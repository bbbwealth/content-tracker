const normalize = (d) => { d.settings = d.settings || { weeklyTarget: 4 }; d.pipeline = (d.pipeline || []).map((p) => ({ ...p, stamps: p.stamps || {} })); d.lists = d.lists || {}; if (!d.lists.collabTypes) d.lists.collabTypes = ["Affiliate (Performance-Based)","Campaign (One-Off Paid)","Partnership (Long-Term / Retainer)"]; d.weeklyPlans = (d.weeklyPlans || []).map((w) => ({ ...w, stamps: w.stamps || {} })); if (!d.lists.topics) d.lists.topics = ["Finance","AI","Travel","Lifestyle","Food","Politics","Current Affairs"]; if (!d.lists.contentStatus) d.lists.contentStatus = ["Idea","Scripted","Filmed","Edited","Published"]; if (d.settings.ideasTarget == null) d.settings.ideasTarget = 20; if (d.settings.ideaQuota == null) d.settings.ideaQuota = 25; if (d.settings.dailyPosts == null) d.settings.dailyPosts = 3; if (d.lists.ideaStatus && !d.lists.ideaStatus.includes("Scheduled")) d.lists.ideaStatus = ["Backlog","Approved","Scheduled","In Progress","Parked","Killed"]; d.accounts = d.accounts || []; if (!d.lists.ideaKind) d.lists.ideaKind = ["Organic","Collab"]; return d; };
const stampContent = (item) => { const s = { ...(item.stamps || {}) }; if (item.status && item.status !== "Idea" && !s[item.status]) s[item.status] = nowISO(); return { ...item, stamps: s }; };
function Toolbar({ title, sub, onAdd, addLabel, onSecondary, secondaryLabel, secondaryIcon:SecIcon }) {
  return (
    <div style={{ display:"flex", alignItems:"center", marginBottom:16, gap:12 }}>
      <div><div style={{ fontFamily:"inherit", fontSize:22, fontWeight:600 }}>{title}</div>{sub && <div style={{ fontSize:12.5, color:C.sub, marginTop:2 }}>{sub}</div>}</div>

        {onSecondary && (<button onClick={onSecondary} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.navy, padding:"9px 14px", borderRadius:10, fontWeight:700, fontSize:13, cursor:"pointer", display:"flex", alignItems:"center", gap:7 }}>{SecIcon && <SecIcon size={16} />}{secondaryLabel}</button>)}
        {onAdd && (<button onClick={onAdd} style={{ border:"none", background:C.navy, color:"#fff", padding:"9px 15px", borderRadius:10, fontWeight:700, fontSize:13, cursor:"pointer", display:"flex", alignItems:"center", gap:7 }}><Plus size={16} />{addLabel}</button>)}
      </div>
    </div>
  );
}

const codePrefix = { ideas:"I", pipeline:"C", collabs:"P" };
const nextCode = (rows, prefix) => { const n = rows.reduce((m,r)=>Math.max(m, parseInt((r.code||"").split("-")[1]||0,10)),0)+1; return `${prefix}-${String(n).padStart(3,"0")}`; };

/* ── app ── */
function App() {
  const [session, setSession] = useState(undefined); // undefined = still checking
  const [data, setData] = useState(null);
  const [tab, setTab] = useState("dashboard");
  const [brandFilter, setBrandFilter] = useState("All");
  const [query, setQuery] = useState("");
  const [modal, setModal] = useState(null);
  const [drag, setDrag] = useState(null);
  const [saved, setSaved] = useState("");
  const savedTimer = useRef();
  const lastPush = useRef("");

  // ── auth: track who is signed in ──
  useEffect(() => {
    if (!SB_READY) return;
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  // ── once signed in: load the shared doc, then live-sync with the team ──
  useEffect(() => {
    if (!SB_READY || !session) { setData(null); return; }
    let channel; let cancelled = false;
    (async () => {
      const { data: row } = await sb.from("app_state").select("data").eq("id", ROW_ID).maybeSingle();
      if (cancelled) return;
      if (row && row.data) {
        setData(normalize(row.data));
      } else {
        // first ever load — seed the shared document
        lastPush.current = JSON.stringify(SEED);
        await sb.from("app_state").upsert({ id: ROW_ID, data: SEED });
        setData(SEED);
      }
      channel = sb
        .channel("app_state_live")
        .on("postgres_changes",
          { event: "*", schema: "public", table: "app_state", filter: `id=eq.${ROW_ID}` },
          (payload) => {
            const incoming = payload.new && payload.new.data;
            if (!incoming) return;
            const str = JSON.stringify(incoming);
            if (str === lastPush.current) return; // ignore the echo of our own save
            setData(normalize(incoming));
          })
        .subscribe();
    })();
    return () => { cancelled = true; if (channel) sb.removeChannel(channel); };
  }, [session]);

  const persist = async (next) => {
    setData(next); // optimistic — update the screen immediately
    lastPush.current = JSON.stringify(next);
    setSaved("Saving…"); clearTimeout(savedTimer.current);
    const { error } = await sb
      .from("app_state")
      .upsert({ id: ROW_ID, data: next, updated_at: new Date().toISOString() });
    setSaved(error ? "Save failed — check connection" : "Saved");
    savedTimer.current = setTimeout(() => setSaved(""), 1600);
  };

  const logout = () => { if (sb) sb.auth.signOut(); };

  if (!SB_READY) return <ConfigNeeded />;
  if (session === undefined) return <Splash />;
  if (!session) return <Login />;
  if (!data) return <Splash />;
  const currentUser = session.user || {};
  const role = (currentUser.app_metadata && currentUser.app_metadata.role) || "user";
  const isAdmin = role === "admin";
  const myName = (currentUser.user_metadata && currentUser.user_metadata.name) || currentUser.email || "";
  const L = data.lists;
  const matchBrand = (r) => brandFilter === "All" || r.brand === brandFilter;
  const matchQuery = (r) => !query || JSON.stringify(r).toLowerCase().includes(query.toLowerCase());
  const filt = (rows) => rows.filter((r) => matchBrand(r) && matchQuery(r));

  const openAdd = (entity) => {
    const blank = {}; fieldSets(L)[entity].forEach((f)=>(blank[f.k]=f.t==="number"?0:f.t==="multiselect"?[]:""));
    if (entity==="ideas") { blank.dateAdded=nowISO(); blank.status="Backlog"; blank.priority="Medium"; blank.kind="Organic"; }
    if (entity==="pipeline") blank.status="Approved";
    if (entity==="calendar") blank.status="Planned";
    if (entity==="collabs") blank.status="Pitching";
    if (entity==="weeklyPlans") { blank.status="Idea"; blank.week=THIS_MON; blank.owner = L.team.includes(myName) ? myName : ""; }
    setModal({ entity, mode:"add", record:blank });
  };
  const openEdit = (entity, record) => setModal({ entity, mode:"edit", record:{ ...record } });
  const saveModal = (rec) => {
    const { entity, mode } = modal; let rows = [...data[entity]]; let extra = {};
    if (mode==="add") {
      let row = { _id:uid(), ...rec }; if (codePrefix[entity]) row.code = nextCode(rows, codePrefix[entity]);
      if (entity==="pipeline") row = withStamp(row, row.status);
      if (entity==="weeklyPlans") row = stampContent(row);
      rows.push(row);
      if (entity==="pipeline" && (row.status==="Scheduled" || row.status==="Posted")) extra.calendar = syncCalendar(data.calendar, row, row.status);
    } else {
      let saved = { ...rec }; if (entity==="pipeline") saved = withStamp(saved, saved.status);
      rows = rows.map((r)=>(r._id===rec._id ? saved : r));
      if (entity==="pipeline" && (saved.status==="Scheduled" || saved.status==="Posted")) extra.calendar = syncCalendar(data.calendar, saved, saved.status);
    }
    persist({ ...data, [entity]:rows, ...extra }); setModal(null);
  };
  const del = (entity,_id) => persist({ ...data, [entity]:data[entity].filter((r)=>r._id!==_id) });
  const setStatus = (entity,_id,status) => persist({ ...data, [entity]:data[entity].map((r)=>(r._id===_id?{ ...r, status }:r)) });
  const setPipelineStatus = (_id, status) => {
    const pipeline = data.pipeline.map((r)=>(r._id===_id ? withStamp(r, status) : r));
    const item = pipeline.find((r)=>r._id===_id);
    let calendar = data.calendar;
    if (status==="Scheduled" || status==="Posted") calendar = syncCalendar(calendar, item, status);
    persist({ ...data, pipeline, calendar });
  };
  const setWeeklyTarget = (n) => persist({ ...data, settings:{ ...data.settings, weeklyTarget: Math.max(0, Number(n)||0) } });
  const promote = (idea) => { const row = withStamp({ _id:uid(), code:nextCode(data.pipeline,"C"), brand:idea.brand, type:idea.type, title:idea.title, platform:"Instagram", owner:idea.by, status:"Approved", notes:(idea.hook||idea.category||""), collab:"", draftDue:"", designDue:"", target:"", link:"" }, "Approved"); persist({ ...data, pipeline:[...data.pipeline,row] }); setTab("pipeline"); };
  const addIdeasToPipeline = (chosen) => {
    let rows=[...data.pipeline], ideas=[...data.ideas];
    chosen.forEach((idea)=>{ rows.push(withStamp({ _id:uid(), code:nextCode(rows,"C"), brand:idea.brand, type:idea.type, title:idea.title, platform:"Instagram", owner:idea.by, status:"Approved", notes:(idea.hook||idea.category||""), collab:"", draftDue:"", designDue:"", target:"", link:"" }, "Approved")); ideas=ideas.map((i)=>(i._id===idea._id&&i.status==="Backlog"?{ ...i, status:"Approved" }:i)); });
    persist({ ...data, pipeline:rows, ideas });
  };

  // ── admin: enrol a new team member (creates their login via the secure Edge Function) ──
  const callAdminFn = async (body) => {
    const { data: s } = await sb.auth.getSession();
    const token = s.session && s.session.access_token;
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-create-user`, {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization":`Bearer ${token}`, "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    });
    const out = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(out.error || `Failed (${res.status})`);
    return out;
  };
  const enrolUser = async ({ name, email, password, role:newRole, tabs }) => {
    try {
      await callAdminFn({ action:"create", name, email, password, role:newRole, tabs });
      if (name && !data.lists.team.includes(name)) persist({ ...data, lists:{ ...data.lists, team:[...data.lists.team, name] } });
      return { ok: true };
    } catch (e) { return { error: String((e && e.message) || e) }; }
  };
  const listMembers = () => callAdminFn({ action:"list" });
  const removeMember = (id) => callAdminFn({ action:"delete", id });
  const updateMember = ({ id, role, tabs }) => callAdminFn({ action:"update", id, role, tabs });
  const setWeeklyStatus = (_id, status) => persist({ ...data, weeklyPlans: data.weeklyPlans.map((r)=>(r._id===_id ? stampContent({ ...r, status }) : r)) });
  const approveIdea = (_id) => setStatus("ideas", _id, "Approved");
  const duplicateIdea = (idea) => {
    const copy = { ...idea, _id:uid(), code:nextCode(data.ideas,"I"), title:(idea.title||"")+" (copy)", status:"Backlog", dateAdded:nowISO(), by:(L.team.includes(myName)?myName:idea.by) };
    persist({ ...data, ideas:[...data.ideas, copy] });
    openEdit("ideas", copy);
  };
  const scheduleIdeas = (ideaIds, date, time) => {
    let cal=[...data.calendar], ideas=[...data.ideas];
    ideaIds.forEach((id)=>{ const idea=data.ideas.find((i)=>i._id===id); if(!idea) return;
      cal.push({ _id:uid(), date, time:time||"8:00 PM", brand:idea.brand, platform:"Instagram", type:idea.type, title:idea.title, owner:idea.by, status:"Planned", caption:idea.category||"", link:"", fromIdea:id });
      ideas=ideas.map((i)=>(i._id===id ? { ...i, status:"Scheduled" } : i)); });
    persist({ ...data, calendar:cal, ideas });
  };

  const NAV = [
    { id:"dashboard", label:"Dashboard", icon:LayoutDashboard }, { id:"ideas", label:"Idea Bank", icon:Lightbulb },
    { id:"pipeline", label:"Pipeline", icon:Columns }, { id:"weekly", label:"Content Tracker", icon:ClipboardList },
    { id:"productivity", label:"Productivity", icon:BarChart3 }, { id:"calendar", label:"Calendar", icon:CalendarDays },
    { id:"collabs", label:"Collabs", icon:Briefcase }, { id:"accounts", label:"Accounts", icon:AtSign }, { id:"pulse", label:"Pulse", icon:Activity }, { id:"settings", label:"Lists", icon:Settings },
    ...(isAdmin ? [{ id:"admin", label:"Admin", icon:Shield }] : []),
  ];
  const allowedTabs = currentUser.app_metadata && currentUser.app_metadata.tabs;
  const visibleNav = (!isAdmin && Array.isArray(allowedTabs)) ? NAV.filter((n)=>n.id==="dashboard" || allowedTabs.includes(n.id)) : NAV;

  const pageTitle = (NAV.find((n)=>n.id===tab) || {}).label || "Dashboard";

  return (
    <div style={{ display:"flex", minHeight:"100vh", background:C.canvas, color:C.ink }}>
      <aside style={{ width:230, flexShrink:0, background:C.navy, display:"flex", flexDirection:"column", position:"sticky", top:0, height:"100vh" }}>
        <div style={{ padding:"18px 18px 16px", display:"flex", alignItems:"center", gap:11, borderBottom:"1px solid #243653" }}>
          <div style={{ width:36, height:36, borderRadius:10, background:C.yellow, color:C.navy, fontWeight:800, fontSize:13, display:"grid", placeItems:"center", letterSpacing:"-.5px" }}>BBB</div>
          <div><div style={{ color:"#fff", fontWeight:700, fontSize:16, lineHeight:1 }}>Content Hub</div><div style={{ color:"#9FB0CC", fontSize:11, marginTop:3 }}>BBB Media Group</div></div>
        </div>
        <nav style={{ flex:1, overflowY:"auto", padding:"12px 12px" }}>
          {visibleNav.map((n)=>{ const on=tab===n.id; const Icon=n.icon; return (
            <button key={n.id} onClick={()=>setTab(n.id)} style={{ width:"100%", border:"none", cursor:"pointer", textAlign:"left", background:on?C.navy2:"transparent", color:on?"#fff":"#8696B4", padding:"10px 12px", borderRadius:9, fontSize:13, fontWeight:600, display:"flex", alignItems:"center", gap:11, marginBottom:2, borderLeft:`3px solid ${on?C.yellow:"transparent"}` }} onMouseEnter={(e)=>{ if(!on) e.currentTarget.style.background="#1A2B49"; }} onMouseLeave={(e)=>{ if(!on) e.currentTarget.style.background="transparent"; }}><Icon size={17} />{n.label}</button>
          ); })}
        </nav>
        <div style={{ padding:"12px 14px", borderTop:"1px solid #243653" }}>
          <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:9 }}>
            <span style={{ background:isAdmin?C.yellow:"#2C3F5E", color:isAdmin?C.navy:"#B9C6DD", fontSize:10, fontWeight:800, padding:"3px 7px", borderRadius:6, letterSpacing:".3px" }}>{isAdmin?"ADMIN":"MEMBER"}</span>
            <span title={currentUser.email} style={{ color:"#9FB0CC", fontSize:11, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{currentUser.email}</span>
          </div>
          <button onClick={logout} style={{ width:"100%", border:"1px solid #2C3F5E", background:C.navy2, color:"#B9C6DD", borderRadius:8, padding:"8px", fontSize:12, fontWeight:600, cursor:"pointer" }}>Log out</button>
        </div>
      </aside>

      <main style={{ flex:1, minWidth:0, display:"flex", flexDirection:"column" }}>
        <header style={{ background:"#fff", borderBottom:`1px solid ${C.line}`, padding:"12px 24px", display:"flex", alignItems:"center", gap:14, flexWrap:"wrap", position:"sticky", top:0, zIndex:20 }}>
          <div style={{ fontSize:18, fontWeight:700 }}>{pageTitle}</div>
          <div style={{ flex:1 }} />
          {saved && <span style={{ color:"#15724A", fontSize:12, fontWeight:600 }}>● {saved}</span>}
          <div style={{ position:"relative", display:"flex", alignItems:"center" }}>
            <Search size={15} color={C.sub} style={{ position:"absolute", left:10 }} />
            <input value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="Search…" style={{ background:"#F6F7FB", border:`1px solid ${C.line}`, color:C.ink, borderRadius:9, padding:"8px 10px 8px 31px", fontSize:13, width:200, outline:"none", fontFamily:"inherit" }} />
          </div>
          <div style={{ display:"flex", gap:4, background:"#F6F7FB", padding:4, borderRadius:10, flexWrap:"wrap", border:`1px solid ${C.line}` }}>
            {["All", ...L.brands].map((b)=>(<button key={b} onClick={()=>setBrandFilter(b)} style={{ border:"none", cursor:"pointer", borderRadius:7, padding:"6px 11px", fontSize:12, fontWeight:600, background:brandFilter===b?C.navy:"transparent", color:brandFilter===b?"#fff":C.sub }}>{b}</button>))}
          </div>
        </header>

        <div style={{ padding:24, flex:1 }}>
          {tab==="dashboard" && <Dashboard data={data} setTab={setTab} myName={myName} />}
          {tab==="ideas" && <Ideas rows={filt(data.ideas)} allIdeas={data.ideas} allTeam={L.team} isAdmin={isAdmin} myName={myName} quota={data.settings.ideaQuota} onAdd={()=>openAdd("ideas")} onEdit={(r)=>openEdit("ideas",r)} onDel={(id)=>del("ideas",id)} onPromote={promote} onApprove={approveIdea} onDuplicate={duplicateIdea} />}
          {tab==="pipeline" && <Pipeline rows={filt(data.pipeline)} ideas={data.ideas} pipelineAll={data.pipeline} pipelineStatus={L.pipelineStatus} onAddFromIdeas={addIdeasToPipeline} onAdd={()=>openAdd("pipeline")} onEdit={(r)=>openEdit("pipeline",r)} onDel={(id)=>del("pipeline",id)} drag={drag} setDrag={setDrag} setStatus={(id,s)=>setPipelineStatus(id,s)} />}
          {tab==="weekly" && <ContentTracker rows={filt(data.weeklyPlans)} allTeam={L.team} isAdmin={isAdmin} myName={myName} target={data.settings.ideasTarget} onAdd={()=>openAdd("weeklyPlans")} onEdit={(r)=>openEdit("weeklyPlans",r)} onDel={(id)=>del("weeklyPlans",id)} setStatus={setWeeklyStatus} />}
          {tab==="productivity" && <Productivity rows={data.weeklyPlans} team={L.team} />}
          {tab==="calendar" && <Calendar rows={data.calendar} allIdeas={data.ideas} allTeam={L.team} isAdmin={isAdmin} myName={myName} dailyPosts={data.settings.dailyPosts} onAdd={()=>openAdd("calendar")} onEdit={(r)=>openEdit("calendar",r)} onDel={(id)=>del("calendar",id)} onSchedule={scheduleIdeas} />}
          {tab==="collabs" && <Collabs rows={filt(data.collabs)} onAdd={()=>openAdd("collabs")} onEdit={(r)=>openEdit("collabs",r)} onDel={(id)=>del("collabs",id)} />}
        {tab==="accounts" && <Accounts rows={filt(data.accounts)} onAdd={()=>openAdd("accounts")} onEdit={(r)=>openEdit("accounts",r)} onDel={(id)=>del("accounts",id)} />}
          {tab==="pulse" && <Pulse data={data} />}
          {tab==="settings" && <Lists data={data} persist={persist} />}
          {tab==="admin" && isAdmin && <AdminPanel data={data} onEnrol={enrolUser} myEmail={currentUser.email} onListUsers={listMembers} onRemoveUser={removeMember} onUpdateUser={updateMember} />}
        </div>
      </main>

      {modal && <Modal modal={modal} L={L} onClose={()=>setModal(null)} onSave={saveModal} isAdmin={isAdmin} />}
    </div>
  );
}

function Splash(){ return (<div style={{ minHeight:"100vh", display:"grid", placeItems:"center", background:C.navy }}><div style={{ textAlign:"center" }}><div style={{ width:46, height:46, borderRadius:12, background:C.yellow, color:C.navy, fontWeight:800, display:"grid", placeItems:"center", margin:"0 auto 14px" }}>BBB</div><div style={{ color:"#fff", fontWeight:700 }}>Loading Content Hub…</div></div></div>); }

function Dashboard({ data, setTab, myName }) {
  const p = data.pipeline;
  const inProd = p.filter((r)=>["Scripting","Design","Review"].includes(r.status)).length;
  const scheduled = p.filter((r)=>r.status==="Scheduled").length;
  const posted = p.filter((r)=>r.status==="Posted").length;
  const ideas = data.ideas.filter((r)=>["Backlog","Approved"].includes(r.status)).length;
  const kpis = [{ n:inProd, l:"In Production", c:C.yellow },{ n:scheduled, l:"Scheduled", c:"#2D6CDF" },{ n:posted, l:"Posted", c:"#1FA463" },{ n:ideas, l:"Ideas / Approved", c:C.red }];
  const byBrand = data.lists.brands.map((b)=>({ b, n:p.filter((r)=>r.brand===b).length }));
  const maxB = Math.max(1, ...byBrand.map((x)=>x.n));
  const active = data.collabs.filter((c)=>["Negotiating","Contract Signed","In Production","Delivered"].includes(c.status)).length;
  const awaiting = data.collabs.filter((c)=>c.status==="Invoiced").length;
  const donePaid = data.collabs.filter((c)=>["Paid","Completed"].includes(c.status)).length;
  const fees = data.collabs.reduce((s,c)=>s+(Number(c.fee)||0),0);
  const upcoming = [...data.calendar].filter((c)=>c.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4);
  const wkPlans = (data.weeklyPlans||[]).filter((w)=>w.week===THIS_MON);
  const wkTeam = (data.lists.team||[]).filter((t)=>t!=="Unassigned");
  const ideasTarget = (data.settings && data.settings.ideasTarget) || 20;
  const wkHit = wkTeam.filter((t)=>wkPlans.filter((w)=>w.owner===t).length >= ideasTarget).length;
  const wkUnder = wkTeam.filter((t)=>wkPlans.filter((w)=>w.owner===t).length < ideasTarget);
  const wkPublished = wkPlans.filter((w)=>w.status==="Published").length;
  const mineThisWeek = wkPlans.filter((w)=>w.owner===myName).length;
  return (
    <div style={{ display:"grid", gap:16 }}>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12 }}>
        {kpis.map((k)=>(<div key={k.l} style={card()}><div style={{ fontFamily:"inherit", fontSize:42, fontWeight:600, lineHeight:1 }}>{k.n}</div><div style={{ display:"flex", alignItems:"center", gap:6, marginTop:8 }}><span style={{ width:10, height:10, borderRadius:3, background:k.c }} /><span style={{ fontSize:12.5, color:C.sub, fontWeight:600 }}>{k.l}</span></div></div>))}
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1.3fr 1fr", gap:16 }}>
        <div style={card()}>
          <SectionTitle icon={TrendingUp}>Pipeline by brand</SectionTitle>
          <div style={{ display:"grid", gap:14, marginTop:14 }}>
            {byBrand.map((x)=>(<div key={x.b}><div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:6 }}><BrandTag b={x.b} /><span style={{ fontWeight:700 }}>{x.n}</span></div><div style={{ height:9, background:"#EEF1F6", borderRadius:6, overflow:"hidden" }}><div style={{ width:`${(x.n/maxB)*100}%`, height:"100%", background:BRAND_DOT[x.b], borderRadius:6, transition:"width .5s" }} /></div></div>))}
          </div>
        </div>
        <div style={card()}>
          <SectionTitle icon={Briefcase}>Collabs</SectionTitle>
          <Row k="Active deals" v={active} /><Row k="Awaiting payment" v={awaiting} /><Row k="Completed / Paid" v={donePaid} />
          <div style={{ borderTop:`1px dashed ${C.line}`, margin:"10px 0 4px" }} />
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline" }}><span style={{ fontSize:12.5, color:C.sub, fontWeight:600 }}>Total fees logged</span><span style={{ fontFamily:"inherit", fontSize:24, fontWeight:600 }}>RM {fees.toLocaleString()}</span></div>
        </div>
      </div>
      <div style={card()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}><SectionTitle icon={ClipboardList}>This week's content</SectionTitle><button onClick={()=>setTab("weekly")} style={linkBtn()}>Open tracker <ArrowRight size={13} /></button></div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12, marginTop:12 }}>
          <div style={card(13)}><div style={{ fontFamily:"inherit", fontSize:28, fontWeight:600, lineHeight:1 }}>{wkPlans.length}</div><div style={{ fontSize:11.5, color:C.sub, fontWeight:600, marginTop:6 }}>Ideas this week</div></div>
          <div style={card(13)}><div style={{ fontFamily:"inherit", fontSize:28, fontWeight:600, lineHeight:1, color:"#1FA463" }}>{wkHit}/{wkTeam.length}</div><div style={{ fontSize:11.5, color:C.sub, fontWeight:600, marginTop:6 }}>Hit {ideasTarget}-idea target</div></div>
          <div style={card(13)}><div style={{ fontFamily:"inherit", fontSize:28, fontWeight:600, lineHeight:1, color:"#1FA463" }}>{wkPublished}</div><div style={{ fontSize:11.5, color:C.sub, fontWeight:600, marginTop:6 }}>Published this week</div></div>
        </div>
        <div style={{ marginTop:12, fontSize:12.5, color:C.sub }}>My ideas this week: <b style={{ color:mineThisWeek>=ideasTarget?"#15724A":C.red }}>{mineThisWeek}/{ideasTarget}</b></div>
        {wkUnder.length>0 && <div style={{ marginTop:8, fontSize:12, color:C.sub, display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}><span style={{ fontWeight:600 }}>Below target:</span>{wkUnder.map((m)=><Pill key={m} bg="#F9D7D7" fg="#A11">{m}</Pill>)}</div>}
      </div>
      <div style={card()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}><SectionTitle icon={CalendarDays}>Next up</SectionTitle><button onClick={()=>setTab("calendar")} style={linkBtn()}>Open calendar <ArrowRight size={13} /></button></div>
        <div style={{ display:"grid", gap:8, marginTop:12 }}>
          {upcoming.length===0 && <Empty>Nothing scheduled yet.</Empty>}
          {upcoming.map((c)=>(<div key={c._id} style={{ display:"flex", alignItems:"center", gap:12, padding:"8px 10px", border:`1px solid ${C.line}`, borderRadius:10 }}><div style={{ textAlign:"center", minWidth:46 }}><div style={{ fontSize:11, color:C.sub, fontWeight:700 }}>{dow(c.date)}</div><div style={{ fontFamily:"inherit", fontSize:18, fontWeight:600 }}>{c.date && c.date.slice(8)}</div></div><div style={{ flex:1 }}><div style={{ fontSize:13.5, fontWeight:600 }}>{c.title}</div><div style={{ fontSize:11.5, color:C.sub, marginTop:2 }}>{c.time} · {c.platform}</div></div><BrandTag b={c.brand} /><StatusPill s={c.status} /></div>))}
        </div>
      </div>
    </div>
  );
}

function Ideas({ rows, allIdeas, allTeam, isAdmin, myName, quota, onAdd, onEdit, onDel, onPromote, onApprove, onDuplicate }) {
  const team = (allTeam||[]).filter((t)=>t!=="Unassigned");
  const [fBy,setFBy]=useState(""); const [fApproval,setFApproval]=useState(""); const [sortBy,setSortBy]=useState("newest");
  const wkIdeas = (allIdeas||[]).filter((i)=>i.dateAdded && mondayOf(i.dateAdded)===THIS_MON);
  const mine = wkIdeas.filter((i)=>i.by===myName).length;
  const countFor = (t)=>wkIdeas.filter((i)=>i.by===t).length;
  const pending = (allIdeas||[]).filter((i)=>i.status==="Backlog").length;
  const hit = team.filter((t)=>countFor(t)>=quota).length;
  const kpiBox=(n,l,c)=>(<div style={{ ...card(12), flex:1, minWidth:120 }}><div style={{ fontFamily:"inherit", fontSize:24, fontWeight:700, lineHeight:1, color:c||C.ink }}>{n}</div><div style={{ fontSize:11, color:C.sub, fontWeight:600, marginTop:5 }}>{l}</div></div>);
  const barRow=(t)=>{ const c=countFor(t); const ok=c>=quota; return (
    <div key={t} style={{ display:"flex", alignItems:"center", gap:10 }}>
      <span style={{ width:90, fontSize:12.5, fontWeight:600 }}>{t}</span>
      <div style={{ flex:1, height:6, background:"#EEF1F6", borderRadius:4, overflow:"hidden" }}><div style={{ width:`${Math.min(100,(c/quota)*100)}%`, height:"100%", background:ok?"#1FA463":C.yellow }} /></div>
      <span style={{ fontSize:12, fontWeight:700, color:ok?"#1FA463":C.red, width:52, textAlign:"right" }}>{c}/{quota}</span>
    </div>
  ); };
  let view = (rows||[]).slice();
  if (fBy) view = view.filter((r)=>r.by===fBy);
  if (fApproval==="approved") view = view.filter((r)=>r.status && r.status!=="Backlog");
  else if (fApproval==="pending") view = view.filter((r)=>r.status==="Backlog");
  if (sortBy==="newest") view.sort((a,b)=>String(b.dateAdded||"").localeCompare(String(a.dateAdded||"")));
  else if (sortBy==="oldest") view.sort((a,b)=>String(a.dateAdded||"").localeCompare(String(b.dateAdded||"")));
  else if (sortBy==="byPerson") view.sort((a,b)=>String(a.by||"").localeCompare(String(b.by||"")));
  const ctrlSel = { ...inp(), width:"auto", minWidth:150, padding:"8px 10px", fontSize:12.5 };
  return (
    <div>
      <Toolbar title="Idea Bank" sub={`Every member submits ≥ ${quota} ideas/week. Admin approves them, then they can be scheduled on the Calendar.`} onAdd={onAdd} addLabel="New idea" />
      {team.includes(myName) && mine<quota && (
        <div style={{ background:"#FFF3CC", border:`1px solid ${C.yellow}`, borderRadius:10, padding:"10px 12px", fontSize:12.5, fontWeight:600, color:"#7a5b00", marginBottom:14 }}>⏰ You've submitted {mine} of {quota} ideas this week — add {quota-mine} more.</div>
      )}
      {isAdmin && (
        <div style={{ ...card(14), marginBottom:16 }}>
          <SectionTitle icon={Shield}>Weekly submissions — {mondayOf(new Date())} → {addDaysISO(mondayOf(new Date()),6)}</SectionTitle>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", margin:"12px 0" }}>
            {kpiBox(`${hit}/${team.length}`, `Hit ${quota}-idea quota`, "#1FA463")}
            {kpiBox(wkIdeas.length, "Ideas this week", C.navy)}
            {kpiBox(pending, "Pending approval", pending?"#C98A00":C.ink)}
          </div>
          <div style={{ display:"grid", gap:8 }}>{team.map((t)=>barRow(t))}</div>
        </div>
      )}
      <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center", marginBottom:14 }}>
        <span style={{ fontSize:11.5, fontWeight:700, color:C.sub }}>Sort & filter:</span>
        <select value={fBy} onChange={(e)=>setFBy(e.target.value)} style={ctrlSel}><option value="">All submitters</option>{team.map((t)=><option key={t} value={t}>{t}</option>)}</select>
        <select value={fApproval} onChange={(e)=>setFApproval(e.target.value)} style={ctrlSel}><option value="">All statuses</option><option value="approved">Approved</option><option value="pending">Pending approval</option></select>
        <select value={sortBy} onChange={(e)=>setSortBy(e.target.value)} style={ctrlSel}><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="byPerson">By submitter (A–Z)</option></select>
        {(fBy||fApproval||sortBy!=="newest") && <button onClick={()=>{ setFBy(""); setFApproval(""); setSortBy("newest"); }} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.sub, borderRadius:8, padding:"7px 11px", fontSize:12, fontWeight:600, cursor:"pointer" }}>Reset</button>}
        <span style={{ fontSize:11.5, color:C.sub, fontWeight:600, marginLeft:"auto" }}>{view.length} of {(rows||[]).length} shown</span>
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:12 }}>
        {view.map((r,i)=>(
          <div key={r._id} style={{ ...card(14), animation:`rise .35s ${i*0.03}s both` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"start", gap:8 }}><BrandTag b={r.brand} /><div style={{ display:"flex", gap:2, alignItems:"center" }}>{isAdmin && r.status==="Backlog" && <button onClick={()=>onApprove(r._id)} style={{ border:"none", background:"#DCF0E4", color:"#15724A", fontWeight:700, fontSize:11, padding:"3px 8px", borderRadius:7, cursor:"pointer" }}>✓ Approve</button>}<IconBtn title="Duplicate & edit" onClick={()=>onDuplicate(r)}><Copy size={14} /></IconBtn><IconBtn title="Promote to pipeline" onClick={()=>onPromote(r)}><ArrowRight size={15} /></IconBtn><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></div></div>
            <div style={{ fontSize:15, fontWeight:700, margin:"8px 0 4px", lineHeight:1.3 }}>{r.title}</div>
            <div style={{ fontSize:12.5, color:C.sub, lineHeight:1.4, minHeight:20 }}>{r.category ? ("🏷 " + r.category) : ""}</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap", margin:"10px 0", alignItems:"center" }}><Pill bg="#EEF1F6" fg={C.sub}>{r.type}</Pill>{r.kind && <Pill bg={r.kind==="Collab"?"#EAE2FB":"#DCF0E4"} fg={r.kind==="Collab"?"#4B2E9E":"#15724A"}>{r.kind}</Pill>}{r.priority && <Pill bg={PRIORITY[r.priority] && PRIORITY[r.priority].bg} fg={PRIORITY[r.priority] && PRIORITY[r.priority].fg}>{r.priority}</Pill>}<StatusPill s={r.status} /></div>
            {Array.isArray(r.crossPost) && r.crossPost.length>0 && <div style={{ display:"flex", gap:5, flexWrap:"wrap", alignItems:"center", marginBottom:8 }}><span style={{ fontSize:11, fontWeight:700, color:C.sub }}>↗ Cross-post:</span>{r.crossPost.map((b)=><Pill key={b} bg="#FFF3CC" fg="#7a5b00">{b}</Pill>)}</div>}
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.sub, borderTop:`1px solid ${C.line}`, paddingTop:8 }}><span>{r.by}</span><span>{r.code} · {r.dateAdded}</span></div>
          </div>
        ))}
      </div>
      {view.length===0 && <Empty>No ideas match your filter.</Empty>}
    </div>
  );
}

                  {(r.scriptLink||r.footageLink||r.contentLink) && <div style={{ display:"flex", gap:4, flexWrap:"wrap", marginBottom:6 }}>{[["Script",r.scriptLink],["Footage",r.footageLink],["Content",r.contentLink]].filter((x)=>x[1]).map((x)=>(<a key={x[0]} href={x[1]} target="_blank" rel="noreferrer" onClick={(e)=>e.stopPropagation()} onMouseDown={(e)=>e.stopPropagation()} style={{ fontSize:10, fontWeight:700, color:C.navy, background:"#EEF1F6", borderRadius:6, padding:"2px 6px", textDecoration:"none" }}>🔗 {x[0]}</a>))}</div>}
                  {r.adminComment && <div style={{ fontSize:10.5, color:"#7a5b00", background:"#FFF3CC", border:`1px solid ${C.yellow}`, borderRadius:7, padding:"4px 6px", marginBottom:6, lineHeight:1.4 }}>💬 {r.adminComment}</div>}
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.sub, borderTop:`1px solid ${C.line}`, paddingTop:6 }}><span>{r.owner}</span><span>{r.target || "—"}</span></div>
                </div>
              ))}

function IdeaPicker({ ideas, pipelineAll, onClose, onConfirm }) {
  const available = ideas.filter((i)=>i.status!=="Killed" && !pipelineAll.some((p)=>p.brand===i.brand && p.title===i.title));
  const [sel, setSel] = useState([]);
  const toggle = (id) => setSel((s)=>(s.includes(id)?s.filter((x)=>x!==id):[...s,id]));
  const chosen = available.filter((i)=>sel.includes(i._id));
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:50, padding:16, backdropFilter:"blur(2px)" }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, width:"min(560px,100%)", maxHeight:"86vh", overflow:"hidden", display:"flex", flexDirection:"column", boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ background:C.navy, padding:"16px 20px", display:"flex", alignItems:"center", justifyContent:"space-between" }}><div style={{ color:"#fff", fontWeight:700, fontSize:15, display:"flex", alignItems:"center", gap:8 }}><Lightbulb size={17} color={C.yellow} />Add from Idea Bank</div><span style={{ cursor:"pointer" }} onClick={onClose}><X size={18} color="#9FB0CC" /></span></div>
        <div style={{ padding:14, overflowY:"auto", display:"grid", gap:8 }}>
          {available.length===0 && <Empty>Every idea is already in the pipeline.</Empty>}

            <div key={i._id} onClick={()=>toggle(i._id)} style={{ display:"flex", alignItems:"center", gap:11, padding:"10px 12px", border:`1.5px solid ${on?C.navy:C.line}`, borderRadius:11, cursor:"pointer", background:on?"#F3F6FC":"#fff" }}>
              <span style={{ width:18, height:18, borderRadius:5, border:`2px solid ${on?C.navy:"#C7CFDD"}`, background:on?C.navy:"#fff", display:"grid", placeItems:"center", flexShrink:0, color:"#fff", fontSize:11, fontWeight:800 }}>{on?"✓":""}</span>
              <div style={{ flex:1, minWidth:0 }}><div style={{ fontSize:13.5, fontWeight:700, lineHeight:1.3 }}>{i.title}</div><div style={{ fontSize:11.5, color:C.sub, marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{i.hook}</div></div>
              <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:5, flexShrink:0 }}><BrandTag b={i.brand} /><div style={{ display:"flex", gap:5 }}><Pill bg="#EEF1F6" fg={C.sub}>{i.type}</Pill><StatusPill s={i.status} /></div></div>
            </div>
          ); })}
        </div>
        <div style={{ padding:"14px 20px", borderTop:`1px solid ${C.line}`, display:"flex", alignItems:"center", gap:10 }}>
          <span style={{ fontSize:12.5, color:C.sub }}>{sel.length} selected</span><div style={{ flex:1 }} />
          <button onClick={onClose} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.sub, padding:"9px 16px", borderRadius:9, fontWeight:600, cursor:"pointer", fontSize:13 }}>Cancel</button>
          <button disabled={!sel.length} onClick={()=>onConfirm(chosen)} style={{ border:"none", background:sel.length?C.yellow:"#E6E9F0", color:sel.length?C.navy:"#A9B2C4", padding:"9px 18px", borderRadius:9, fontWeight:700, cursor:sel.length?"pointer":"default", fontSize:13 }}>Add {sel.length || ""} to pipeline</button>
        </div>
      </div>
    </div>
  );
}

function Calendar({ rows, allIdeas, allTeam, isAdmin, myName, dailyPosts, onAdd, onEdit, onDel, onSchedule }) {
  const team = (allTeam||[]).filter((t)=>t!=="Unassigned");
  const [member, setMember] = useState(isAdmin ? "All" : (team.includes(myName) ? myName : "All"));
  const now = new Date();
  const [ym, setYm] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const [picker, setPicker] = useState(null);
  const approved = (allIdeas||[]).filter((i)=>i.status==="Approved");
  const pad2 = (n)=>String(n).padStart(2,"0");
  const scoped = (r)=> member==="All" || r.owner===member;
  const byDay = {}; rows.filter((r)=>r.date && scoped(r)).forEach((r)=>{ (byDay[r.date]=byDay[r.date]||[]).push(r); });
  const first = new Date(ym.y, ym.m, 1);
  const startPad = (first.getDay()+6)%7;
  const dim = new Date(ym.y, ym.m+1, 0).getDate();
  const cells = []; for (let i=0;i<startPad;i++) cells.push(null);
  for (let d=1; d<=dim; d++){ const iso=`${ym.y}-${pad2(ym.m+1)}-${pad2(d)}`; cells.push({ d, iso, items:(byDay[iso]||[]) }); }
  while (cells.length%7!==0) cells.push(null);
  const monthName = first.toLocaleDateString("en-US",{ month:"long", year:"numeric" });
  const shift = (delta)=>setYm(({y,m})=>{ const dd=new Date(y,m+delta,1); return { y:dd.getFullYear(), m:dd.getMonth() }; });
  const navBtn = { border:`1px solid ${C.line}`, background:"#fff", color:C.navy, borderRadius:9, padding:"7px 12px", fontSize:12.5, fontWeight:700, cursor:"pointer" };
  const [wkStart, wkEnd] = weekBounds();
  const weekDates = [0,1,2,3,4,5,6].map((i)=>addDaysISO(wkStart,i));
  const weekTarget = dailyPosts*7;
  const plannedWk = (t)=>rows.filter((r)=>r.owner===t && r.date>=wkStart && r.date<=wkEnd).length;
  const daysMet = (t)=>weekDates.filter((d)=>rows.filter((r)=>r.owner===t && r.date===d).length>=dailyPosts).length;
  const daysUnder = (t)=>weekDates.filter((d)=>rows.filter((r)=>r.owner===t && r.date===d).length<dailyPosts);
  const cellBg = (n)=> member==="All" ? "#fff" : (n>=dailyPosts ? "#EAF6EF" : n>0 ? "#FFF7E6" : "#fff");

function Collabs({ rows, onAdd, onEdit, onDel }) {

    if (sort==="feeDesc") a.sort((x,y)=>num(y.fee)-num(x.fee));
    else if (sort==="feeAsc") a.sort((x,y)=>num(x.fee)-num(y.fee));
    else if (sort==="golive") a.sort((x,y)=>(x.goLive||"9999").localeCompare(y.goLive||"9999"));
    else if (sort==="brief") a.sort((x,y)=>(y.briefDate||"").localeCompare(x.briefDate||""));
    else if (sort==="partner") a.sort((x,y)=>(x.partner||"").localeCompare(y.partner||""));
    else if (sort==="status") a.sort((x,y)=>(x.status||"").localeCompare(y.status||""));

function Pulse({ data }) {
  const STAGES = ["Approved","Scripting","Design","Review","Scheduled","Posted"];
  const items = data.pipeline;
  const avgSpan = (from,to) => { const xs=items.map((p)=>dayspan(p.stamps&&p.stamps[from], p.stamps&&p.stamps[to])).filter((v)=>v!=null && v>=0); return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; };
  const cntSpan = (from,to) => items.filter((p)=>p.stamps&&p.stamps[from]&&p.stamps[to]).length;
  const script2sched = avgSpan("Scripting","Scheduled");
  const appr2posted = avgSpan("Approved","Posted");
  const stageBars = []; for (let i=0;i<STAGES.length-1;i++){ stageBars.push({ label:`${STAGES[i]} → ${STAGES[i+1]}`, v:avgSpan(STAGES[i],STAGES[i+1]) }); }
  const maxBar = Math.max(0.1, ...stageBars.map((s)=>s.v||0));
  const fmt = (v) => v==null ? "—" : (v<1 ? `${Math.round(v*24)}h` : `${v.toFixed(1)}d`);
  const cal = data.calendar.filter((c)=>c.date);
  const due = cal.filter((c)=>c.date<=TODAY);
  const delivered = due.filter((c)=>c.status==="Posted");
  const rate = due.length ? Math.round((delivered.length/due.length)*100) : null;
  const headline = (val, label, sub, color) => (<div style={{ ...card(16), flex:1, minWidth:150 }}><div style={{ fontFamily:"inherit", fontSize:34, fontWeight:600, lineHeight:1, color:color||C.ink }}>{val}</div><div style={{ fontSize:12.5, color:C.sub, fontWeight:600, marginTop:8 }}>{label}</div>{sub && <div style={{ fontSize:11, color:C.sub, marginTop:3 }}>{sub}</div>}</div>);
  return (
    <div style={{ display:"grid", gap:16 }}>
      <Toolbar title="Pulse" sub="Efficiency & delivery across the content engine" />
      <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
        {headline(fmt(script2sched), "Script → Scheduled", `avg turnaround · ${cntSpan("Scripting","Scheduled")} pieces`, C.navy)}
        {headline(fmt(appr2posted), "Approved → Posted", `full cycle · ${cntSpan("Approved","Posted")} pieces`, C.navy)}
        {headline(rate==null?"—":rate+"%", "On-time delivery", `${delivered.length}/${due.length} due posts`, rate==null?C.ink:(rate>=80?"#1FA463":rate>=50?"#C98A00":C.red))}
      </div>
      <div style={card()}>
        <SectionTitle icon={TrendingUp}>Average time in each stage</SectionTitle>
        <div style={{ display:"grid", gap:12, marginTop:16 }}>
          {stageBars.map((s)=>(
            <div key={s.label} style={{ display:"flex", alignItems:"center", gap:12 }}>
              <span style={{ fontSize:12, color:C.sub, fontWeight:600, width:148, textAlign:"right", flexShrink:0 }}>{s.label}</span>
              <div style={{ flex:1, height:18, background:"#EEF1F6", borderRadius:6, overflow:"hidden" }}><div style={{ width:`${s.v?Math.max(6,(s.v/maxBar)*100):0}%`, height:"100%", background:C.navy, borderRadius:6, transition:"width .5s" }} /></div>
              <span style={{ fontSize:12.5, fontWeight:700, width:48, flexShrink:0 }}>{fmt(s.v)}</span>
            </div>
          ))}
        </div>
        <div style={{ fontSize:11, color:C.sub, marginTop:14, borderTop:`1px dashed ${C.line}`, paddingTop:10 }}>Measured from stage timestamps — recorded automatically each time a piece changes status. New pieces accumulate data as they move through the board.</div>
      </div>
    </div>
  );
}

// resize an uploaded image to a small square-ish logo and return a data URL (keeps the shared DB light)
function fileToLogoDataURL(file, max=220) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h = Math.round(h * max / w); w = max; } }
        else { if (h > max) { w = Math.round(w * max / h); h = max; } }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

                </div>)
              : f.t==="textarea" ? (<textarea value={rec[f.k]||""} onChange={(e)=>set(f.k,e.target.value)} rows={2} style={{ ...inp(), resize:"vertical" }} />)
              : (<input type={f.t==="number"?"number":f.t==="date"?"date":"text"} value={rec[f.k]==null?"":rec[f.k]} onChange={(e)=>set(f.k, f.t==="number"?Number(e.target.value):e.target.value)} style={inp()} />)}
            </div>
          ))}
        </div>
        <div style={{ padding:"0 20px 20px", display:"flex", gap:10, justifyContent:"flex-end" }}><button onClick={onClose} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.sub, padding:"9px 16px", borderRadius:9, fontWeight:600, cursor:"pointer", fontSize:13 }}>Cancel</button><button onClick={()=>onSave(rec)} style={{ border:"none", background:C.yellow, color:C.navy, padding:"9px 18px", borderRadius:9, fontWeight:700, cursor:"pointer", fontSize:13 }}>{modal.mode==="add"?"Add":"Save"}</button></div>
      </div>
    </div>
  );
}

/* ── content tracker (members submit weekly ideas + track execution stages) ── */
function ContentTracker({ rows, allTeam, isAdmin, myName, target, onAdd, onEdit, onDel, setStatus }) {
  const STAGES = ["Idea","Scripted","Filmed","Edited","Published"];
  const DONE = ["Scripted","Filmed","Edited","Published"];
  const [week, setWeek] = useState(THIS_MON);
  const wk = rows.filter((r)=>r.week===week);
  const team = (allTeam||[]).filter((t)=>t!=="Unassigned");
  const sunday = addDaysISO(week, 6);
  const grouped = {}; wk.forEach((r)=>{ (grouped[r.owner]=grouped[r.owner]||[]).push(r); });
  const mine = wk.filter((r)=>r.owner===myName).length;
  const countFor = (o)=>wk.filter((r)=>r.owner===o).length;
  const hitTarget = team.filter((t)=>countFor(t)>=target).length;
  const published = wk.filter((r)=>r.status==="Published").length;
  const navBtn = { border:`1px solid ${C.line}`, background:"#fff", color:C.navy, borderRadius:9, padding:"7px 12px", fontSize:12.5, fontWeight:700, cursor:"pointer" };
  const kpiBox = (n,l,c)=>(<div style={{ ...card(12), flex:1, minWidth:120 }}><div style={{ fontFamily:"inherit", fontSize:24, fontWeight:600, lineHeight:1, color:c||C.ink }}>{n}</div><div style={{ fontSize:11, color:C.sub, fontWeight:600, marginTop:5 }}>{l}</div></div>);
  const bar = (val,max,color)=>(<div style={{ height:6, background:"#EEF1F6", borderRadius:4, overflow:"hidden" }}><div style={{ width:`${Math.min(100,(val/Math.max(1,max))*100)}%`, height:"100%", background:color }} /></div>);
  return (
    <div>
      <Toolbar title="Content Tracker" sub={`Each member submits ≥ ${target} ideas/week, then tracks each through Scripted → Filmed → Edited → Published. Week of ${week} → ${sunday}`} onAdd={onAdd} addLabel="Add idea" />
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14, flexWrap:"wrap" }}>
        <button onClick={()=>setWeek(addDaysISO(week,-7))} style={navBtn}>← Prev</button>
        <button onClick={()=>setWeek(THIS_MON)} style={navBtn}>This week</button>
        <button onClick={()=>setWeek(addDaysISO(week,7))} style={navBtn}>Next →</button>
        {week===THIS_MON && <Pill bg={C.navy} fg="#fff">Current week</Pill>}
      </div>
      {team.includes(myName) && week===THIS_MON && mine<target && (
        <div style={{ background:"#FFF3CC", border:`1px solid ${C.yellow}`, borderRadius:10, padding:"10px 12px", fontSize:12.5, fontWeight:600, color:"#7a5b00", marginBottom:14 }}>⏰ You've submitted {mine} of {target} ideas this week — add {target-mine} more before Monday's meeting.</div>
      )}
      {isAdmin && (
        <div style={{ ...card(14), marginBottom:14 }}>
          <SectionTitle icon={Shield}>Monday review — team summary</SectionTitle>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", margin:"12px 0" }}>
            {kpiBox(`${hitTarget}/${team.length}`, `Hit ${target}-idea target`, "#1FA463")}
            {kpiBox(wk.length, "Total ideas", C.navy)}
            {kpiBox(published, "Published", "#1FA463")}
            {kpiBox(wk.filter((r)=>DONE.includes(r.status)&&r.status!=="Published").length, "In progress", "#C98A00")}
          </div>
          <div style={{ display:"grid", gap:8 }}>
            {team.map((t)=>{ const c=countFor(t); const pub=wk.filter((r)=>r.owner===t&&r.status==="Published").length; const ok=c>=target; return (
              <div key={t} style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ width:90, fontSize:12.5, fontWeight:600 }}>{t}</span>
                <div style={{ flex:1 }}>{bar(c,target,ok?"#1FA463":C.yellow)}</div>
                <span style={{ fontSize:12, fontWeight:700, color:ok?"#1FA463":C.red, width:58, textAlign:"right" }}>{c}/{target}</span>
                <span style={{ fontSize:11.5, color:C.sub, width:84, textAlign:"right" }}>{pub} published</span>
              </div>
            ); })}
          </div>
        </div>
      )}
      <div style={{ display:"grid", gap:14 }}>
        {Object.keys(grouped).length===0 && <Empty>No ideas submitted for this week yet.</Empty>}
        {team.filter((t)=>grouped[t]).map((owner)=>{ const c=grouped[owner].length; const ok=c>=target; return (
          <div key={owner}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
              <span style={{ fontFamily:"inherit", fontSize:16, fontWeight:600 }}>{owner}</span>
              <span style={{ fontSize:11.5, color:ok?"#15724A":C.red, background:ok?"#DCF0E4":"#FBE4E6", borderRadius:6, padding:"2px 8px", fontWeight:700 }}>{c}/{target}</span>
              {owner===myName && <Pill bg="#E8EEF7" fg={C.navy}>You</Pill>}
              <div style={{ flex:1, height:1, background:C.line }} />
            </div>
            <div style={{ display:"grid", gap:8 }}>
              {grouped[owner].map((r)=>(
                <div key={r._id} style={{ display:"flex", alignItems:"flex-start", gap:12, ...card(12) }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
                      <span style={{ fontSize:13.5, fontWeight:600 }}>{r.title || "(untitled)"}</span>
                      <Pill bg="#EEF1F6" fg={C.sub}>{r.type||"—"}</Pill>
                      {r.topic && <Pill bg="#E8EEF7" fg={C.navy}>{r.topic}</Pill>}
                    </div>
                    <div style={{ fontSize:11, color:C.sub, marginTop:4 }}>
                      {DONE.map((st)=> (r.stamps&&r.stamps[st]) ? <span key={st} style={{ marginRight:12 }}>✓ {st} <b style={{ color:C.ink }}>{r.stamps[st].slice(5)}</b></span> : null)}
                      {(!r.stamps || !DONE.some((st)=>r.stamps[st])) && <span style={{ fontStyle:"italic" }}>not started</span>}
                      {r.notes && <span style={{ display:"block", marginTop:3 }}>{r.notes}</span>}
                    </div>
                  </div>
                  <select value={r.status||"Idea"} onChange={(e)=>setStatus(r._id, e.target.value)} style={{ border:`1px solid ${C.line}`, borderRadius:8, padding:"5px 8px", fontSize:12, fontFamily:"inherit", background:STATUS_TINT[r.status]||"#fff", fontWeight:700, cursor:"pointer" }}>
                    {STAGES.map((s)=><option key={s} value={s}>{s}</option>)}
                  </select>
                  <div style={{ display:"flex" }}><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></div>
                </div>
              ))}
            </div>
          </div>
        ); })}
      </div>
    </div>
  );
}

/* ── productivity calendar (counts every status update per day, per person) ── */
function Productivity({ rows, team }) {
  const STAGES = ["Scripted","Filmed","Edited","Published"];
  const members = ["All", ...(team||[]).filter((t)=>t!=="Unassigned")];
  const [member, setMember] = useState("All");
  const now = new Date();
  const [ym, setYm] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const counts = {};
  rows.forEach((r)=>{ if (member!=="All" && r.owner!==member) return; const s=r.stamps||{}; STAGES.forEach((st)=>{ if (s[st]) counts[s[st]]=(counts[s[st]]||0)+1; }); });
  const first = new Date(ym.y, ym.m, 1);
  const startPad = (first.getDay()+6)%7;
  const dim = new Date(ym.y, ym.m+1, 0).getDate();
  const pad2 = (n)=>String(n).padStart(2,"0");
  const cells = []; for (let i=0;i<startPad;i++) cells.push(null);
  for (let d=1; d<=dim; d++){ const iso=`${ym.y}-${pad2(ym.m+1)}-${pad2(d)}`; cells.push({ d, iso, n: counts[iso]||0 }); }
  while (cells.length%7!==0) cells.push(null);
  const monthKey = `${ym.y}-${pad2(ym.m+1)}`;
  const monthTotal = Object.keys(counts).filter((k)=>k.startsWith(monthKey)).reduce((a,k)=>a+counts[k],0);
  const maxN = Math.max(1, ...cells.filter(Boolean).map((c)=>c.n));
  const monthName = first.toLocaleDateString("en-US",{ month:"long", year:"numeric" });
  const shift = (delta)=>setYm(({y,m})=>{ const d=new Date(y,m+delta,1); return { y:d.getFullYear(), m:d.getMonth() }; });
  const heat = (n)=>{ if (!n) return "#fff"; const t=n/maxN; if (t>0.66) return "#1FA463"; if (t>0.33) return "#7CC59A"; return "#CFE8D9"; };
  const navBtn = { border:`1px solid ${C.line}`, background:"#fff", color:C.navy, borderRadius:9, padding:"7px 12px", fontSize:12.5, fontWeight:700, cursor:"pointer" };
  const TODAYV = nowISO();
  return (
    <div>
      <Toolbar title="Productivity" sub="Each square counts the content actions completed that day — moving an idea to Scripted, Filmed, Edited or Published." />
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14, flexWrap:"wrap" }}>
        <button onClick={()=>shift(-1)} style={navBtn}>←</button>
        <span style={{ fontFamily:"inherit", fontSize:18, fontWeight:600, minWidth:160, textAlign:"center" }}>{monthName}</span>
        <button onClick={()=>shift(1)} style={navBtn}>→</button>
        <div style={{ flex:1 }} />
        <span style={{ fontSize:12, color:C.sub, fontWeight:600 }}>Member</span>
        <select value={member} onChange={(e)=>setMember(e.target.value)} style={{ border:`1px solid ${C.line}`, borderRadius:9, padding:"7px 10px", fontSize:13, fontFamily:"inherit", background:"#fff", cursor:"pointer" }}>
          {members.map((m)=><option key={m} value={m}>{m}</option>)}
        </select>
        <Pill bg={C.navy} fg="#fff">{monthTotal} actions</Pill>
      </div>
      <div style={card(14)}>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:6 }}>
          {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d)=>(<div key={d} style={{ fontSize:11, fontWeight:700, color:C.sub, textAlign:"center", paddingBottom:4 }}>{d}</div>))}
          {cells.map((c,i)=>(
            <div key={i} style={{ aspectRatio:"1 / 1", borderRadius:9, border:`1px solid ${c&&c.iso===TODAYV?C.navy:C.line}`, background:c?heat(c.n):"transparent", display:"flex", flexDirection:"column", justifyContent:"space-between", padding:6, minHeight:52 }}>
              {c && <span style={{ fontSize:11, fontWeight:600, color:c.n>maxN*0.33?"#fff":C.sub }}>{c.d}</span>}
              {c && c.n>0 && <span style={{ fontFamily:"inherit", fontSize:18, fontWeight:600, color:c.n>maxN*0.33?"#fff":C.ink, textAlign:"right" }}>{c.n}</span>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── admin panel: enrol team members (calls the secure Edge Function) ── */
function AdminPanel({ data, onEnrol, myEmail, onListUsers, onRemoveUser, onUpdateUser }) {
  const [name,setName]=useState(""); const [email,setEmail]=useState(""); const [pw,setPw]=useState(""); const [role,setRole]=useState("user");
  const [tabs,setTabs]=useState(MEMBER_TABS.map((t)=>t[0]));
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState(null);
  const [members,setMembers]=useState(null); const [mErr,setMErr]=useState("");
  const [editId,setEditId]=useState(null); const [eRole,setERole]=useState("user"); const [eTabs,setETabs]=useState([]); const [eBusy,setEBusy]=useState(false);
  const lbl = { fontSize:11.5, fontWeight:700, color:C.sub, display:"block", marginBottom:5 };
  const load = ()=>{ if(!onListUsers) return; setMErr(""); onListUsers().then((r)=>setMembers(r.users||[])).catch((e)=>setMErr(String((e&&e.message)||e))); };
  useEffect(()=>{ load(); }, []);
  const toggleTab=(id)=>setTabs((s)=>s.includes(id)?s.filter((x)=>x!==id):[...s,id]);
  const submit = async (e)=>{ e.preventDefault(); setBusy(true); setMsg(null);
    const res = await onEnrol({ name, email:email.trim(), password:pw, role, tabs: role==="admin"?null:tabs });
    setBusy(false);
    if (res.error) setMsg({ ok:false, text:res.error });
    else { setMsg({ ok:true, text:`✓ ${email} enrolled as ${role==="admin"?"Admin":"Member"}.` }); setName(""); setEmail(""); setPw(""); setRole("user"); setTabs(MEMBER_TABS.map((t)=>t[0])); load(); }
  };
  const remove = async (u)=>{ const ok = window.confirm ? window.confirm(`Remove ${u.email}? They will lose access to Content Hub immediately.`) : true; if(!ok) return; try{ await onRemoveUser(u.id); load(); }catch(e){ setMErr(String((e&&e.message)||e)); } };
  const startEdit = (u)=>{ setEditId(u.id); setERole(u.role||"user"); setETabs(Array.isArray(u.tabs)?u.tabs.slice():MEMBER_TABS.map((t)=>t[0])); };
  const toggleETab = (id)=>{ if(id==="dashboard") return; setETabs((s)=>s.includes(id)?s.filter((x)=>x!==id):[...s,id]); };
  const saveEdit = async (u)=>{ setEBusy(true); setMErr(""); try{ await onUpdateUser({ id:u.id, role:eRole, tabs: eRole==="admin"?null:eTabs }); setEditId(null); load(); }catch(e){ setMErr(String((e&&e.message)||e)); } setEBusy(false); };
  return (
    <div>
      <Toolbar title="Admin" sub="Enrol team members, set which tabs they can access, and manage logins" />
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
        <div style={card(16)}>
          <SectionTitle icon={UserPlus}>Enrol a new team member</SectionTitle>
          <form onSubmit={submit} style={{ display:"grid", gap:10, marginTop:12 }}>
            <div><label style={lbl}>Full name</label><input value={name} onChange={(e)=>setName(e.target.value)} required style={inp()} placeholder="e.g. Serene" /></div>
            <div><label style={lbl}>Email</label><input type="email" value={email} onChange={(e)=>setEmail(e.target.value)} required style={inp()} placeholder="name@company.com" /></div>
            <div><label style={lbl}>Temporary password</label><input value={pw} onChange={(e)=>setPw(e.target.value)} required minLength={6} style={inp()} placeholder="at least 6 characters" /></div>
            <div><label style={lbl}>Role</label><select value={role} onChange={(e)=>setRole(e.target.value)} style={inp()}><option value="user">Member</option><option value="admin">Admin</option></select></div>
            {role==="user" && (
              <div>
                <label style={lbl}>Tabs this member can access</label>
                <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                  {MEMBER_TABS.map((mt)=>{ const id=mt[0]; const label=mt[1]; const on=tabs.includes(id); const locked=id==="dashboard"; return (
                    <button type="button" key={id} onClick={()=>{ if(!locked) toggleTab(id); }} style={{ border:`1.5px solid ${on?C.navy:C.line}`, background:on?"#F3F6FC":"#fff", color:on?C.navy:C.sub, borderRadius:8, padding:"5px 9px", fontSize:11.5, fontWeight:600, cursor:locked?"default":"pointer", opacity:locked?0.7:1 }}>{on?"✓ ":""}{label}</button>
                  ); })}
                </div>
                <div style={{ fontSize:10.5, color:C.sub, marginTop:5 }}>Dashboard is always on. Admins see every tab.</div>
              </div>
            )}
            {msg && <div style={{ background:msg.ok?"#D6EFD6":"#FBE4E6", color:msg.ok?"#15724A":"#A11", fontSize:12, fontWeight:600, padding:"8px 10px", borderRadius:8 }}>{msg.text}</div>}
            <button type="submit" disabled={busy} style={{ border:"none", background:busy?"#9FB0CC":C.navy, color:"#fff", padding:"10px", borderRadius:10, fontWeight:700, fontSize:13.5, cursor:busy?"default":"pointer" }}>{busy?"Enrolling…":"Enrol member"}</button>
          </form>
          <div style={{ fontSize:11, color:C.sub, marginTop:10, lineHeight:1.5 }}>They can log in immediately with this email + password. Ask them to change it after first login.</div>
        </div>
        <div style={card(16)}>
          <SectionTitle icon={Shield}>Members & access</SectionTitle>
          {mErr && <div style={{ background:"#FBE4E6", color:"#A11", fontSize:11.5, fontWeight:600, padding:"8px 10px", borderRadius:8, margin:"12px 0" }}>{mErr}</div>}
          {members===null && !mErr && <div style={{ fontSize:12, color:C.sub, marginTop:12 }}>Loading members…</div>}
          <div style={{ display:"grid", gap:7, marginTop:12 }}>
            {members && members.map((u)=>(
              <div key={u.id} style={{ border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden" }}>
                <div style={{ display:"flex", alignItems:"center", gap:9, padding:"8px 10px" }}>
                  <span style={{ width:26, height:26, borderRadius:7, background:"#EEF1F6", display:"grid", placeItems:"center", fontSize:12, fontWeight:800, color:C.navy, flexShrink:0 }}>{(u.name||u.email||"?").slice(0,1).toUpperCase()}</span>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:12.5, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{u.name||u.email}</div>
                    <div style={{ fontSize:10.5, color:C.sub, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{u.email}{Array.isArray(u.tabs)?` · ${u.tabs.length} tabs`:(u.role==="admin"?"":" · all tabs")}</div>
                  </div>
                  <Pill bg={u.role==="admin"?C.yellow:"#EEF1F6"} fg={u.role==="admin"?C.navy:C.sub}>{u.role==="admin"?"Admin":"Member"}</Pill>
                  {u.email!==myEmail ? (<React.Fragment><IconBtn title="Edit access" onClick={()=>editId===u.id?setEditId(null):startEdit(u)}><Pencil size={14} /></IconBtn><IconBtn title="Remove member" danger onClick={()=>remove(u)}><Trash2 size={14} /></IconBtn></React.Fragment>) : <span style={{ fontSize:10, color:C.sub, width:24, textAlign:"center" }}>you</span>}
                </div>
                {editId===u.id && (
                  <div style={{ borderTop:`1px solid ${C.line}`, padding:"10px 12px", background:"#FAFBFD" }}>
                    <label style={lbl}>Role</label>
                    <select value={eRole} onChange={(e)=>setERole(e.target.value)} style={{ ...inp(), marginBottom:10 }}><option value="user">Member</option><option value="admin">Admin</option></select>
                    {eRole==="user" && (
                      <div style={{ marginBottom:10 }}>
                        <label style={lbl}>Tabs this member can access</label>
                        <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                          {MEMBER_TABS.map((mt)=>{ const id=mt[0]; const on=eTabs.includes(id); const locked=id==="dashboard"; return (
                            <button type="button" key={id} onClick={()=>toggleETab(id)} style={{ border:`1.5px solid ${on?C.navy:C.line}`, background:on?"#F3F6FC":"#fff", color:on?C.navy:C.sub, borderRadius:8, padding:"5px 9px", fontSize:11.5, fontWeight:600, cursor:locked?"default":"pointer", opacity:locked?0.7:1 }}>{on?"✓ ":""}{mt[1]}</button>
                          ); })}
                        </div>
                        <div style={{ fontSize:10.5, color:C.sub, marginTop:5 }}>Dashboard is always on.</div>
                      </div>
                    )}
                    <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
                      <button onClick={()=>setEditId(null)} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.sub, borderRadius:8, padding:"7px 13px", fontSize:12.5, fontWeight:600, cursor:"pointer" }}>Cancel</button>
                      <button onClick={()=>saveEdit(u)} disabled={eBusy} style={{ border:"none", background:eBusy?"#9FB0CC":C.navy, color:"#fff", borderRadius:8, padding:"7px 15px", fontSize:12.5, fontWeight:700, cursor:eBusy?"default":"pointer" }}>{eBusy?"Saving…":"Save access"}</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
            {members && members.length===0 && <Empty>No members yet.</Empty>}
          </div>
          <div style={{ fontSize:11, color:C.sub, marginTop:10, lineHeight:1.5 }}>Removing a member deletes their login immediately. Owner-dropdown names are managed in Lists → Team / Owner.</div>
        </div>
      </div>
    </div>
  );
}

                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── login screen (shown until a team member signs in) ── */
function Login() {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    setErr(""); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) setErr(error.message || "Could not sign in.");
  };
  return (
    <div style={{ minHeight:"100vh", display:"grid", placeItems:"center", background:C.navy, padding:20 }}>
      <form onSubmit={submit} style={{ width:"min(340px,100%)", background:"#fff", borderRadius:16, padding:24, boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:11, marginBottom:18 }}>
          <div style={{ width:38, height:38, borderRadius:10, background:C.yellow, color:C.navy, fontWeight:800, fontSize:14, display:"grid", placeItems:"center" }}>BBB</div>
          <div><div style={{ fontWeight:800, fontSize:16 }}>Content Hub</div><div style={{ fontSize:11.5, color:C.sub }}>Team & admin sign in</div></div>
        </div>
        <label style={{ fontSize:11.5, fontWeight:700, color:C.sub, display:"block", marginBottom:5 }}>Email</label>
        <input type="email" value={email} onChange={(e)=>setEmail(e.target.value)} required autoFocus style={{ ...inp(), marginBottom:12 }} />
        <label style={{ fontSize:11.5, fontWeight:700, color:C.sub, display:"block", marginBottom:5 }}>Password</label>
        <input type="password" value={pw} onChange={(e)=>setPw(e.target.value)} required style={{ ...inp(), marginBottom:16 }} />
        {err && <div style={{ background:"#FBE4E6", color:"#A11", fontSize:12, fontWeight:600, padding:"8px 10px", borderRadius:8, marginBottom:12 }}>{err}</div>}
        <button type="submit" disabled={busy} style={{ width:"100%", border:"none", background:busy?"#9FB0CC":C.navy, color:"#fff", padding:"11px", borderRadius:10, fontWeight:700, fontSize:14, cursor:busy?"default":"pointer" }}>{busy?"Signing in…":"Sign in"}</button>
        <div style={{ fontSize:11, color:C.sub, marginTop:14, textAlign:"center", lineHeight:1.5 }}>Accounts are created by your admin in Supabase. Contact your team lead if you can't sign in.</div>
      </form>
    </div>
  );
}

/* ── shown if the Supabase keys haven't been filled in yet ── */
function ConfigNeeded() {
  return (
    <div style={{ minHeight:"100vh", display:"grid", placeItems:"center", background:C.navy, padding:24 }}>
      <div style={{ width:"min(460px,100%)", background:"#fff", borderRadius:16, padding:26, textAlign:"center" }}>
        <div style={{ fontSize:34, marginBottom:8 }}>🔌</div>
        <div style={{ fontWeight:800, fontSize:17, marginBottom:8 }}>Almost there — add your Supabase keys</div>
        <div style={{ fontSize:13, color:C.sub, lineHeight:1.6 }}>Open <b>index.html</b> and paste your <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> near the top of the script (Supabase → Project Settings → API). Then refresh. Full steps are in the setup guide.</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

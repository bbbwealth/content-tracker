const withStamp = (item, status) => { const stamps = { ...(item.stamps || {}) }; if (!stamps[status]) stamps[status] = nowISO(); return { ...item, status, stamps }; };

      try {
        const res = await fetch(API, { cache: "no-store" });

        await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(seeded) });
        if (!off) { setData(seeded); loadedAtRef.current = seeded.updatedAt; setSaved("Synced"); }
      } catch (e) {
        try { const raw = localStorage.getItem(KEY); if (raw) { if (!off) { setData(normalize(JSON.parse(raw))); setSaved("Offline — local only"); } return; } } catch(_) {}
        if (!off) { setData(SEED); setSaved("Offline — local only"); }
      }
    })();
    return () => { off = true; };
  }, []);

  const persist = (next) => {
    next = { ...next, updatedAt: Date.now() };
    setData(next); dirtyRef.current = true; setSaved("Saving…");
    try { localStorage.setItem(KEY, JSON.stringify(next)); } catch(_) {}
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      try {
        const res = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(next) });
        if (!res.ok) throw new Error();
        dirtyRef.current = false; loadedAtRef.current = next.updatedAt; setSaved("Synced");
      } catch (e) { setSaved("Offline — saved locally"); }
    }, 600);
  };

  useEffect(() => {
    const t = setInterval(async () => {
      if (dirtyRef.current || busyRef.current) return;
      try {
        const res = await fetch(API, { cache: "no-store" });
        if (!res.ok) return;
        const remote = await res.json();
        if (remote && remote.updatedAt && remote.updatedAt > loadedAtRef.current) { setData(normalize(remote)); loadedAtRef.current = remote.updatedAt; }
      } catch (e) {}
    }, 20000);
    return () => clearInterval(t);
  }, []);

  if (!data) return <Splash />;
  const L = data.lists;
  const matchBrand = (r) => brandFilter === "All" || r.brand === brandFilter;
  const matchQuery = (r) => !query || JSON.stringify(r).toLowerCase().includes(query.toLowerCase());
  const filt = (rows) => rows.filter((r) => matchBrand(r) && matchQuery(r));

  const openAdd = (entity) => {
    const blank = {}; fieldSets(L)[entity].forEach((f)=>(blank[f.k]=f.t==="number"?0:""));
    if (entity==="ideas") { blank.dateAdded=new Date().toISOString().slice(0,10); blank.status="Backlog"; blank.priority="Medium"; }
    if (entity==="pipeline") blank.status="Approved";
    if (entity==="calendar") blank.status="Planned";
    if (entity==="collabs") blank.status="Pitching";
    setModal({ entity, mode:"add", record:blank });
  };
  const openEdit = (entity, record) => setModal({ entity, mode:"edit", record:{ ...record } });
  const saveModal = (rec) => {
    const { entity, mode } = modal; let rows = [...data[entity]]; let extra = {};
    if (mode==="add") {
      let row = { _id:uid(), ...rec }; if (codePrefix[entity]) row.code = nextCode(rows, codePrefix[entity]);
      if (entity==="pipeline") row = withStamp(row, row.status);
      rows.push(row);
      if (entity==="pipeline" && (row.status==="Scheduled" || row.status==="Posted")) extra.calendar = syncCalendar(data.calendar, row, row.status);
    } else {
      let saved = { ...rec }; if (entity==="pipeline") saved = withStamp(saved, saved.status);
      rows = rows.map((r)=>(r._id===rec._id ? saved : r));
      if (entity==="pipeline" && (saved.status==="Scheduled" || saved.status==="Posted")) extra.calendar = syncCalendar(data.calendar, saved, saved.status);
    }
    persist({ ...data, [entity]:rows, ...extra }); setModal(null);
  };
  const del = (entity,_id) => persist({ ...data, [entity]:data[entity].filter((r)=>r._id!==_id) });
  const setStatus = (entity,_id,status) => persist({ ...data, [entity]:data[entity].map((r)=>(r._id===_id?{ ...r, status }:r)) });
  const setPipelineStatus = (_id, status) => {
    const pipeline = data.pipeline.map((r)=>(r._id===_id ? withStamp(r, status) : r));
    const item = pipeline.find((r)=>r._id===_id);
    let calendar = data.calendar;
    if (status==="Scheduled" || status==="Posted") calendar = syncCalendar(calendar, item, status);
    persist({ ...data, pipeline, calendar });
  };
  const setWeeklyTarget = (n) => persist({ ...data, settings:{ ...data.settings, weeklyTarget: Math.max(0, Number(n)||0) } });
  const promote = (idea) => { const row = withStamp({ _id:uid(), code:nextCode(data.pipeline,"C"), brand:idea.brand, type:idea.type, title:idea.title, platform:"Instagram", owner:idea.by, status:"Approved", notes:idea.hook, collab:"", draftDue:"", designDue:"", target:"", link:"" }, "Approved"); persist({ ...data, pipeline:[...data.pipeline,row] }); setTab("pipeline"); };
  const addIdeasToPipeline = (chosen) => {
    let rows=[...data.pipeline], ideas=[...data.ideas];
    chosen.forEach((idea)=>{ rows.push(withStamp({ _id:uid(), code:nextCode(rows,"C"), brand:idea.brand, type:idea.type, title:idea.title, platform:"Instagram", owner:idea.by, status:"Approved", notes:idea.hook, collab:"", draftDue:"", designDue:"", target:"", link:"" }, "Approved")); ideas=ideas.map((i)=>(i._id===idea._id&&i.status==="Backlog"?{ ...i, status:"Approved" }:i)); });
    persist({ ...data, pipeline:rows, ideas });
  };

  const NAV = [
    { id:"dashboard", label:"Dashboard", icon:LayoutDashboard }, { id:"ideas", label:"Idea Bank", icon:Lightbulb },
    { id:"pipeline", label:"Pipeline", icon:Columns }, { id:"calendar", label:"Calendar", icon:CalendarDays },
    { id:"collabs", label:"Collabs", icon:Briefcase }, { id:"pulse", label:"Pulse", icon:Activity }, { id:"settings", label:"Lists", icon:Settings },
  ];

  return (
    <div style={{ background:C.canvas, color:C.ink, borderRadius:16, overflow:"hidden", border:`1px solid ${C.line}`, boxShadow:"0 10px 40px rgba(20,35,62,.10)" }}>
      <div style={{ background:C.navy, padding:"14px 20px", display:"flex", alignItems:"center", gap:16, flexWrap:"wrap" }}>
        <div style={{ display:"flex", alignItems:"center", gap:11 }}>
          <div style={{ width:34, height:34, borderRadius:9, background:C.yellow, color:C.navy, fontWeight:800, fontSize:13, display:"grid", placeItems:"center", letterSpacing:"-.5px" }}>BBB</div>
          <div><div style={{ color:"#fff", fontWeight:700, fontSize:16, lineHeight:1 }}>Content OS</div><div style={{ color:"#9FB0CC", fontSize:11, marginTop:3 }}>BBB Media Group</div></div>
        </div>
        <div style={{ flex:1 }} />
        <div style={{ position:"relative", display:"flex", alignItems:"center" }}>
          <Search size={15} color="#9FB0CC" style={{ position:"absolute", left:10 }} />
          <input value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="Search…" style={{ background:C.navy2, border:"1px solid #2C3F5E", color:"#fff", borderRadius:9, padding:"7px 10px 7px 30px", fontSize:13, width:150, outline:"none" }} />
        </div>
        <div style={{ display:"flex", gap:6, background:C.navy2, padding:4, borderRadius:10, flexWrap:"wrap" }}>
          {["All", ...L.brands].map((b)=>(<button key={b} onClick={()=>setBrandFilter(b)} style={{ border:"none", cursor:"pointer", borderRadius:7, padding:"6px 11px", fontSize:12, fontWeight:600, background:brandFilter===b?C.yellow:"transparent", color:brandFilter===b?C.navy:"#B9C6DD" }}>{b}</button>))}
        </div>
      </div>

      <div style={{ display:"flex", gap:2, padding:"0 14px", background:C.navy, borderTop:"1px solid #243653", flexWrap:"wrap" }}>
        {NAV.map((n)=>{ const on=tab===n.id; const Icon=n.icon; return (
          <button key={n.id} onClick={()=>setTab(n.id)} style={{ border:"none", cursor:"pointer", background:"transparent", color:on?"#fff":"#8696B4", padding:"12px 14px", fontSize:13, fontWeight:600, display:"flex", alignItems:"center", gap:7, borderBottom:`3px solid ${on?C.yellow:"transparent"}` }}><Icon size={16} />{n.label}</button>
        ); })}
        <div style={{ flex:1 }} />
        {saved && <div style={{ alignSelf:"center", color: saved.indexOf("Offline")>=0 ? "#FF8E8E" : (saved.indexOf("Synced")>=0 ? "#7CE0A3" : C.yellow), fontSize:12, fontWeight:600, paddingRight:8 }}>● {saved}</div>}
      </div>

      <div style={{ padding:20, maxHeight:"72vh", overflowY:"auto" }}>
        {tab==="dashboard" && <Dashboard data={data} setTab={setTab} />}
        {tab==="ideas" && <Ideas rows={filt(data.ideas)} onAdd={()=>openAdd("ideas")} onEdit={(r)=>openEdit("ideas",r)} onDel={(id)=>del("ideas",id)} onPromote={promote} />}
        {tab==="pipeline" && <Pipeline rows={filt(data.pipeline)} ideas={data.ideas} pipelineAll={data.pipeline} onAddFromIdeas={addIdeasToPipeline} onAdd={()=>openAdd("pipeline")} onEdit={(r)=>openEdit("pipeline",r)} onDel={(id)=>del("pipeline",id)} drag={drag} setDrag={setDrag} setStatus={(id,s)=>setPipelineStatus(id,s)} />}
        {tab==="calendar" && <Calendar rows={filt(data.calendar)} weeklyTarget={data.settings.weeklyTarget} onTarget={setWeeklyTarget} onAdd={()=>openAdd("calendar")} onEdit={(r)=>openEdit("calendar",r)} onDel={(id)=>del("calendar",id)} />}
        {tab==="collabs" && <Collabs rows={filt(data.collabs)} onAdd={()=>openAdd("collabs")} onEdit={(r)=>openEdit("collabs",r)} onDel={(id)=>del("collabs",id)} />}
        {tab==="pulse" && <Pulse data={data} />}
        {tab==="settings" && <Lists data={data} persist={persist} />}
      </div>

      {modal && <Modal modal={modal} L={L} onClose={()=>setModal(null)} onSave={saveModal} />}
    </div>
  );
}

function Splash(){ return (<div style={{ height:420, display:"grid", placeItems:"center", background:C.navy, borderRadius:16 }}><div style={{ textAlign:"center" }}><div style={{ width:46, height:46, borderRadius:12, background:C.yellow, color:C.navy, fontWeight:800, display:"grid", placeItems:"center", margin:"0 auto 14px" }}>BBB</div><div style={{ color:"#fff", fontWeight:700 }}>Loading Content OS…</div></div></div>); }

                </div>
              ))}

}

function IdeaPicker({ ideas, pipelineAll, onClose, onConfirm }) {

  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:50, padding:16, backdropFilter:"blur(2px)" }}>

        <div style={{ background:C.navy, padding:"16px 20px", display:"flex", alignItems:"center", justifyContent:"space-between" }}><div style={{ color:"#fff", fontWeight:700, fontSize:15, display:"flex", alignItems:"center", gap:8 }}><Lightbulb size={17} color={C.yellow} />Add from Idea Bank</div><span style={{ cursor:"pointer" }} onClick={onClose}><X size={18} color="#9FB0CC" /></span></div>
        <div style={{ padding:14, overflowY:"auto", display:"grid", gap:8 }}>

              <span style={{ width:18, height:18, borderRadius:5, border:`2px solid ${on?C.navy:"#C7CFDD"}`, background:on?C.navy:"#fff", display:"grid", placeItems:"center", flexShrink:0, color:"#fff", fontSize:11, fontWeight:800 }}>{on?"✓":""}</span>
              <div style={{ flex:1, minWidth:0 }}><div style={{ fontSize:13.5, fontWeight:700, lineHeight:1.3 }}>{i.title}</div><div style={{ fontSize:11.5, color:C.sub, marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{i.hook}</div></div>
              <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:5, flexShrink:0 }}><BrandTag b={i.brand} /><div style={{ display:"flex", gap:5 }}><Pill bg="#EEF1F6" fg={C.sub}>{i.type}</Pill><StatusPill s={i.status} /></div></div>
            </div>
          ); })}
        </div>
        <div style={{ padding:"14px 20px", borderTop:`1px solid ${C.line}`, display:"flex", alignItems:"center", gap:10 }}>
          <span style={{ fontSize:12.5, color:C.sub }}>{sel.length} selected</span><div style={{ flex:1 }} />
          <button onClick={onClose} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.sub, padding:"9px 16px", borderRadius:9, fontWeight:600, cursor:"pointer", fontSize:13 }}>Cancel</button>
          <button disabled={!sel.length} onClick={()=>onConfirm(chosen)} style={{ border:"none", background:sel.length?C.yellow:"#E6E9F0", color:sel.length?C.navy:"#A9B2C4", padding:"9px 18px", borderRadius:9, fontWeight:700, cursor:sel.length?"pointer":"default", fontSize:13 }}>Add {sel.length || ""} to pipeline</button>
        </div>
      </div>
    </div>
  );
}

function Calendar({ rows, onAdd, onEdit, onDel, weeklyTarget, onTarget }) {
  const [wkStart, wkEnd] = weekBounds();
  const dated = rows.filter((r)=>r.date);
  const thisWeek = dated.filter((r)=>r.date>=wkStart && r.date<=wkEnd);
  const due = dated.filter((r)=>r.date<=TODAY);
  const delivered = due.filter((r)=>r.status==="Posted");
  const missed = due.filter((r)=>r.status!=="Posted");
  const rate = due.length ? Math.round((delivered.length/due.length)*100) : null;
  const isMissed = (r) => r.date < TODAY && r.status !== "Posted";
  const groups = useMemo(()=>{ const g={}; [...rows].filter((r)=>r.date).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach((r)=>{ (g[r.date]=g[r.date]||[]).push(r); }); return g; }, [rows]);
  const kpi = (n, l, c, sub) => (<div style={{ ...card(13), flex:1, minWidth:120 }}><div style={{ fontFamily:"'Fraunces',serif", fontSize:28, fontWeight:600, lineHeight:1, color:c||C.ink }}>{n}</div><div style={{ fontSize:11.5, color:C.sub, fontWeight:600, marginTop:6 }}>{l}</div>{sub && <div style={{ fontSize:10.5, color:C.sub, marginTop:2 }}>{sub}</div>}</div>);
  return (
    <div>
      <Toolbar title="Posting Calendar" sub="Plan ahead. Anything past its date and not Posted counts as missed." onAdd={onAdd} addLabel="Schedule post" />
      <div style={{ display:"flex", gap:10, marginBottom:18, flexWrap:"wrap" }}>
        <div style={{ ...card(13), flex:1, minWidth:150 }}>
          <div style={{ display:"flex", alignItems:"baseline", gap:6 }}>
            <div style={{ fontFamily:"'Fraunces',serif", fontSize:28, fontWeight:600, lineHeight:1 }}>{thisWeek.length}</div>
            <div style={{ fontSize:14, color:C.sub, fontWeight:600 }}>/ <input type="number" value={weeklyTarget} onChange={(e)=>onTarget(e.target.value)} style={{ width:34, border:`1px solid ${C.line}`, borderRadius:6, padding:"2px 4px", fontSize:13, fontFamily:"inherit", textAlign:"center" }} /></div>
          </div>
          <div style={{ fontSize:11.5, color:C.sub, fontWeight:600, marginTop:6 }}>Planned this week</div>
          <div style={{ height:6, background:"#EEF1F6", borderRadius:4, overflow:"hidden", marginTop:7 }}><div style={{ width:`${Math.min(100,(thisWeek.length/Math.max(1,weeklyTarget))*100)}%`, height:"100%", background: thisWeek.length>=weeklyTarget ? "#1FA463" : C.yellow }} /></div>
        </div>
        {kpi(rate==null?"—":rate+"%", "On-time delivery", rate==null?C.ink:(rate>=80?"#1FA463":rate>=50?"#C98A00":C.red), `${delivered.length}/${due.length} due posts`)}
        {kpi(delivered.length, "Delivered", "#1FA463")}
        {kpi(missed.length, "Missed", missed.length?C.red:C.ink, "past date, not posted")}
      </div>
      <div style={{ display:"grid", gap:14 }}>
        {Object.keys(groups).length===0 && <Empty>No posts scheduled.</Empty>}
        {Object.entries(groups).map(([date,items])=>(
          <div key={date}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}><span style={{ fontFamily:"'Fraunces',serif", fontSize:18, fontWeight:600 }}>{date}</span><span style={{ fontSize:12, color:C.sub, fontWeight:700, background:"#EEF1F6", borderRadius:6, padding:"2px 8px" }}>{dow(date)}</span>{date===TODAY && <Pill bg={C.navy} fg="#fff">Today</Pill>}<div style={{ flex:1, height:1, background:C.line }} /></div>
            <div style={{ display:"grid", gap:8 }}>
              {items.map((r)=>{ const miss=isMissed(r); return (
                <div key={r._id} style={{ display:"flex", alignItems:"center", gap:12, ...card(12), borderColor: miss ? "#F3C9CD" : C.line, background: miss ? "#FFF7F7" : "#fff" }}>
                  <span style={{ fontSize:12, fontWeight:700, color:C.navy, minWidth:64 }}>{r.time}</span>
                  <div style={{ flex:1 }}><div style={{ fontSize:13.5, fontWeight:600 }}>{r.title}{r.fromPipeline && <span title="Linked from pipeline" style={{ color:C.sub, fontWeight:600 }}> ↩</span>}</div><div style={{ fontSize:11.5, color:C.sub, marginTop:2 }}>{r.platform} · {r.type} · {r.owner}</div></div>
                  <BrandTag b={r.brand} />
                  {miss ? <Pill bg="#F9D7D7" fg="#A11">Missed</Pill> : <StatusPill s={r.status} />}
                  <div style={{ display:"flex" }}><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></div>
                </div>
              ); })}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function Collabs({ rows, onAdd, onEdit, onDel }) {
  const [sort, setSort] = useState("default");
  const sorted = useMemo(()=>{ const a=[...rows]; const num=(x)=>Number(x)||0;
    if (sort==="feeDesc") a.sort((x,y)=>num(y.fee)-num(x.fee));
    else if (sort==="feeAsc") a.sort((x,y)=>num(x.fee)-num(y.fee));
    else if (sort==="golive") a.sort((x,y)=>(x.goLive||"9999").localeCompare(y.goLive||"9999"));
    else if (sort==="brief") a.sort((x,y)=>(y.briefDate||"").localeCompare(x.briefDate||""));
    else if (sort==="partner") a.sort((x,y)=>(x.partner||"").localeCompare(y.partner||""));
    else if (sort==="status") a.sort((x,y)=>(x.status||"").localeCompare(y.status||""));
    else if (sort==="type") a.sort((x,y)=>(x.ctype||"").localeCompare(y.ctype||""));
    else a.sort((x,y)=>(x.code||"").localeCompare(y.code||""));
    return a; }, [rows, sort]);
  const fees = rows.reduce((s,c)=>s+(Number(c.fee)||0),0);
  const SORTS = [["default","Code (default)"],["type","Collab type"],["feeDesc","Fee (high→low)"],["feeAsc","Fee (low→high)"],["golive","Go-live (soonest)"],["brief","Brief date (newest)"],["partner","Partner (A–Z)"],["status","Status"]];
  return (
    <div>
      <Toolbar title="Collabs & Partners" sub={`${rows.length} deals · RM ${fees.toLocaleString()} logged`} onAdd={onAdd} addLabel="New collab" />
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
        <span style={{ fontSize:12, color:C.sub, fontWeight:600 }}>Sort by</span>
        <select value={sort} onChange={(e)=>setSort(e.target.value)} style={{ border:`1px solid ${C.line}`, borderRadius:9, padding:"7px 10px", fontSize:13, fontFamily:"inherit", background:"#fff", outline:"none", cursor:"pointer" }}>
          {SORTS.map(([v,l])=><option key={v} value={v}>{l}</option>)}
        </select>
      </div>
      <div style={{ display:"grid", gap:10 }}>
        {sorted.map((r)=>(
          <div key={r._id} style={card(14)}>
            <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}><span style={{ fontSize:14.5, fontWeight:700 }}>{r.partner}</span><TypePill t={r.ctype} /><BrandTag b={r.brand} /><StatusPill s={r.status} /><span style={{ fontFamily:"'Fraunces',serif", fontSize:20, fontWeight:600, marginLeft:"auto" }}>{Number(r.fee)?`RM ${Number(r.fee).toLocaleString()}`:"—"}</span><div style={{ display:"flex" }}><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></div></div>
            <div style={{ fontSize:12.5, color:C.sub, margin:"8px 0" }}>{r.deliverables} · Talent: {r.talent} · PIC: {r.pic}</div>
            <div style={{ display:"flex", gap:18, flexWrap:"wrap", fontSize:11.5, color:C.sub, borderTop:`1px solid ${C.line}`, paddingTop:8 }}><span>Go-live <b style={{ color:C.ink }}>{r.goLive || "—"}</b></span><span>Contract <Pill bg={STATUS_TINT[r.contract]} fg={statusInk(r.contract)}>{r.contract}</Pill></span><span>Invoice <Pill bg={STATUS_TINT[r.invoice]} fg={statusInk(r.invoice)}>{r.invoice}</Pill></span><span style={{ marginLeft:"auto" }}>{r.code}</span></div>
          </div>
        ))}
      </div>
      {rows.length===0 && <Empty>No collabs match your filter.</Empty>}
    </div>
  );
}

function Pulse({ data }) {
  const STAGES = ["Approved","Scripting","Design","Review","Scheduled","Posted"];
  const items = data.pipeline;
  const avgSpan = (from,to) => { const xs=items.map((p)=>dayspan(p.stamps&&p.stamps[from], p.stamps&&p.stamps[to])).filter((v)=>v!=null && v>=0); return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; };
  const cntSpan = (from,to) => items.filter((p)=>p.stamps&&p.stamps[from]&&p.stamps[to]).length;
  const script2sched = avgSpan("Scripting","Scheduled");
  const appr2posted = avgSpan("Approved","Posted");
  const stageBars = []; for (let i=0;i<STAGES.length-1;i++){ stageBars.push({ label:`${STAGES[i]} → ${STAGES[i+1]}`, v:avgSpan(STAGES[i],STAGES[i+1]) }); }
  const maxBar = Math.max(0.1, ...stageBars.map((s)=>s.v||0));
  const fmt = (v) => v==null ? "—" : (v<1 ? `${Math.round(v*24)}h` : `${v.toFixed(1)}d`);
  const cal = data.calendar.filter((c)=>c.date);
  const due = cal.filter((c)=>c.date<=TODAY);
  const delivered = due.filter((c)=>c.status==="Posted");
  const rate = due.length ? Math.round((delivered.length/due.length)*100) : null;
  const headline = (val, label, sub, color) => (<div style={{ ...card(16), flex:1, minWidth:150 }}><div style={{ fontFamily:"'Fraunces',serif", fontSize:34, fontWeight:600, lineHeight:1, color:color||C.ink }}>{val}</div><div style={{ fontSize:12.5, color:C.sub, fontWeight:600, marginTop:8 }}>{label}</div>{sub && <div style={{ fontSize:11, color:C.sub, marginTop:3 }}>{sub}</div>}</div>);
  return (
    <div style={{ display:"grid", gap:16 }}>
      <Toolbar title="Pulse" sub="Efficiency & delivery across the content engine" />
      <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
        {headline(fmt(script2sched), "Script → Scheduled", `avg turnaround · ${cntSpan("Scripting","Scheduled")} pieces`, C.navy)}
        {headline(fmt(appr2posted), "Approved → Posted", `full cycle · ${cntSpan("Approved","Posted")} pieces`, C.navy)}
        {headline(rate==null?"—":rate+"%", "On-time delivery", `${delivered.length}/${due.length} due posts`, rate==null?C.ink:(rate>=80?"#1FA463":rate>=50?"#C98A00":C.red))}
      </div>
      <div style={card()}>
        <SectionTitle icon={TrendingUp}>Average time in each stage</SectionTitle>
        <div style={{ display:"grid", gap:12, marginTop:16 }}>
          {stageBars.map((s)=>(
            <div key={s.label} style={{ display:"flex", alignItems:"center", gap:12 }}>
              <span style={{ fontSize:12, color:C.sub, fontWeight:600, width:148, textAlign:"right", flexShrink:0 }}>{s.label}</span>
              <div style={{ flex:1, height:18, background:"#EEF1F6", borderRadius:6, overflow:"hidden" }}><div style={{ width:`${s.v?Math.max(6,(s.v/maxBar)*100):0}%`, height:"100%", background:C.navy, borderRadius:6, transition:"width .5s" }} /></div>
              <span style={{ fontSize:12.5, fontWeight:700, width:48, flexShrink:0 }}>{fmt(s.v)}</span>
            </div>
          ))}
        </div>
        <div style={{ fontSize:11, color:C.sub, marginTop:14, borderTop:`1px dashed ${C.line}`, paddingTop:10 }}>Measured from stage timestamps — recorded automatically each time a piece changes status. New pieces accumulate data as they move through the board.</div>
      </div>
    </div>
  );
}

const LIST_LABELS = { brands:"Brands", types:"Content Types", platforms:"Platforms", pipelineStatus:"Pipeline Status", ideaStatus:"Idea Status", priority:"Priority", team:"Team / Owner", calStatus:"Calendar Status", collabStatus:"Collab Status", collabTypes:"Collab Types", docStatus:"Doc Status" };
function Lists({ data, persist }) {
  const add = (key,val) => { if(!val.trim()) return; persist({ ...data, lists:{ ...data.lists, [key]:[...data.lists[key], val.trim()] } }); };
  const rm = (key,val) => persist({ ...data, lists:{ ...data.lists, [key]:data.lists[key].filter((v)=>v!==val) } });
  return (
    <div>
      <Toolbar title="Lists" sub="Dropdown options used across every tab" />
      <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(230px,1fr))", gap:12 }}>
        {Object.keys(LIST_LABELS).map((key)=>(
          <div key={key} style={card(14)}>
            <div style={{ fontSize:12.5, fontWeight:700, marginBottom:10 }}>{LIST_LABELS[key]}</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:10 }}>{data.lists[key].map((v)=>(<span key={v} style={{ display:"inline-flex", alignItems:"center", gap:5, background:"#EEF1F6", borderRadius:7, padding:"4px 8px", fontSize:12 }}>{v}<span style={{ cursor:"pointer", color:C.sub, display:"inline-flex" }} onClick={()=>rm(key,v)}><X size={12} /></span></span>))}</div>
            <AddInline onAdd={(v)=>add(key,v)} />
          </div>
        ))}
      </div>
    </div>
  );
}
function AddInline({ onAdd }) {
  const [v,setV] = useState("");
  return (<div style={{ display:"flex", gap:6 }}><input value={v} onChange={(e)=>setV(e.target.value)} onKeyDown={(e)=>{ if(e.key==="Enter"){ onAdd(v); setV(""); } }} placeholder="Add…" style={{ flex:1, border:`1px solid ${C.line}`, borderRadius:7, padding:"6px 9px", fontSize:12, outline:"none" }} /><button onClick={()=>{ onAdd(v); setV(""); }} style={{ border:"none", background:C.navy, color:"#fff", borderRadius:7, width:30, cursor:"pointer" }}>+</button></div>);
}

function Modal({ modal, L, onClose, onSave }) {
  const [rec,setRec] = useState(modal.record);
  const fields = fieldSets(L)[modal.entity];
  const title = { ideas:"Idea", pipeline:"Pipeline piece", calendar:"Calendar post", collabs:"Collab" }[modal.entity];
  const set = (k,v) => setRec((r)=>({ ...r, [k]:v }));
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:50, padding:16, backdropFilter:"blur(2px)" }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, width:"min(560px,100%)", maxHeight:"86vh", overflow:"auto", boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ background:C.navy, padding:"16px 20px", display:"flex", alignItems:"center", justifyContent:"space-between", position:"sticky", top:0 }}><div style={{ color:"#fff", fontWeight:700, fontSize:15 }}>{modal.mode==="add"?`New ${title}`:`Edit ${title}`}</div><span style={{ cursor:"pointer" }} onClick={onClose}><X size={18} color="#9FB0CC" /></span></div>
        <div style={{ padding:20, display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
          {fields.map((f)=>(
            <div key={f.k} style={{ gridColumn:f.full?"1 / -1":"auto" }}>
              <label style={{ fontSize:11.5, fontWeight:700, color:C.sub, display:"block", marginBottom:5 }}>{f.l}</label>
              {f.t==="select" ? (<select value={rec[f.k]||""} onChange={(e)=>set(f.k,e.target.value)} style={inp()}><option value="">—</option>{f.o.map((o)=><option key={o} value={o}>{o}</option>)}</select>)
              : f.t==="textarea" ? (<textarea value={rec[f.k]||""} onChange={(e)=>set(f.k,e.target.value)} rows={2} style={{ ...inp(), resize:"vertical" }} />)
              : (<input type={f.t==="number"?"number":f.t==="date"?"date":"text"} value={rec[f.k]==null?"":rec[f.k]} onChange={(e)=>set(f.k, f.t==="number"?Number(e.target.value):e.target.value)} style={inp()} />)}
            </div>
          ))}
        </div>
        <div style={{ padding:"0 20px 20px", display:"flex", gap:10, justifyContent:"flex-end" }}><button onClick={onClose} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.sub, padding:"9px 16px", borderRadius:9, fontWeight:600, cursor:"pointer", fontSize:13 }}>Cancel</button><button onClick={()=>onSave(rec)} style={{ border:"none", background:C.yellow, color:C.navy, padding:"9px 18px", borderRadius:9, fontWeight:700, cursor:"pointer", fontSize:13 }}>{modal.mode==="add"?"Add":"Save"}</button></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

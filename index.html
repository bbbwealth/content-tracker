function Pipeline({ rows, ideas, pipelineAll, onAddFromIdeas, onAdd, onEdit, onDel, drag, setDrag, setStatus, pipelineStatus }) {
  const [picker, setPicker] = useState(false);
  const base = (pipelineStatus && pipelineStatus.length) ? pipelineStatus : PIPE_COLS;
  const extra = [...new Set(rows.map((r)=>r.status))].filter((s)=>s && !base.includes(s));
  const cols = [...base, ...extra];
  return (
    <div>
      <Toolbar title="Pipeline" sub="Drag cards between stages to update status" onAdd={onAdd} addLabel="New piece" onSecondary={()=>setPicker(true)} secondaryLabel="Add from ideas" secondaryIcon={Lightbulb} />
      <div style={{ display:"flex", gap:12, overflowX:"auto", paddingBottom:8 }}>
        {cols.map((col)=>{ const items=rows.filter((r)=>r.status===col); const over=drag&&drag.over===col; return (
          <div key={col} onDragOver={(e)=>{ e.preventDefault(); if(drag) setDrag({ ...drag, over:col }); }} onDrop={()=>{ if(drag){ setStatus(drag.id,col); setDrag(null); } }} style={{ minWidth:210, width:210, background:over?"#EDF1F8":"#EFF1F6", borderRadius:12, padding:8, transition:"background .15s", border:over?`2px dashed ${C.navy2}`:"2px dashed transparent" }}>
            <div style={{ display:"flex", alignItems:"center", gap:7, padding:"4px 6px 10px" }}><span style={{ width:9, height:9, borderRadius:3, background:STATUS_TINT[col], border:`1px solid ${C.line}` }} /><span style={{ fontSize:12.5, fontWeight:700 }}>{col}</span><span style={{ fontSize:11, color:C.sub, marginLeft:"auto", background:"#fff", borderRadius:6, padding:"1px 7px" }}>{items.length}</span></div>
            <div style={{ display:"grid", gap:8, minHeight:30 }}>
              {items.map((r)=>(
                <div key={r._id} draggable onDragStart={()=>setDrag({ id:r._id, over:col })} onDragEnd={()=>setDrag(null)} style={{ background:"#fff", borderRadius:10, padding:10, border:`1px solid ${C.line}`, cursor:"grab", boxShadow:"0 1px 2px rgba(20,35,62,.05)" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:5 }}><GripVertical size={13} /><BrandTag b={r.brand} /><div style={{ marginLeft:"auto", display:"flex" }}><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={13} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={13} /></IconBtn></div></div>
                  <div style={{ fontSize:13, fontWeight:700, margin:"7px 0 5px", lineHeight:1.3 }}>{r.title}</div>
                  <div style={{ display:"flex", gap:5, flexWrap:"wrap", marginBottom:6 }}><Pill bg="#EEF1F6" fg={C.sub}>{r.type}</Pill>{r.collab && <Pill bg="#FBE9D9" fg="#9A5B16">★ {r.collab}</Pill>}</div>
                  {(r.scriptLink||r.footageLink||r.contentLink) && <div style={{ display:"flex", gap:4, flexWrap:"wrap", marginBottom:6 }}>{[["Script",r.scriptLink],["Footage",r.footageLink],["Content",r.contentLink]].filter((x)=>x[1]).map((x)=>(<a key={x[0]} href={x[1]} target="_blank" rel="noreferrer" onClick={(e)=>e.stopPropagation()} onMouseDown={(e)=>e.stopPropagation()} style={{ fontSize:10, fontWeight:700, color:C.navy, background:"#EEF1F6", borderRadius:6, padding:"2px 6px", textDecoration:"none" }}>🔗 {x[0]}</a>))}</div>}
                  {r.adminComment && <div style={{ fontSize:10.5, color:"#7a5b00", background:"#FFF3CC", border:`1px solid ${C.yellow}`, borderRadius:7, padding:"4px 6px", marginBottom:6, lineHeight:1.4 }}>💬 {r.adminComment}</div>}
                  <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.sub, borderTop:`1px solid ${C.line}`, paddingTop:6 }}><span>{r.owner}</span><span>{r.target || "—"}</span></div>
                </div>
              ))}
            </div>
          </div>
        ); })}
      </div>
      {picker && <IdeaPicker ideas={ideas} pipelineAll={pipelineAll} onClose={()=>setPicker(false)} onConfirm={(sel)=>{ onAddFromIdeas(sel); setPicker(false); }} />}
    </div>
  );
}

function IdeaPicker({ ideas, pipelineAll, onClose, onConfirm }) {
  const available = ideas.filter((i)=>i.status!=="Killed" && !pipelineAll.some((p)=>p.brand===i.brand && p.title===i.title));
  const [sel, setSel] = useState([]);
  const toggle = (id) => setSel((s)=>(s.includes(id)?s.filter((x)=>x!==id):[...s,id]));
  const chosen = available.filter((i)=>sel.includes(i._id));
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:50, padding:16, backdropFilter:"blur(2px)" }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, width:"min(560px,100%)", maxHeight:"86vh", overflow:"hidden", display:"flex", flexDirection:"column", boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ background:C.navy, padding:"16px 20px", display:"flex", alignItems:"center", justifyContent:"space-between" }}><div style={{ color:"#fff", fontWeight:700, fontSize:15, display:"flex", alignItems:"center", gap:8 }}><Lightbulb size={17} color={C.yellow} />Add from Idea Bank</div><span style={{ cursor:"pointer" }} onClick={onClose}><X size={18} color="#9FB0CC" /></span></div>
        <div style={{ padding:14, overflowY:"auto", display:"grid", gap:8 }}>
          {available.length===0 && <Empty>Every idea is already in the pipeline.</Empty>}
          {available.map((i)=>{ const on=sel.includes(i._id); return (
            <div key={i._id} onClick={()=>toggle(i._id)} style={{ display:"flex", alignItems:"center", gap:11, padding:"10px 12px", border:`1.5px solid ${on?C.navy:C.line}`, borderRadius:11, cursor:"pointer", background:on?"#F3F6FC":"#fff" }}>
              <span style={{ width:18, height:18, borderRadius:5, border:`2px solid ${on?C.navy:"#C7CFDD"}`, background:on?C.navy:"#fff", display:"grid", placeItems:"center", flexShrink:0, color:"#fff", fontSize:11, fontWeight:800 }}>{on?"✓":""}</span>
              <div style={{ flex:1, minWidth:0 }}><div style={{ fontSize:13.5, fontWeight:700, lineHeight:1.3 }}>{i.title}</div><div style={{ fontSize:11.5, color:C.sub, marginTop:2, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>{i.hook}</div></div>

// the Calendar is a READ-ONLY view of pieces that carry a schedule date — all scheduling happens on the Content tab
function Calendar({ rows, allTeam, isAdmin, myName, dailyPosts, brands, brandFilter, setBrandFilter, query, setQuery }) {
  const team = (allTeam||[]).filter((t)=>t!=="Unassigned");
  const [member, setMember] = useState(isAdmin ? "All" : (team.includes(myName) ? myName : "All"));
  const now = new Date();
  const [ym, setYm] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const pad2 = (n)=>String(n).padStart(2,"0");
  const scoped = (r)=> member==="All" || r.owner===member || r.by===member;
  const byDay = {}; rows.filter((r)=>r.target && scoped(r)).forEach((r)=>{ (byDay[r.target]=byDay[r.target]||[]).push(r); });
  const first = new Date(ym.y, ym.m, 1);
  const startPad = (first.getDay()+6)%7;
  const dim = new Date(ym.y, ym.m+1, 0).getDate();
  const cells = []; for (let i=0;i<startPad;i++) cells.push(null);
  for (let d=1; d<=dim; d++){ const iso=`${ym.y}-${pad2(ym.m+1)}-${pad2(d)}`; cells.push({ d, iso, items:(byDay[iso]||[]) }); }
  while (cells.length%7!==0) cells.push(null);
  const monthName = first.toLocaleDateString("en-US",{ month:"long", year:"numeric" });
  const shift = (delta)=>setYm(({y,m})=>{ const dd=new Date(y,m+delta,1); return { y:dd.getFullYear(), m:dd.getMonth() }; });
  const navBtn = { border:`1px solid ${C.line}`, background:"#fff", color:C.navy, borderRadius:9, padding:"7px 12px", fontSize:12.5, fontWeight:700, cursor:"pointer" };
  const [wkStart, wkEnd] = weekBounds();
  const weekDates = [0,1,2,3,4,5,6].map((i)=>addDaysISO(wkStart,i));
  const weekTarget = dailyPosts*7;
  const plannedWk = (t)=>rows.filter((r)=>(r.owner===t||r.by===t) && r.target>=wkStart && r.target<=wkEnd).length;
  const daysMet = (t)=>weekDates.filter((d)=>rows.filter((r)=>(r.owner===t||r.by===t) && r.target===d).length>=dailyPosts).length;
  const daysUnder = (t)=>weekDates.filter((d)=>rows.filter((r)=>(r.owner===t||r.by===t) && r.target===d).length<dailyPosts);
  const cellBg = (n)=> member==="All" ? "#fff" : (n>=dailyPosts ? "#EAF6EF" : n>0 ? "#FFF7E6" : "#fff");
  const kpiBox=(v,l,c)=>(<div style={{ ...card(12), flex:1, minWidth:120 }}><div style={{ fontFamily:"inherit", fontSize:24, fontWeight:700, lineHeight:1, color:c||C.ink }}>{v}</div><div style={{ fontSize:11, color:C.sub, fontWeight:600, marginTop:5 }}>{l}</div></div>);
  return (
    <div>
      <div style={{ display:"flex", gap:9, flexWrap:"wrap", alignItems:"center", marginBottom:14 }}>
        <div style={{ position:"relative", display:"flex", alignItems:"center" }}>
          <Search size={14} color={C.sub} style={{ position:"absolute", left:9 }} />
          <input value={query||""} onChange={(e)=>setQuery && setQuery(e.target.value)} placeholder="Search…" style={{ background:"#fff", border:`1px solid ${C.line}`, color:C.ink, borderRadius:8, padding:"7px 10px 7px 29px", fontSize:12.5, width:180, outline:"none", fontFamily:"inherit" }} />
        </div>
        <HoverSelect value={brandFilter||"All"} options={brands||[]} allLabel="All brands" allValue="All" onChange={(v)=>setBrandFilter && setBrandFilter(v)} style={{ border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 10px", fontSize:12.5, background:"#fff", color:C.ink, minWidth:118 }} />
        <HoverSelect value={member} options={team} allLabel="All members" allValue="All" onChange={setMember} style={{ border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 10px", fontSize:12.5, background:"#fff", color:C.ink, minWidth:118 }} />
        <div style={{ flex:1 }} />
        <span style={{ fontSize:11.5, color:C.sub, fontWeight:600 }}>View only — set schedule dates on the Content tab</span>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14, flexWrap:"wrap" }}>
        <button onClick={()=>shift(-1)} style={navBtn}>←</button>
        <span style={{ fontFamily:"inherit", fontSize:18, fontWeight:700, minWidth:160, textAlign:"center" }}>{monthName}</span>
        <button onClick={()=>shift(1)} style={navBtn}>→</button>
      </div>
      <div style={card(14)}>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:6 }}>
          {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d)=>(<div key={d} style={{ fontSize:11, fontWeight:700, color:C.sub, textAlign:"center", paddingBottom:4 }}>{d}</div>))}
          {cells.map((c,i)=> c ? (
            <div key={i} style={{ minHeight:104, borderRadius:9, border:`1px solid ${c.iso===TODAY?C.navy:C.line}`, background:cellBg(c.items.length), padding:6, overflow:"hidden" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
                <span style={{ fontSize:11.5, fontWeight:700, color:C.sub }}>{c.d}</span>
                {member!=="All" ? <span style={{ fontSize:10, fontWeight:800, color:c.items.length>=dailyPosts?"#15724A":C.red }}>{c.items.length}/{dailyPosts}</span> : (c.items.length>0 && <span style={{ fontSize:10, fontWeight:700, color:C.sub }}>{c.items.length}</span>)}
              </div>
              <div style={{ display:"grid", gap:3 }}>
                {c.items.slice(0,3).map((r)=>{ const posted=r.status===ST.PUBLISHED; return (
                  <div key={r._id} title={`${r.title}\n${[r.brand, r.type, r.owner||r.by, r.status].filter(Boolean).join(" · ")}`} style={{ display:"flex", alignItems:"center", gap:4, background:posted?"#DCF0E4":"#fff", border:`1px solid ${posted?"#8FD3AC":C.line}`, borderRadius:6, padding:"2px 5px", fontSize:10.5 }}>
                    <span style={{ width:7, height:7, borderRadius:2, background:BRAND_DOT[r.brand]||C.sub, flexShrink:0 }} />
                    <span style={{ flex:1, minWidth:0, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", fontWeight:600, color:posted?"#15724A":"inherit", textDecoration:posted?"line-through":"none" }}>{r.title||"(untitled)"}</span>
                    {posted && <span title="Published" style={{ fontWeight:800, color:"#15724A", flexShrink:0, fontSize:11 }}>✓</span>}
                  </div>
                ); })}
                {c.items.length>3 && <div style={{ fontSize:10, color:C.sub, fontWeight:600 }}>+{c.items.length-3} more</div>}
              </div>
            </div>
          ) : <div key={i} />)}
        </div>
      </div>
    </div>
  );
}

function Collabs({ rows, onAdd, onEdit, onDel }) {
  const [sort, setSort] = useState("default");
  const sorted = useMemo(()=>{ const a=[...rows]; const num=(x)=>Number(x)||0;
    if (sort==="feeDesc") a.sort((x,y)=>num(y.fee)-num(x.fee));
    else if (sort==="feeAsc") a.sort((x,y)=>num(x.fee)-num(y.fee));
    else if (sort==="golive") a.sort((x,y)=>(x.goLive||"9999").localeCompare(y.goLive||"9999"));
    else if (sort==="brief") a.sort((x,y)=>(y.briefDate||"").localeCompare(x.briefDate||""));
    else if (sort==="partner") a.sort((x,y)=>(x.partner||"").localeCompare(y.partner||""));
    else if (sort==="status") a.sort((x,y)=>(x.status||"").localeCompare(y.status||""));
    else if (sort==="type") a.sort((x,y)=>(x.ctype||"").localeCompare(y.ctype||""));
    else a.sort((x,y)=>(x.code||"").localeCompare(y.code||""));
    return a; }, [rows, sort]);
  const fees = rows.reduce((s,c)=>s+(Number(c.fee)||0),0);
  const SORTS = [["default","Code (default)"],["type","Collab type"],["feeDesc","Fee (high→low)"],["feeAsc","Fee (low→high)"],["golive","Go-live (soonest)"],["brief","Brief date (newest)"],["partner","Partner (A–Z)"],["status","Status"]];
  return (
    <div>
      <Toolbar title="Collabs & Partners" sub={`${rows.length} deals · RM ${fees.toLocaleString()} logged`} onAdd={onAdd} addLabel="New collab" />
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
        <span style={{ fontSize:12, color:C.sub, fontWeight:600 }}>Sort by</span>
        <select value={sort} onChange={(e)=>setSort(e.target.value)} style={{ border:`1px solid ${C.line}`, borderRadius:9, padding:"7px 10px", fontSize:13, fontFamily:"inherit", background:"#fff", outline:"none", cursor:"pointer" }}>
          {SORTS.map(([v,l])=><option key={v} value={v}>{l}</option>)}

      </div>
      <div style={{ display:"grid", gap:10 }}>
        {sorted.map((r)=>(
          <div key={r._id} style={card(14)}>
            <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}><span style={{ fontSize:14.5, fontWeight:700 }}>{r.partner}</span><TypePill t={r.ctype} /><BrandTag b={r.brand} /><StatusPill s={r.status} /><span style={{ fontFamily:"inherit", fontSize:20, fontWeight:600, marginLeft:"auto" }}>{Number(r.fee)?`RM ${Number(r.fee).toLocaleString()}`:"—"}</span><div style={{ display:"flex" }}><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></div></div>
            <div style={{ fontSize:12.5, color:C.sub, margin:"8px 0" }}>{r.deliverables} · Talent: {r.talent} · PIC: {r.pic}</div>
            <div style={{ display:"flex", gap:18, flexWrap:"wrap", fontSize:11.5, color:C.sub, borderTop:`1px solid ${C.line}`, paddingTop:8 }}><span>Go-live <b style={{ color:C.ink }}>{r.goLive || "—"}</b></span><span>Contract <Pill bg={STATUS_TINT[r.contract]} fg={statusInk(r.contract)}>{r.contract}</Pill></span><span>Invoice <Pill bg={STATUS_TINT[r.invoice]} fg={statusInk(r.invoice)}>{r.invoice}</Pill></span><span style={{ marginLeft:"auto" }}>{r.code}</span></div>
          </div>
        ))}
      </div>
      {rows.length===0 && <Empty>No collabs match your filter.</Empty>}
    </div>
  );
}

    try { const du = await fileToDataURL(f); onSaveDeck(b, { file:du, fileName:f.name }); } catch (e) { alert("Sorry, couldn't read that file."); }

              <BrandTag b={b} />
              <div style={{ marginTop:14 }}>
                {d.file ? (

/* ── incentive (follower-growth rewards + incentive trips) ── */
function Incentive({ data, isAdmin, onSave }) {
  const inc = data || {};
  const maxTier = 100000;
  const fmt = (n)=>Number(n||0).toLocaleString();
  const tierFor = (n)=>{ let t=null; TRIP_TIERS.forEach((x)=>{ if(n>=x.min) t=x; }); return t; };
  const nextTier = (n)=>TRIP_TIERS.find((x)=>n<x.min);
  const numInp = { width:"100%", border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 9px", fontSize:14.5, fontWeight:700, fontFamily:"inherit" };
  // trip is a shared team goal — based on the team's combined current followers
  const teamTotal = INCENTIVE_PEOPLE.reduce((s,p)=>s+(Number((inc[p.name]||{}).current)||0), 0);
  const teamTier = tierFor(teamTotal); const teamNext = nextTier(teamTotal); const teamPct = Math.max(0, Math.min(100, (teamTotal/maxTier)*100));
  return (
    <div>
      <Toolbar title="Incentive" sub="Follower-growth rewards & incentive trips for the content team" />
      <div style={{ ...card(16), marginBottom:16 }}>
        <SectionTitle icon={Trophy}>Incentive trips — unlock by total followers</SectionTitle>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))", gap:10, marginTop:12 }}>
          {TRIP_TIERS.map((t)=>(
            <div key={t.label} style={{ border:`1px solid ${C.line}`, borderRadius:10, padding:"12px 14px", background:"#F8F9FC" }}>
              <div style={{ fontSize:24 }}>{t.emoji}</div>
              <div style={{ fontSize:14.5, fontWeight:700, marginTop:4 }}>{t.label}</div>
              <div style={{ fontSize:12, color:C.sub, marginTop:2 }}>{">"} {fmt(t.min)} followers</div>
            </div>
          ))}
        </div>
        <div style={{ marginTop:14, background:"#F8F9FC", border:`1px solid ${C.line}`, borderRadius:10, padding:"12px 14px" }}>
          <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginBottom:9 }}>
            <span style={{ fontSize:12.5, fontWeight:700 }}>Team total followers</span>
            <span style={{ fontFamily:"inherit", fontSize:20, fontWeight:800, color:C.navy }}>{fmt(teamTotal)}</span>
            {teamTier && <Pill bg="#DCF0E4" fg="#15724A">{teamTier.emoji} {teamTier.label} unlocked</Pill>}
            <span style={{ marginLeft:"auto", fontSize:11.5, color:C.sub, fontWeight:600 }}>{teamNext ? `${fmt(teamNext.min-teamTotal)} to ${teamNext.emoji} ${teamNext.label}` : "🎉 Top tier unlocked"}</span>
          </div>
          <div style={{ height:12, background:"#EEF1F6", borderRadius:6, overflow:"hidden" }}><div style={{ width:`${teamPct}%`, height:"100%", background:teamTier?"#1FA463":C.yellow, borderRadius:6, transition:"width .4s" }} /></div>

function Pulse({ data }) {
  const STAGES = ["Approved","Scripting","Design","Review","Scheduled","Posted"];
  const items = data.pipeline;
  const avgSpan = (from,to) => { const xs=items.map((p)=>dayspan(p.stamps&&p.stamps[from], p.stamps&&p.stamps[to])).filter((v)=>v!=null && v>=0); return xs.length ? xs.reduce((a,b)=>a+b,0)/xs.length : null; };
  const cntSpan = (from,to) => items.filter((p)=>p.stamps&&p.stamps[from]&&p.stamps[to]).length;
  const script2sched = avgSpan("Scripting","Scheduled");
  const appr2posted = avgSpan("Approved","Posted");
  const stageBars = []; for (let i=0;i<STAGES.length-1;i++){ stageBars.push({ label:`${STAGES[i]} → ${STAGES[i+1]}`, v:avgSpan(STAGES[i],STAGES[i+1]) }); }
  const maxBar = Math.max(0.1, ...stageBars.map((s)=>s.v||0));
  const fmt = (v) => v==null ? "—" : (v<1 ? `${Math.round(v*24)}h` : `${v.toFixed(1)}d`);
  const cal = data.calendar.filter((c)=>c.date);
  const due = cal.filter((c)=>c.date<=TODAY);
  const delivered = due.filter((c)=>c.status==="Posted");
  const rate = due.length ? Math.round((delivered.length/due.length)*100) : null;
  const headline = (val, label, sub, color) => (<div style={{ ...card(16), flex:1, minWidth:150 }}><div style={{ fontFamily:"inherit", fontSize:34, fontWeight:600, lineHeight:1, color:color||C.ink }}>{val}</div><div style={{ fontSize:12.5, color:C.sub, fontWeight:600, marginTop:8 }}>{label}</div>{sub && <div style={{ fontSize:11, color:C.sub, marginTop:3 }}>{sub}</div>}</div>);
  return (
    <div style={{ display:"grid", gap:16 }}>
      <Toolbar title="Pulse" sub="Efficiency & delivery across the content engine" />
      <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
        {headline(fmt(script2sched), "Script → Scheduled", `avg turnaround · ${cntSpan("Scripting","Scheduled")} pieces`, C.navy)}
        {headline(fmt(appr2posted), "Approved → Posted", `full cycle · ${cntSpan("Approved","Posted")} pieces`, C.navy)}
        {headline(rate==null?"—":rate+"%", "On-time delivery", `${delivered.length}/${due.length} due posts`, rate==null?C.ink:(rate>=80?"#1FA463":rate>=50?"#C98A00":C.red))}
      </div>
      <div style={card()}>
        <SectionTitle icon={TrendingUp}>Average time in each stage</SectionTitle>
        <div style={{ display:"grid", gap:12, marginTop:16 }}>
          {stageBars.map((s)=>(
            <div key={s.label} style={{ display:"flex", alignItems:"center", gap:12 }}>
              <span style={{ fontSize:12, color:C.sub, fontWeight:600, width:148, textAlign:"right", flexShrink:0 }}>{s.label}</span>
              <div style={{ flex:1, height:18, background:"#EEF1F6", borderRadius:6, overflow:"hidden" }}><div style={{ width:`${s.v?Math.max(6,(s.v/maxBar)*100):0}%`, height:"100%", background:C.navy, borderRadius:6, transition:"width .5s" }} /></div>
              <span style={{ fontSize:12.5, fontWeight:700, width:48, flexShrink:0 }}>{fmt(s.v)}</span>
            </div>
          ))}
        </div>
        <div style={{ fontSize:11, color:C.sub, marginTop:14, borderTop:`1px dashed ${C.line}`, paddingTop:10 }}>Measured from stage timestamps — recorded automatically each time a piece changes status. New pieces accumulate data as they move through the board.</div>
      </div>
    </div>
  );
}

// read any file to a data URL (used for collab deck uploads)
function fileToDataURL(file) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file); });
}
// open a stored data URL in a new tab via a blob (reliable for PDFs)
function openDataUrl(dataUrl) {
  try {
    const parts = String(dataUrl).split(","); const mime = (parts[0].match(/data:([^;]+)/) || [])[1] || "application/octet-stream";
    const bin = atob(parts[1]); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: mime })); window.open(url, "_blank");
  } catch (e) { window.open(dataUrl, "_blank"); }
}
// resize an uploaded image to a small square-ish logo and return a data URL (keeps the shared DB light)
function fileToLogoDataURL(file, max=220) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h = Math.round(h * max / w); w = max; } }
        else { if (h > max) { w = Math.round(w * max / h); h = max; } }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

                      {r.topic && <Pill bg="#E8EEF7" fg={C.navy}>{r.topic}</Pill>}
                    </div>
                    <div style={{ fontSize:11, color:C.sub, marginTop:4 }}>
                      {DONE.map((st)=> (r.stamps&&r.stamps[st]) ? <span key={st} style={{ marginRight:12 }}>✓ {st} <b style={{ color:C.ink }}>{r.stamps[st].slice(5)}</b></span> : null)}
                      {(!r.stamps || !DONE.some((st)=>r.stamps[st])) && <span style={{ fontStyle:"italic" }}>not started</span>}
                      {r.notes && <span style={{ display:"block", marginTop:3 }}>{r.notes}</span>}
                    </div>
                  </div>
                  <select value={r.status||"Idea"} onChange={(e)=>setStatus(r._id, e.target.value)} style={{ border:`1px solid ${C.line}`, borderRadius:8, padding:"5px 8px", fontSize:12, fontFamily:"inherit", background:STATUS_TINT[r.status]||"#fff", fontWeight:700, cursor:"pointer" }}>
                    {STAGES.map((s)=><option key={s} value={s}>{s}</option>)}
                  </select>
                  <div style={{ display:"flex" }}><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></div>
                </div>
              ))}
            </div>
          </div>
        ); })}
      </div>
    </div>
  );
}

/* ── productivity calendar (counts every status update per day, per person) ── */
function Productivity({ rows, team }) {
  const STAGES = ["Scripted","Filmed","Edited","Published"];
  const members = ["All", ...(team||[]).filter((t)=>t!=="Unassigned")];
  const [member, setMember] = useState("All");
  const now = new Date();
  const [ym, setYm] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const counts = {};
  rows.forEach((r)=>{ if (member!=="All" && r.owner!==member) return; const s=r.stamps||{}; STAGES.forEach((st)=>{ if (s[st]) counts[s[st]]=(counts[s[st]]||0)+1; }); });
  const first = new Date(ym.y, ym.m, 1);
  const startPad = (first.getDay()+6)%7;
  const dim = new Date(ym.y, ym.m+1, 0).getDate();
  const pad2 = (n)=>String(n).padStart(2,"0");
  const cells = []; for (let i=0;i<startPad;i++) cells.push(null);
  for (let d=1; d<=dim; d++){ const iso=`${ym.y}-${pad2(ym.m+1)}-${pad2(d)}`; cells.push({ d, iso, n: counts[iso]||0 }); }
  while (cells.length%7!==0) cells.push(null);
  const monthKey = `${ym.y}-${pad2(ym.m+1)}`;
  const monthTotal = Object.keys(counts).filter((k)=>k.startsWith(monthKey)).reduce((a,k)=>a+counts[k],0);
  const maxN = Math.max(1, ...cells.filter(Boolean).map((c)=>c.n));
  const monthName = first.toLocaleDateString("en-US",{ month:"long", year:"numeric" });
  const shift = (delta)=>setYm(({y,m})=>{ const d=new Date(y,m+delta,1); return { y:d.getFullYear(), m:d.getMonth() }; });
  const heat = (n)=>{ if (!n) return "#fff"; const t=n/maxN; if (t>0.66) return "#1FA463"; if (t>0.33) return "#7CC59A"; return "#CFE8D9"; };
  const navBtn = { border:`1px solid ${C.line}`, background:"#fff", color:C.navy, borderRadius:9, padding:"7px 12px", fontSize:12.5, fontWeight:700, cursor:"pointer" };
  const TODAYV = nowISO();
  return (
    <div>
      <Toolbar title="Productivity" sub="Each square counts the content actions completed that day — moving an idea to Scripted, Filmed, Edited or Published." />
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14, flexWrap:"wrap" }}>
        <button onClick={()=>shift(-1)} style={navBtn}>←</button>
        <span style={{ fontFamily:"inherit", fontSize:18, fontWeight:600, minWidth:160, textAlign:"center" }}>{monthName}</span>
        <button onClick={()=>shift(1)} style={navBtn}>→</button>
        <div style={{ flex:1 }} />
        <span style={{ fontSize:12, color:C.sub, fontWeight:600 }}>Member</span>
        <select value={member} onChange={(e)=>setMember(e.target.value)} style={{ border:`1px solid ${C.line}`, borderRadius:9, padding:"7px 10px", fontSize:13, fontFamily:"inherit", background:"#fff", cursor:"pointer" }}>
          {members.map((m)=><option key={m} value={m}>{m}</option>)}
        </select>
        <Pill bg={C.navy} fg="#fff">{monthTotal} actions</Pill>
      </div>
      <div style={card(14)}>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:6 }}>
          {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d)=>(<div key={d} style={{ fontSize:11, fontWeight:700, color:C.sub, textAlign:"center", paddingBottom:4 }}>{d}</div>))}
          {cells.map((c,i)=>(
            <div key={i} style={{ aspectRatio:"1 / 1", borderRadius:9, border:`1px solid ${c&&c.iso===TODAYV?C.navy:C.line}`, background:c?heat(c.n):"transparent", display:"flex", flexDirection:"column", justifyContent:"space-between", padding:6, minHeight:52 }}>
              {c && <span style={{ fontSize:11, fontWeight:600, color:c.n>maxN*0.33?"#fff":C.sub }}>{c.d}</span>}
              {c && c.n>0 && <span style={{ fontFamily:"inherit", fontSize:18, fontWeight:600, color:c.n>maxN*0.33?"#fff":C.ink, textAlign:"right" }}>{c.n}</span>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── admin panel: enrol team members (calls the secure Edge Function) ── */

  const [members,setMembers]=useState(null); const [mErr,setMErr]=useState("");
  const [editId,setEditId]=useState(null); const [eRole,setERole]=useState("user"); const [eTabs,setETabs]=useState([]); const [eBusy,setEBusy]=useState(false);
  const [cRoles,setCRoles]=useState([]); const [emp,setEmp]=useState("Full time");

  const lbl = { fontSize:11.5, fontWeight:700, color:C.sub, display:"block", marginBottom:5 };

  const load = ()=>{ if(!onListUsers) return; setMErr(""); onListUsers().then((r)=>setMembers(r.users||[])).catch((e)=>setMErr(String((e&&e.message)||e))); };
  useEffect(()=>{ load(); }, []);
  const toggleTab=(id)=>setTabs((s)=>s.includes(id)?s.filter((x)=>x!==id):[...s,id]);
  const submit = async (e)=>{ e.preventDefault(); setBusy(true); setMsg(null);
    const res = await onEnrol({ name, email:email.trim(), password:pw, role, tabs: role==="admin"?null:tabs, contentRoles:cRoles, employment:emp });
    setBusy(false);
    if (res.error) setMsg({ ok:false, text:res.error });
    else { setMsg({ ok:true, text:`✓ ${email} enrolled as ${role==="admin"?"Admin":"Member"}.` }); setName(""); setEmail(""); setPw(""); setRole("user"); setTabs(MEMBER_TABS.map((t)=>t[0])); setCRoles([]); setEmp("Full time"); load(); }
  };
  const remove = async (u)=>{ const ok = window.confirm ? window.confirm(`Remove ${u.email}? They will lose access to Content Hub immediately.`) : true; if(!ok) return; try{ await onRemoveUser(u.id); load(); }catch(e){ setMErr(String((e&&e.message)||e)); } };
  const startEdit = (u)=>{ setEditId(u.id); setERole(u.role||"user"); setETabs(Array.isArray(u.tabs)?u.tabs.slice():MEMBER_TABS.map((t)=>t[0])); setERoles(Array.isArray(u.contentRoles)?u.contentRoles.slice():[]); setEEmp(u.employment||"Full time"); };
  const toggleETab = (id)=>{ if(id==="pipeline") return; setETabs((s)=>s.includes(id)?s.filter((x)=>x!==id):[...s,id]); };
  const saveEdit = async (u)=>{ setEBusy(true); setMErr(""); try{ await onUpdateUser({ id:u.id, role:eRole, tabs: eRole==="admin"?null:eTabs, contentRoles:eRoles, employment:eEmp }); setEditId(null); load(); }catch(e){ setMErr(String((e&&e.message)||e)); } setEBusy(false); };
  return (

            <div><label style={lbl}>Email</label><input type="email" value={email} onChange={(e)=>setEmail(e.target.value)} required style={inp()} placeholder="name@company.com" /></div>
            <div><label style={lbl}>Temporary password</label><input value={pw} onChange={(e)=>setPw(e.target.value)} required minLength={6} style={inp()} placeholder="at least 6 characters" /></div>
            <div><label style={lbl}>Role</label><select value={role} onChange={(e)=>setRole(e.target.value)} style={inp()}><option value="user">Member</option><option value="admin">Admin</option></select></div>
            {role==="user" && (

                <label style={lbl}>Tabs this member can access</label>

                  {MEMBER_TABS.map((mt)=>{ const id=mt[0]; const label=mt[1]; const on=tabs.includes(id); const locked=id==="pipeline"; return (
                    <button type="button" key={id} onClick={()=>{ if(!locked) toggleTab(id); }} style={{ border:`1.5px solid ${on?C.navy:C.line}`, background:on?"#F3F6FC":"#fff", color:on?C.navy:C.sub, borderRadius:8, padding:"5px 9px", fontSize:11.5, fontWeight:600, cursor:locked?"default":"pointer", opacity:locked?0.7:1 }}>{on?"✓ ":""}{label}</button>
                  ); })}
                </div>

            <div>

            {msg && <div style={{ background:msg.ok?"#D6EFD6":"#FBE4E6", color:msg.ok?"#15724A":"#A11", fontSize:12, fontWeight:600, padding:"8px 10px", borderRadius:8 }}>{msg.text}</div>}
            <button type="submit" disabled={busy} style={{ border:"none", background:busy?"#9FB0CC":C.navy, color:"#fff", padding:"10px", borderRadius:10, fontWeight:700, fontSize:13.5, cursor:busy?"default":"pointer" }}>{busy?"Enrolling…":"Enrol member"}</button>

                    <div style={{ fontSize:10.5, color:C.sub, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{u.email}{Array.isArray(u.tabs)?` · ${u.tabs.length} tabs`:(u.role==="admin"?"":" · all tabs")}</div>
                    {(u.employment || (Array.isArray(u.contentRoles)&&u.contentRoles.length>0)) && <div style={{ display:"flex", gap:4, flexWrap:"wrap", marginTop:4 }}>{u.employment && <Pill bg={u.employment==="Full time"?"#DCE8FB":"#FCE9D6"} fg={u.employment==="Full time"?"#1E3F86":"#8a5a1a"}>{u.employment}</Pill>}{Array.isArray(u.contentRoles)&&u.contentRoles.map((cr)=><Pill key={cr} bg="#EEF1F6" fg={C.sub}>{cr}</Pill>)}</div>}
                  </div>

                  {u.email!==myEmail ? (<React.Fragment><IconBtn title="Edit access" onClick={()=>editId===u.id?setEditId(null):startEdit(u)}><Pencil size={14} /></IconBtn><IconBtn title="Remove member" danger onClick={()=>remove(u)}><Trash2 size={14} /></IconBtn></React.Fragment>) : <span style={{ fontSize:10, color:C.sub, width:24, textAlign:"center" }}>you</span>}
                </div>
                {editId===u.id && (
                  <div style={{ borderTop:`1px solid ${C.line}`, padding:"10px 12px", background:"#FAFBFD" }}>
                    <label style={lbl}>Role</label>
                    <select value={eRole} onChange={(e)=>setERole(e.target.value)} style={{ ...inp(), marginBottom:10 }}><option value="user">Member</option><option value="admin">Admin</option></select>
                    {eRole==="user" && (

          </div>
          <div style={{ fontSize:11, color:C.sub, marginTop:10, lineHeight:1.5 }}>Removing a member deletes their login immediately. Owner-dropdown names are managed in Lists → Team / Owner.</div>
        </div>
      </div>
    </div>
  );
}

/* ── hiring (job posts everyone can share to friends / family) ── */

  const [copied, setCopied] = useState(null);
  const shareText = (r) => {
    const link = (r.applyLink && r.applyLink.trim()) || siteUrl || "";
    return [
      `📢 We're hiring: ${r.title || "Open role"}`,
      [r.employment, r.brand, r.location].filter(Boolean).join(" · "),
      r.desc || "",
      link ? `Apply / details: ${link}` : "",
      "— BBB Media Group",
    ].filter(Boolean).join("\n\n");

  const share = (r, how) => {
    const text = shareText(r);

              </div>
              <div style={{ display:"flex", gap:7, flexWrap:"wrap", margin:"9px 0", alignItems:"center" }}>

                {r.brand && <BrandTag b={r.brand} />}

              </div>
              {r.desc && <div style={{ fontSize:12.5, color:C.sub, lineHeight:1.5, whiteSpace:"pre-wrap" }}>{r.desc}</div>}
              {r.applyLink && <div style={{ fontSize:12, marginTop:8 }}><a href={r.applyLink} target="_blank" rel="noopener noreferrer" style={{ color:"#2D6CDF", fontWeight:600 }}>Apply link →</a></div>}
              <div style={{ display:"flex", gap:7, flexWrap:"wrap", marginTop:12, paddingTop:12, borderTop:`1px solid ${C.line}`, alignItems:"center" }}>
                <span style={{ fontSize:11, fontWeight:700, color:C.sub, display:"inline-flex", alignItems:"center", gap:4 }}><Share2 size={13} />Share:</span>
                {sBtn("WhatsApp", ()=>share(r,"whatsapp"), "#DCF0E4", "#12643f")}
                {sBtn("Email", ()=>share(r,"email"))}
                {sBtn(copied===r._id?"Copied ✓":"Copy", ()=>share(r,"copy"))}
                {typeof navigator!=="undefined" && navigator.share && sBtn("More…", ()=>share(r,"native"))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── login screen (shown until a team member signs in) ── */
function Login() {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    setErr(""); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) setErr(error.message || "Could not sign in.");
  };
  return (
    <div style={{ minHeight:"100vh", display:"grid", placeItems:"center", background:C.navy, padding:20 }}>
      <form onSubmit={submit} style={{ width:"min(340px,100%)", background:"#fff", borderRadius:16, padding:24, boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:11, marginBottom:18 }}>
          <div style={{ width:38, height:38, borderRadius:10, background:C.yellow, color:C.navy, fontWeight:800, fontSize:14, display:"grid", placeItems:"center" }}>BBB</div>
          <div><div style={{ fontWeight:800, fontSize:16 }}>Content Hub</div><div style={{ fontSize:11.5, color:C.sub }}>Team & admin sign in</div></div>
        </div>
        <label style={{ fontSize:11.5, fontWeight:700, color:C.sub, display:"block", marginBottom:5 }}>Email</label>
        <input type="email" value={email} onChange={(e)=>setEmail(e.target.value)} required autoFocus style={{ ...inp(), marginBottom:12 }} />
        <label style={{ fontSize:11.5, fontWeight:700, color:C.sub, display:"block", marginBottom:5 }}>Password</label>
        <input type="password" value={pw} onChange={(e)=>setPw(e.target.value)} required style={{ ...inp(), marginBottom:16 }} />
        {err && <div style={{ background:"#FBE4E6", color:"#A11", fontSize:12, fontWeight:600, padding:"8px 10px", borderRadius:8, marginBottom:12 }}>{err}</div>}
        <button type="submit" disabled={busy} style={{ width:"100%", border:"none", background:busy?"#9FB0CC":C.navy, color:"#fff", padding:"11px", borderRadius:10, fontWeight:700, fontSize:14, cursor:busy?"default":"pointer" }}>{busy?"Signing in…":"Sign in"}</button>
        <div style={{ fontSize:11, color:C.sub, marginTop:14, textAlign:"center", lineHeight:1.5 }}>Accounts are created by your admin in Supabase. Contact your team lead if you can't sign in.</div>
      </form>
    </div>
  );
}

/* ── shown if the Supabase keys haven't been filled in yet ── */
function ConfigNeeded() {
  return (
    <div style={{ minHeight:"100vh", display:"grid", placeItems:"center", background:C.navy, padding:24 }}>
      <div style={{ width:"min(460px,100%)", background:"#fff", borderRadius:16, padding:26, textAlign:"center" }}>
        <div style={{ fontSize:34, marginBottom:8 }}>🔌</div>
        <div style={{ fontWeight:800, fontSize:17, marginBottom:8 }}>Almost there — add your Supabase keys</div>
        <div style={{ fontSize:13, color:C.sub, lineHeight:1.6 }}>Open <b>index.html</b> and paste your <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> near the top of the script (Supabase → Project Settings → API). Then refresh. Full steps are in the setup guide.</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

        .channel("app_state_live")
        .on("postgres_changes",
          { event: "*", schema: "public", table: "app_state", filter: `id=eq.${ROW_ID}` },
          (payload) => {
            const incoming = payload.new && payload.new.data;
            if (!incoming) return;
            const str = JSON.stringify(incoming);
            if (str === lastPush.current) return; // ignore the echo of our own save
            setData(normalize(incoming));

/* ── CSV parsing + Meta insights import ── */
function parseCSV(text) {
  const rows = []; let cur = [], field = "", q = false;
  const s = String(text||"").replace(/^﻿/, "");
  for (let i=0; i<s.length; i++) {
    const c = s[i];
    if (q) { if (c === '"') { if (s[i+1] === '"') { field += '"'; i++; } else q = false; } else field += c; }
    else if (c === '"') q = true;
    else if (c === ",") { cur.push(field); field = ""; }
    else if (c === "\n") { cur.push(field); rows.push(cur); cur = []; field = ""; }
    else if (c === "\r") { /* skip */ }
    else field += c;
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter((r)=>r.some((x)=>String(x).trim() !== ""));
}
const norm = (s)=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const fmtNum = (v)=>Number(v||0).toLocaleString();
const MONTHS = { jan:"01", feb:"02", mar:"03", apr:"04", may:"05", jun:"06", jul:"07", aug:"08", sep:"09", oct:"10", nov:"11", dec:"12" };
// "Sat 11 Jul 2026, 7:10 PM" -> "2026-07-11"  (also handles 2026-07-11 / 11/07/2026)
const parseMetaDate = (s) => {
  const t = String(s||"").trim(); if (!t) return "";
  let m = /(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})/.exec(t);
  if (m) { const mo = MONTHS[m[2].slice(0,3).toLowerCase()]; if (mo) return `${m[3]}-${mo}-${m[1].padStart(2,"0")}`; }
  m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  return dispToIso(t.split(",")[0]) || "";
};
function ImportModal({ pieces, lists, onApply, onCreate, onClose }) {
  const [result, setResult] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const L = lists || {};
  const num = (v)=>{ const n = Number(String(v==null?"":v).replace(/[^0-9.-]/g,"")); return isNaN(n)?0:n; };
  const readRows = async (file) => {
    const isCsv = /\.csv$/i.test(file.name);
    if (isCsv) return parseCSV(await file.text());
    if (typeof window.XLSX === "undefined") throw new Error("Spreadsheet reader didn't load — check your connection, or save the file as CSV.");
    const wb = window.XLSX.read(new Uint8Array(await file.arrayBuffer()), { type:"array" }); // must be a byte array, not a raw ArrayBuffer
    return window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:false, defval:"" });
  };
  const handle = async (file) => {
    setErr(""); setResult(null); setBusy(true);
    try {
      const rows = await readRows(file);
      if (rows.length < 2) { setErr("That file has no data rows."); setBusy(false); return; }
      let hi = rows.findIndex((r)=>r.some((c)=>/^(title|permalink|post id|description|caption|date published|publish time)$/i.test(String(c).trim())));
      if (hi < 0) hi = 0;
      const head = rows[hi].map((h)=>norm(h));
      const find = (...keys)=>head.findIndex((h)=>keys.some((k)=>h.includes(k)));
      const exact = (...keys)=>head.findIndex((h)=>keys.some((k)=>h===k));
      const col = {
        link: (()=>{ const p=find("permalink","posturl"); return p>=0 ? p : exact("link","url","postlink"); })(), // careful: "Link clicks" is NOT a permalink
        title: (()=>{ const t=exact("title"); return t>=0?t:find("description","caption","posttext","message"); })(),
        date: find("datepublished","publishtime","date"),
        type: exact("type","posttype"),
        account: find("accounts","account","page"),
        views: (()=>{ const v=exact("views"); return v>=0?v:find("videoviews","plays","impressions"); })(),
        reach: exact("reach"),
        likes: find("likesreactions","likes","reactions"),
        comments: find("comments"),
        shares: find("shares"),
        saves: find("saves","saved","bookmarks"),
        follows: find("follows","newfollowers"),
      };
      if (col.views < 0 && col.likes < 0) { setErr("Couldn't find metric columns (Views / Likes) in that file."); setBusy(false); return; }
      const brandFor = (acct)=>{
        const first = String(acct||"").split(",")[0].trim(); if (!first) return "";
        const f = norm(first);
        const b = (L.brands||[]).find((x)=>norm(x)===f) || (L.brands||[]).find((x)=>f.includes(norm(x)) || norm(x).includes(f));
        return b || "";
      };
      const updates = [], creates = [];
      const stamp = nowISO(); // when this data was imported
      rows.slice(hi+1).forEach((r)=>{
        const title = col.title>=0 ? String(r[col.title]||"").trim() : "";
        if (!title || /^total$/i.test(title)) return;               // skip Meta's TOTAL row
        const link = col.link>=0 ? String(r[col.link]||"").trim() : "";
        const metrics = {};
        ["views","reach","likes","comments","shares","saves","follows"].forEach((k)=>{ if (col[k]>=0 && String(r[col[k]]||"").trim()!=="") metrics[k] = num(r[col[k]]); });
        if (!Object.keys(metrics).length) return;
        let p = null;
        if (link) p = pieces.find((x)=>x.contentLink && norm(x.contentLink)===norm(link));
        if (!p) { const d = norm(title); p = pieces.find((x)=>x.title && (norm(x.title)===d || (norm(x.title).length>8 && d.includes(norm(x.title))))); }
        if (p) updates.push({ id:p._id, title:p.title, patch:{ ...metrics, importedAt:stamp } });
        else {
          const ty = col.type>=0 ? String(r[col.type]||"").trim() : "";
          creates.push({
            title, ...metrics, importedAt:stamp, imported:1,
            brand: col.account>=0 ? brandFor(r[col.account]) : "",
            type: (L.types||[]).includes(ty) ? ty : "",
            target: col.date>=0 ? parseMetaDate(r[col.date]) : "",
            dateAdded: col.date>=0 ? parseMetaDate(r[col.date]) : "",
            status: ST.PUBLISHED, kind:"Organic", category:"", platform: (col.account>=0 && /instagram/i.test(String(r[col.account]||""))) ? "Instagram" : "Instagram",
            contentLink: link, scriptLink:"", footageLink:"", notes:"", adminComment:"", crossPost:[], owner:"", by:"", scriptWriter:"", stamps:{},
          });
        }
      });
      setResult({ updates, creates, cols:Object.keys(col).filter((k)=>col[k]>=0) });
    } catch (e) { setErr("Couldn't read that file: " + String((e&&e.message)||e)); }
    setBusy(false);
  };
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:60, padding:16, backdropFilter:"blur(2px)" }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, width:"min(560px,100%)", maxHeight:"84vh", overflow:"auto", boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ background:C.navy, padding:"14px 18px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ color:"#fff", fontWeight:700, fontSize:14.5 }}>Import insights from Meta (CSV)</div>
          <span style={{ cursor:"pointer" }} onClick={onClose}><X size={17} color="#9FB0CC" /></span>
        </div>
        <div style={{ padding:16 }}>
          <div style={{ fontSize:12, color:C.sub, lineHeight:1.55, marginBottom:12 }}>Export from <b>Meta Business Suite → Content</b> (.xlsx or .csv). Posts already in your planner are <b>updated</b> with their numbers; anything new is <b>added as a Published piece</b>, so your whole back catalogue lands here.</div>
          <label style={{ display:"block", border:`2px dashed ${C.line}`, borderRadius:12, padding:"18px", textAlign:"center", cursor:"pointer", background:"#F8F9FC" }}>
            <div style={{ fontSize:13, fontWeight:700, color:C.navy }}>{busy ? "Reading…" : "Choose .xlsx or .csv file"}</div>
            <div style={{ fontSize:11, color:C.sub, marginTop:4 }}>views · reach · likes · comments · shares · saves · follows</div>
            <input type="file" accept=".csv,.xlsx,.xls,text/csv" onChange={(e)=>{ const f=e.target.files&&e.target.files[0]; if(f) handle(f); if(e.target) e.target.value=""; }} style={{ display:"none" }} />
          </label>
          {err && <div style={{ background:"#FBE4E6", color:"#A11", fontSize:12, fontWeight:600, padding:"9px 11px", borderRadius:8, marginTop:12 }}>{err}</div>}
          {result && (
            <div style={{ marginTop:14 }}>
              <div style={{ display:"flex", gap:8, marginBottom:9 }}>
                <span style={{ background:"#DCE8FB", color:"#1E3F86", borderRadius:7, padding:"4px 9px", fontSize:11.5, fontWeight:700 }}>{result.creates.length} new piece{result.creates.length===1?"":"s"}</span>
                <span style={{ background:"#DCF0E4", color:"#15724A", borderRadius:7, padding:"4px 9px", fontSize:11.5, fontWeight:700 }}>{result.updates.length} updated</span>
              </div>
              <div style={{ fontSize:11, color:C.sub, marginBottom:10 }}>Detected: {result.cols.join(", ")}</div>
              <div style={{ maxHeight:200, overflow:"auto", display:"grid", gap:6 }}>
                {result.updates.map((m,i)=>(
                  <div key={"u"+i} style={{ display:"flex", alignItems:"center", gap:8, border:`1px solid ${C.line}`, borderRadius:8, padding:"6px 9px" }}>
                    <span style={{ color:"#1FA463", fontWeight:800, fontSize:12 }}>✓</span>
                    <span style={{ flex:1, fontSize:12, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{m.title}</span>
                    <span style={{ fontSize:11, color:C.sub, whiteSpace:"nowrap" }}>{fmtNum(m.patch.views)} views</span>
                  </div>
                ))}
                {result.creates.map((m,i)=>(
                  <div key={"c"+i} style={{ display:"flex", alignItems:"center", gap:8, border:`1px solid ${C.line}`, borderRadius:8, padding:"6px 9px" }}>
                    <span style={{ color:BLUE.accent, fontWeight:800, fontSize:12 }}>+</span>
                    <span style={{ flex:1, minWidth:0 }}>
                      <span style={{ fontSize:12, fontWeight:600, display:"block", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{m.title}</span>
                      <span style={{ fontSize:10.5, color:C.sub }}>{[m.brand||"no brand", m.type, m.target && isoToDisp(m.target)].filter(Boolean).join(" · ")}</span>
                    </span>
                    <span style={{ fontSize:11, color:C.sub, whiteSpace:"nowrap" }}>{fmtNum(m.views)} views</span>
                  </div>
                ))}
              </div>
              <button disabled={!result.updates.length && !result.creates.length} onClick={()=>{ if(result.updates.length) onApply(result.updates); if(result.creates.length) onCreate(result.creates); onClose(); }} style={{ width:"100%", marginTop:14, border:"none", background:(result.updates.length||result.creates.length)?C.navy:"#E6E9F0", color:(result.updates.length||result.creates.length)?"#fff":"#A9B2C4", borderRadius:9, padding:"10px", fontSize:13, fontWeight:700, cursor:"pointer" }}>Import {result.updates.length+result.creates.length} post{(result.updates.length+result.creates.length)===1?"":"s"}</button>
              <div style={{ fontSize:11, color:C.sub, marginTop:8 }}>New pieces come in as <b>Published</b> with their publish date. Brand is matched from the Account column — set any that show "no brand" on the Content tab.</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );

/* ── insight — performance of published content (numbers typed in per piece) ── */
function Insight({ rows, allRows, lists, onPatch, onCreate, onLink, followers, onSaveFollowers, brandFilter, setBrandFilter, query, setQuery }) {
  const L = lists || {};
  const team = (L.team||[]).filter((t)=>t!=="Unassigned");
  const FOL = followers || {};
  const [groupBy, setGroupBy] = useState("brand");
  const [importing, setImporting] = useState(false);
  const [linkRow, setLinkRow] = useState(null);
  const [sortKey, setSortKey] = useState("follows");
  const [sortDir, setSortDir] = useState(-1);
  const toggleSort = (k)=>{ if (sortKey===k) setSortDir(sortDir*-1); else { setSortKey(k); setSortDir(k==="title"||k==="creator"?1:-1); } };
  const pub = (rows||[]).filter((r)=>r.status===ST.PUBLISHED);
  const n = (v)=>Number(v)||0;
  const creator = (r)=>r.owner || r.by || "";
  const eng = (r)=>n(r.likes)+n(r.comments)+n(r.shares)+n(r.saves);
  const fmt = (v)=>Number(v||0).toLocaleString();
  const totViews = pub.reduce((s,r)=>s+n(r.views),0);
  const totEng = pub.reduce((s,r)=>s+eng(r),0);
  const totFollows = pub.reduce((s,r)=>s+n(r.follows),0);
  const unattributed = pub.filter((r)=>!creator(r));
  const unattrFollows = unattributed.reduce((s,r)=>s+n(r.follows),0);
  // ── primary view: follower growth credited to whoever made the content ──
  const perMember = {};
  pub.forEach((r)=>{ const c = creator(r) || "— unattributed"; perMember[c] = perMember[c] || { t:c, posts:0, views:0, follows:0, eng:0 };
    perMember[c].posts++; perMember[c].views += n(r.views); perMember[c].follows += n(r.follows); perMember[c].eng += eng(r); });
  // rank by followers, but unattributed is not a person — it always sits last
  const isUnattr = (m)=>m.t.indexOf("—")===0;
  const members = Object.values(perMember).sort((a,b)=>(isUnattr(a)?1:0)-(isUnattr(b)?1:0) || b.follows-a.follows);
  const maxF = Math.max(1, ...members.map((m)=>m.follows));
  const keyOf = (r)=> groupBy==="brand" ? (r.brand||"—") : groupBy==="category" ? (r.category||"—") : (r.type||"—");
  const groups = {};
  pub.forEach((r)=>{ const k=keyOf(r); groups[k]=groups[k]||{ k, count:0, views:0, follows:0 }; groups[k].count++; groups[k].views+=n(r.views); groups[k].follows+=n(r.follows); });
  const gList = Object.values(groups).sort((a,b)=>b.follows-a.follows);
  const maxGF = Math.max(1, ...gList.map((g)=>g.follows));
  let list = pub.slice();
  if (sortKey) {
    const val = (r)=>{
      if (sortKey==="creator") return creator(r).toLowerCase();
      if (["views","reach","likes","comments","shares","saves","follows"].includes(sortKey)) return n(r[sortKey]);
      return String(r[sortKey]==null?"":r[sortKey]).toLowerCase();
    };
    list.sort((a,b)=>{ const x=val(a), y=val(b); if(x===y) return 0; if(typeof x==="number") return (x-y)*sortDir; if(x==="") return 1; if(y==="") return -1; return (x<y?-1:1)*sortDir; });
  }
  // ── follower ledger per brand (uses every published row, not just the filtered view) ──
  const allPub = (allRows || rows || []).filter((r)=>r.status===ST.PUBLISHED);
  const gainedBy = {};
  allPub.forEach((r)=>{ const b=r.brand||"—"; gainedBy[b]=(gainedBy[b]||0)+n(r.follows); });
  const shownBrands = (L.brands||[]).filter((b)=>!brandFilter || brandFilter==="All" || b===brandFilter);
  const overDrawn = shownBrands.filter((b)=>{ const t=Number((FOL[b]||{}).total||0); return t>0 && (t-(gainedBy[b]||0))<0; });
  const staleAsOf = shownBrands.filter((b)=>{ const a=(FOL[b]||{}).asOf; if(!a) return false; return (Date.now()-new Date(a).getTime())/86400000 > 30; });
  const kpi = (v,l,c,sub)=>(<div style={{ ...card(14), flex:1, minWidth:150 }}><div style={{ fontFamily:"inherit", fontSize:30, fontWeight:600, lineHeight:1, color:c||C.ink }}>{v}</div><div style={{ fontSize:11.5, color:C.sub, fontWeight:600, marginTop:7 }}>{l}</div>{sub && <div style={{ fontSize:10.5, color:C.sub, marginTop:3 }}>{sub}</div>}</div>);
  const th = { textAlign:"left", fontSize:10.5, fontWeight:700, color:"#fff", padding:"9px 6px", whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:".2px", cursor:"pointer", userSelect:"none" };
  const arrow = (k)=><span style={{ opacity:sortKey===k?1:.35, marginLeft:3 }}>{sortKey===k ? (sortDir===1?"▲":"▼") : "↕"}</span>;
  const metricCols = [["views","Views"],["reach","Reach"],["likes","Likes"],["comments","Comm."],["shares","Shares"],["saves","Saves"],["follows","Follows"]];
  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:9, marginBottom:14, flexWrap:"wrap" }}>
        <button onClick={()=>setImporting(true)} style={{ border:"none", background:C.navy, color:"#fff", padding:"8px 14px", borderRadius:9, fontWeight:700, fontSize:12.5, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>⬆ Import from Meta</button>
        <div style={{ position:"relative", display:"flex", alignItems:"center" }}>
          <Search size={14} color={C.sub} style={{ position:"absolute", left:9 }} />
          <input value={query||""} onChange={(e)=>setQuery && setQuery(e.target.value)} placeholder="Search…" style={{ background:"#fff", border:`1px solid ${C.line}`, color:C.ink, borderRadius:8, padding:"7px 10px 7px 29px", fontSize:12.5, width:180, outline:"none", fontFamily:"inherit" }} />
        </div>
        <HoverSelect value={brandFilter||"All"} options={L.brands||[]} allLabel="All brands" allValue="All" onChange={(v)=>setBrandFilter && setBrandFilter(v)} style={{ border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 10px", fontSize:12.5, background:"#fff", color:C.ink, minWidth:118 }} />
        <div style={{ flex:1 }} />
      </div>
      <div style={{ display:"flex", gap:12, flexWrap:"wrap", marginBottom:14 }}>
        {kpi(fmt(totFollows), "New followers", "#1FA463", "the number that counts")}
        {kpi(fmt(pub.length), "Published pieces", BLUE.accent)}
        {kpi(fmt(totViews), "Total views", C.navy)}
        {kpi(fmt(totEng), "Total engagement", "#7B5BD6")}
      </div>
      {/* account-level follower count: keyed in per brand, split into what content earned vs the organic balance */}
      <div style={{ ...card(16), marginBottom:14 }}>
        <div style={{ display:"flex", alignItems:"baseline", gap:10, flexWrap:"wrap" }}>
          <SectionTitle icon={TrendingUp}>Total followers</SectionTitle>
          <span style={{ fontSize:11, color:C.sub }}>Read the follower count off each account and key it in — the split below is worked out from it.</span>
        </div>
        <table style={{ width:"100%", borderCollapse:"collapse", marginTop:12 }}>
          <thead><tr>
            {["Brand","Total followers","As of","Gained from content","Organic (balance)",""].map((h,i)=>(
              <th key={h+i} style={{ textAlign:i>=1&&i<=4?"right":"left", fontSize:10, fontWeight:700, color:C.sub, textTransform:"uppercase", letterSpacing:".3px", padding:"0 8px 7px", whiteSpace:"nowrap" }}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {shownBrands.map((b)=>{
              const rec = FOL[b] || {};
              const tot = Number(rec.total||0);
              const gain = gainedBy[b] || 0;
              const org = tot - gain;
              const pct = tot ? (gain/tot)*100 : 0;
              return (
                <tr key={b} style={{ borderTop:`1px solid ${C.line}` }}>
                  <td style={{ padding:"9px 8px" }}><BrandTag b={b} /></td>
                  <td style={{ padding:"5px 8px", textAlign:"right" }}>
                    <InlineText type="number" value={rec.total==null?"":rec.total} onCommit={(v)=>onSaveFollowers(b,{ total:Number(v)||0, asOf:(FOL[b]||{}).asOf || nowISO() })} placeholder="—" style={{ textAlign:"right", fontWeight:700, fontSize:13, border:`1px solid ${C.line}`, borderRadius:7, background:"#fff", padding:"5px 7px" }} />
                  </td>
                  <td style={{ padding:"5px 8px", textAlign:"right" }}>
                    <DateCell value={rec.asOf||""} onCommit={(v)=>onSaveFollowers(b,{ asOf:v })} style={{ textAlign:"right", fontSize:12, color:C.sub, border:`1px solid ${C.line}`, borderRadius:7, background:"#fff", padding:"5px 7px" }} />
                  </td>
                  <td style={{ padding:"9px 8px", textAlign:"right", fontSize:13, fontWeight:800, color:"#15724A", whiteSpace:"nowrap" }}>+{fmt(gain)}{tot ? <span style={{ fontSize:10.5, fontWeight:600, color:C.sub, marginLeft:5 }}>{pct.toFixed(1)}%</span> : null}</td>
                  <td style={{ padding:"9px 8px", textAlign:"right", fontSize:13, fontWeight:700, color:org<0?C.red:C.ink, whiteSpace:"nowrap" }}>{tot ? fmt(org) : "—"}</td>
                  <td style={{ padding:"9px 8px", width:150 }}>
                    {tot>0 && <div style={{ display:"flex", height:8, borderRadius:5, overflow:"hidden", background:"#EEF1F6" }}>
                      <div title={`from content ${fmt(gain)}`} style={{ width:`${Math.min(100,Math.max(0,pct))}%`, background:"#1FA463" }} />
                      <div title={`organic ${fmt(org)}`} style={{ flex:1, background:"#C7CFDD" }} />
                    </div>}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {overDrawn.length>0 && <div style={{ fontSize:11.5, color:C.red, fontWeight:600, marginTop:9 }}>⚠ Content has earned more followers than the total keyed in for {overDrawn.join(", ")} — check that total is current.</div>}
        {staleAsOf.length>0 && <div style={{ fontSize:11, color:C.sub, marginTop:9 }}>Not updated in over 30 days: {staleAsOf.join(", ")}.</div>}
      </div>
      {importing && <ImportModal pieces={rows||[]} lists={L} onApply={(l)=>l.forEach((m)=>onPatch(m.id, m.patch))} onCreate={onCreate} onClose={()=>setImporting(false)} />}
      {/* only offer pieces that actually went out (Published), that didn't come from Meta, and that haven't already taken metrics from a link */}
      {linkRow && <LinkModal source={linkRow} candidates={(allRows||rows||[]).filter((r)=>r._id!==linkRow._id && !r.imported && !r.importedAt && r.status===ST.PUBLISHED)} onLink={(tid)=>{ onLink(linkRow._id, tid); setLinkRow(null); }} onClose={()=>setLinkRow(null)} />}
      {pub.length===0 ? <Empty>Nothing published yet. Mark a piece Published on Content, or import your Meta export.</Empty> : (
        <div>
          {unattributed.length>0 && (
            <div style={{ background:"#FFF3CC", border:`1px solid ${C.yellow}`, borderRadius:10, padding:"10px 12px", fontSize:12.5, fontWeight:600, color:"#7a5b00", marginBottom:14 }}>
              ⚠ {unattributed.length} published piece{unattributed.length===1?"":"s"} ({fmt(unattrFollows)} followers) aren't credited to anyone yet — set <b>Creator</b> below, or <b>Link</b> them to the planned idea so they inherit its owner.
            </div>
          )}
          <div style={{ display:"grid", gridTemplateColumns:"1.35fr 1fr", gap:14, marginBottom:14 }}>
            <div style={card(16)}>
              <SectionTitle icon={Trophy}>Follower growth by team member</SectionTitle>
              <div style={{ fontSize:11, color:C.sub, margin:"5px 0 13px" }}>New followers earned by the content each member created.</div>
              <div style={{ display:"grid", gap:10 }}>
                {members.map((m)=>{ const un = m.t.indexOf("—")===0; return (
                  <div key={m.t} style={{ display:"flex", alignItems:"center", gap:10 }}>
                    <span style={{ width:104, fontSize:12, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", color:un?C.sub:C.ink }}>{m.t}</span>
                    <div style={{ flex:1, height:10, background:"#EEF1F6", borderRadius:5, overflow:"hidden" }}><div style={{ width:`${(m.follows/maxF)*100}%`, height:"100%", background:un?"#C7CFDD":"#1FA463", borderRadius:5 }} /></div>
                    <span style={{ fontSize:13, fontWeight:800, width:62, textAlign:"right", color:un?C.sub:"#15724A" }}>+{fmt(m.follows)}</span>
                    <span style={{ fontSize:10.5, color:C.sub, width:112, textAlign:"right" }}>{m.posts} post{m.posts===1?"":"s"} · {fmt(m.views)} views</span>
                  </div>
                ); })}
              </div>
              <div style={{ fontSize:10.5, color:C.sub, marginTop:12, borderTop:`1px dashed ${C.line}`, paddingTop:9 }}>Followers per post: {members.filter((m)=>m.t.indexOf("—")!==0).map((m)=>`${m.t} ${m.posts?Math.round(m.follows/m.posts):0}`).join(" · ")||"—"}</div>
            </div>
            <div style={card(16)}>
              <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                <SectionTitle icon={TrendingUp}>Followers by</SectionTitle>
                <HoverSelect value={groupBy} options={[{v:"brand",l:"Brand"},{v:"category",l:"Topic"},{v:"type",l:"Type"}]} allLabel="Brand" allValue="brand" onChange={setGroupBy} style={{ border:`1px solid ${C.line}`, borderRadius:8, padding:"5px 8px", fontSize:12, background:"#fff", minWidth:92 }} />
              </div>
              <div style={{ display:"grid", gap:9, marginTop:13 }}>
                {gList.map((g)=>(
                  <div key={g.k} style={{ display:"flex", alignItems:"center", gap:9 }}>
                    <span style={{ width:96, fontSize:11.5, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{g.k}</span>
                    <div style={{ flex:1, height:8, background:"#EEF1F6", borderRadius:5, overflow:"hidden" }}><div style={{ width:`${(g.follows/maxGF)*100}%`, height:"100%", background:BLUE.accent, borderRadius:5 }} /></div>
                    <span style={{ fontSize:12, fontWeight:700, width:52, textAlign:"right" }}>+{fmt(g.follows)}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div style={{ ...card(0), overflow:"visible" }}>
            <div style={{ overflow:"visible" }}>
              <table className="xl" style={{ width:"100%" }}>
                <colgroup>
                  <col style={{ width:92 }} /><col style={{ width:104 }} /><col style={{ width:122 }} /><col />
                  {metricCols.map((m)=><col key={m[0]} style={{ width:62 }} />)}
                  <col style={{ width:92 }} /><col style={{ width:40 }} />
                </colgroup>
                <thead><tr style={{ background:BLUE.head }}>
                  <th style={th} onClick={()=>toggleSort("target")}>Published{arrow("target")}</th>
                  <th style={th} onClick={()=>toggleSort("creator")}>Creator{arrow("creator")}</th>
                  <th style={th} onClick={()=>toggleSort("brand")}>Brand{arrow("brand")}</th>
                  <th style={th} onClick={()=>toggleSort("title")}>Idea{arrow("title")}</th>
                  {metricCols.map((m)=><th key={m[0]} style={th} onClick={()=>toggleSort(m[0])}>{m[1]}{arrow(m[0])}</th>)}
                  <th style={th} onClick={()=>toggleSort("importedAt")}>Imported{arrow("importedAt")}</th>
                  <th style={{ ...th, cursor:"default", borderRight:"none" }}></th>
                </tr></thead>
                <tbody>
                  {list.map((r)=>(
                    <tr key={r._id}>
                      <td style={{ fontSize:11.5, color:C.sub, padding:"6px 6px" }}>{r.target?isoToDisp(r.target):"—"}</td>
                      <td><HoverSelect value={creator(r)} options={team} onChange={(v)=>onPatch(r._id,{owner:v})} placeholder="set creator" style={{ fontWeight:creator(r)?700:400, background:creator(r)?"transparent":"#FFF3CC", borderRadius:5 }} /></td>
                      <td style={{ padding:"6px 6px" }}><BrandTag b={r.brand} /></td>
                      <td style={{ fontSize:12, fontWeight:600, padding:"6px 6px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }} title={r.title}>{r.imported ? <span title="Imported from Meta — not yet linked to a planned idea" style={{ color:BLUE.accent, fontWeight:800, marginRight:4 }}>⬆</span> : null}{r.title||"(untitled)"}</td>
                      {metricCols.map((m)=>(
                        <td key={m[0]}><InlineText type="number" value={r[m[0]]==null?"":r[m[0]]} onCommit={(v)=>onPatch(r._id,{[m[0]]:Number(v)||0})} placeholder="0" style={m[0]==="follows"?{ fontWeight:800, color:"#15724A" }:undefined} /></td>
                      ))}
                      <td style={{ fontSize:11, color:C.sub, padding:"6px 6px" }}>{r.importedAt?isoToDisp(r.importedAt):"—"}</td>
                      <td style={{ textAlign:"center", borderRight:"none", padding:0 }}><IconBtn title="Link this to a planned idea on Content" onClick={()=>setLinkRow(r)}><Share2 size={12} /></IconBtn></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <div style={{ fontSize:11, color:C.sub, marginTop:9 }}>Numbers are editable — they save as you go. <b>Creator</b> is who the followers are credited to. <b>⬆</b> marks a post imported from Meta that isn't linked to a planned idea yet; use the link button to merge it into the right one.</div>
        </div>
      )}
    </div>
  );
}

/* ── link an imported post to the planned idea it belongs to (titles rarely match) ── */
function LinkModal({ source, candidates, onLink, onClose }) {
  const [q, setQ] = useState("");
  const nrm = (s)=>String(s||"").toLowerCase();
  const dayGap = (a,b)=>{ if(!a||!b) return 9999; const d=(new Date(a)-new Date(b))/86400000; return Math.abs(d); };
  // rank: same brand first, then closest publish date, then title overlap
  const scored = candidates.map((c)=>{
    let s = 0;
    if (c.brand && source.brand && c.brand===source.brand) s += 50;
    const gap = dayGap(c.target||c.dateAdded, source.target);
    if (gap < 400) s += Math.max(0, 30 - gap);
    const t = nrm(c.title).slice(0,14);
    if (t && nrm(source.title).indexOf(t)>=0) s += 40;
    return { c, s };
  }).sort((a,b)=>b.s-a.s).map((x)=>x.c);
  const shown = q ? scored.filter((c)=>nrm(c.title).indexOf(nrm(q))>=0 || nrm(c.brand).indexOf(nrm(q))>=0) : scored.slice(0,25);
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:60, padding:16, backdropFilter:"blur(2px)" }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, width:"min(600px,100%)", maxHeight:"84vh", display:"flex", flexDirection:"column", boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ background:C.navy, padding:"14px 18px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ color:"#fff", fontWeight:700, fontSize:14.5 }}>Link to a planned idea</div>
          <span style={{ cursor:"pointer" }} onClick={onClose}><X size={17} color="#9FB0CC" /></span>
        </div>
        <div style={{ padding:"14px 18px", borderBottom:`1px solid ${C.line}` }}>
          <div style={{ fontSize:11, color:C.sub, marginBottom:6 }}>Imported post</div>
          <div style={{ fontSize:12.5, fontWeight:700, lineHeight:1.4, maxHeight:52, overflow:"hidden" }}>{source.title}</div>
          <div style={{ fontSize:11, color:C.sub, marginTop:5 }}>{[source.brand, source.target && isoToDisp(source.target), fmtNum(source.follows)+" followers"].filter(Boolean).join(" · ")}</div>
          <div style={{ fontSize:11.5, color:C.sub, marginTop:11 }}>Its numbers move onto the idea you pick (which keeps its creator), and this imported row disappears.</div>
          <div style={{ fontSize:11, color:C.sub, marginTop:9, background:"#F6F7FB", border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 9px" }}>
            <b>{candidates.length}</b> piece{candidates.length===1?"":"s"} can be linked to. Only pieces your team <b>ticked Published</b> on Content count here — rows that arrived from Meta, and ones already linked, are left out.
          </div>
          <input value={q} onChange={(e)=>setQ(e.target.value)} placeholder="Search your ideas…" style={{ ...inp(), marginTop:10 }} />
        </div>
        <div style={{ padding:12, overflowY:"auto", display:"grid", gap:7 }}>
          {shown.length===0 && <Empty>{candidates.length===0 ? "Nothing to link to. Only pieces marked Published on Content are offered here, and ones already linked drop off the list." : "No published pieces match that search."}</Empty>}
          {shown.map((c)=>(
            <button key={c._id} onClick={()=>onLink(c._id)} style={{ display:"flex", alignItems:"center", gap:10, border:`1px solid ${C.line}`, background:"#fff", borderRadius:10, padding:"9px 11px", cursor:"pointer", textAlign:"left" }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:12.5, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.title||"(untitled)"}</div>
                <div style={{ fontSize:10.5, color:C.sub, marginTop:2 }}>{[c.brand, c.status, (c.owner||c.by) && ("by "+(c.owner||c.by)), c.target && isoToDisp(c.target)].filter(Boolean).join(" · ")}</div>
              </div>
              <span style={{ fontSize:11.5, fontWeight:700, color:BLUE.accent, whiteSpace:"nowrap" }}>Link →</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function Dashboard({ data, setTab, myName }) {
  const p = data.pipeline;
  const inProd = p.filter((r)=>[ST.SCRIPTED,ST.FILMED,ST.EDITED].includes(r.status)).length;
  const scheduled = p.filter((r)=>r.status===ST.SCHEDULED).length;
  const posted = p.filter((r)=>r.status===ST.PUBLISHED).length;
  const ideas = p.filter((r)=>r.status===ST.IDEA).length;
  const kpis = [{ n:inProd, l:"In Production", c:C.yellow },{ n:scheduled, l:"Scheduled", c:BLUE.accent },{ n:posted, l:"Published", c:"#1FA463" },{ n:ideas, l:"Ideas", c:C.red }];
  const byBrand = data.lists.brands.map((b)=>({ b, n:p.filter((r)=>r.brand===b).length }));
  const maxB = Math.max(1, ...byBrand.map((x)=>x.n));
  const active = data.collabs.filter((c)=>["Negotiating","Contract Signed","In Production","Delivered"].includes(c.status)).length;
  const awaiting = data.collabs.filter((c)=>c.status==="Invoiced").length;
  const donePaid = data.collabs.filter((c)=>["Paid","Completed"].includes(c.status)).length;
  const fees = data.collabs.reduce((s,c)=>s+(Number(c.fee)||0),0);
  const upcoming = p.filter((c)=>c.target).sort((a,b)=>a.target.localeCompare(b.target)).slice(0,4);
  const wkPlans = (data.weeklyPlans||[]).filter((w)=>w.week===THIS_MON);
  const wkTeam = (data.lists.team||[]).filter((t)=>t!=="Unassigned");
  const ideasTarget = (data.settings && data.settings.ideasTarget) || 20;
  const wkHit = wkTeam.filter((t)=>wkPlans.filter((w)=>w.owner===t).length >= ideasTarget).length;
  const wkUnder = wkTeam.filter((t)=>wkPlans.filter((w)=>w.owner===t).length < ideasTarget);
  const wkPublished = wkPlans.filter((w)=>w.status==="Published").length;
  const mineThisWeek = wkPlans.filter((w)=>w.owner===myName).length;
  return (
    <div style={{ display:"grid", gap:16 }}>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12 }}>
        {kpis.map((k)=>(<div key={k.l} style={card()}><div style={{ fontFamily:"inherit", fontSize:42, fontWeight:600, lineHeight:1 }}>{k.n}</div><div style={{ display:"flex", alignItems:"center", gap:6, marginTop:8 }}><span style={{ width:10, height:10, borderRadius:3, background:k.c }} /><span style={{ fontSize:12.5, color:C.sub, fontWeight:600 }}>{k.l}</span></div></div>))}
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1.3fr 1fr", gap:16 }}>
        <div style={card()}>
          <SectionTitle icon={TrendingUp}>Pipeline by brand</SectionTitle>
          <div style={{ display:"grid", gap:14, marginTop:14 }}>
            {byBrand.map((x)=>(<div key={x.b}><div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:6 }}><BrandTag b={x.b} /><span style={{ fontWeight:700 }}>{x.n}</span></div><div style={{ height:9, background:"#EEF1F6", borderRadius:6, overflow:"hidden" }}><div style={{ width:`${(x.n/maxB)*100}%`, height:"100%", background:BRAND_DOT[x.b], borderRadius:6, transition:"width .5s" }} /></div></div>))}
          </div>
        </div>
        <div style={card()}>
          <SectionTitle icon={Briefcase}>Collabs</SectionTitle>
          <Row k="Active deals" v={active} /><Row k="Awaiting payment" v={awaiting} /><Row k="Completed / Paid" v={donePaid} />
          <div style={{ borderTop:`1px dashed ${C.line}`, margin:"10px 0 4px" }} />
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline" }}><span style={{ fontSize:12.5, color:C.sub, fontWeight:600 }}>Total fees logged</span><span style={{ fontFamily:"inherit", fontSize:24, fontWeight:600 }}>RM {fees.toLocaleString()}</span></div>
        </div>
      </div>
      <div style={card()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}><SectionTitle icon={CalendarDays}>Next up</SectionTitle><button onClick={()=>setTab("calendar")} style={linkBtn()}>Open calendar <ArrowRight size={13} /></button></div>
        <div style={{ display:"grid", gap:8, marginTop:12 }}>
          {upcoming.length===0 && <Empty>Nothing scheduled yet.</Empty>}
          {upcoming.map((c)=>(<div key={c._id} style={{ display:"flex", alignItems:"center", gap:12, padding:"8px 10px", border:`1px solid ${C.line}`, borderRadius:10 }}><div style={{ textAlign:"center", minWidth:46 }}><div style={{ fontSize:11, color:C.sub, fontWeight:700 }}>{dow(c.target)}</div><div style={{ fontFamily:"inherit", fontSize:18, fontWeight:600 }}>{c.target && c.target.slice(8)}</div></div><div style={{ flex:1 }}><div style={{ fontSize:13.5, fontWeight:600 }}>{c.title}</div><div style={{ fontSize:11.5, color:C.sub, marginTop:2 }}>{[c.type, c.category].filter(Boolean).join(" · ")}</div></div><BrandTag b={c.brand} /><StatusPill s={c.status} /></div>))}
        </div>
      </div>
    </div>
  );
}

// idea approval is binary: Backlog = pending, anything else = approved
function ApprovalTag({ r }) { const ok = r.status && r.status !== "Backlog"; return <Pill bg={ok?"#DCF0E4":"#FFF3CC"} fg={ok?"#15724A":"#8a6d1a"}>{ok?"Approved":"Pending approval"}</Pill>; }

/* ── dates are shown/typed as DD/MM/YYYY but stored as ISO ── */
const isoToDisp = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||"")); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso||""); };
const dispToIso = (s) => {
  const t = String(s||"").trim();
  if (!t) return "";
  const m = /^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2}|\d{4})$/.exec(t);
  if (!m) return null;
  const d = m[1].padStart(2,"0"), mo = m[2].padStart(2,"0");
  const y = m[3].length === 2 ? "20"+m[3] : m[3];
  if (+mo < 1 || +mo > 12 || +d < 1 || +d > 31) return null;
  return `${y}-${mo}-${d}`;
};
function DateCell({ value, onCommit, style, ...rest }) {
  const [v, setV] = useState(isoToDisp(value));
  useEffect(()=>{ setV(isoToDisp(value)); }, [value]);
  const commit = ()=>{ const iso = dispToIso(v); if (iso === null) { setV(isoToDisp(value)); return; } if (iso !== (value||"")) onCommit(iso); };
  return <input {...rest} value={v} placeholder="dd/mm/yyyy" onChange={(e)=>setV(e.target.value)} onBlur={commit} onKeyDown={(e)=>{ if(e.key==="Enter") e.target.blur(); }} style={style} />;
}

/* ── dropdown that opens on hover (no click needed), still keyboard-driveable ── */
function HoverSelect({ value, options, onChange, placeholder, allLabel, allValue, style, wrapStyle, ...rest }) {
  const [open, setOpen] = useState(false);
  const opts = (options||[]).map((o)=>(o && typeof o==="object") ? { v:o.v, l:o.l } : { v:o, l:String(o) });
  const clearV = allValue !== undefined ? allValue : "";
  const cur = opts.find((o)=>o.v===value);
  const label = cur ? cur.l : (allLabel || placeholder || "—");
  const vals = opts.map((o)=>o.v);
  const onKey = (e)=>{
    if (e.key==="ArrowDown" || e.key==="ArrowUp") {
      e.preventDefault(); e.stopPropagation(); // change the value, don't jump rows (same as a native select)
      const i = vals.indexOf(value);
      const ni = e.key==="ArrowDown" ? Math.min(vals.length-1, i+1) : Math.max(0, i-1);
      if (vals[ni] !== undefined) onChange(vals[ni]);
    } else if (e.key==="Escape") { setOpen(false); }
    else if (e.key==="Backspace" || e.key==="Delete") { e.preventDefault(); onChange(clearV); }
    else if (e.key.length===1) { const f = opts.find((o)=>o.l.toLowerCase().startsWith(e.key.toLowerCase())); if (f) onChange(f.v); }
  };
  return (
    <div onMouseEnter={()=>setOpen(true)} onMouseLeave={()=>setOpen(false)} style={{ position:"relative", ...wrapStyle }}>
      <div {...rest} data-select="1" tabIndex={0} onFocus={()=>setOpen(true)} onBlur={()=>setOpen(false)} onKeyDown={onKey} style={{ cursor:"pointer", padding:"6px 6px", fontSize:12, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", minHeight:26, display:"flex", alignItems:"center", gap:5, ...style }}>
        <span style={{ flex:1, overflow:"hidden", textOverflow:"ellipsis", color:cur?undefined:"#A9B2C4" }}>{label}</span>
        <span style={{ opacity:.45, fontSize:9 }}>▼</span>
      </div>
      {open && (
        <div style={{ position:"absolute", top:"100%", left:0, minWidth:"100%", background:"#fff", border:`1px solid ${C.line}`, borderRadius:8, boxShadow:"0 10px 26px rgba(20,35,62,.18)", zIndex:40, maxHeight:216, overflowY:"auto", padding:4 }}>
          <div onMouseDown={(e)=>{ e.preventDefault(); onChange(clearV); setOpen(false); }} style={{ padding:"5px 8px", fontSize:11.5, color:C.sub, cursor:"pointer", borderRadius:5, whiteSpace:"nowrap" }}>{allLabel || "—"}</div>
          {opts.map((o)=>(
            <div key={String(o.v)} onMouseDown={(e)=>{ e.preventDefault(); onChange(o.v); setOpen(false); }} style={{ padding:"5px 8px", fontSize:12, cursor:"pointer", borderRadius:5, whiteSpace:"nowrap", background:o.v===value?"#EAF1FD":"transparent", fontWeight:o.v===value?700:400 }}>{o.l}</div>
          ))}
        </div>
      )}
    </div>
  );
}

// commits a text edit on blur / Enter (avoids a DB write per keystroke)
function InlineText({ value, onCommit, style, placeholder, type, ...rest }) {
  const [v,setV] = useState(value==null?"":value);
  useEffect(()=>{ setV(value==null?"":value); }, [value]);
  return <input {...rest} type={type||"text"} value={v} placeholder={placeholder||""} onChange={(e)=>setV(e.target.value)} onBlur={()=>{ if(v!==(value==null?"":value)) onCommit(v); }} onKeyDown={(e)=>{ if(e.key==="Enter") e.target.blur(); }} style={style} />;
}

/* ── unified content board — Idea Bank + Pipeline merged into one board ── */
// share one piece to a teammate on WhatsApp (numbers live in Lists → Team WhatsApp numbers)
function ShareModal({ r, phones, team, onClose }) {
  const [copied, setCopied] = useState(false);
  const msg = [
    `📌 ${r.title || "(untitled)"}`,
    [r.brand, r.type].filter(Boolean).join(" · "),
    r.category ? `Topic: ${r.category}` : "",
    r.status ? `Stage: ${r.status}` : "",
    r.target ? `Schedule: ${r.target}` : "",
    r.scriptLink ? `Script: ${r.scriptLink}` : "",
    r.footageLink ? `Footage: ${r.footageLink}` : "",
    r.contentLink ? `Content: ${r.contentLink}` : "",
  ].filter(Boolean).join("\n");
  const withPhone = (team||[]).filter((t)=>((phones||{})[t]||"").trim());
  const without = (team||[]).filter((t)=>!((phones||{})[t]||"").trim());
  const send = (t)=>{ const digits=String((phones||{})[t]||"").replace(/[^\d]/g,""); window.open(`https://wa.me/${digits}?text=${encodeURIComponent(msg)}`, "_blank"); onClose(); };
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:60, padding:16, backdropFilter:"blur(2px)" }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, width:"min(420px,100%)", maxHeight:"80vh", overflow:"auto", boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ background:C.navy, padding:"14px 18px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ color:"#fff", fontWeight:700, fontSize:14.5, display:"flex", alignItems:"center", gap:8 }}><Share2 size={16} color={C.yellow} />Share via WhatsApp</div>
          <span style={{ cursor:"pointer" }} onClick={onClose}><X size={17} color="#9FB0CC" /></span>
        </div>
        <div style={{ padding:16 }}>
          <div style={{ background:"#F8F9FC", border:`1px solid ${C.line}`, borderRadius:10, padding:"9px 11px", fontSize:11.5, color:C.sub, whiteSpace:"pre-wrap", marginBottom:14, maxHeight:130, overflow:"auto" }}>{msg}</div>
          {withPhone.length===0 && <Empty>No numbers saved yet — add them in Lists → Team WhatsApp numbers.</Empty>}
          <div style={{ display:"grid", gap:7 }}>
            {withPhone.map((t)=>(
              <button key={t} onClick={()=>send(t)} style={{ display:"flex", alignItems:"center", gap:10, border:`1px solid ${C.line}`, background:"#fff", borderRadius:10, padding:"9px 11px", cursor:"pointer", textAlign:"left" }}>
                <span style={{ width:26, height:26, borderRadius:7, background:"#DCF0E4", color:"#12643f", display:"grid", placeItems:"center", fontSize:12, fontWeight:800 }}>{t.slice(0,1).toUpperCase()}</span>
                <span style={{ flex:1 }}><span style={{ fontSize:12.5, fontWeight:700, display:"block" }}>{t}</span><span style={{ fontSize:11, color:C.sub }}>{(phones||{})[t]}</span></span>
                <span style={{ fontSize:11.5, fontWeight:700, color:"#12643f" }}>Send →</span>
              </button>
            ))}
          </div>
          {without.length>0 && <div style={{ fontSize:11, color:C.sub, marginTop:11 }}>No number saved for: {without.join(", ")} — add in Lists.</div>}
          <button onClick={()=>{ if(navigator.clipboard){ navigator.clipboard.writeText(msg).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),1500); }); } }} style={{ width:"100%", marginTop:14, border:`1px solid ${C.line}`, background:"#fff", color:C.navy, borderRadius:9, padding:"9px", fontSize:12.5, fontWeight:700, cursor:"pointer" }}>{copied?"Copied ✓":"Copy text"}</button>
        </div>
      </div>
    </div>
  );
}

function ContentBoard({ rows, allRows, lists, isAdmin, myName, quota, onAdd, onEdit, onDel, onDuplicate, onPatch, onQuickAdd, topicLinks, memberPhones, brandFilter, setBrandFilter, setStatus, onPaste, onUndo, canUndo }) {
  const L = lists || {};
  const team = (L.team||[]).filter((t)=>t!=="Unassigned");
  const stages = (L.pipelineStatus && L.pipelineStatus.length) ? L.pipelineStatus : STAGES;
  const gridRef = useRef(null);
  const [sel, setSel] = useState(null);   // { r1,c1,r2,c2 } anchor -> focus
  const dragRef = useRef(false);
  const [toast, setToast] = useState("");
  const toastTimer = useRef(null);
  // clear the previous timer, otherwise an older toast's timeout wipes a newer message early
  const flash = (m)=>{ setToast(m); if(toastTimer.current) clearTimeout(toastTimer.current); toastTimer.current = setTimeout(()=>setToast(""), 2600); };
  const [sortKey, setSortKey] = useState("");
  const [sortDir, setSortDir] = useState(1);
  const [newTitle, setNewTitle] = useState("");
  const [shareRow, setShareRow] = useState(null);
  const addRef = useRef(null);
  const toggleSort = (k)=>{ if (sortKey===k) setSortDir(sortDir*-1); else { setSortKey(k); setSortDir(1); } };
  const commitNew = ()=>{ const t=(newTitle||"").trim(); if(!t) return; onQuickAdd(t); setNewTitle(""); setTimeout(()=>{ if(addRef.current) addRef.current.focus(); },0); };
  // picking a topic auto-fills its default script link (unless the piece already has its own)
  const setTopic = (r, t)=>{
    const patch = { category:t };
    const tl = topicLinks || {};
    const next = tl[t] || "", prev = tl[r.category] || "", cur = (r.scriptLink||"").trim();
    if (next && (!cur || cur===prev)) patch.scriptLink = next;
    onPatch(r._id, patch);
  };
  // ── excel-style range selection + clipboard ──
  // each grid column, and how to read/write it as plain text
  const GRID_COLS = [
    { field:"dateAdded",    kind:"date", label:"Date added" },
    { field:"brand",        kind:"list", label:"Brand",   opts:()=>L.brands||[] },
    { field:"type",         kind:"list", label:"Type",    opts:()=>L.types||[] },
    { field:"title",        kind:"text", label:"Idea" },
    { field:"category",     kind:"list", label:"Topic",   opts:()=>L.topics||[] },
    { field:"status",       kind:"list", label:"Stage",   opts:()=>stages },
    { field:"scriptWriter", kind:"list", label:"Writer",  opts:()=>team },
    { field:"target",       kind:"date", label:"Schedule" },
    { field:"scriptLink",   kind:"text", label:"Script" },
    { field:"footageLink",  kind:"text", label:"Footage" },
    { field:"contentLink",  kind:"text", label:"Content" },
  ];
  const NCOL = GRID_COLS.length;
  const readCell = (r, ci) => { const c=GRID_COLS[ci]; if(!c||!r) return ""; const v=r[c.field]; return c.kind==="date" ? (v?isoToDisp(v):"") : String(v==null?"":v); };
  // parse a pasted string into a storable value — undefined means "don't trust it, skip this cell"
  const writeCell = (ci, raw) => {
    const c = GRID_COLS[ci]; if (!c) return undefined;
    const s = String(raw==null?"":raw).trim();
    if (c.kind==="date") { if(!s) return ""; const iso=dispToIso(s); if(iso) return iso; if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; return undefined; }
    if (c.kind==="list") { if(!s) return ""; const hit=(c.opts()||[]).find((x)=>String(x).toLowerCase()===s.toLowerCase()); return hit===undefined?undefined:hit; }
    return s;
  };
  const normSel = (s)=> s ? { r1:Math.min(s.r1,s.r2), r2:Math.max(s.r1,s.r2), c1:Math.min(s.c1,s.c2), c2:Math.max(s.c1,s.c2) } : null;
  const selSize = ()=>{ const n=normSel(sel); return n ? (n.r2-n.r1+1)*(n.c2-n.c1+1) : 0; };
  const multiSel = selSize() > 1;
  // only tint when a real range is up, so ordinary single-cell editing looks unchanged
  const cellSelected = (ri,ci)=>{ if(!multiSel) return false; const n=normSel(sel); return ri>=n.r1 && ri<=n.r2 && ci>=n.c1 && ci<=n.c2; };
  const SEL_CELL = { background:"#DBE7FB", boxShadow:"inset 0 0 0 1px #B9D0F5" };
  const cellAt = (e)=>{ const td=e.target && e.target.closest && e.target.closest("td[data-r]"); return td ? { r:Number(td.getAttribute("data-r")), c:Number(td.getAttribute("data-c")) } : null; };
  // functional updater — shift+click must extend from the CURRENT anchor, not a stale closure copy
  const onCellDown = (e)=>{
    const p=cellAt(e); if(!p) return;
    if (e.shiftKey) { e.preventDefault(); setSel((s)=> s ? { ...s, r2:p.r, c2:p.c } : { r1:p.r, c1:p.c, r2:p.r, c2:p.c }); }
    else { setSel({ r1:p.r, c1:p.c, r2:p.r, c2:p.c }); dragRef.current=true; }
  };
  const onCellOver = (e)=>{ if(!dragRef.current) return; const p=cellAt(e); if(!p) return; setSel((s)=> s ? { ...s, r2:p.r, c2:p.c } : s); };
  useEffect(()=>{ const up=()=>{ dragRef.current=false; }; document.addEventListener("mouseup", up); return ()=>document.removeEventListener("mouseup", up); },[]);
  const buildTSV = ()=>{
    const n=normSel(sel); if(!n) return "";
    const out=[];
    for(let ri=n.r1; ri<=Math.min(n.r2, list.length-1); ri++){
      const cells=[];
      for(let ci=n.c1; ci<=n.c2; ci++) cells.push(readCell(list[ri], ci).replace(/\t/g," ").replace(/\r?\n/g," "));
      out.push(cells.join("\t"));
    }
    return out.join("\n");
  };
  // Ctrl+C — hand the range to the clipboard as TSV so it lands in Excel as real columns
  const onGridCopy = (e)=>{
    if (!multiSel) return; // single cell: let the browser copy the text in the field
    e.preventDefault();
    const tsv = buildTSV();
    if (e.clipboardData) e.clipboardData.setData("text/plain", tsv);
    flash(`Copied ${selSize()} cells`);
  };
  const pasteTSV = (text)=>{
    const n = normSel(sel); if(!n) return;
    const lines = String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");
    while (lines.length && lines[lines.length-1]==="") lines.pop();
    if (!lines.length) return;
    const updates=[], creates=[]; let skipped=0;
    lines.forEach((line, i)=>{
      const cells = line.split("\t");
      const patch = {};
      cells.forEach((raw, j)=>{
        const col = n.c1 + j; if (col >= NCOL) return;
        const v = writeCell(col, raw);
        if (v === undefined) { skipped++; return; }
        patch[GRID_COLS[col].field] = v;
      });
      if (!Object.keys(patch).length) return;
      const target = n.r1 + i;
      if (target < list.length) updates.push({ id:list[target]._id, patch });
      else creates.push(patch); // past the last row -> becomes a new piece
    });
    if (!updates.length && !creates.length) { flash("Nothing usable in that paste"); return; }
    onPaste && onPaste({ updates, creates });
    const bits=[];
    if (updates.length) bits.push(updates.length+" row"+(updates.length===1?"":"s")+" updated");
    if (creates.length) bits.push(creates.length+" new piece"+(creates.length===1?"":"s"));
    if (skipped) bits.push(skipped+" cell"+(skipped===1?"":"s")+" skipped");
    flash(bits.join(" · ")+" — Ctrl+Z to undo");
  };
  const onGridPaste = (e)=>{
    const text = e.clipboardData && e.clipboardData.getData("text/plain");
    if (!text) return;
    if (!/[\t\n\r]/.test(text) && !multiSel) return; // plain single value into one field: behave normally
    e.preventDefault();
    pasteTSV(text);
  };
  const clearSel = ()=>{
    const n = normSel(sel); if(!n) return;
    const updates=[];
    for (let ri=n.r1; ri<=Math.min(n.r2, list.length-1); ri++){
      const patch={};
      for (let ci=n.c1; ci<=n.c2; ci++){ const c=GRID_COLS[ci]; if(c.field==="status") continue; patch[c.field]=""; }
      if (Object.keys(patch).length) updates.push({ id:list[ri]._id, patch });
    }
    if (!updates.length) return;
    onPaste && onPaste({ updates, creates:[] });
    flash("Cleared "+updates.length+" row"+(updates.length===1?"":"s")+" — Ctrl+Z to undo");
  };
  // excel-style keyboard nav: Enter/↓ = down, Shift+Enter/↑ = up, Tab = across (native), Esc = exit
  const onGridKey = (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key==="a" || e.key==="A")) { e.preventDefault(); setSel({ r1:0, c1:0, r2:Math.max(0,list.length-1), c2:NCOL-1 }); flash("Selected all "+list.length+" rows"); return; }
    if (mod && (e.key==="z" || e.key==="Z")) { e.preventDefault(); setSel(null); flash(onUndo && onUndo() ? "Undone" : "Nothing left to undo"); return; }
    if ((e.key==="Delete" || e.key==="Backspace") && multiSel) { e.preventDefault(); clearSel(); return; }
    if (e.shiftKey && sel && /^Arrow(Up|Down|Left|Right)$/.test(e.key)) {
      e.preventDefault();
      const d = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] }[e.key];
      setSel((s)=>({ ...s, r2:Math.max(0,Math.min(list.length-1, s.r2+d[0])), c2:Math.max(0,Math.min(NCOL-1, s.c2+d[1])) }));
      return;
    }
    const el = e.target;
    if (!el || !el.getAttribute) return;
    const r = el.getAttribute("data-r"), c = el.getAttribute("data-c");
    if (r === null || c === null) return;
    const isSelect = el.tagName === "SELECT" || el.getAttribute("data-select") === "1";
    let nr = Number(r);
    if (e.key === "Escape") { setSel(null); el.blur(); return; }
    else if (e.key === "Enter") { e.preventDefault(); nr += e.shiftKey ? -1 : 1; }
    else if (e.key === "ArrowDown" && !isSelect) { e.preventDefault(); nr += 1; }
    else if (e.key === "ArrowUp" && !isSelect) { e.preventDefault(); nr -= 1; }
    else return;
    const next = gridRef.current && gridRef.current.querySelector(`[data-r="${nr}"][data-c="${c}"]`);
    if (next) { next.focus(); if (next.select) try { next.select(); } catch (err) {} }
    else el.blur(); // last row — commit instead (this is what makes the quick-add row save)
  };
  const [fType, setFType] = useState("");
  const [fStage, setFStage] = useState("");
  const [fScript, setFScript] = useState("");
  const [fWriter, setFWriter] = useState("");
  const hasScript = (r)=>!!(r.scriptLink && String(r.scriptLink).trim());

  let list = (rows||[]).slice();
  if (fType) list = list.filter((r)=>r.type===fType);
  if (fStage) list = list.filter((r)=>r.status===fStage);
  if (fScript==="needs") list = list.filter((r)=>!hasScript(r));
  else if (fScript==="has") list = list.filter((r)=>hasScript(r));
  if (fWriter) list = list.filter((r)=>r.scriptWriter===fWriter);
  if (sortKey) {
    const val = (r)=> sortKey==="status" ? String(STAGES.indexOf(r.status)).padStart(2,"0") : String(r[sortKey]==null?"":r[sortKey]).toLowerCase();
    list.sort((a,b)=>{ const x=val(a), y=val(b); if(x===y) return 0; if(x==="") return 1; if(y==="") return -1; return (x<y?-1:1)*sortDir; });
  }
  const anyFilter = !!(fType||fStage||fScript||fWriter||(brandFilter&&brandFilter!=="All")||sortKey);
  const clearAll = ()=>{ setFType(""); setFStage(""); setFScript(""); setFWriter(""); setSortKey(""); if(setBrandFilter) setBrandFilter("All"); };

  const selSty = { border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 10px", fontSize:12.5, fontFamily:"inherit", background:"#fff", cursor:"pointer", color:C.ink, minWidth:118 };
  const th = { textAlign:"left", fontSize:11, fontWeight:700, color:"#fff", padding:"11px 12px", whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:".3px" };
  return (
    <div>
      <div style={{ display:"flex", gap:9, flexWrap:"wrap", alignItems:"center", marginBottom:14 }}>
        <HoverSelect value={brandFilter||"All"} options={L.brands||[]} allLabel="All brands" allValue="All" onChange={(v)=>setBrandFilter && setBrandFilter(v)} style={selSty} />
        <HoverSelect value={fType} options={L.types||[]} allLabel="All types" allValue="" onChange={setFType} style={selSty} />
        <HoverSelect value={fStage} options={stages} allLabel="All stages" allValue="" onChange={setFStage} style={selSty} />
        <HoverSelect value={fScript} options={[{v:"needs",l:"Needs script"},{v:"has",l:"Has script"}]} allLabel="Script: all" allValue="" onChange={setFScript} style={selSty} />
        <HoverSelect value={fWriter} options={team} allLabel="All script writers" allValue="" onChange={setFWriter} style={selSty} />
        {anyFilter && <button onClick={clearAll} style={{ border:"none", background:"transparent", color:BLUE.accent, fontSize:12, fontWeight:700, cursor:"pointer", textDecoration:"underline" }}>clear</button>}
        <span style={{ marginLeft:"auto", fontSize:11.5, color:C.sub, fontWeight:600 }}>{list.length} of {(rows||[]).length} pieces</span>
        <button onClick={onAdd} style={{ border:"none", background:C.navy, color:"#fff", padding:"8px 14px", borderRadius:9, fontWeight:700, fontSize:12.5, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}><Plus size={15} />New piece</button>
      </div>
      {(
        <div style={{ ...card(0), overflow:"visible" }}>
          <div style={{ overflow:"visible" }} ref={gridRef} onKeyDown={onGridKey} onCopy={onGridCopy} onPaste={onGridPaste} onMouseDown={onCellDown} onMouseOver={onCellOver}>
            <table className="xl" style={{ width:"100%" }}>
              <colgroup>
                <col style={{ width:170 }} /><col style={{ width:126 }} /><col style={{ width:88 }} /><col />
                <col style={{ width:108 }} /><col style={{ width:104 }} /><col style={{ width:96 }} /><col style={{ width:128 }} />
                <col style={{ width:62 }} /><col style={{ width:62 }} /><col style={{ width:62 }} />
              </colgroup>
              <thead><tr style={{ background:BLUE.head }}>
                {[["dateAdded","Date added"],["brand","Brand"],["type","Type"],["title","Idea"],["category","Topic"],["status","Stage"],["scriptWriter","Writer"],["target","Schedule"],["scriptLink","Script"],["footageLink","Footage"],["contentLink","Content"]].map((col)=>(
                  <th key={col[0]} style={{ ...th, cursor:"pointer", userSelect:"none", padding:"10px 6px" }} onClick={()=>toggleSort(col[0])} title={"Sort by "+col[1]}>
                    {col[1]}<span style={{ opacity:sortKey===col[0]?1:.35, marginLeft:3 }}>{sortKey===col[0] ? (sortDir===1?"▲":"▼") : "↕"}</span>

                    <div style={{ display:"flex", alignItems:"center", gap:1 }}>
                      <DateCell data-r={ri} data-c={0} value={r.dateAdded} onCommit={(v)=>onPatch(r._id,{dateAdded:v})} />
                      <IconBtn title="Share via WhatsApp" onClick={()=>setShareRow(r)}><Share2 size={12} /></IconBtn>
                      <IconBtn title="Duplicate row below" onClick={()=>onDuplicate(r)}><Copy size={12} /></IconBtn>
                      <IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={12} /></IconBtn>
                    </div>,
                    <HoverSelect data-r={ri} data-c={1} value={r.brand||""} options={L.brands||[]} onChange={(v)=>onPatch(r._id,{brand:v})} />,
                    <HoverSelect data-r={ri} data-c={2} value={r.type||""} options={L.types||[]} onChange={(v)=>onPatch(r._id,{type:v})} />,
                    <div style={{ display:"flex", alignItems:"center" }}>{r.imported ? <span title="Imported from Meta — this is a post that already went out, not one of your planned ideas" style={{ flexShrink:0, color:BLUE.accent, fontWeight:900, fontSize:11, paddingLeft:5 }}>⬆</span> : null}<InlineText data-r={ri} data-c={3} value={r.title} onCommit={(v)=>onPatch(r._id,{title:v})} placeholder="Idea…" /></div>,
                    <HoverSelect data-r={ri} data-c={4} value={r.category||""} options={L.topics||[]} onChange={(v)=>setTopic(r, v)} placeholder="topic" />,
                    <HoverSelect data-r={ri} data-c={5} value={r.status||stages[0]} options={stages} onChange={(v)=>setStatus(r._id, v)} style={{ background:STAGE_TINT[r.status]||"transparent", color:STAGE_INK[r.status]||C.ink, fontWeight:700, borderRadius:6, margin:"3px", padding:"4px 6px" }} />,
                    <HoverSelect data-r={ri} data-c={6} value={r.scriptWriter||""} options={team} onChange={(v)=>onPatch(r._id,{scriptWriter:v})} />,
                    <div style={{ display:"flex", alignItems:"center" }}><DateCell data-r={ri} data-c={7} value={r.target} onCommit={(v)=>onPatch(r._id,{target:v})} /><button onClick={()=>setStatus(r._id, r.status===ST.PUBLISHED ? ST.SCHEDULED : ST.PUBLISHED)} tabIndex={-1} title={r.imported ? "Published — came in from the Meta import, not ticked by the team" : (r.status===ST.PUBLISHED ? "Published — click to undo" : "Tick when published as scheduled")} style={{ border:"none", cursor:"pointer", background:r.status===ST.PUBLISHED?"#1FA463":"#E9EDF4", color:r.status===ST.PUBLISHED?"#fff":"#A9B2C4", width:18, height:18, borderRadius:5, fontSize:11, fontWeight:900, lineHeight:1, flexShrink:0, marginRight:4, display:"grid", placeItems:"center" }}>✓</button></div>,
                    ...[["scriptLink",8],["footageLink",9],["contentLink",10]].map((lk)=>(
                      <div style={{ display:"flex", alignItems:"center" }}><InlineText data-r={ri} data-c={lk[1]} value={r[lk[0]]} onCommit={(v)=>onPatch(r._id,{[lk[0]]:v})} placeholder="—" />{r[lk[0]] && String(r[lk[0]]).trim() && <a href={r[lk[0]]} target="_blank" rel="noopener noreferrer" tabIndex={-1} title="Open" style={{ color:BLUE.accent, fontWeight:800, fontSize:12, textDecoration:"none", paddingRight:4 }}>↗</a>}</div>
                    )),
                  ];
                  return (
                    <tr key={r._id}>
                      {cells.map((node,ci)=>(
                        <td key={ci} data-r={ri} data-c={ci} style={{ ...(ci===cells.length-1?{ borderRight:"none" }:null), ...(cellSelected(ri,ci)?SEL_CELL:null) }}>{node}</td>
                      ))}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {list.length===0 && <Empty>No pieces match your filter.</Empty>}
      <div style={{ fontSize:11, color:C.sub, marginTop:9, display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
        <span>Click a cell and drag (or Shift+click) to select a range · <b>Ctrl+A</b> select all · <b>Ctrl+C</b> copy · <b>Ctrl+V</b> paste · <b>Del</b> clear · <b>Ctrl+Z</b> undo</span>
        {multiSel && <span style={{ fontWeight:700, color:BLUE.accent }}>{selSize()} cells selected</span>}
      </div>
      {toast && <div style={{ position:"fixed", right:20, bottom:20, background:C.navy, color:"#fff", padding:"10px 15px", borderRadius:10, fontSize:12.5, fontWeight:600, boxShadow:"0 10px 26px rgba(20,35,62,.28)", zIndex:80 }}>{toast}</div>}
      {shareRow && <ShareModal r={shareRow} phones={memberPhones} team={team} onClose={()=>setShareRow(null)} />}
    </div>
  );
}

/* ── legacy (no longer rendered — kept only so old data shape stays readable) ── */
function Ideas({ rows, allIdeas, allTeam, lists, isAdmin, myName, quota, onAdd, onEdit, onDel, onPromote, onApprove, onDuplicate, onPatch }) {
  const team = (allTeam||[]).filter((t)=>t!=="Unassigned");
  const L = lists || {};
  const [fBy,setFBy]=useState(""); const [fApproval,setFApproval]=useState(""); const [sortBy,setSortBy]=useState("newest"); const [viewMode,setViewMode]=useState("cards");
  const wkIdeas = (allIdeas||[]).filter((i)=>i.dateAdded && mondayOf(i.dateAdded)===THIS_MON);
  const mine = wkIdeas.filter((i)=>i.by===myName).length;
  const countFor = (t)=>wkIdeas.filter((i)=>i.by===t).length;
  const pending = (allIdeas||[]).filter((i)=>i.status==="Backlog").length;
  const hit = team.filter((t)=>countFor(t)>=quota).length;
  const kpiBox=(n,l,c)=>(<div style={{ ...card(12), flex:1, minWidth:120 }}><div style={{ fontFamily:"inherit", fontSize:24, fontWeight:700, lineHeight:1, color:c||C.ink }}>{n}</div><div style={{ fontSize:11, color:C.sub, fontWeight:600, marginTop:5 }}>{l}</div></div>);
  const barRow=(t)=>{ const c=countFor(t); const ok=c>=quota; return (
    <div key={t} style={{ display:"flex", alignItems:"center", gap:10 }}>
      <span style={{ width:90, fontSize:12.5, fontWeight:600 }}>{t}</span>
      <div style={{ flex:1, height:6, background:"#EEF1F6", borderRadius:4, overflow:"hidden" }}><div style={{ width:`${Math.min(100,(c/quota)*100)}%`, height:"100%", background:ok?"#1FA463":C.yellow }} /></div>
      <span style={{ fontSize:12, fontWeight:700, color:ok?"#1FA463":C.red, width:52, textAlign:"right" }}>{c}/{quota}</span>
    </div>
  ); };
  let view = (rows||[]).slice();
  if (fBy) view = view.filter((r)=>r.by===fBy);
  if (fApproval==="approved") view = view.filter((r)=>r.status && r.status!=="Backlog");
  else if (fApproval==="pending") view = view.filter((r)=>r.status==="Backlog");
  if (sortBy==="newest") view.sort((a,b)=>String(b.dateAdded||"").localeCompare(String(a.dateAdded||"")));
  else if (sortBy==="oldest") view.sort((a,b)=>String(a.dateAdded||"").localeCompare(String(b.dateAdded||"")));
  else if (sortBy==="byPerson") view.sort((a,b)=>String(a.by||"").localeCompare(String(b.by||"")));
  const ctrlSel = { ...inp(), width:"auto", minWidth:150, padding:"8px 10px", fontSize:12.5 };
  return (
    <div>
      <Toolbar title="Idea Bank" sub={`Every member submits ≥ ${quota} ideas/week. Admin approves them, then they can be scheduled on the Calendar.`} onAdd={onAdd} addLabel="New idea" />
      {team.includes(myName) && mine<quota && (
        <div style={{ background:"#FFF3CC", border:`1px solid ${C.yellow}`, borderRadius:10, padding:"10px 12px", fontSize:12.5, fontWeight:600, color:"#7a5b00", marginBottom:14 }}>⏰ You've submitted {mine} of {quota} ideas this week — add {quota-mine} more.</div>
      )}
      {isAdmin && (
        <div style={{ ...card(14), marginBottom:16 }}>
          <SectionTitle icon={Shield}>Weekly submissions — {mondayOf(new Date())} → {addDaysISO(mondayOf(new Date()),6)}</SectionTitle>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", margin:"12px 0" }}>
            {kpiBox(`${hit}/${team.length}`, `Hit ${quota}-idea quota`, "#1FA463")}
            {kpiBox(wkIdeas.length, "Ideas this week", C.navy)}
            {kpiBox(pending, "Pending approval", pending?"#C98A00":C.ink)}
          </div>
          <div style={{ display:"grid", gap:8 }}>{team.map((t)=>barRow(t))}</div>
        </div>
      )}
      <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center", marginBottom:14 }}>
        <span style={{ fontSize:11.5, fontWeight:700, color:C.sub }}>Sort & filter:</span>
        <select value={fBy} onChange={(e)=>setFBy(e.target.value)} style={ctrlSel}><option value="">All submitters</option>{team.map((t)=><option key={t} value={t}>{t}</option>)}</select>
        <select value={fApproval} onChange={(e)=>setFApproval(e.target.value)} style={ctrlSel}><option value="">All statuses</option><option value="approved">Approved</option><option value="pending">Pending approval</option></select>
        <select value={sortBy} onChange={(e)=>setSortBy(e.target.value)} style={ctrlSel}><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="byPerson">By submitter (A–Z)</option></select>
        {(fBy||fApproval||sortBy!=="newest") && <button onClick={()=>{ setFBy(""); setFApproval(""); setSortBy("newest"); }} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.sub, borderRadius:8, padding:"7px 11px", fontSize:12, fontWeight:600, cursor:"pointer" }}>Reset</button>}
        <div style={{ marginLeft:"auto", display:"flex", gap:8, alignItems:"center" }}>
          <div style={{ display:"flex", background:"#F1F3F8", borderRadius:8, padding:3 }}>
            {[["cards","Cards"],["list","List"]].map((o)=>(<button key={o[0]} onClick={()=>setViewMode(o[0])} style={{ border:"none", cursor:"pointer", borderRadius:6, padding:"5px 13px", fontSize:12, fontWeight:700, background:viewMode===o[0]?"#fff":"transparent", color:viewMode===o[0]?C.navy:C.sub, boxShadow:viewMode===o[0]?"0 1px 2px rgba(20,35,62,.12)":"none" }}>{o[1]}</button>))}
          </div>
          <span style={{ fontSize:11.5, color:C.sub, fontWeight:600 }}>{view.length} of {(rows||[]).length} shown</span>
        </div>
      </div>
      {viewMode==="cards" && <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:12 }}>
        {view.map((r,i)=>(
          <div key={r._id} style={{ ...card(14), animation:`rise .35s ${i*0.03}s both` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"start", gap:8 }}><BrandTag b={r.brand} /><div style={{ display:"flex", gap:2, alignItems:"center" }}>{isAdmin && r.status==="Backlog" && <button onClick={()=>onApprove(r._id)} style={{ border:"none", background:"#DCF0E4", color:"#15724A", fontWeight:700, fontSize:11, padding:"3px 8px", borderRadius:7, cursor:"pointer" }}>✓ Approve</button>}<IconBtn title="Duplicate & edit" onClick={()=>onDuplicate(r)}><Copy size={14} /></IconBtn><IconBtn title="Promote to pipeline" onClick={()=>onPromote(r)}><ArrowRight size={15} /></IconBtn><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></div></div>
            <div style={{ fontSize:15, fontWeight:700, margin:"8px 0 4px", lineHeight:1.3 }}>{r.title}</div>
            <div style={{ fontSize:12.5, color:C.sub, lineHeight:1.4, minHeight:20 }}>{r.category ? ("🏷 " + r.category) : ""}</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap", margin:"10px 0", alignItems:"center" }}><Pill bg="#EEF1F6" fg={C.sub}>{r.type}</Pill>{r.kind && <Pill bg={r.kind==="Collab"?"#EAE2FB":"#DCF0E4"} fg={r.kind==="Collab"?"#4B2E9E":"#15724A"}>{r.kind}</Pill>}<ApprovalTag r={r} /></div>
            {Array.isArray(r.crossPost) && r.crossPost.length>0 && <div style={{ display:"flex", gap:5, flexWrap:"wrap", alignItems:"center", marginBottom:8 }}><span style={{ fontSize:11, fontWeight:700, color:C.sub }}>↗ Cross-post:</span>{r.crossPost.map((b)=><Pill key={b} bg="#FFF3CC" fg="#7a5b00">{b}</Pill>)}</div>}
            {r.notes && <div style={{ fontSize:12, color:C.sub, lineHeight:1.45, marginBottom:8, background:"#F8F9FC", border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 9px", display:"flex", gap:6 }}><span>📝</span><span style={{ flex:1, whiteSpace:"pre-wrap" }}>{r.notes}</span></div>}
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.sub, borderTop:`1px solid ${C.line}`, paddingTop:8 }}><span>{r.by}</span><span>{r.code} · {r.dateAdded}</span></div>
          </div>
        ))}
      </div>}
      {viewMode==="list" && view.length>0 && (()=>{
        const th = { textAlign:"left", fontSize:11, fontWeight:700, color:C.sub, padding:"9px 10px", borderBottom:`1px solid ${C.line}`, whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:".3px" };
        const td = { padding:"7px 10px", borderBottom:`1px solid ${C.line}`, verticalAlign:"middle", fontSize:12.5 };
        const cellSel = (r,k,opts)=>(<select value={r[k]||""} onChange={(e)=>onPatch(r._id,{[k]:e.target.value})} style={{ border:`1px solid ${C.line}`, borderRadius:7, padding:"5px 7px", fontSize:12, fontFamily:"inherit", background:"#fff", cursor:"pointer", maxWidth:150 }}><option value="">—</option>{(opts||[]).map((o)=><option key={o} value={o}>{o}</option>)}</select>);
        return (
        <div style={{ ...card(0), overflow:"hidden" }}><div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", minWidth:1040 }}>
            <thead><tr><th style={th}>Brand</th><th style={th}>Type</th><th style={th}>Organic/Collab</th><th style={th}>Topic</th><th style={th}>Working Title</th><th style={th}>Cross-post</th><th style={th}>Submitter</th><th style={th}>Status</th><th style={{ ...th, textAlign:"right" }}></th></tr></thead>
            <tbody>
              {view.map((r)=>(
                <tr key={r._id}>
                  <td style={td}>{cellSel(r,"brand",L.brands)}</td>
                  <td style={td}>{cellSel(r,"type",L.types)}</td>
                  <td style={td}>{cellSel(r,"kind",L.ideaKind)}</td>
                  <td style={td}>{cellSel(r,"category",L.topics)}</td>
                  <td style={{ ...td, minWidth:220 }}><InlineText value={r.title} onCommit={(v)=>onPatch(r._id,{title:v})} placeholder="Working title…" style={{ width:"100%", border:`1px solid ${C.line}`, borderRadius:7, padding:"6px 8px", fontSize:12.5, fontFamily:"inherit" }} />{r.notes && <div title={r.notes} style={{ fontSize:11, color:C.sub, marginTop:4, maxWidth:240, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", cursor:"help" }}>📝 {r.notes}</div>}</td>
                  <td style={td}>{Array.isArray(r.crossPost)&&r.crossPost.length>0 ? <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>{r.crossPost.map((b)=><Pill key={b} bg="#FFF3CC" fg="#7a5b00">{b}</Pill>)}</div> : <span style={{ color:C.sub }}>—</span>}</td>
                  <td style={{ ...td, color:C.sub, whiteSpace:"nowrap" }}>{r.by||"—"}</td>
                  <td style={td}>{isAdmin ? (<select value={(r.status&&r.status!=="Backlog")?"Approved":"Pending"} onChange={(e)=>onPatch(r._id,{status:e.target.value==="Approved"?"Approved":"Backlog"})} style={{ border:`1px solid ${C.line}`, borderRadius:7, padding:"5px 7px", fontSize:12, fontFamily:"inherit", background:"#fff", cursor:"pointer" }}><option value="Pending">Pending approval</option><option value="Approved">Approved</option></select>) : <ApprovalTag r={r} />}</td>

                </tr>
              ))}

        </div></div>
        ); })()}
      {view.length===0 && <Empty>No ideas match your filter.</Empty>}

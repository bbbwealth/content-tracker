// the Calendar is a READ-ONLY view of pieces that carry a schedule date — all scheduling happens on the Content tab
// Below the calendar: when each piece reached each stage (from its stamps) and days between stages.
function StageHistory({ rows }) {
  const flow = [ST.IDEA, ST.SCRIPTED, ST.FILMED, ST.EDITED, ST.SCHEDULED, ST.PUBLISHED];
  const items = (rows||[]).filter((r)=> r.stamps && Object.keys(r.stamps).length && !r.imported);
  const dcell = (s)=> s ? isoToDisp(String(s).slice(0,10)) : "";
  const days = (a,b)=>{ if(!a||!b) return null; return Math.max(0, Math.round((new Date(b)-new Date(a))/86400000)); };
  const th = { textAlign:"left", fontSize:10, fontWeight:700, color:"#fff", padding:"9px 8px", whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:".2px" };
  return (
    <div style={{ ...card(0), marginTop:14, overflow:"hidden" }}>
      <div style={{ padding:"13px 16px", borderBottom:`1px solid ${C.line}`, display:"flex", alignItems:"baseline", gap:10, flexWrap:"wrap" }}>
        <SectionTitle icon={CalendarDays}>Stage timeline</SectionTitle>
        <span style={{ fontSize:11, color:C.sub }}>When each piece reached each stage, and the days it took between stages.</span>
      </div>
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%", minWidth:860, borderCollapse:"collapse" }}>
          <thead><tr style={{ background:BLUE.head }}>
            <th style={th}>Content</th>
            <th style={th}>Writer</th>
            <th style={th}>Editor</th>
            {flow.map((s)=><th key={s} style={{ ...th, textAlign:"center" }}>{s}</th>)}
            <th style={{ ...th, textAlign:"center" }}>Total</th>
          </tr></thead>
          <tbody>
            {items.length===0 && <tr><td colSpan={flow.length+4} style={{ padding:0 }}><Empty>No stage history yet. As pieces move through stages on Content, their timeline builds here.</Empty></td></tr>}
            {items.map((r,ri)=>{
              const reached = flow.filter((s)=>r.stamps[s]);
              const total = reached.length>1 ? days(r.stamps[reached[0]], r.stamps[reached[reached.length-1]]) : null;
              let prev = null;
              return (
                <tr key={r._id} style={{ background: ri%2?"#F5F7FB":"#fff" }}>
                  <td style={{ fontSize:12, fontWeight:600, padding:"8px 8px", maxWidth:200, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", borderBottom:`1px solid ${C.line}` }} title={r.title}>{r.title||"(untitled)"}</td>
                  <td style={{ fontSize:11.5, padding:"8px 8px", whiteSpace:"nowrap", borderBottom:`1px solid ${C.line}`, borderLeft:`1px solid ${C.line}`, color:(r.scriptWriter)?C.ink:"#C7CFDD" }}>{r.scriptWriter||"—"}</td>
                  <td style={{ fontSize:11.5, padding:"8px 8px", whiteSpace:"nowrap", borderBottom:`1px solid ${C.line}`, borderLeft:`1px solid ${C.line}`, color:(r.editor)?C.ink:"#C7CFDD" }}>{r.editor||"—"}</td>
                  {flow.map((s)=>{
                    const t = r.stamps[s];
                    const gap = (t && prev) ? days(prev, t) : null;
                    if (t) prev = t;
                    return (
                      <td key={s} style={{ textAlign:"center", padding:"6px 8px", borderBottom:`1px solid ${C.line}`, borderLeft:`1px solid ${C.line}` }}>
                        {t ? (<div>
                          <div style={{ fontSize:11.5, fontWeight:600, color:C.ink }}>{dcell(t)}</div>
                          {gap!=null && <div style={{ fontSize:10, fontWeight:700, color:gap<=2?"#15724A":gap<=5?"#C98A00":C.red, marginTop:1 }}>+{gap}d</div>}
                        </div>) : <span style={{ color:"#C7CFDD" }}>—</span>}
                      </td>
                    );
                  })}
                  <td style={{ textAlign:"center", padding:"6px 8px", borderBottom:`1px solid ${C.line}`, borderLeft:`1px solid ${C.line}`, fontSize:12.5, fontWeight:800, color:BLUE.ink }}>{total!=null?total+"d":"—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {items.length>0 && <div style={{ fontSize:11, color:C.sub, padding:"10px 16px" }}>Each date is when the piece first reached that stage. <b>+Nd</b> is days since the previous stage. <b>Total</b> is idea → latest stage.</div>}
    </div>
  );
}

  const [sortKey, setSortKey] = useState(""); const [sortDir, setSortDir] = useState(1);
  const targetOf = (r)=> r.dealType==="Retainer" ? (Number(r.perMonth)||0)*(Number(r.months)||0) : (Number(r.qty)||0);
  const sortVal = (r,k)=>{ switch(k){ case "partner": return (r.partner||"").toLowerCase(); case "brand": return (r.brand||"").toLowerCase(); case "dealType": return (r.dealType||"").toLowerCase(); case "desc": return (r.desc||"").toLowerCase(); case "scope": return targetOf(r); case "delivered": return Number(r.delivered)||0; case "dcu": return r.dcu?1:0; case "affiliate": return r.affiliate?1:0; case "fee": return Number(r.fee)||0; case "status": return (r.status||"").toLowerCase(); case "payStatus": return (r.payStatus||"").toLowerCase(); case "dateAdded": return r.dateAdded||""; case "start": return r.start||""; case "end": return r.end||""; case "pic": return (r.pic||"").toLowerCase(); default: return ""; } };
  const toggleSort = (k)=>{ if(sortKey===k) setSortDir((d)=>-d); else { setSortKey(k); setSortDir(1); } };
  const sortArrow = (k)=><span style={{ opacity:sortKey===k?1:.35, marginLeft:3 }}>{sortKey===k ? (sortDir===1?"▲":"▼") : "↕"}</span>;
  const anyFilter = !!(fType||fBrand||fContent||fPay||fPic||fDcu||fAffil);
  const clearAll = ()=>{ setFType(""); setFBrand(""); setFContent(""); setFPay(""); setFPic(""); setFDcu(""); setFAffil(""); setSortKey(""); };
  let list = rows.slice();
  if (fType) list = list.filter((r)=>(r.dealType||"One-off")===fType);
  if (fBrand) list = list.filter((r)=>r.brand===fBrand);
  if (fContent) list = list.filter((r)=>r.status===fContent);

  if (sortKey) list.sort((a,b)=>{ const x=sortVal(a,sortKey), y=sortVal(b,sortKey); if(x===y) return 0; if(typeof x==="number") return (x-y)*sortDir; if(x==="") return 1; if(y==="") return -1; return (x<y?-1:1)*sortDir; });

// build a human scope string for a deal (used in share text + invoice line item)
const scopeText = (r)=>{ const dt=r.dealType||"Campaign"; if(dt==="Retainer") return `${Number(r.perMonth)||0} pieces/month × ${Number(r.months)||0} months`; if(dt==="Appearance") return `${Number(r.qty)||0} appearance${(Number(r.qty)||0)===1?"":"s"}`; return `${Number(r.qty)||0} piece${(Number(r.qty)||0)===1?"":"s"}`; };

/* ── send a deal's info to a teammate on WhatsApp (same idea as sharing a content piece) ── */
function CollabShareModal({ deal, phones, team, scopeText, onClose }) {
  const [copied, setCopied] = useState(false);
  const r = deal;
  const money = (v)=> "RM " + (Number(v)||0).toLocaleString();
  const msg = [
    `🤝 ${r.partner || "(unnamed partner)"}`,
    [r.brand, r.dealType].filter(Boolean).join(" · "),
    r.desc ? `Project: ${r.desc}` : "",
    `Scope: ${scopeText(r)}`,
    `Rate: ${money(r.fee)}`,
    r.status ? `Status: ${r.status}` : "",
    r.payStatus ? `Payment: ${r.payStatus}` : "",
    (r.start||r.end) ? `Period: ${r.start||"?"} → ${r.end||"?"}` : "",
    r.pic ? `PIC: ${r.pic}` : "",
  ].filter(Boolean).join("\n");
  const withPhone = (team||[]).filter((t)=>((phones||{})[t]||"").trim());
  const without = (team||[]).filter((t)=>!((phones||{})[t]||"").trim());
  const send = (t)=>{ const digits=String((phones||{})[t]||"").replace(/[^\d]/g,""); window.open(`https://wa.me/${digits}?text=${encodeURIComponent(msg)}`, "_blank"); onClose(); };
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:60, padding:16, backdropFilter:"blur(2px)" }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, width:"min(420px,100%)", maxHeight:"80vh", overflow:"auto", boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ background:C.navy, padding:"14px 18px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ color:"#fff", fontWeight:700, fontSize:14.5, display:"flex", alignItems:"center", gap:8 }}><Share2 size={16} color={C.yellow} />Send deal info</div>
          <span style={{ cursor:"pointer" }} onClick={onClose}><X size={17} color="#9FB0CC" /></span>
        </div>
        <div style={{ padding:16 }}>
          <div style={{ background:"#F8F9FC", border:`1px solid ${C.line}`, borderRadius:10, padding:"9px 11px", fontSize:11.5, color:C.sub, whiteSpace:"pre-wrap", marginBottom:14, maxHeight:150, overflow:"auto" }}>{msg}</div>
          {withPhone.length===0 && <Empty>No numbers saved yet — add them in Lists → Team WhatsApp numbers.</Empty>}
          <div style={{ display:"grid", gap:7 }}>
            {withPhone.map((t)=>(
              <button key={t} onClick={()=>send(t)} style={{ display:"flex", alignItems:"center", gap:10, border:`1px solid ${C.line}`, background:"#fff", borderRadius:10, padding:"9px 11px", cursor:"pointer", textAlign:"left" }}>
                <span style={{ width:26, height:26, borderRadius:7, background:"#DCF0E4", color:"#12643f", display:"grid", placeItems:"center", fontSize:12, fontWeight:800 }}>{t.slice(0,1).toUpperCase()}</span>
                <span style={{ flex:1 }}><span style={{ fontSize:12.5, fontWeight:700, display:"block" }}>{t}</span><span style={{ fontSize:11, color:C.sub }}>{(phones||{})[t]}</span></span>
                <span style={{ fontSize:11.5, fontWeight:700, color:"#12643f" }}>Send →</span>
              </button>
            ))}
          </div>
          {without.length>0 && <div style={{ fontSize:11, color:C.sub, marginTop:11 }}>No number saved for: {without.join(", ")} — add in Lists.</div>}
          <button onClick={()=>{ if(navigator.clipboard){ navigator.clipboard.writeText(msg).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),1500); }); } }} style={{ width:"100%", marginTop:14, border:`1px solid ${C.line}`, background:"#fff", color:C.navy, borderRadius:9, padding:"9px", fontSize:12.5, fontWeight:700, cursor:"pointer" }}>{copied?"Copied ✓":"Copy text"}</button>
        </div>
      </div>
    </div>
  );
}

/* ── issue an invoice for a deal: editable company profile + bill-to + line items, printable / save-as-PDF ── */
function InvoiceModal({ deal, profile, scopeText, onSaveInvoice, onSaveProfile, onClose }) {
  const existing = deal.invoice || {};
  const todayStr = new Date().toISOString().slice(0,10);
  const [comp, setComp] = useState({ company:profile.company||"", regNo:profile.regNo||"", address:profile.address||"", email:profile.email||"", phone:profile.phone||"", bank:profile.bank||"" });
  const [inv, setInv] = useState({
    number: existing.number || ("INV-"+new Date().getFullYear()+"-"+String(Math.floor(Math.random()*9000)+1000)),
    date: existing.date || todayStr,
    due: existing.due || "",
    billTo: existing.billTo || deal.partner || "",
    billAddr: existing.billAddr || "",
    sst: existing.sst!=null ? existing.sst : 0,
    notes: existing.notes || "",
    items: (existing.items && existing.items.length) ? existing.items : [{ desc: deal.desc || `${deal.dealType||"Campaign"} — ${scopeText(deal)}`, qty:1, price:Number(deal.fee)||0 }],
  });
  const money = (v)=> (Number(v)||0).toLocaleString(undefined,{ minimumFractionDigits:2, maximumFractionDigits:2 });
  const subtotal = inv.items.reduce((s,it)=>s+(Number(it.qty)||0)*(Number(it.price)||0),0);
  const tax = subtotal*(Number(inv.sst)||0)/100;
  const total = subtotal+tax;
  const setItem = (i,patch)=> setInv((s)=>({ ...s, items:s.items.map((it,ix)=>ix===i?{ ...it, ...patch }:it) }));
  const addItem = ()=> setInv((s)=>({ ...s, items:[...s.items, { desc:"", qty:1, price:0 }] }));
  const delItem = (i)=> setInv((s)=>({ ...s, items:s.items.filter((_,ix)=>ix!==i) }));
  const saveAll = ()=>{ onSaveProfile(comp); onSaveInvoice({ ...inv }); };
  const esc = (s)=>String(s==null?"":s).replace(/[&<>]/g,(c)=>({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
  const printFallback = ()=>{
    const rowsHtml = inv.items.map((it)=>`<tr><td style="padding:9px 10px;border-bottom:1px solid #E4E8F0">${esc(it.desc)}</td><td style="padding:9px 10px;border-bottom:1px solid #E4E8F0;text-align:right">${Number(it.qty)||0}</td><td style="padding:9px 10px;border-bottom:1px solid #E4E8F0;text-align:right">${money(it.price)}</td><td style="padding:9px 10px;border-bottom:1px solid #E4E8F0;text-align:right">${money((Number(it.qty)||0)*(Number(it.price)||0))}</td></tr>`).join("");
    const html = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(inv.number)}</title><style>body{font-family:-apple-system,Inter,Arial,sans-serif;color:#11192B;margin:0;padding:40px;font-size:13px}h1{font-size:24px;margin:0}table{width:100%;border-collapse:collapse}.muted{color:#5B6680}.r{text-align:right}</style></head><body>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px">
        <div><h1>${esc(comp.company||"Your company")}</h1>${comp.regNo?`<div class="muted">Reg: ${esc(comp.regNo)}</div>`:""}${comp.address?`<div class="muted" style="white-space:pre-line;margin-top:4px">${esc(comp.address)}</div>`:""}${comp.email?`<div class="muted">${esc(comp.email)}</div>`:""}${comp.phone?`<div class="muted">${esc(comp.phone)}</div>`:""}</div>
        <div class="r"><div style="font-size:22px;font-weight:800;letter-spacing:1px">INVOICE</div><div class="muted" style="margin-top:6px">${esc(inv.number)}</div><div class="muted">Date: ${esc(inv.date)}</div>${inv.due?`<div class="muted">Due: ${esc(inv.due)}</div>`:""}</div>
      </div>
      <div style="margin-bottom:18px"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Bill to</div><div style="font-weight:700;margin-top:3px">${esc(inv.billTo)}</div>${inv.billAddr?`<div class="muted" style="white-space:pre-line">${esc(inv.billAddr)}</div>`:""}</div>
      <table><thead><tr style="background:#15233E;color:#fff"><th style="padding:9px 10px;text-align:left">Description</th><th style="padding:9px 10px" class="r">Qty</th><th style="padding:9px 10px" class="r">Unit (RM)</th><th style="padding:9px 10px" class="r">Amount (RM)</th></tr></thead><tbody>${rowsHtml}</tbody></table>
      <div style="display:flex;justify-content:flex-end;margin-top:16px"><table style="width:280px"><tr><td style="padding:5px 10px" class="muted">Subtotal</td><td style="padding:5px 10px" class="r">RM ${money(subtotal)}</td></tr>${Number(inv.sst)?`<tr><td style="padding:5px 10px" class="muted">SST (${Number(inv.sst)}%)</td><td style="padding:5px 10px" class="r">RM ${money(tax)}</td></tr>`:""}<tr><td style="padding:8px 10px;font-weight:800;border-top:2px solid #15233E">Total</td><td style="padding:8px 10px;font-weight:800;border-top:2px solid #15233E" class="r">RM ${money(total)}</td></tr></table></div>
      ${comp.bank?`<div style="margin-top:26px"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Payment details</div><div style="white-space:pre-line;margin-top:3px">${esc(comp.bank)}</div></div>`:""}
      ${inv.notes?`<div style="margin-top:18px" class="muted"><div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Notes</div><div style="white-space:pre-line;margin-top:3px">${esc(inv.notes)}</div></div>`:""}
      <script>window.onload=function(){window.print();}<\/script></body></html>`;
    const w = window.open("", "_blank"); if (!w) { alert("Allow pop-ups to download the invoice."); return; } w.document.write(html); w.document.close();
  };
  const downloadPdf = ()=>{
    saveAll();
    const Ctor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    if (!Ctor) { printFallback(); return; }
    try {
      const doc = new Ctor({ unit:"pt", format:"a4" });
      const W = doc.internal.pageSize.getWidth(); const M = 42; const sub=[91,102,128];
      let y = 56;
      doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(17,25,43);
      doc.text(String(comp.company||"Your company"), M, y);
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(sub[0],sub[1],sub[2]);
      let cy=y+16; [comp.regNo?("Reg: "+comp.regNo):"", ...(comp.address?String(comp.address).split(/\n/):[]), comp.email||"", comp.phone||""].filter(Boolean).forEach((ln)=>{ doc.text(String(ln), M, cy); cy+=12; });
      doc.setFont("helvetica","bold"); doc.setFontSize(16); doc.setTextColor(17,25,43); doc.text("INVOICE", W-M, y, { align:"right" });
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(sub[0],sub[1],sub[2]);
      let ry=y+16; [inv.number, "Date: "+inv.date, inv.due?("Due: "+inv.due):""].filter(Boolean).forEach((ln)=>{ doc.text(String(ln), W-M, ry, { align:"right" }); ry+=12; });
      y = Math.max(cy, ry) + 16;
      doc.setFontSize(8); doc.setTextColor(sub[0],sub[1],sub[2]); doc.text("BILL TO", M, y); y+=13;
      doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(17,25,43); doc.text(String(inv.billTo||""), M, y); y+=13;
      if (inv.billAddr) { doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(sub[0],sub[1],sub[2]); String(inv.billAddr).split(/\n/).forEach((ln)=>{ doc.text(String(ln), M, y); y+=11; }); }
      y += 10;
      const qtyX=W-M-190, unitX=W-M-96, amtX=W-M-4;
      doc.setFillColor(21,35,62); doc.rect(M, y, W-2*M, 20, "F");
      doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(255,255,255);
      doc.text("DESCRIPTION", M+6, y+13); doc.text("QTY", qtyX, y+13, { align:"right" }); doc.text("UNIT (RM)", unitX, y+13, { align:"right" }); doc.text("AMOUNT", amtX, y+13, { align:"right" });
      y+=20;
      doc.setFont("helvetica","normal"); doc.setTextColor(17,25,43); doc.setFontSize(10);
      inv.items.forEach((it)=>{ const amt=(Number(it.qty)||0)*(Number(it.price)||0); const dl=doc.splitTextToSize(String(it.desc||""), qtyX-M-30); const rh=Math.max(20, dl.length*12+8); doc.text(dl, M+6, y+13); doc.text(String(Number(it.qty)||0), qtyX, y+13, { align:"right" }); doc.text(money(it.price), unitX, y+13, { align:"right" }); doc.text(money(amt), amtX, y+13, { align:"right" }); doc.setDrawColor(228,232,240); doc.line(M, y+rh, W-M, y+rh); y+=rh; });
      y+=14; const lx=W-M-160, vx=W-M-4;
      doc.setFontSize(10); doc.setTextColor(sub[0],sub[1],sub[2]); doc.text("Subtotal", lx, y); doc.setTextColor(17,25,43); doc.text("RM "+money(subtotal), vx, y, { align:"right" }); y+=15;
      if (Number(inv.sst)) { doc.setTextColor(sub[0],sub[1],sub[2]); doc.text("SST ("+Number(inv.sst)+"%)", lx, y); doc.setTextColor(17,25,43); doc.text("RM "+money(tax), vx, y, { align:"right" }); y+=15; }
      doc.setDrawColor(21,35,62); doc.setLineWidth(1.4); doc.line(lx, y-1, vx, y-1); doc.setLineWidth(1);
      doc.setFont("helvetica","bold"); doc.setFontSize(12); doc.text("Total", lx, y+14); doc.text("RM "+money(total), vx, y+14, { align:"right" }); y+=30;
      doc.setFont("helvetica","normal");
      if (comp.bank) { doc.setFontSize(8); doc.setTextColor(sub[0],sub[1],sub[2]); doc.text("PAYMENT DETAILS", M, y); y+=15; doc.setFontSize(9.5); doc.setTextColor(17,25,43); String(comp.bank).split(/\n/).forEach((ln)=>{ doc.text(String(ln), M, y); y+=12; }); y+=6; }
      if (inv.notes) { doc.setFontSize(8); doc.setTextColor(sub[0],sub[1],sub[2]); doc.text("NOTES", M, y); y+=13; doc.setFontSize(9.5); doc.setTextColor(17,25,43); String(inv.notes).split(/\n/).forEach((ln)=>{ doc.text(String(ln), M, y); y+=12; }); }
      doc.save((String(inv.number||"invoice").replace(/[^\w-]/g,"_"))+".pdf");
    } catch (e) { printFallback(); }
  };
  const lbl = { fontSize:11, fontWeight:700, color:C.sub, display:"block", marginBottom:4 };
  const fld = { border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 9px", fontSize:12.5, fontFamily:"inherit", width:"100%", boxSizing:"border-box" };
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:60, padding:16, backdropFilter:"blur(2px)" }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, width:"min(680px,100%)", maxHeight:"88vh", display:"flex", flexDirection:"column", boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ background:C.navy, padding:"14px 18px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ color:"#fff", fontWeight:700, fontSize:14.5, display:"flex", alignItems:"center", gap:8 }}><FileText size={16} color={C.yellow} />Issue invoice — {deal.partner}</div>
          <span style={{ cursor:"pointer" }} onClick={onClose}><X size={17} color="#9FB0CC" /></span>
        </div>
        <div style={{ padding:16, overflowY:"auto" }}>
          <div style={{ fontSize:11.5, fontWeight:700, color:C.navy, marginBottom:8 }}>Your company (saved &amp; reused)</div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:16 }}>
            <div><label style={lbl}>Company name</label><input value={comp.company} onChange={(e)=>setComp({ ...comp, company:e.target.value })} style={fld} /></div>
            <div><label style={lbl}>Reg. no</label><input value={comp.regNo} onChange={(e)=>setComp({ ...comp, regNo:e.target.value })} style={fld} /></div>
            <div><label style={lbl}>Email</label><input value={comp.email} onChange={(e)=>setComp({ ...comp, email:e.target.value })} style={fld} /></div>
            <div><label style={lbl}>Phone</label><input value={comp.phone} onChange={(e)=>setComp({ ...comp, phone:e.target.value })} style={fld} /></div>
            <div style={{ gridColumn:"1 / -1" }}><label style={lbl}>Address</label><textarea value={comp.address} onChange={(e)=>setComp({ ...comp, address:e.target.value })} rows={2} style={{ ...fld, resize:"vertical" }} /></div>
            <div style={{ gridColumn:"1 / -1" }}><label style={lbl}>Bank / payment details</label><textarea value={comp.bank} onChange={(e)=>setComp({ ...comp, bank:e.target.value })} rows={2} placeholder="Bank · Account name · Account number" style={{ ...fld, resize:"vertical" }} /></div>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:14 }}>
            <div><label style={lbl}>Invoice no</label><input value={inv.number} onChange={(e)=>setInv({ ...inv, number:e.target.value })} style={fld} /></div>
            <div><label style={lbl}>Date</label><input type="date" value={inv.date} onChange={(e)=>setInv({ ...inv, date:e.target.value })} style={fld} /></div>
            <div><label style={lbl}>Due date</label><input type="date" value={inv.due} onChange={(e)=>setInv({ ...inv, due:e.target.value })} style={fld} /></div>
            <div style={{ gridColumn:"1 / -1" }}><label style={lbl}>Bill to</label><input value={inv.billTo} onChange={(e)=>setInv({ ...inv, billTo:e.target.value })} style={fld} /></div>
            <div style={{ gridColumn:"1 / -1" }}><label style={lbl}>Bill-to address (optional)</label><textarea value={inv.billAddr} onChange={(e)=>setInv({ ...inv, billAddr:e.target.value })} rows={2} style={{ ...fld, resize:"vertical" }} /></div>
          </div>
          <div style={{ fontSize:11.5, fontWeight:700, color:C.navy, marginBottom:6 }}>Line items</div>
          <div style={{ border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden", marginBottom:10 }}>
            <table style={{ width:"100%", borderCollapse:"collapse" }}>
              <thead><tr style={{ background:"#F1F3F8" }}>
                <th style={{ textAlign:"left", fontSize:10, fontWeight:700, color:C.sub, padding:"7px 8px" }}>DESCRIPTION</th>
                <th style={{ textAlign:"right", fontSize:10, fontWeight:700, color:C.sub, padding:"7px 8px", width:56 }}>QTY</th>
                <th style={{ textAlign:"right", fontSize:10, fontWeight:700, color:C.sub, padding:"7px 8px", width:110 }}>UNIT (RM)</th>
                <th style={{ textAlign:"right", fontSize:10, fontWeight:700, color:C.sub, padding:"7px 8px", width:110 }}>AMOUNT</th>
                <th style={{ width:30 }} />
              </tr></thead>
              <tbody>
                {inv.items.map((it,i)=>(
                  <tr key={i} style={{ borderTop:`1px solid ${C.line}` }}>
                    <td style={{ padding:"4px 6px" }}><input value={it.desc} onChange={(e)=>setItem(i,{ desc:e.target.value })} style={{ ...fld, border:"none" }} /></td>
                    <td style={{ padding:"4px 6px" }}><input type="number" value={it.qty} onChange={(e)=>setItem(i,{ qty:Number(e.target.value)||0 })} style={{ ...fld, border:"none", textAlign:"right" }} /></td>
                    <td style={{ padding:"4px 6px" }}><NumCell value={it.price} onCommit={(v)=>setItem(i,{ price:v })} style={{ ...fld, border:"none", textAlign:"right" }} /></td>
                    <td style={{ padding:"4px 6px", textAlign:"right", fontSize:12.5, fontWeight:600, whiteSpace:"nowrap" }}>{money((Number(it.qty)||0)*(Number(it.price)||0))}</td>
                    <td style={{ textAlign:"center" }}>{inv.items.length>1 && <IconBtn title="Remove" danger onClick={()=>delItem(i)}><Trash2 size={12} /></IconBtn>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <button onClick={addItem} style={{ border:`1px dashed ${C.line}`, background:"#fff", color:C.navy, borderRadius:8, padding:"6px 11px", fontSize:12, fontWeight:700, cursor:"pointer" }}>+ Add line</button>
          <div style={{ display:"flex", justifyContent:"flex-end", marginTop:12 }}>
            <div style={{ width:280 }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:12.5, padding:"3px 0", color:C.sub }}><span>Subtotal</span><span>RM {money(subtotal)}</span></div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:12.5, padding:"3px 0", color:C.sub }}><span>SST %</span><input type="number" value={inv.sst} onChange={(e)=>setInv({ ...inv, sst:Number(e.target.value)||0 })} style={{ width:64, border:`1px solid ${C.line}`, borderRadius:6, padding:"4px 6px", fontSize:12, textAlign:"right", fontFamily:"inherit" }} /></div>
              <div style={{ display:"flex", justifyContent:"space-between", fontSize:15, fontWeight:800, padding:"7px 0", borderTop:`2px solid ${C.navy}`, marginTop:4 }}><span>Total</span><span>RM {money(total)}</span></div>
            </div>
          </div>
          <div style={{ marginTop:10 }}><label style={lbl}>Notes (optional)</label><textarea value={inv.notes} onChange={(e)=>setInv({ ...inv, notes:e.target.value })} rows={2} style={{ ...fld, resize:"vertical" }} /></div>
        </div>
        <div style={{ padding:"12px 16px", borderTop:`1px solid ${C.line}`, display:"flex", gap:9, justifyContent:"flex-end" }}>
          <button onClick={()=>{ saveAll(); onClose(); }} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.navy, borderRadius:9, padding:"9px 16px", fontWeight:700, fontSize:13, cursor:"pointer" }}>Save</button>
          <button onClick={downloadPdf} style={{ border:"none", background:C.navy, color:"#fff", borderRadius:9, padding:"9px 18px", fontWeight:700, fontSize:13, cursor:"pointer" }}>Download PDF</button>
        </div>
      </div>
    </div>
  );
}

/* ── affiliate / performance-based deals: fee per account, tier / bonus, accounts delivered ── */
function AffiliateSection({ rows, onPatch }) {
  const th = { textAlign:"left", fontSize:10.5, fontWeight:700, color:"#fff", padding:"10px 8px", whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:".2px" };
  const miniInp = { width:"100%", border:`1px solid ${C.line}`, borderRadius:6, padding:"5px 7px", fontSize:12, fontFamily:"inherit", textAlign:"right", boxSizing:"border-box" };
  const totalOf = (r)=> (Number(r.feePerAccount)||0) * (Number(r.accountsDelivered)||0);
  const totalPaid = rows.reduce((s,r)=>s+totalOf(r),0);
  const totalAccts = rows.reduce((s,r)=>s+(Number(r.accountsDelivered)||0),0);
  const kpi = (v,l)=>(<div style={{ ...card(12), flex:1, minWidth:120 }}><div style={{ fontSize:22, fontWeight:600, lineHeight:1, color:C.ink }}>{v}</div><div style={{ fontSize:11, color:C.sub, fontWeight:600, marginTop:6 }}>{l}</div></div>);
  return (
    <div style={{ marginTop:22 }}>
      <div style={{ fontSize:12.5, fontWeight:700, color:C.navy, margin:"4px 2px 4px", display:"flex", alignItems:"center", gap:7 }}><TrendingUp size={15} /> Affiliate / performance deals</div>
      <div style={{ fontSize:11, color:C.sub, margin:"0 2px 10px" }}>Deals you flagged <b>Affiliate</b> above show here. Track the fee paid per account, whether there's a tier / performance bonus, and how many accounts you've delivered.</div>
      {rows.length===0 ? <Empty>No affiliate deals yet — set <b>Affiliate = Yes</b> on a deal above and it will appear here.</Empty> : (
        <div>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:12 }}>
            {kpi(rows.length, "Affiliate deals")}
            {kpi(totalAccts.toLocaleString(), "Accounts delivered")}
            {kpi("RM "+totalPaid.toLocaleString(), "Total affiliate paid")}
          </div>
          <div style={{ ...card(0), overflow:"visible" }}>
            <div style={{ overflowX:"auto" }}>
              <table className="xl" style={{ width:"100%", minWidth:820 }}>
                <colgroup>
                  <col /><col style={{ width:120 }} /><col style={{ width:118 }} /><col style={{ width:118 }} /><col style={{ width:118 }} /><col style={{ width:220 }} />
                </colgroup>
                <thead><tr style={{ background:BLUE.head }}>
                  {["Partner / Client","Brand","Fee / account (RM)","Accounts delivered","Total paid (RM)","Tier / performance bonus"].map((h)=><th key={h} style={th}>{h}</th>)}
                </tr></thead>
                <tbody>
                  {rows.map((r)=>(
                    <tr key={r._id} style={{ background:"#fff" }}>
                      <td style={{ fontSize:12, fontWeight:600, padding:"8px 8px", borderBottom:`1px solid ${C.line}`, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:0 }} title={r.partner}>{r.partner||"(unnamed)"}</td>
                      <td style={{ padding:"8px 8px", borderBottom:`1px solid ${C.line}` }}><BrandTag b={r.brand} /></td>
                      <td style={{ padding:"5px 8px", borderBottom:`1px solid ${C.line}` }}><NumCell value={r.feePerAccount} onCommit={(v)=>onPatch(r._id,{feePerAccount:v})} placeholder="0" style={miniInp} /></td>
                      <td style={{ padding:"5px 8px", borderBottom:`1px solid ${C.line}` }}><NumCell value={r.accountsDelivered} onCommit={(v)=>onPatch(r._id,{accountsDelivered:v})} placeholder="0" style={miniInp} /></td>
                      <td style={{ padding:"8px 8px", borderBottom:`1px solid ${C.line}`, textAlign:"right", fontSize:12.5, fontWeight:700, color:"#15724A", whiteSpace:"nowrap" }}>{totalOf(r).toLocaleString()}</td>
                      <td style={{ padding:"5px 8px", borderBottom:`1px solid ${C.line}` }}><input value={r.bonus||""} onChange={(e)=>onPatch(r._id,{bonus:e.target.value})} placeholder="e.g. +RM500 after 50 accounts, or —" style={{ ...miniInp, textAlign:"left" }} /></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── collab decks (media kit per brand, file upload only) ── */
function CollabDecks({ decks, brands, isAdmin, onSaveDeck }) {
  const [view, setView] = useState("cards");
  const list = brands || [];
  const upload = async (b, f) => {
    if (!f) return;
    if (f.size > 2*1024*1024) { alert("That file is over 2MB. Compress it (or split it) to keep the app fast."); return; }
    try { const du = await fileToDataURL(f); onSaveDeck(b, { file:du, fileName:f.name }); } catch (e) { alert("Sorry, couldn't read that file."); }
  };
  const uploadInput = (b, label) => (
    <label style={{ fontSize:12, fontWeight:600, color:C.navy, cursor:"pointer", border:`1px solid ${C.line}`, borderRadius:8, padding:"6px 11px", display:"inline-block" }}>{label}
      <input type="file" accept="application/pdf,image/*" onChange={(e)=>{ const f=e.target.files&&e.target.files[0]; upload(b,f); if(e.target) e.target.value=""; }} style={{ display:"none" }} />
    </label>
  );
  const openBtn = (d) => <button onClick={()=>openDataUrl(d.file)} style={{ border:"none", background:C.navy, color:"#fff", borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:700, cursor:"pointer" }}>Open</button>;
  const removeBtn = (b) => isAdmin ? <button onClick={()=>onSaveDeck(b,{ file:"", fileName:"" })} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.red, borderRadius:8, padding:"6px 10px", fontSize:12, fontWeight:700, cursor:"pointer" }}>Remove</button> : null;
  return (
    <div>
      <Toolbar title="Collab Decks" sub="Media kit per brand — upload a file to share with partners during pitches" />
      <div style={{ display:"flex", alignItems:"center", marginBottom:14 }}>
        <div style={{ marginLeft:"auto", display:"flex", background:"#F1F3F8", borderRadius:8, padding:3 }}>
          {[["cards","Cards"],["list","List"]].map((o)=>(<button key={o[0]} onClick={()=>setView(o[0])} style={{ border:"none", cursor:"pointer", borderRadius:6, padding:"5px 13px", fontSize:12, fontWeight:700, background:view===o[0]?"#fff":"transparent", color:view===o[0]?C.navy:C.sub, boxShadow:view===o[0]?"0 1px 2px rgba(20,35,62,.12)":"none" }}>{o[1]}</button>))}
        </div>
      </div>
      {list.length===0 ? <Empty>Add brands in Lists to attach decks.</Empty> : view==="cards" ? (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(250px,1fr))", gap:12 }}>
          {list.map((b)=>{ const d=(decks&&decks[b])||{}; return (
            <div key={b} style={card(16)}>
              <BrandTag b={b} />
              <div style={{ marginTop:14 }}>
                {d.file ? (
                  <div>
                    <div style={{ fontSize:12.5, color:C.sub, marginBottom:10, display:"flex", gap:6, alignItems:"center" }}><span>📎</span><span style={{ flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }} title={d.fileName}>{d.fileName}</span></div>
                    <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>{openBtn(d)}{isAdmin && uploadInput(b,"Replace")}{removeBtn(b)}</div>
                  </div>
                ) : (
                  <div style={{ display:"flex", flexDirection:"column", gap:8 }}><span style={{ fontSize:12.5, color:C.sub }}>No deck uploaded yet.</span>{isAdmin ? uploadInput(b,"Upload file") : null}</div>
                )}
              </div>
            </div>
          ); })}
        </div>
      ) : (

// read any file to a data URL (used for collab deck uploads)
function fileToDataURL(file) {
  return new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = reject; r.readAsDataURL(file); });
}
// open a stored data URL in a new tab via a blob (reliable for PDFs)
function openDataUrl(dataUrl) {
  try {
    const parts = String(dataUrl).split(","); const mime = (parts[0].match(/data:([^;]+)/) || [])[1] || "application/octet-stream";
    const bin = atob(parts[1]); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: mime })); window.open(url, "_blank");
  } catch (e) { window.open(dataUrl, "_blank"); }
}
// resize an uploaded image to a small square-ish logo and return a data URL (keeps the shared DB light)
function fileToLogoDataURL(file, max=220) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > h) { if (w > max) { h = Math.round(h * max / w); w = max; } }
        else { if (h > max) { w = Math.round(w * max / h); h = max; } }
        const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

  const countFor = (o)=>wk.filter((r)=>r.owner===o).length;
  const hitTarget = team.filter((t)=>countFor(t)>=target).length;
  const published = wk.filter((r)=>r.status==="Published").length;
  const navBtn = { border:`1px solid ${C.line}`, background:"#fff", color:C.navy, borderRadius:9, padding:"7px 12px", fontSize:12.5, fontWeight:700, cursor:"pointer" };
  const kpiBox = (n,l,c)=>(<div style={{ ...card(12), flex:1, minWidth:120 }}><div style={{ fontFamily:"inherit", fontSize:24, fontWeight:600, lineHeight:1, color:c||C.ink }}>{n}</div><div style={{ fontSize:11, color:C.sub, fontWeight:600, marginTop:5 }}>{l}</div></div>);
  const bar = (val,max,color)=>(<div style={{ height:6, background:"#EEF1F6", borderRadius:4, overflow:"hidden" }}><div style={{ width:`${Math.min(100,(val/Math.max(1,max))*100)}%`, height:"100%", background:color }} /></div>);
  return (
    <div>
      <Toolbar title="Content Tracker" sub={`Each member submits ≥ ${target} ideas/week, then tracks each through Scripted → Filmed → Edited → Published. Week of ${week} → ${sunday}`} onAdd={onAdd} addLabel="Add idea" />
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14, flexWrap:"wrap" }}>
        <button onClick={()=>setWeek(addDaysISO(week,-7))} style={navBtn}>← Prev</button>
        <button onClick={()=>setWeek(THIS_MON)} style={navBtn}>This week</button>
        <button onClick={()=>setWeek(addDaysISO(week,7))} style={navBtn}>Next →</button>
        {week===THIS_MON && <Pill bg={C.navy} fg="#fff">Current week</Pill>}
      </div>
      {team.includes(myName) && week===THIS_MON && mine<target && (
        <div style={{ background:"#FFF3CC", border:`1px solid ${C.yellow}`, borderRadius:10, padding:"10px 12px", fontSize:12.5, fontWeight:600, color:"#7a5b00", marginBottom:14 }}>⏰ You've submitted {mine} of {target} ideas this week — add {target-mine} more before Monday's meeting.</div>
      )}
      {isAdmin && (
        <div style={{ ...card(14), marginBottom:14 }}>
          <SectionTitle icon={Shield}>Monday review — team summary</SectionTitle>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", margin:"12px 0" }}>
            {kpiBox(`${hitTarget}/${team.length}`, `Hit ${target}-idea target`, "#1FA463")}
            {kpiBox(wk.length, "Total ideas", C.navy)}
            {kpiBox(published, "Published", "#1FA463")}
            {kpiBox(wk.filter((r)=>DONE.includes(r.status)&&r.status!=="Published").length, "In progress", "#C98A00")}
          </div>
          <div style={{ display:"grid", gap:8 }}>
            {team.map((t)=>{ const c=countFor(t); const pub=wk.filter((r)=>r.owner===t&&r.status==="Published").length; const ok=c>=target; return (
              <div key={t} style={{ display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ width:90, fontSize:12.5, fontWeight:600 }}>{t}</span>
                <div style={{ flex:1 }}>{bar(c,target,ok?"#1FA463":C.yellow)}</div>
                <span style={{ fontSize:12, fontWeight:700, color:ok?"#1FA463":C.red, width:58, textAlign:"right" }}>{c}/{target}</span>
                <span style={{ fontSize:11.5, color:C.sub, width:84, textAlign:"right" }}>{pub} published</span>
              </div>
            ); })}
          </div>
        </div>
      )}
      <div style={{ display:"grid", gap:14 }}>
        {Object.keys(grouped).length===0 && <Empty>No ideas submitted for this week yet.</Empty>}
        {team.filter((t)=>grouped[t]).map((owner)=>{ const c=grouped[owner].length; const ok=c>=target; return (
          <div key={owner}>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:8 }}>
              <span style={{ fontFamily:"inherit", fontSize:16, fontWeight:600 }}>{owner}</span>
              <span style={{ fontSize:11.5, color:ok?"#15724A":C.red, background:ok?"#DCF0E4":"#FBE4E6", borderRadius:6, padding:"2px 8px", fontWeight:700 }}>{c}/{target}</span>
              {owner===myName && <Pill bg="#E8EEF7" fg={C.navy}>You</Pill>}
              <div style={{ flex:1, height:1, background:C.line }} />
            </div>
            <div style={{ display:"grid", gap:8 }}>
              {grouped[owner].map((r)=>(
                <div key={r._id} style={{ display:"flex", alignItems:"flex-start", gap:12, ...card(12) }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:6, flexWrap:"wrap" }}>
                      <span style={{ fontSize:13.5, fontWeight:600 }}>{r.title || "(untitled)"}</span>
                      <Pill bg="#EEF1F6" fg={C.sub}>{r.type||"—"}</Pill>
                      {r.topic && <Pill bg="#E8EEF7" fg={C.navy}>{r.topic}</Pill>}
                    </div>
                    <div style={{ fontSize:11, color:C.sub, marginTop:4 }}>
                      {DONE.map((st)=> (r.stamps&&r.stamps[st]) ? <span key={st} style={{ marginRight:12 }}>✓ {st} <b style={{ color:C.ink }}>{r.stamps[st].slice(5)}</b></span> : null)}
                      {(!r.stamps || !DONE.some((st)=>r.stamps[st])) && <span style={{ fontStyle:"italic" }}>not started</span>}
                      {r.notes && <span style={{ display:"block", marginTop:3 }}>{r.notes}</span>}
                    </div>
                  </div>
                  <select value={r.status||"Idea"} onChange={(e)=>setStatus(r._id, e.target.value)} style={{ border:`1px solid ${C.line}`, borderRadius:8, padding:"5px 8px", fontSize:12, fontFamily:"inherit", background:STATUS_TINT[r.status]||"#fff", fontWeight:700, cursor:"pointer" }}>
                    {STAGES.map((s)=><option key={s} value={s}>{s}</option>)}
                  </select>
                  <div style={{ display:"flex" }}><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></div>
                </div>
              ))}
            </div>
          </div>
        ); })}
      </div>
    </div>
  );
}

/* ── productivity calendar (counts every status update per day, per person) ── */
function Productivity({ rows, team }) {
  const STAGES = ["Scripted","Filmed","Edited","Published"];
  const members = ["All", ...(team||[]).filter((t)=>t!=="Unassigned")];
  const [member, setMember] = useState("All");
  const now = new Date();
  const [ym, setYm] = useState({ y: now.getFullYear(), m: now.getMonth() });
  const counts = {};
  rows.forEach((r)=>{ if (member!=="All" && r.owner!==member) return; const s=r.stamps||{}; STAGES.forEach((st)=>{ if (s[st]) counts[s[st]]=(counts[s[st]]||0)+1; }); });
  const first = new Date(ym.y, ym.m, 1);
  const startPad = (first.getDay()+6)%7;
  const dim = new Date(ym.y, ym.m+1, 0).getDate();
  const pad2 = (n)=>String(n).padStart(2,"0");
  const cells = []; for (let i=0;i<startPad;i++) cells.push(null);
  for (let d=1; d<=dim; d++){ const iso=`${ym.y}-${pad2(ym.m+1)}-${pad2(d)}`; cells.push({ d, iso, n: counts[iso]||0 }); }
  while (cells.length%7!==0) cells.push(null);
  const monthKey = `${ym.y}-${pad2(ym.m+1)}`;
  const monthTotal = Object.keys(counts).filter((k)=>k.startsWith(monthKey)).reduce((a,k)=>a+counts[k],0);
  const maxN = Math.max(1, ...cells.filter(Boolean).map((c)=>c.n));
  const monthName = first.toLocaleDateString("en-US",{ month:"long", year:"numeric" });
  const shift = (delta)=>setYm(({y,m})=>{ const d=new Date(y,m+delta,1); return { y:d.getFullYear(), m:d.getMonth() }; });
  const heat = (n)=>{ if (!n) return "#fff"; const t=n/maxN; if (t>0.66) return "#1FA463"; if (t>0.33) return "#7CC59A"; return "#CFE8D9"; };
  const navBtn = { border:`1px solid ${C.line}`, background:"#fff", color:C.navy, borderRadius:9, padding:"7px 12px", fontSize:12.5, fontWeight:700, cursor:"pointer" };
  const TODAYV = nowISO();
  return (
    <div>
      <Toolbar title="Productivity" sub="Each square counts the content actions completed that day — moving an idea to Scripted, Filmed, Edited or Published." />
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14, flexWrap:"wrap" }}>
        <button onClick={()=>shift(-1)} style={navBtn}>←</button>
        <span style={{ fontFamily:"inherit", fontSize:18, fontWeight:600, minWidth:160, textAlign:"center" }}>{monthName}</span>
        <button onClick={()=>shift(1)} style={navBtn}>→</button>
        <div style={{ flex:1 }} />
        <span style={{ fontSize:12, color:C.sub, fontWeight:600 }}>Member</span>
        <select value={member} onChange={(e)=>setMember(e.target.value)} style={{ border:`1px solid ${C.line}`, borderRadius:9, padding:"7px 10px", fontSize:13, fontFamily:"inherit", background:"#fff", cursor:"pointer" }}>
          {members.map((m)=><option key={m} value={m}>{m}</option>)}
        </select>
        <Pill bg={C.navy} fg="#fff">{monthTotal} actions</Pill>
      </div>
      <div style={card(14)}>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:6 }}>
          {["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d)=>(<div key={d} style={{ fontSize:11, fontWeight:700, color:C.sub, textAlign:"center", paddingBottom:4 }}>{d}</div>))}
          {cells.map((c,i)=>(
            <div key={i} style={{ aspectRatio:"1 / 1", borderRadius:9, border:`1px solid ${c&&c.iso===TODAYV?C.navy:C.line}`, background:c?heat(c.n):"transparent", display:"flex", flexDirection:"column", justifyContent:"space-between", padding:6, minHeight:52 }}>
              {c && <span style={{ fontSize:11, fontWeight:600, color:c.n>maxN*0.33?"#fff":C.sub }}>{c.d}</span>}
              {c && c.n>0 && <span style={{ fontFamily:"inherit", fontSize:18, fontWeight:600, color:c.n>maxN*0.33?"#fff":C.ink, textAlign:"right" }}>{c.n}</span>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ── admin panel: enrol team members (calls the secure Edge Function) ── */
function AdminPanel({ data, onEnrol, myEmail, onListUsers, onRemoveUser, onUpdateUser }) {
  const [name,setName]=useState(""); const [email,setEmail]=useState(""); const [pw,setPw]=useState(""); const [role,setRole]=useState("user");
  const [tabs,setTabs]=useState(MEMBER_TABS.map((t)=>t[0]));
  const [busy,setBusy]=useState(false); const [msg,setMsg]=useState(null);
  const [members,setMembers]=useState(null); const [mErr,setMErr]=useState("");
  const [editId,setEditId]=useState(null); const [eRole,setERole]=useState("user"); const [eTabs,setETabs]=useState([]); const [eBusy,setEBusy]=useState(false);
  const [cRoles,setCRoles]=useState([]); const [emp,setEmp]=useState("Full time");
  const [eRoles,setERoles]=useState([]); const [eEmp,setEEmp]=useState("Full time"); const [eName,setEName]=useState("");
  // App-managed editors: an email on data.editors is an editor even if their Supabase role is "user".
  const appEditors = ((data && data.editors) || []).map((e)=>String(e||"").toLowerCase());
  const isAppEditor = (u)=> u.role==="editor" || appEditors.includes(String(u.email||"").toLowerCase());
  const lbl = { fontSize:11.5, fontWeight:700, color:C.sub, display:"block", marginBottom:5 };
  const roleChip = (label, on, onClick) => <button type="button" key={label} onClick={onClick} style={{ border:`1.5px solid ${on?C.navy:C.line}`, background:on?"#F3F6FC":"#fff", color:on?C.navy:C.sub, borderRadius:8, padding:"5px 9px", fontSize:11.5, fontWeight:600, cursor:"pointer" }}>{on?"✓ ":""}{label}</button>;
  const load = ()=>{ if(!onListUsers) return; setMErr(""); onListUsers().then((r)=>setMembers(r.users||[])).catch((e)=>setMErr(String((e&&e.message)||e))); };
  useEffect(()=>{ load(); }, []);
  const toggleTab=(id)=>setTabs((s)=>s.includes(id)?s.filter((x)=>x!==id):[...s,id]);
  const submit = async (e)=>{ e.preventDefault(); setBusy(true); setMsg(null);
    const res = await onEnrol({ name, email:email.trim(), password:pw, role, tabs: role==="admin"?null:tabs, contentRoles:cRoles, employment:emp });
    setBusy(false);
    if (res.error) setMsg({ ok:false, text:res.error });
    else { setMsg({ ok:true, text:`✓ ${email} enrolled as ${role==="admin"?"Admin":role==="editor"?"Editor":"Member"}.` }); setName(""); setEmail(""); setPw(""); setRole("user"); setTabs(MEMBER_TABS.map((t)=>t[0])); setCRoles([]); setEmp("Full time"); load(); }
  };
  const remove = async (u)=>{ const ok = window.confirm ? window.confirm(`Remove ${u.email}? They will lose access to Content Hub immediately.`) : true; if(!ok) return; try{ await onRemoveUser(u.id); load(); }catch(e){ setMErr(String((e&&e.message)||e)); } };
  const startEdit = (u)=>{ setEditId(u.id); setEName(u.name||""); setERole(isAppEditor(u)?"editor":(u.role||"user")); setETabs(Array.isArray(u.tabs)?u.tabs.slice():MEMBER_TABS.map((t)=>t[0])); setERoles(Array.isArray(u.contentRoles)?u.contentRoles.slice():[]); setEEmp(u.employment||"Full time"); };
  const toggleETab = (id)=>{ if(id==="pipeline") return; setETabs((s)=>s.includes(id)?s.filter((x)=>x!==id):[...s,id]); };
  const saveEdit = async (u)=>{ setEBusy(true); setMErr(""); try{ await onUpdateUser({ id:u.id, email:u.email, role:eRole, tabs: eRole==="admin"?null:eTabs, contentRoles:eRoles, employment:eEmp, name:eName.trim(), oldName:u.name||"" }); setEditId(null); load(); }catch(e){ setMErr(String((e&&e.message)||e)); } setEBusy(false); };
  return (
    <div>
      <Toolbar title="Admin" sub="Enrol team members, set which tabs they can access, and manage logins" />
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:16 }}>
        <div style={card(16)}>
          <SectionTitle icon={UserPlus}>Enrol a new team member</SectionTitle>
          <form onSubmit={submit} style={{ display:"grid", gap:10, marginTop:12 }}>
            <div><label style={lbl}>Full name</label><input value={name} onChange={(e)=>setName(e.target.value)} required style={inp()} placeholder="e.g. Serene" /></div>
            <div><label style={lbl}>Email</label><input type="email" value={email} onChange={(e)=>setEmail(e.target.value)} required style={inp()} placeholder="name@company.com" /></div>
            <div><label style={lbl}>Temporary password</label><input value={pw} onChange={(e)=>setPw(e.target.value)} required minLength={6} style={inp()} placeholder="at least 6 characters" /></div>
            <div><label style={lbl}>Role</label><select value={role} onChange={(e)=>setRole(e.target.value)} style={inp()}><option value="user">Member</option><option value="editor">Editor</option><option value="admin">Admin</option></select>
              {role==="editor" && <div style={{ fontSize:10.5, color:C.sub, marginTop:5, lineHeight:1.5 }}>Editors only see content assigned to them (as Editor), can open Project Assets and mark a piece Edited, plus the Payout tab. Nothing else is editable.</div>}
            </div>
            {role==="user" && (
              <div>
                <label style={lbl}>Tabs this member can access</label>
                <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                  {MEMBER_TABS.map((mt)=>{ const id=mt[0]; const label=mt[1]; const on=tabs.includes(id); const locked=id==="pipeline"; return (
                    <button type="button" key={id} onClick={()=>{ if(!locked) toggleTab(id); }} style={{ border:`1.5px solid ${on?C.navy:C.line}`, background:on?"#F3F6FC":"#fff", color:on?C.navy:C.sub, borderRadius:8, padding:"5px 9px", fontSize:11.5, fontWeight:600, cursor:locked?"default":"pointer", opacity:locked?0.7:1 }}>{on?"✓ ":""}{label}</button>
                  ); })}
                </div>
                <div style={{ fontSize:10.5, color:C.sub, marginTop:5 }}>Content is always on. Admins see every tab.</div>
              </div>
            )}
            <div>
              <label style={lbl}>Content role(s)</label>
              <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{CONTENT_ROLES.map((cr)=>roleChip(cr, cRoles.includes(cr), ()=>setCRoles((s)=>s.includes(cr)?s.filter((x)=>x!==cr):[...s,cr])))}</div>
            </div>
            <div><label style={lbl}>Employment</label><select value={emp} onChange={(e)=>setEmp(e.target.value)} style={inp()}>{EMPLOYMENT_TYPES.map((x)=><option key={x} value={x}>{x}</option>)}</select></div>
            {msg && <div style={{ background:msg.ok?"#D6EFD6":"#FBE4E6", color:msg.ok?"#15724A":"#A11", fontSize:12, fontWeight:600, padding:"8px 10px", borderRadius:8 }}>{msg.text}</div>}
            <button type="submit" disabled={busy} style={{ border:"none", background:busy?"#9FB0CC":C.navy, color:"#fff", padding:"10px", borderRadius:10, fontWeight:700, fontSize:13.5, cursor:busy?"default":"pointer" }}>{busy?"Enrolling…":"Enrol member"}</button>
          </form>
          <div style={{ fontSize:11, color:C.sub, marginTop:10, lineHeight:1.5 }}>They can log in immediately with this email + password. Ask them to change it after first login.</div>
        </div>
        <div style={card(16)}>
          <SectionTitle icon={Shield}>Members & access</SectionTitle>
          {mErr && <div style={{ background:"#FBE4E6", color:"#A11", fontSize:11.5, fontWeight:600, padding:"8px 10px", borderRadius:8, margin:"12px 0" }}>{mErr}</div>}
          {members===null && !mErr && <div style={{ fontSize:12, color:C.sub, marginTop:12 }}>Loading members…</div>}
          <div style={{ display:"grid", gap:7, marginTop:12 }}>
            {members && members.map((u)=>(
              <div key={u.id} style={{ border:`1px solid ${C.line}`, borderRadius:9, overflow:"hidden" }}>
                <div style={{ display:"flex", alignItems:"center", gap:9, padding:"8px 10px" }}>
                  <span style={{ width:26, height:26, borderRadius:7, background:"#EEF1F6", display:"grid", placeItems:"center", fontSize:12, fontWeight:800, color:C.navy, flexShrink:0 }}>{(u.name||u.email||"?").slice(0,1).toUpperCase()}</span>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:12.5, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{u.name||u.email}</div>
                    <div style={{ fontSize:10.5, color:C.sub, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{u.email}{Array.isArray(u.tabs)?` · ${u.tabs.length} tabs`:(u.role==="admin"?"":" · all tabs")}</div>
                    {(u.employment || (Array.isArray(u.contentRoles)&&u.contentRoles.length>0)) && <div style={{ display:"flex", gap:4, flexWrap:"wrap", marginTop:4 }}>{u.employment && <Pill bg={u.employment==="Full time"?"#DCE8FB":"#FCE9D6"} fg={u.employment==="Full time"?"#1E3F86":"#8a5a1a"}>{u.employment}</Pill>}{Array.isArray(u.contentRoles)&&u.contentRoles.map((cr)=><Pill key={cr} bg="#EEF1F6" fg={C.sub}>{cr}</Pill>)}</div>}
                  </div>
                  <Pill bg={u.role==="admin"?C.yellow:isAppEditor(u)?"#E5DEFA":"#EEF1F6"} fg={u.role==="admin"?C.navy:isAppEditor(u)?"#4B2E9E":C.sub}>{u.role==="admin"?"Admin":isAppEditor(u)?"Editor":"Member"}</Pill>
                  {u.email!==myEmail ? (<React.Fragment><IconBtn title="Edit access" onClick={()=>editId===u.id?setEditId(null):startEdit(u)}><Pencil size={14} /></IconBtn><IconBtn title="Remove member" danger onClick={()=>remove(u)}><Trash2 size={14} /></IconBtn></React.Fragment>) : (<React.Fragment><IconBtn title="Edit your name" onClick={()=>editId===u.id?setEditId(null):startEdit(u)}><Pencil size={14} /></IconBtn><span style={{ fontSize:10, color:C.sub, width:24, textAlign:"center" }}>you</span></React.Fragment>)}
                </div>
                {editId===u.id && (
                  <div style={{ borderTop:`1px solid ${C.line}`, padding:"10px 12px", background:"#FAFBFD" }}>
                    <label style={lbl}>Full name</label>
                    <input value={eName} onChange={(e)=>setEName(e.target.value)} placeholder="Display name" style={{ ...inp(), marginBottom:10 }} />
                    {u.email!==myEmail && (<React.Fragment>
                    <label style={lbl}>Role</label>
                    <select value={eRole} onChange={(e)=>setERole(e.target.value)} style={{ ...inp(), marginBottom:10 }}><option value="user">Member</option><option value="editor">Editor</option><option value="admin">Admin</option></select>
                    {eRole==="user" && (
                      <div style={{ marginBottom:10 }}>
                        <label style={lbl}>Tabs this member can access</label>
                        <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
                          {MEMBER_TABS.map((mt)=>{ const id=mt[0]; const on=eTabs.includes(id); const locked=id==="pipeline"; return (
                            <button type="button" key={id} onClick={()=>toggleETab(id)} style={{ border:`1.5px solid ${on?C.navy:C.line}`, background:on?"#F3F6FC":"#fff", color:on?C.navy:C.sub, borderRadius:8, padding:"5px 9px", fontSize:11.5, fontWeight:600, cursor:locked?"default":"pointer", opacity:locked?0.7:1 }}>{on?"✓ ":""}{mt[1]}</button>
                          ); })}
                        </div>
                        <div style={{ fontSize:10.5, color:C.sub, marginTop:5 }}>Dashboard is always on.</div>
                      </div>
                    )}
                    <div style={{ marginBottom:10 }}>
                      <label style={lbl}>Content role(s)</label>
                      <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>{CONTENT_ROLES.map((cr)=>roleChip(cr, eRoles.includes(cr), ()=>setERoles((s)=>s.includes(cr)?s.filter((x)=>x!==cr):[...s,cr])))}</div>
                    </div>
                    <div style={{ marginBottom:10 }}><label style={lbl}>Employment</label><select value={eEmp} onChange={(e)=>setEEmp(e.target.value)} style={inp()}>{EMPLOYMENT_TYPES.map((x)=><option key={x} value={x}>{x}</option>)}</select></div>
                    </React.Fragment>)}
                    <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
                      <button onClick={()=>setEditId(null)} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.sub, borderRadius:8, padding:"7px 13px", fontSize:12.5, fontWeight:600, cursor:"pointer" }}>Cancel</button>
                      <button onClick={()=>saveEdit(u)} disabled={eBusy} style={{ border:"none", background:eBusy?"#9FB0CC":C.navy, color:"#fff", borderRadius:8, padding:"7px 15px", fontSize:12.5, fontWeight:700, cursor:eBusy?"default":"pointer" }}>{eBusy?"Saving…":"Save access"}</button>
                    </div>
                  </div>
                )}
              </div>
            ))}
            {members && members.length===0 && <Empty>No members yet.</Empty>}
          </div>
          <div style={{ fontSize:11, color:C.sub, marginTop:10, lineHeight:1.5 }}>Removing a member deletes their login immediately. Owner-dropdown names are managed in Lists → Team / Owner.</div>
        </div>
      </div>
    </div>
  );
}

  const td = { fontSize:12.5, padding:"11px 12px", borderBottom:`1px solid ${C.line}`, verticalAlign:"top" };
  return (
    <div>
      <Toolbar title="Account Management" sub={`${rows.length} social account${rows.length===1?"":"s"} — who manages each and the devices used to create / log in`} onAdd={onAdd} addLabel="New account" />
      {rows.length===0 ? <Empty>No accounts yet. Click "New account" to record your first social account.</Empty> : (
        <div style={{ ...card(0), overflow:"hidden" }}>
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", minWidth:860 }}>
              <thead><tr>
                <th style={th}>Platform</th><th style={th}>Brand logo</th><th style={th}>Brand</th><th style={th}>Manager</th><th style={th}>Created on</th><th style={th}>Logged in on</th><th style={{ ...th, textAlign:"right" }}></th>
              </tr></thead>
              <tbody>
                {rows.map((r)=>(
                  <tr key={r._id}>
                    <td style={td}><Pill bg="#EEF1F6" fg={C.sub}>{r.platform||"—"}</Pill></td>
                    <td style={td}>{r.logo ? <img src={r.logo} alt="" style={{ height:38, width:38, borderRadius:8, objectFit:"cover", border:`1px solid ${C.line}`, background:"#fff", display:"block" }} /> : <div style={{ height:38, width:38, borderRadius:8, background:"#EEF1F6", display:"grid", placeItems:"center", color:C.sub, fontSize:9, fontWeight:700, letterSpacing:".3px" }}>LOGO</div>}{r.notes && <div style={{ fontSize:11, color:C.sub, fontWeight:400, marginTop:5, maxWidth:220, whiteSpace:"normal" }}>{r.notes}</div>}</td>
                    <td style={td}>{r.brand ? <BrandTag b={r.brand} /> : "—"}</td>
                    <td style={{ ...td, fontWeight:600 }}>{r.manager||"—"}</td>
                    <td style={{ ...td, color:C.sub }}>{r.createdDevice||"—"}</td>
                    <td style={{ ...td, color:C.sub }}>{r.loginDevice||"—"}</td>
                    <td style={{ ...td, textAlign:"right", whiteSpace:"nowrap" }}><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── hiring (job posts everyone can share to friends / family) ── */
function Hiring({ rows, isAdmin, siteUrl, onAdd, onEdit, onDel }) {
  const [copied, setCopied] = useState(null);
  const shareText = (r) => {
    const link = (r.applyLink && r.applyLink.trim()) || siteUrl || "";
    return [
      `📢 We're hiring: ${r.title || "Open role"}`,
      [r.employment, r.brand, r.location].filter(Boolean).join(" · "),
      r.desc || "",
      link ? `Apply / details: ${link}` : "",
      "— BBB Media Group",
    ].filter(Boolean).join("\n\n");
  };
  const share = (r, how) => {
    const text = shareText(r);
    if (how==="whatsapp") window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
    else if (how==="email") window.open(`mailto:?subject=${encodeURIComponent("We're hiring: "+(r.title||"Open role"))}&body=${encodeURIComponent(text)}`, "_blank");
    else if (how==="native" && typeof navigator!=="undefined" && navigator.share) navigator.share({ title:`We're hiring: ${r.title||""}`, text }).catch(()=>{});
    else if (how==="copy" && typeof navigator!=="undefined" && navigator.clipboard) navigator.clipboard.writeText(text).then(()=>{ setCopied(r._id); setTimeout(()=>setCopied(null),1600); });
  };
  const sBtn = (label, onClick, bg, fg) => <button onClick={onClick} style={{ border:`1px solid ${C.line}`, background:bg||"#fff", color:fg||C.navy, borderRadius:8, padding:"6px 11px", fontSize:12, fontWeight:700, cursor:"pointer" }}>{label}</button>;
  return (
    <div>
      <Toolbar title="Hiring" sub={`${rows.length} open role${rows.length===1?"":"s"} — anyone can share these with friends & family`} onAdd={isAdmin?onAdd:undefined} addLabel="New job post" />
      {rows.length===0 ? <Empty>{isAdmin ? 'No job posts yet. Click "New job post" to add one.' : "No open roles right now."}</Empty> : (
        <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(340px,1fr))", gap:12 }}>
          {rows.map((r)=>(
            <div key={r._id} style={card(16)}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"start", gap:8 }}>
                <div style={{ fontSize:15.5, fontWeight:700, lineHeight:1.3 }}>{r.title||"Untitled role"}</div>
                {isAdmin && <div style={{ display:"flex", flexShrink:0 }}><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></div>}
              </div>
              <div style={{ display:"flex", gap:7, flexWrap:"wrap", margin:"9px 0", alignItems:"center" }}>
                {r.employment && <Pill bg={r.employment==="Full time"?"#DCE8FB":"#FCE9D6"} fg={r.employment==="Full time"?"#1E3F86":"#8a5a1a"}>{r.employment}</Pill>}
                {r.brand && <BrandTag b={r.brand} />}
                {r.location && <span style={{ fontSize:12, color:C.sub }}>📍 {r.location}</span>}
              </div>
              {r.desc && <div style={{ fontSize:12.5, color:C.sub, lineHeight:1.5, whiteSpace:"pre-wrap" }}>{r.desc}</div>}
              {r.applyLink && <div style={{ fontSize:12, marginTop:8 }}><a href={r.applyLink} target="_blank" rel="noopener noreferrer" style={{ color:"#2D6CDF", fontWeight:600 }}>Apply link →</a></div>}
              <div style={{ display:"flex", gap:7, flexWrap:"wrap", marginTop:12, paddingTop:12, borderTop:`1px solid ${C.line}`, alignItems:"center" }}>
                <span style={{ fontSize:11, fontWeight:700, color:C.sub, display:"inline-flex", alignItems:"center", gap:4 }}><Share2 size={13} />Share:</span>
                {sBtn("WhatsApp", ()=>share(r,"whatsapp"), "#DCF0E4", "#12643f")}
                {sBtn("Email", ()=>share(r,"email"))}
                {sBtn(copied===r._id?"Copied ✓":"Copy", ()=>share(r,"copy"))}
                {typeof navigator!=="undefined" && navigator.share && sBtn("More…", ()=>share(r,"native"))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ── login screen (shown until a team member signs in) ── */
function Login() {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = async (e) => {
    e.preventDefault();
    setErr(""); setBusy(true);
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pw });
    setBusy(false);
    if (error) setErr(error.message || "Could not sign in.");
  };
  return (
    <div style={{ minHeight:"100vh", display:"grid", placeItems:"center", background:C.navy, padding:20 }}>
      <form onSubmit={submit} style={{ width:"min(340px,100%)", background:"#fff", borderRadius:16, padding:24, boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ display:"flex", alignItems:"center", gap:11, marginBottom:18 }}>
          <div style={{ width:38, height:38, borderRadius:10, background:C.yellow, color:C.navy, fontWeight:800, fontSize:14, display:"grid", placeItems:"center" }}>BBB</div>
          <div><div style={{ fontWeight:800, fontSize:16 }}>Content Hub</div><div style={{ fontSize:11.5, color:C.sub }}>Team & admin sign in</div></div>
        </div>
        <label style={{ fontSize:11.5, fontWeight:700, color:C.sub, display:"block", marginBottom:5 }}>Email</label>
        <input type="email" value={email} onChange={(e)=>setEmail(e.target.value)} required autoFocus style={{ ...inp(), marginBottom:12 }} />
        <label style={{ fontSize:11.5, fontWeight:700, color:C.sub, display:"block", marginBottom:5 }}>Password</label>
        <input type="password" value={pw} onChange={(e)=>setPw(e.target.value)} required style={{ ...inp(), marginBottom:16 }} />
        {err && <div style={{ background:"#FBE4E6", color:"#A11", fontSize:12, fontWeight:600, padding:"8px 10px", borderRadius:8, marginBottom:12 }}>{err}</div>}
        <button type="submit" disabled={busy} style={{ width:"100%", border:"none", background:busy?"#9FB0CC":C.navy, color:"#fff", padding:"11px", borderRadius:10, fontWeight:700, fontSize:14, cursor:busy?"default":"pointer" }}>{busy?"Signing in…":"Sign in"}</button>
        <div style={{ fontSize:11, color:C.sub, marginTop:14, textAlign:"center", lineHeight:1.5 }}>Accounts are created by your admin in Supabase. Contact your team lead if you can't sign in.</div>
      </form>
    </div>
  );
}

/* ── shown if the Supabase keys haven't been filled in yet ── */
function ConfigNeeded() {
  return (
    <div style={{ minHeight:"100vh", display:"grid", placeItems:"center", background:C.navy, padding:24 }}>
      <div style={{ width:"min(460px,100%)", background:"#fff", borderRadius:16, padding:26, textAlign:"center" }}>
        <div style={{ fontSize:34, marginBottom:8 }}>🔌</div>
        <div style={{ fontWeight:800, fontSize:17, marginBottom:8 }}>Almost there — add your Supabase keys</div>
        <div style={{ fontSize:13, color:C.sub, lineHeight:1.6 }}>Open <b>index.html</b> and paste your <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> near the top of the script (Supabase → Project Settings → API). Then refresh. Full steps are in the setup guide.</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

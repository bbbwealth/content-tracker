      .from("app_state")

    setSaved(error ? "Save failed — check connection" : "Saved");
    savedTimer.current = setTimeout(() => setSaved(""), 1600);
  };

  const logout = () => { if (sb) sb.auth.signOut(); };

  if (!SB_READY) return <ConfigNeeded />;
  if (session === undefined) return <Splash />;
  if (!session) return <Login />;
  if (!data) return <Splash />;
  const currentUser = session.user || {};
  const role = (currentUser.app_metadata && currentUser.app_metadata.role) || "user";
  const isAdmin = role === "admin";
  // Editors are managed inside the app (Admin → mark as Editor). Anyone whose email
  // is on data.editors gets the restricted, edit-only view — no Supabase role change needed.
  const editorEmails = (data.editors || []).map((e)=>String(e||"").toLowerCase());
  const isEditor = !isAdmin && (role === "editor" || editorEmails.includes(String(currentUser.email||"").toLowerCase()));
  const myName = (currentUser.user_metadata && currentUser.user_metadata.name) || currentUser.email || "";
  const L = { ...data.lists, topics: [ ...((data.lists && data.lists.topics) || []) ].sort((a,b)=>String(a).localeCompare(String(b))) };
  const matchBrand = (r) => brandFilter === "All" || r.brand === brandFilter;
  const matchQuery = (r) => !query || JSON.stringify(r).toLowerCase().includes(query.toLowerCase());
  const filt = (rows) => rows.filter((r) => matchBrand(r) && matchQuery(r));

  const openAdd = (entity) => {
    const blank = {}; fieldSets(L)[entity].forEach((f)=>(blank[f.k]=f.t==="number"?0:f.t==="multiselect"?[]:""));
    if (entity==="ideas") { blank.dateAdded=nowISO(); blank.status="Backlog"; blank.priority="Medium"; blank.kind="Organic"; blank.by=myName; }
    if (entity==="pipeline") { blank.status=STAGES[0]; blank.kind="Organic"; blank.by=myName; blank.dateAdded=nowISO(); blank.platform="Instagram"; }
    if (entity==="calendar") blank.status="Planned";
    if (entity==="collabs") blank.status="Pitching";
    if (entity==="hiring") blank.employment="Full time";
    if (entity==="weeklyPlans") { blank.status="Idea"; blank.week=THIS_MON; blank.owner = L.team.includes(myName) ? myName : ""; }
    setModal({ entity, mode:"add", record:blank });
  };
  const openEdit = (entity, record) => setModal({ entity, mode:"edit", record:{ ...record } });
  const saveModal = (rec) => {
    const { entity, mode } = modal; let rows = [...data[entity]]; let extra = {};
    if (mode==="add") {
      let row = { _id:uid(), ...rec }; if (codePrefix[entity]) row.code = nextCode(rows, codePrefix[entity]);
      if (entity==="pipeline") row = withStamp(row, row.status);
      if (entity==="weeklyPlans") row = stampContent(row);
      rows.push(row);
    } else {
      let saved = { ...rec }; if (entity==="pipeline") saved = withStamp(saved, saved.status);
      rows = rows.map((r)=>(r._id===rec._id ? saved : r));
    }
    persist({ ...data, [entity]:rows, ...extra }); setModal(null);
  };
  const del = (entity,_id) => persist({ ...data, [entity]:data[entity].filter((r)=>r._id!==_id) });
  const patchIdea = (id, patch) => persist({ ...data, ideas: data.ideas.map((r)=>(r._id===id ? { ...r, ...patch } : r)) });
  // one source of truth: the Calendar is just a view of pieces that have a schedule date
  // ── undo history for grid edits (paste / range-clear / single cell) ──
  // snapshots the pipeline BEFORE a change so Ctrl+Z can roll it back
  const snapshotPipeline = () => {
    undoRef.current.push(JSON.stringify(data.pipeline));
    if (undoRef.current.length > 40) undoRef.current.shift();
  };
  const undoGrid = () => {
    const prev = undoRef.current.pop();
    if (prev == null) return false;
    persist({ ...data, pipeline: JSON.parse(prev) });
    return true;
  };
  const canUndo = () => undoRef.current.length > 0;
  const patchPiece = (id, patch) => { snapshotPipeline(); persist({ ...data, pipeline: data.pipeline.map((r)=>(r._id===id ? { ...r, ...patch } : r)) }); };
  // one atomic write for a pasted block: overwrite existing rows, append new pieces for the overflow
  const applyGridPaste = ({ updates, creates }) => {
    snapshotPipeline();
    let rows = data.pipeline.map((r)=>{
      const u = (updates||[]).find((x)=>x.id===r._id);
      return u ? { ...r, ...u.patch } : r;
    });
    (creates||[]).forEach((p)=>{
      rows.push(withStamp({ _id:uid(), code:nextCode(rows,"C"), brand:"", type:"", kind:"Organic", category:"", title:"", status:STAGES[0], platform:"Instagram", owner:myName, by:myName, dateAdded:nowISO(), scriptWriter:"", target:"", scriptLink:"", footageLink:"", contentLink:"", notes:"", adminComment:"", crossPost:[], ...p }, p.status || STAGES[0]));
    });
    persist({ ...data, pipeline: rows });
  };
  // plug a piece into a day from the Calendar (or unplug it) — the Content grid reflects it instantly
  const schedulePieces = (ids, date) => persist({ ...data, pipeline: data.pipeline.map((r)=>(ids.includes(r._id) ? withStamp({ ...r, target:date, status:ST.SCHEDULED }, ST.SCHEDULED) : r)) });
  const unschedulePiece = (id) => persist({ ...data, pipeline: data.pipeline.map((r)=>(r._id===id ? { ...r, target:"", status:(r.status===ST.SCHEDULED||r.status===ST.PUBLISHED)?ST.EDITED:r.status } : r)) });
  // connect an imported post to a published content piece — keeps the imported row, just stores a reference.
  // Insight then reads the Writer + Type off the connected piece. Pass targetId=null to disconnect.
  const connectInsight = (sourceId, targetId) => {
    persist({ ...data, pipeline: data.pipeline.map((r)=>(r._id===sourceId ? { ...r, connectedTo: targetId || "" } : r)) });
  };
  // bulk-create pieces from a Meta export
  const importPieces = (list) => {
    let rows = [...data.pipeline];
    list.forEach((p)=>{ rows.push({ ...p, _id:uid(), code:nextCode(rows,"C") }); });
    persist({ ...data, pipeline:rows });
  };
  // ONE atomic write for a whole Meta import — updates AND creates together.
  // (Doing 37 separate patch calls all read the same stale `data`, so only the last would survive.)
  const importAll = ({ updates, creates }) => {
    snapshotPipeline();
    const byId = {}; (updates||[]).forEach((m)=>{ byId[m.id] = { ...(byId[m.id]||{}), ...m.patch }; });
    let rows = data.pipeline.map((r)=> byId[r._id] ? { ...r, ...byId[r._id] } : r);
    (creates||[]).forEach((p)=>{ rows.push({ ...p, _id:uid(), code:nextCode(rows,"C") }); });
    persist({ ...data, pipeline: rows });
  };
  // excel-style quick add: type a title on the blank bottom row and it becomes a piece
  const quickAddPiece = (title) => {
    const row = withStamp({ _id:uid(), code:nextCode(data.pipeline,"C"), brand:(brandFilter!=="All"?brandFilter:(L.brands[0]||"")), type:"", kind:"Organic", category:"", title, status:STAGES[0], platform:"Instagram", owner:myName, by:myName, dateAdded:nowISO(), scriptWriter:"", target:"", scriptLink:"", footageLink:"", contentLink:"", notes:"", adminComment:"", crossPost:[] }, STAGES[0]);
    persist({ ...data, pipeline:[...data.pipeline, row] });
  };
  const saveDeck = (brand, deck) => persist({ ...data, collabDecks: { ...(data.collabDecks||{}), [brand]: { ...((data.collabDecks||{})[brand]||{}), ...deck } } });
  const saveInvoiceProfile = (patch) => persist({ ...data, invoiceProfile: { ...(data.invoiceProfile||{}), ...patch } });
  const patchCollab = (id, patch) => persist({ ...data, collabs: data.collabs.map((r)=>(r._id===id ? { ...r, ...patch } : r)) });
  // editor payouts: rate + payee details, and submitted invoices
  const savePayout = (name, patch) => persist({ ...data, payouts: { ...(data.payouts||{}), [name]: { ...((data.payouts||{})[name]||{}), ...patch } } });
  const submitInvoice = (name, invoice) => { const cur=(data.payouts||{})[name]||{}; persist({ ...data, payouts:{ ...(data.payouts||{}), [name]:{ ...cur, invoices:[...(cur.invoices||[]), invoice] } } }); };
  const quickAddCollab = (partner) => { const t=(partner||"").trim(); if(!t) return; persist({ ...data, collabs:[...data.collabs, { _id:uid(), code:nextCode(data.collabs,"K"), partner:t, brand:(L.brands[0]||""), dealType:"Campaign", desc:"", qty:1, perMonth:3, months:6, delivered:0, dcu:false, affiliate:false, feePerAccount:0, accountsDelivered:0, bonus:"", fee:"", status:"Pitching", payStatus:"Not Invoiced", dateAdded:nowISO(), start:"", end:"", pic:"", notes:"" }] }); };
  // account-level follower count per brand, keyed in by hand + stamped with the day it was read
  const saveFollowers = (brand, patch) => persist({ ...data, followers: { ...(data.followers||{}), [brand]: { ...((data.followers||{})[brand]||{}), ...patch } } });
  const saveFollowerGrowth = (brand, patch) => persist({ ...data, followerGrowth: { ...(data.followerGrowth||{}), [brand]: { ...((data.followerGrowth||{})[brand]||{}), ...patch } } });
  const saveIncentive = (name, patch) => persist({ ...data, incentive: { ...(data.incentive||{}), [name]: { ...((data.incentive||{})[name]||{}), ...patch } } });
  const setStatus = (entity,_id,status) => persist({ ...data, [entity]:data[entity].map((r)=>(r._id===_id?{ ...r, status }:r)) });
  const setPipelineStatus = (_id, status) => { snapshotPipeline(); persist({ ...data, pipeline: data.pipeline.map((r)=>(r._id===_id ? withStamp(r, status) : r)) }); };
  const setWeeklyTarget = (n) => persist({ ...data, settings:{ ...data.settings, weeklyTarget: Math.max(0, Number(n)||0) } });
  // duplicate straight into the row below — no popup
  const duplicatePiece = (r) => {
    const copy = { ...r, _id:uid(), code:nextCode(data.pipeline,"C"), dateAdded:nowISO(), stamps:{} };
    const rows = [...data.pipeline];
    const at = rows.findIndex((x)=>x._id===r._id);
    rows.splice(at<0 ? rows.length : at+1, 0, copy);
    persist({ ...data, pipeline:rows });
  };

  // ── admin: enrol a new team member (creates their login via the secure Edge Function) ──
  const callAdminFn = async (body) => {
    const { data: s } = await sb.auth.getSession();
    const token = s.session && s.session.access_token;
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-create-user`, {
      method: "POST",
      headers: { "Content-Type":"application/json", "Authorization":`Bearer ${token}`, "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify(body),
    });
    const out = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(out.error || `Failed (${res.status})`);
    return out;
  };
  // App-managed editor list — the source of truth for editor mode (no Supabase role change needed).
  const setEditorFlag = (base, email, on) => {
    const e = String(email||"").toLowerCase(); if (!e) return base;
    const cur = (base.editors || []).filter((x)=>String(x||"").toLowerCase()!==e);
    return { ...base, editors: on ? [...cur, e] : cur };
  };
  const enrolUser = async ({ name, email, password, role:newRole, tabs, contentRoles, employment }) => {
    try {
      await callAdminFn({ action:"create", name, email, password, role:newRole, tabs, contentRoles, employment });
      let next = data;
      if (name && !data.lists.team.includes(name)) next = { ...next, lists:{ ...next.lists, team:[...next.lists.team, name] } };
      next = setEditorFlag(next, email, newRole==="editor");
      if (next !== data) persist(next);
      return { ok: true };
    } catch (e) { return { error: String((e && e.message) || e) }; }
  };
  const listMembers = () => callAdminFn({ action:"list" });
  const removeMember = (id) => callAdminFn({ action:"delete", id });
  const updateMember = async ({ id, email, role, tabs, contentRoles, employment, name, oldName }) => {
    const nm = String(name||"").trim();
    const out = await callAdminFn({ action:"update", id, role, tabs, contentRoles, employment, ...(nm ? { name: nm } : {}) });
    let next = setEditorFlag(data, email, role==="editor");
    // keep the Owner/Team dropdown list in sync with the renamed member
    if (nm) {
      const prev = String(oldName||"").trim();
      let team = next.lists.team.slice();
      if (prev && prev !== nm) team = team.map((t)=> t===prev ? nm : t);
      if (!team.includes(nm)) team.push(nm);
      next = { ...next, lists:{ ...next.lists, team } };
    }
    persist(next);
    return out;
  };
  const setWeeklyStatus = (_id, status) => persist({ ...data, weeklyPlans: data.weeklyPlans.map((r)=>(r._id===_id ? stampContent({ ...r, status }) : r)) });
  const NAV = [
    { id:"pipeline", label:"Content", icon:Columns }, { id:"calendar", label:"Calendar", icon:CalendarDays }, { id:"insight", label:"Insight", icon:TrendingUp }, { id:"analytics", label:"Analytics", icon:TrendingUp },
    { id:"collabs", label:"Collabs", icon:Briefcase }, { id:"accounts", label:"Accounts", icon:AtSign }, { id:"hiring", label:"Hiring", icon:Megaphone }, { id:"incentive", label:"Incentive", icon:Trophy }, { id:"payout", label:"Payout", icon:Trophy }, { id:"settings", label:"Lists", icon:Settings },
    ...(isAdmin ? [{ id:"admin", label:"Admin", icon:Shield }] : []),
  ];
  const allowedTabs = currentUser.app_metadata && currentUser.app_metadata.tabs;
  const myEmployment = (currentUser.user_metadata && currentUser.user_metadata.employment) || (currentUser.app_metadata && currentUser.app_metadata.employment) || "";
  const isPartTime = String(myEmployment).toLowerCase() === "part time";
  // editors get a locked-down nav: Content always; Payout only for part-time editors
  const visibleNav = isEditor ? NAV.filter((n)=>n.id==="pipeline" || (n.id==="payout" && isPartTime))
    : (!isAdmin && Array.isArray(allowedTabs)) ? NAV.filter((n)=>n.id==="pipeline" || allowedTabs.includes(n.id)) : NAV;
  // editors are confined to Content (+ Payout only if part-time) — never allow the active tab to drift elsewhere
  useEffect(()=>{ if (isEditor && tab!=="pipeline" && !(tab==="payout" && isPartTime)) setTab("pipeline"); }, [isEditor, tab, isPartTime]);

  const pageTitle = (NAV.find((n)=>n.id===tab) || {}).label || "Dashboard";

  return (
    <div style={{ minHeight:"100vh", background:C.canvas, color:C.ink }}>
      <div style={{ background:C.navy, position:"sticky", top:0, zIndex:30 }}>
        <div style={{ display:"flex", alignItems:"center", gap:11, padding:"10px 20px", borderBottom:"1px solid #243653" }}>
          <div style={{ width:32, height:32, borderRadius:9, background:C.yellow, color:C.navy, fontWeight:800, fontSize:12, display:"grid", placeItems:"center", letterSpacing:"-.5px", flexShrink:0 }}>BBB</div>
          <div><div style={{ color:"#fff", fontWeight:700, fontSize:15, lineHeight:1 }}>Content Hub</div><div style={{ color:"#9FB0CC", fontSize:10.5, marginTop:2 }}>BBB Media Group</div></div>
          <div style={{ flex:1 }} />
          <span style={{ background:isAdmin?C.yellow:"#2C3F5E", color:isAdmin?C.navy:"#B9C6DD", fontSize:10, fontWeight:800, padding:"3px 7px", borderRadius:6, letterSpacing:".3px" }}>{isAdmin?"ADMIN":"MEMBER"}</span>
          <span title={currentUser.email} style={{ color:"#9FB0CC", fontSize:11.5, fontWeight:600, maxWidth:200, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{currentUser.email}</span>
          <button onClick={logout} style={{ border:"1px solid #2C3F5E", background:C.navy2, color:"#B9C6DD", borderRadius:8, padding:"6px 12px", fontSize:12, fontWeight:600, cursor:"pointer", flexShrink:0 }}>Log out</button>
        </div>
        <nav style={{ display:"flex", gap:2, padding:"0 12px", overflowX:"auto" }}>
          {visibleNav.map((n)=>{ const on=tab===n.id; const Icon=n.icon; return (
            <button key={n.id} onClick={()=>setTab(n.id)} style={{ border:"none", cursor:"pointer", background:on?C.navy2:"transparent", color:on?"#fff":"#8696B4", padding:"11px 13px", fontSize:12.5, fontWeight:600, display:"flex", alignItems:"center", gap:7, whiteSpace:"nowrap", borderBottom:`3px solid ${on?C.yellow:"transparent"}`, borderRadius:"8px 8px 0 0" }} onMouseEnter={(e)=>{ if(!on) e.currentTarget.style.background="#1A2B49"; }} onMouseLeave={(e)=>{ if(!on) e.currentTarget.style.background="transparent"; }}><Icon size={16} />{n.label}</button>
          ); })}
        </nav>
      </div>

      <main style={{ minWidth:0, display:"flex", flexDirection:"column" }}>
        <header style={{ background:"#fff", borderBottom:`1px solid ${C.line}`, padding:"12px 24px", display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
          <div style={{ flex:1 }} />
          {saved && <span style={{ color:"#15724A", fontSize:12, fontWeight:600 }}>● {saved}</span>}
          {tab!=="calendar" && tab!=="insight" && (
            <div style={{ position:"relative", display:"flex", alignItems:"center" }}>
              <Search size={15} color={C.sub} style={{ position:"absolute", left:10 }} />
              <input value={query} onChange={(e)=>setQuery(e.target.value)} placeholder="Search…" style={{ background:"#F6F7FB", border:`1px solid ${C.line}`, color:C.ink, borderRadius:9, padding:"8px 10px 8px 31px", fontSize:13, width:200, outline:"none", fontFamily:"inherit" }} />
            </div>
          )}
          {tab!=="pipeline" && tab!=="calendar" && tab!=="insight" && (
            <select value={brandFilter} onChange={(e)=>setBrandFilter(e.target.value)} style={{ border:`1px solid ${C.line}`, borderRadius:9, padding:"8px 10px", fontSize:12.5, fontFamily:"inherit", background:"#fff", cursor:"pointer", color:C.ink }}>
              <option value="All">All brands</option>{L.brands.map((b)=><option key={b} value={b}>{b}</option>)}
            </select>
          )}
        </header>

        <div style={{ padding:24, flex:1 }}>
          {tab==="insight" && <Insight rows={filt(data.pipeline)} allRows={data.pipeline} lists={L} onPatch={patchPiece} onCreate={importPieces} onImport={importAll} onConnect={connectInsight} brandFilter={brandFilter} setBrandFilter={setBrandFilter} query={query} setQuery={setQuery} />}
          {tab==="pipeline" && (isEditor
            ? <EditorContent rows={data.pipeline.filter((r)=>!r.imported && r.editor===myName)} myName={myName} onSetStatus={(id,s)=>setPipelineStatus(id,s)} />
            : <ContentBoard rows={filt(data.pipeline).filter((r)=>!r.imported)} allRows={data.pipeline} lists={L} isAdmin={isAdmin} myName={myName} quota={data.settings.ideaQuota} onAdd={()=>openAdd("pipeline")} onEdit={(r)=>openEdit("pipeline",r)} onDel={(id)=>del("pipeline",id)} onDuplicate={duplicatePiece} onPatch={patchPiece} onQuickAdd={quickAddPiece} topicLinks={data.topicLinks} memberPhones={data.memberPhones} brandFilter={brandFilter} setBrandFilter={setBrandFilter} setStatus={(id,s)=>setPipelineStatus(id,s)} onPaste={applyGridPaste} onUndo={undoGrid} canUndo={canUndo} />)}
          {tab==="calendar" && <Calendar rows={filt(data.pipeline).filter((r)=>!r.imported)} allTeam={L.team} isAdmin={isAdmin} myName={myName} dailyPosts={data.settings.dailyPosts} brands={L.brands} brandFilter={brandFilter} setBrandFilter={setBrandFilter} query={query} setQuery={setQuery} />}
          {tab==="collabs" && <Collabs rows={filt(data.collabs)} lists={L} isAdmin={isAdmin} onPatch={patchCollab} onQuickAdd={quickAddCollab} onDel={(id)=>del("collabs",id)} decks={data.collabDecks} onSaveDeck={saveDeck} phones={data.memberPhones} invoiceProfile={data.invoiceProfile} onSaveProfile={saveInvoiceProfile} />}
        {tab==="accounts" && <Accounts rows={filt(data.accounts)} onAdd={()=>openAdd("accounts")} onEdit={(r)=>openEdit("accounts",r)} onDel={(id)=>del("accounts",id)} />}
          {tab==="hiring" && <Hiring rows={data.hiring} isAdmin={isAdmin} siteUrl={typeof window!=="undefined"?window.location.origin:""} onAdd={()=>openAdd("hiring")} onEdit={(r)=>openEdit("hiring",r)} onDel={(id)=>del("hiring",id)} />}
          {tab==="analytics" && <Analytics rows={data.pipeline} lists={L} followers={data.followers} onSaveFollowers={saveFollowers} growth={data.followerGrowth} onSaveGrowth={saveFollowerGrowth} brands={L.brands} />}
          {tab==="incentive" && <Incentive data={data.incentive} isAdmin={isAdmin} onSave={saveIncentive} myName={myName} followers={data.followers} brands={L.brands} />}
          {tab==="payout" && !(isEditor && !isPartTime) && <Payout rows={data.pipeline} payouts={data.payouts} isAdmin={isAdmin} isEditor={isEditor} myName={myName} team={L.team} onSave={savePayout} onSubmitInvoice={submitInvoice} />}
          {tab==="settings" && <Lists data={data} persist={persist} />}
          {tab==="admin" && isAdmin && <AdminPanel data={data} onEnrol={enrolUser} myEmail={currentUser.email} onListUsers={listMembers} onRemoveUser={removeMember} onUpdateUser={updateMember} />}
        </div>
      </main>

      {modal && <Modal modal={modal} L={L} onClose={()=>setModal(null)} onSave={saveModal} isAdmin={isAdmin} />}
    </div>
  );
}

function Splash(){ return (<div style={{ minHeight:"100vh", display:"grid", placeItems:"center", background:C.navy }}><div style={{ textAlign:"center" }}><div style={{ width:46, height:46, borderRadius:12, background:C.yellow, color:C.navy, fontWeight:800, display:"grid", placeItems:"center", margin:"0 auto 14px" }}>BBB</div><div style={{ color:"#fff", fontWeight:700 }}>Loading Content Hub…</div></div></div>); }

/* ── CSV parsing + Meta insights import ── */
function parseCSV(text) {
  const rows = []; let cur = [], field = "", q = false;
  const s = String(text||"").replace(/^﻿/, "");
  for (let i=0; i<s.length; i++) {
    const c = s[i];
    if (q) { if (c === '"') { if (s[i+1] === '"') { field += '"'; i++; } else q = false; } else field += c; }
    else if (c === '"') q = true;
    else if (c === ",") { cur.push(field); field = ""; }
    else if (c === "\n") { cur.push(field); rows.push(cur); cur = []; field = ""; }
    else if (c === "\r") { /* skip */ }
    else field += c;
  }
  if (field.length || cur.length) { cur.push(field); rows.push(cur); }
  return rows.filter((r)=>r.some((x)=>String(x).trim() !== ""));
}
const norm = (s)=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const fmtNum = (v)=>Number(v||0).toLocaleString();
const MONTHS = { jan:"01", feb:"02", mar:"03", apr:"04", may:"05", jun:"06", jul:"07", aug:"08", sep:"09", oct:"10", nov:"11", dec:"12" };
// "Sat 11 Jul 2026, 7:10 PM" -> "2026-07-11"  (also handles 2026-07-11 / 11/07/2026)
const parseMetaDate = (s) => {
  const t = String(s||"").trim(); if (!t) return "";
  const iso = (y,mo,d)=>`${y}-${mo}-${String(d).padStart(2,"0")}`;
  // Excel/Sheets serial date (e.g. 46204) — days since 1899-12-30
  if (/^\d{5}(\.\d+)?$/.test(t)) { const dt = new Date(Math.round((Number(t)-25569)*86400000)); if (!isNaN(dt)) return iso(dt.getUTCFullYear(), String(dt.getUTCMonth()+1).padStart(2,"0"), dt.getUTCDate()); }
  // no year in the string (e.g. "Wed Jul 22") — assume the most recent occurrence, not a future date
  const guessYear = (moNum, d)=>{ const now=new Date(); let y=now.getFullYear(); const cand=new Date(`${y}-${moNum}-${String(d).padStart(2,"0")}T00:00:00`); if (cand.getTime()-now.getTime() > 2*86400000) y-=1; return y; };
  let m = /(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})/.exec(t);                 // 11 Jul 2026
  if (m) { const mo = MONTHS[m[2].slice(0,3).toLowerCase()]; if (mo) return iso(m[3], mo, m[1]); }
  m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t); if (m) return `${m[1]}-${m[2]}-${m[3]}`; // ISO
  m = /([A-Za-z]{3,})\s+(\d{1,2})(?!\d)/.exec(t);                        // Wed Jul 22 / Jul 22 (no year)
  if (m) { const mo = MONTHS[m[1].slice(0,3).toLowerCase()]; if (mo) return iso(guessYear(mo, m[2]), mo, m[2]); }
  return dispToIso(t.split(",")[0]) || "";
};
// ── Meta CSV/XLSX export: capture Description, Duration (sec), Publish time, Permalink, Views, Follows ──
const parseMetaCsvDate = (s) => {
  const t = String(s||"").trim(); if (!t) return "";
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t);          // Meta exports use MM/DD/YYYY
  if (m) return `${m[3]}-${String(m[1]).padStart(2,"0")}-${String(m[2]).padStart(2,"0")}`;
  return parseMetaDate(t);
};
function ImportModal({ pieces, lists, onImport, onClose }) {
  const [result, setResult] = useState(null);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [brand, setBrand] = useState("");
  const L = lists || {};
  const brands = L.brands || [];
  const num = (v)=>{ const n = Number(String(v==null?"":v).replace(/[^0-9.-]/g,"")); return isNaN(n)?0:n; };
  const readRows = async (file) => {
    const isCsv = /\.csv$/i.test(file.name);
    if (isCsv) return parseCSV(await file.text());
    if (typeof window.XLSX === "undefined") throw new Error("Spreadsheet reader didn't load — check your connection, or save the file as CSV.");
    const wb = window.XLSX.read(new Uint8Array(await file.arrayBuffer()), { type:"array" });
    return window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:false, defval:"" });
  };
  const handle = async (file) => {
    setErr(""); setResult(null); setBusy(true);
    try {
      if (!brand) { setErr("Choose a brand first."); setBusy(false); return; }
      const rows = await readRows(file);
      if (rows.length < 2) { setErr("That file has no data rows."); setBusy(false); return; }
      const head = rows[0].map((h)=>norm(h));
      const find = (...keys)=>head.findIndex((h)=>keys.some((k)=>h.includes(k)));
      const exact = (...keys)=>head.findIndex((h)=>keys.some((k)=>h===k));
      const col = {
        title:    (()=>{ const t=exact("description"); return t>=0?t:find("description","caption"); })(),
        duration: find("durationsec","duration"),
        date:     (()=>{ const d=exact("publishtime"); return d>=0?d:find("publishtime","publishdate","datepublished"); })(),
        link:     (()=>{ const p=exact("permalink"); return p>=0?p:find("permalink","posturl"); })(),
        views:    (()=>{ const v=exact("views"); return v>=0?v:find("views","plays","videoviews"); })(),
        follows:  (()=>{ const f=exact("follows"); return f>=0?f:find("follows","newfollowers"); })(),
      };
      if (col.title < 0) { setErr("Couldn't find a Description column in that file."); setBusy(false); return; }
      const found = [];
      if (col.title>=0) found.push("Description"); if (col.duration>=0) found.push("Duration"); if (col.date>=0) found.push("Publish time");
      if (col.link>=0) found.push("Permalink"); if (col.views>=0) found.push("Views"); if (col.follows>=0) found.push("Follows");
      const updates = [], creates = [];
      let skipped = 0;
      const usedIds = new Set();
      const stamp = nowISO();
      const stampFull = localDateTime();
      rows.slice(1).forEach((r)=>{
        const title = String(r[col.title]||"").trim();
        if (!title || /^total\b/i.test(title)) { if (r.some((c)=>String(c||"").trim()!=="")) skipped++; return; }
        const link = col.link>=0 ? String(r[col.link]||"").trim() : "";
        const metrics = {};
        if (col.views>=0   && String(r[col.views]||"").trim()!=="")   metrics.views   = num(r[col.views]);
        if (col.follows>=0 && String(r[col.follows]||"").trim()!=="") metrics.follows = num(r[col.follows]);
        const duration = col.duration>=0 ? num(r[col.duration]) : 0;
        const pubDate = col.date>=0 ? parseMetaCsvDate(r[col.date]) : "";
        // match on exact permalink first (most reliable), then exact title
        let p = null;
        if (link) p = pieces.find((x)=>!usedIds.has(x._id) && x.contentLink && norm(x.contentLink)===norm(link));
        if (!p) { const d = norm(title); p = pieces.find((x)=>!usedIds.has(x._id) && x.title && norm(x.title)===d); }
        if (p) { usedIds.add(p._id); updates.push({ id:p._id, title:p.title, patch:{ ...metrics, duration, importedAt:stamp, importedAtTime:stampFull, ...(link?{ contentLink:link }:{}), ...(pubDate ? { publishedAt:pubDate } : {}) } }); }
        else {
          creates.push({
            title, ...metrics, duration, importedAt:stamp, importedAtTime:stampFull, imported:1, publishedAt:pubDate,
            brand,
            type: duration>0 ? "Reel" : "Carousel",
            target: pubDate, dateAdded: pubDate,
            status: ST.PUBLISHED, kind:"Organic", category:"", platform:"Instagram",
            contentLink: link, scriptLink:"", footageLink:"", notes:"", adminComment:"", crossPost:[], owner:"", by:"", scriptWriter:"", stamps:{},
          });
        }
      });
      setResult({ updates, creates, skipped, cols:found, brand });
    } catch (e) { setErr("Couldn't read that file: " + String((e&&e.message)||e)); }
    setBusy(false);
  };
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:60, padding:16, backdropFilter:"blur(2px)" }}>

          <span style={{ cursor:"pointer" }} onClick={onClose}><X size={17} color="#9FB0CC" /></span>
        </div>
        <div style={{ padding:16 }}>
          <div style={{ fontSize:12, color:C.sub, lineHeight:1.55, marginBottom:12 }}>Export from <b>Meta Business Suite → Content</b> (.csv or .xlsx). It reads only <b>Description, Duration, Publish time, Permalink, Views, Follows</b>. Posts already in your planner are <b>updated</b>; anything new is <b>added as a Published piece</b> under the brand you pick.</div>
          <div style={{ fontSize:11.5, fontWeight:700, color:C.sub, marginBottom:6 }}>1 · Which brand is this file for?</div>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14 }}>
            {brands.map((b)=>(
              <button key={b} type="button" onClick={()=>setBrand(b)} style={{ display:"flex", alignItems:"center", gap:6, border:`1.5px solid ${brand===b?C.navy:C.line}`, background:brand===b?"#F3F6FC":"#fff", color:brand===b?C.navy:C.sub, borderRadius:9, padding:"7px 12px", fontSize:12.5, fontWeight:700, cursor:"pointer" }}>
                <span style={{ width:9, height:9, borderRadius:3, background:BRAND_DOT[b]||C.sub }} />{b}{brand===b?" ✓":""}
              </button>
            ))}
            {brands.length===0 && <span style={{ fontSize:12, color:C.sub }}>Add brands in Lists first.</span>}
          </div>
          <div style={{ fontSize:11.5, fontWeight:700, color:C.sub, marginBottom:6 }}>2 · Upload the file</div>
          <label style={{ display:"block", border:`2px dashed ${brand?C.line:"#E9ECF2"}`, borderRadius:12, padding:"18px", textAlign:"center", cursor:brand?"pointer":"not-allowed", background:brand?"#F8F9FC":"#F3F4F7", opacity:brand?1:0.6 }}>
            <div style={{ fontSize:13, fontWeight:700, color:C.navy }}>{busy ? "Reading…" : brand ? `Choose .csv or .xlsx for ${brand}` : "Pick a brand above first"}</div>
            <div style={{ fontSize:11, color:C.sub, marginTop:4 }}>Description · Duration · Publish time · Permalink · Views · Follows</div>
            <input type="file" accept=".csv,.xlsx,.xls,text/csv" disabled={!brand} onChange={(e)=>{ const f=e.target.files&&e.target.files[0]; if(f) handle(f); if(e.target) e.target.value=""; }} style={{ display:"none" }} />
          </label>
          {err && <div style={{ background:"#FBE4E6", color:"#A11", fontSize:12, fontWeight:600, padding:"9px 11px", borderRadius:8, marginTop:12 }}>{err}</div>}
          {result && (
            <div style={{ marginTop:14 }}>
              <div style={{ display:"flex", gap:8, marginBottom:9, flexWrap:"wrap" }}>
                <span style={{ background:"#DCE8FB", color:"#1E3F86", borderRadius:7, padding:"4px 9px", fontSize:11.5, fontWeight:700 }}>{result.creates.length} new piece{result.creates.length===1?"":"s"}</span>
                <span style={{ background:"#DCF0E4", color:"#15724A", borderRadius:7, padding:"4px 9px", fontSize:11.5, fontWeight:700 }}>{result.updates.length} updated</span>
                {result.skipped>0 && <span title="Rows with no title (e.g. Meta's TOTAL row) — these are the only rows not imported" style={{ background:"#FBE3E3", color:"#A11B1B", borderRadius:7, padding:"4px 9px", fontSize:11.5, fontWeight:700 }}>{result.skipped} skipped (no title)</span>}
              </div>
              <div style={{ fontSize:11, color:C.sub, marginBottom:10 }}>Detected: {result.cols.join(", ")}</div>
              <div style={{ maxHeight:200, overflow:"auto", display:"grid", gap:6 }}>
                {result.updates.map((m,i)=>(
                  <div key={"u"+i} style={{ display:"flex", alignItems:"center", gap:8, border:`1px solid ${C.line}`, borderRadius:8, padding:"6px 9px" }}>
                    <span style={{ color:"#1FA463", fontWeight:800, fontSize:12 }}>✓</span>
                    <span style={{ flex:1, fontSize:12, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{m.title}</span>
                    <span style={{ fontSize:11, color:C.sub, whiteSpace:"nowrap" }}>{fmtNum(m.patch.views)} views</span>
                  </div>
                ))}
                {result.creates.map((m,i)=>(
                  <div key={"c"+i} style={{ display:"flex", alignItems:"center", gap:8, border:`1px solid ${C.line}`, borderRadius:8, padding:"6px 9px" }}>
                    <span style={{ color:BLUE.accent, fontWeight:800, fontSize:12 }}>+</span>
                    <span style={{ flex:1, minWidth:0 }}>
                      <span style={{ fontSize:12, fontWeight:600, display:"block", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{m.title}</span>

                    </span>
                    <span style={{ fontSize:11, color:C.sub, whiteSpace:"nowrap" }}>{fmtNum(m.views)} views</span>
                  </div>
                ))}
              </div>
              <button disabled={!result.updates.length && !result.creates.length} onClick={()=>{ onImport({ updates:result.updates, creates:result.creates }); onClose(); }} style={{ width:"100%", marginTop:14, border:"none", background:(result.updates.length||result.creates.length)?C.navy:"#E6E9F0", color:(result.updates.length||result.creates.length)?"#fff":"#A9B2C4", borderRadius:9, padding:"10px", fontSize:13, fontWeight:700, cursor:"pointer" }}>Import {result.updates.length+result.creates.length} post{(result.updates.length+result.creates.length)===1?"":"s"}</button>
              <div style={{ fontSize:11, color:C.sub, marginTop:8 }}>New pieces come in as <b>Published</b> under <b>{result.brand}</b> with their publish date, duration, permalink, views &amp; follows.</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

  const L = lists || {};

  const [linkRow, setLinkRow] = useState(null);
  const [sortKey, setSortKey] = useState("follows");
  const [sortDir, setSortDir] = useState(-1);
  const toggleSort = (k)=>{ if (sortKey===k) setSortDir(sortDir*-1); else { setSortKey(k); setSortDir(k==="title"||k==="creator"?1:-1); } };
  // Insight only holds performance data that came from Meta — either a raw import or a planned idea
  // that an import was linked onto (link copies importedAt across). Plain pipeline pieces never appear here.
  const pub = (rows||[]).filter((r)=>r.importedAt);
  const n = (v)=>Number(v)||0;
  const creator = (r)=>r.owner || r.by || "";
  const eng = (r)=>n(r.likes)+n(r.comments)+n(r.shares)+n(r.saves);
  const fmt = (v)=>Number(v||0).toLocaleString();
  const totViews = pub.reduce((s,r)=>s+n(r.views),0);
  const totEng = pub.reduce((s,r)=>s+eng(r),0);
  const totFollows = pub.reduce((s,r)=>s+n(r.follows),0);
  const unattributed = pub.filter((r)=>!creator(r));
  const unattrFollows = unattributed.reduce((s,r)=>s+n(r.follows),0);
  // ── primary view: follower growth credited to whoever made the content ──
  const perMember = {};
  pub.forEach((r)=>{ const c = creator(r) || "— unattributed"; perMember[c] = perMember[c] || { t:c, posts:0, views:0, follows:0, eng:0 };
    perMember[c].posts++; perMember[c].views += n(r.views); perMember[c].follows += n(r.follows); perMember[c].eng += eng(r); });
  // rank by followers, but unattributed is not a person — it always sits last
  const isUnattr = (m)=>m.t.indexOf("—")===0;
  const members = Object.values(perMember).sort((a,b)=>(isUnattr(a)?1:0)-(isUnattr(b)?1:0) || b.follows-a.follows);
  const maxF = Math.max(1, ...members.map((m)=>m.follows));
  const keyOf = (r)=> groupBy==="brand" ? (r.brand||"—") : groupBy==="category" ? (r.category||"—") : (r.type||"—");
  const groups = {};
  pub.forEach((r)=>{ const k=keyOf(r); groups[k]=groups[k]||{ k, count:0, views:0, follows:0 }; groups[k].count++; groups[k].views+=n(r.views); groups[k].follows+=n(r.follows); });
  const gList = Object.values(groups).sort((a,b)=>b.follows-a.follows);

  let list = pub.slice();
  if (sortKey) {

      if (sortKey==="creator") return creator(r).toLowerCase();

  const shownBrands = (L.brands||[]).filter((b)=>!brandFilter || brandFilter==="All" || b===brandFilter);
  const overDrawn = shownBrands.filter((b)=>{ const t=Number((FOL[b]||{}).total||0); return t>0 && (t-(gainedBy[b]||0))<0; });
  const staleAsOf = shownBrands.filter((b)=>{ const a=(FOL[b]||{}).asOf; if(!a) return false; return (Date.now()-new Date(a).getTime())/86400000 > 30; });
  const kpi = (v,l,c,sub)=>(<div style={{ ...card(14), flex:1, minWidth:150 }}><div style={{ fontFamily:"inherit", fontSize:30, fontWeight:600, lineHeight:1, color:c||C.ink }}>{v}</div><div style={{ fontSize:11.5, color:C.sub, fontWeight:600, marginTop:7 }}>{l}</div>{sub && <div style={{ fontSize:10.5, color:C.sub, marginTop:3 }}>{sub}</div>}</div>);
  const th = { textAlign:"left", fontSize:10.5, fontWeight:700, color:"#fff", padding:"9px 6px", whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:".2px", cursor:"pointer", userSelect:"none" };

        <div style={{ flex:1 }} />

                    <div style={{ flex:1, height:10, background:"#EEF1F6", borderRadius:5, overflow:"hidden" }}><div style={{ width:`${(m.follows/maxF)*100}%`, height:"100%", background:un?"#C7CFDD":"#1FA463", borderRadius:5 }} /></div>
                    <span style={{ fontSize:13, fontWeight:800, width:62, textAlign:"right", color:un?C.sub:"#15724A" }}>+{fmt(m.follows)}</span>

                  </div>
                ); })}
              </div>
              <div style={{ fontSize:10.5, color:C.sub, marginTop:12, borderTop:`1px dashed ${C.line}`, paddingTop:9 }}>Followers per post: {members.filter((m)=>m.t.indexOf("—")!==0).map((m)=>`${m.t} ${m.posts?Math.round(m.follows/m.posts):0}`).join(" · ")||"—"}</div>
            </div>

              </div>

                    <span style={{ width:96, fontSize:11.5, fontWeight:600, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{g.k}</span>
                    <div style={{ flex:1, height:8, background:"#EEF1F6", borderRadius:5, overflow:"hidden" }}><div style={{ width:`${(g.follows/maxGF)*100}%`, height:"100%", background:BLUE.accent, borderRadius:5 }} /></div>
                    <span style={{ fontSize:12, fontWeight:700, width:52, textAlign:"right" }}>+{fmt(g.follows)}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
          <div style={{ ...card(0), overflow:"visible" }}>
            <div style={{ overflow:"visible" }}>
              <table className="xl" style={{ width:"100%" }}>
                <colgroup>
                  <col style={{ width:92 }} /><col style={{ width:104 }} /><col style={{ width:122 }} /><col />
                  {metricCols.map((m)=><col key={m[0]} style={{ width:62 }} />)}
                  <col style={{ width:92 }} /><col style={{ width:40 }} />
                </colgroup>
                <thead><tr style={{ background:BLUE.head }}>
                  <th style={th} onClick={()=>toggleSort("target")}>Published{arrow("target")}</th>
                  <th style={th} onClick={()=>toggleSort("creator")}>Creator{arrow("creator")}</th>
                  <th style={th} onClick={()=>toggleSort("brand")}>Brand{arrow("brand")}</th>

                  {metricCols.map((m)=><th key={m[0]} style={th} onClick={()=>toggleSort(m[0])}>{m[1]}{arrow(m[0])}</th>)}
                  <th style={th} onClick={()=>toggleSort("importedAt")}>Imported{arrow("importedAt")}</th>
                  <th style={{ ...th, cursor:"default", borderRight:"none" }}></th>

                <tbody>
                  {list.map((r)=>(
                    <tr key={r._id}>
                      <td style={{ fontSize:11.5, color:C.sub, padding:"6px 6px" }}>{(r.publishedAt||r.target)?isoToDisp(r.publishedAt||r.target):"—"}</td>
                      <td><HoverSelect value={creator(r)} options={team} onChange={(v)=>onPatch(r._id,{owner:v})} placeholder="set creator" style={{ fontWeight:400, background:creator(r)?"transparent":"#FFF3CC", borderRadius:5 }} /></td>
                      <td style={{ padding:"6px 6px" }}><BrandTag b={r.brand} weight={400} /></td>
                      <td style={{ fontSize:12, fontWeight:400, padding:"6px 6px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }} title={r.title}>{r.imported ? <span title="Imported from Meta — not yet linked to a planned idea" style={{ color:BLUE.accent, fontWeight:800, marginRight:4 }}>⬆</span> : null}{r.title||"(untitled)"}</td>
                      {metricCols.map((m)=>(
                        <td key={m[0]}><InlineText type="number" value={r[m[0]]==null?"":r[m[0]]} onCommit={(v)=>onPatch(r._id,{[m[0]]:Number(v)||0})} placeholder="0" style={m[0]==="follows"?{ color:"#15724A" }:undefined} /></td>
                      ))}
                      <td style={{ fontSize:11, color:C.sub, padding:"6px 6px" }}>{r.importedAt?isoToDisp(r.importedAt):"—"}</td>
                      <td style={{ textAlign:"center", borderRight:"none", padding:0 }}><IconBtn title="Link this to a planned idea on Content" onClick={()=>setLinkRow(r)}><Share2 size={12} /></IconBtn></td>
                    </tr>

                </tbody>
              </table>
            </div>
          </div>
          <div style={{ fontSize:11, color:C.sub, marginTop:9 }}>Numbers are editable — they save as you go. <b>Creator</b> is who the followers are credited to. <b>⬆</b> marks a post imported from Meta that isn't linked to a planned idea yet; use the link button to merge it into the right one.</div>
        </div>
      )}
    </div>
  );
}

/* ── link an imported post to the planned idea it belongs to (titles rarely match) ── */
function LinkModal({ source, candidates, onLink, onClose }) {
  const [q, setQ] = useState("");
  const nrm = (s)=>String(s||"").toLowerCase();
  const dayGap = (a,b)=>{ if(!a||!b) return 9999; const d=(new Date(a)-new Date(b))/86400000; return Math.abs(d); };
  // rank: same brand first, then closest publish date, then title overlap
  const scored = candidates.map((c)=>{
    let s = 0;
    if (c.brand && source.brand && c.brand===source.brand) s += 50;
    const gap = dayGap(c.target||c.dateAdded, source.target);
    if (gap < 400) s += Math.max(0, 30 - gap);
    const t = nrm(c.title).slice(0,14);
    if (t && nrm(source.title).indexOf(t)>=0) s += 40;
    return { c, s };
  }).sort((a,b)=>b.s-a.s).map((x)=>x.c);
  const shown = q ? scored.filter((c)=>nrm(c.title).indexOf(nrm(q))>=0 || nrm(c.brand).indexOf(nrm(q))>=0) : scored.slice(0,25);
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:60, padding:16, backdropFilter:"blur(2px)" }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, width:"min(600px,100%)", maxHeight:"84vh", display:"flex", flexDirection:"column", boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ background:C.navy, padding:"14px 18px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ color:"#fff", fontWeight:700, fontSize:14.5 }}>Link to a planned idea</div>
          <span style={{ cursor:"pointer" }} onClick={onClose}><X size={17} color="#9FB0CC" /></span>
        </div>
        <div style={{ padding:"14px 18px", borderBottom:`1px solid ${C.line}` }}>
          <div style={{ fontSize:11, color:C.sub, marginBottom:6 }}>Imported post</div>
          <div style={{ fontSize:12.5, fontWeight:700, lineHeight:1.4, maxHeight:52, overflow:"hidden" }}>{source.title}</div>
          <div style={{ fontSize:11, color:C.sub, marginTop:5 }}>{[source.brand, source.target && isoToDisp(source.target), fmtNum(source.follows)+" followers"].filter(Boolean).join(" · ")}</div>
          <div style={{ fontSize:11.5, color:C.sub, marginTop:11 }}>Its numbers move onto the idea you pick (which keeps its creator), and this imported row disappears.</div>
          <div style={{ fontSize:11, color:C.sub, marginTop:9, background:"#F6F7FB", border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 9px" }}>
            <b>{candidates.length}</b> piece{candidates.length===1?"":"s"} can be linked to. Only pieces your team <b>ticked Published</b> on Content count here — rows that arrived from Meta, and ones already linked, are left out.
          </div>
          <input value={q} onChange={(e)=>setQ(e.target.value)} placeholder="Search your ideas…" style={{ ...inp(), marginTop:10 }} />
        </div>
        <div style={{ padding:12, overflowY:"auto", display:"grid", gap:7 }}>
          {shown.length===0 && <Empty>{candidates.length===0 ? "Nothing to link to. Only pieces marked Published on Content are offered here, and ones already linked drop off the list." : "No published pieces match that search."}</Empty>}
          {shown.map((c)=>(
            <button key={c._id} onClick={()=>onLink(c._id)} style={{ display:"flex", alignItems:"center", gap:10, border:`1px solid ${C.line}`, background:"#fff", borderRadius:10, padding:"9px 11px", cursor:"pointer", textAlign:"left" }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:12.5, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.title||"(untitled)"}</div>
                <div style={{ fontSize:10.5, color:C.sub, marginTop:2 }}>{[c.brand, c.status, (c.owner||c.by) && ("by "+(c.owner||c.by)), c.target && isoToDisp(c.target)].filter(Boolean).join(" · ")}</div>
              </div>
              <span style={{ fontSize:11.5, fontWeight:700, color:BLUE.accent, whiteSpace:"nowrap" }}>Link →</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

function Insight({ rows, allRows, lists, onPatch, onCreate, onImport, onConnect, brandFilter, setBrandFilter, query, setQuery }) {
  const L = lists || {};
  const [importing, setImporting] = useState(false);
  const [connectRow, setConnectRow] = useState(null);
  const [sortKey, setSortKey] = useState("publishedAt");
  const [sortDir, setSortDir] = useState(-1);
  const [fConn, setFConn] = useState("");     // connected status: "", "yes", "no"
  const [fWriter, setFWriter] = useState("");
  const [fTopic, setFTopic] = useState("");
  const toggleSort = (k)=>{ if (sortKey===k) setSortDir(sortDir*-1); else { setSortKey(k); setSortDir(k==="title"?1:-1); } };
  const n = (v)=>Number(v)||0;
  const fmt = (v)=>Number(v||0).toLocaleString();
  const team = (L.team||[]).filter((t)=>t!=="Unassigned");
  // Insight shows ONLY posts that came in through a Meta import — never planned Content pieces
  // (a planned piece an old import happened to stamp with importedAt must NOT appear here).
  const pub = (rows||[]).filter((r)=>r.imported);
  const byId = {}; (allRows||[]).forEach((p)=>{ byId[p._id]=p; });
  const connectedPiece = (r)=> r.connectedTo ? byId[r.connectedTo] : null;
  const writerOf = (r)=>{ const c=connectedPiece(r); return c ? (c.scriptWriter||c.owner||c.by||"") : ""; };
  const topicOf = (r)=>{ const c=connectedPiece(r); return c ? (c.category||"") : ""; };
  const pubDate = (r)=> r.publishedAt || r.target || "";
  // content pieces available to connect to: team-planned pieces marked Published (not imports).
  // Use !r.imported only — a planned piece may carry a stale importedAt from an old match, but it's still connectable.
  const connectable = (allRows||[]).filter((r)=>r.status===ST.PUBLISHED && !r.imported);
  const lastImport = pub.map((r)=>r.importedAtTime).filter(Boolean).sort().pop() || "";
  const anyFilter = !!(fConn || fWriter || fTopic);
  const clearFilters = ()=>{ setFConn(""); setFWriter(""); setFTopic(""); };

  let list = pub.slice();
  if (fConn==="yes") list = list.filter((r)=>connectedPiece(r));
  else if (fConn==="no") list = list.filter((r)=>!connectedPiece(r));
  if (fWriter) list = list.filter((r)=>writerOf(r)===fWriter);
  if (fTopic) list = list.filter((r)=>topicOf(r)===fTopic);
  const val = (r)=>{
    if (sortKey==="publishedAt") return pubDate(r);
    if (sortKey==="writer") return writerOf(r).toLowerCase();
    if (sortKey==="topic") return topicOf(r).toLowerCase();
    if (["views","reach","interactions","follows","duration"].includes(sortKey)) return n(r[sortKey]);
    return String(r[sortKey]==null?"":r[sortKey]).toLowerCase();
  };
  list.sort((a,b)=>{ const x=val(a), y=val(b); if(x===y) return 0; if(typeof x==="number") return (x-y)*sortDir; if(x==="") return 1; if(y==="") return -1; return (x<y?-1:1)*sortDir; });

  const th = { textAlign:"left", fontSize:10.5, fontWeight:700, color:"#fff", padding:"9px 7px", whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:".2px", cursor:"pointer", userSelect:"none" };
  const arrow = (k)=><span style={{ opacity:sortKey===k?1:.35, marginLeft:3 }}>{sortKey===k ? (sortDir===1?"▲":"▼") : "↕"}</span>;
  const numCell = { fontSize:12, color:C.ink, padding:"7px 7px", textAlign:"right", whiteSpace:"nowrap" };

  return (
    <div>
      <div style={{ display:"flex", alignItems:"center", gap:9, marginBottom:14, flexWrap:"wrap" }}>
        <button onClick={()=>setImporting(true)} style={{ border:"none", background:C.navy, color:"#fff", padding:"8px 14px", borderRadius:9, fontWeight:700, fontSize:12.5, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}>⬆ Import from Meta</button>
        <div style={{ position:"relative", display:"flex", alignItems:"center" }}>
          <Search size={14} color={C.sub} style={{ position:"absolute", left:9 }} />
          <input value={query||""} onChange={(e)=>setQuery && setQuery(e.target.value)} placeholder="Search…" style={{ background:"#fff", border:`1px solid ${C.line}`, color:C.ink, borderRadius:8, padding:"7px 10px 7px 29px", fontSize:12.5, width:180, outline:"none", fontFamily:"inherit" }} />
        </div>
        {(()=>{ const sel={ border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 10px", fontSize:12.5, background:"#fff", color:C.ink, minWidth:112 }; return (<>
          <HoverSelect value={brandFilter||"All"} options={L.brands||[]} allLabel="All brands" allValue="All" onChange={(v)=>setBrandFilter && setBrandFilter(v)} style={sel} />
          <HoverSelect value={fConn} options={[{v:"yes",l:"Connected"},{v:"no",l:"Not connected"}]} allLabel="Any connection" allValue="" onChange={setFConn} style={sel} />
          <HoverSelect value={fWriter} options={team} allLabel="All writers" allValue="" onChange={setFWriter} style={sel} />
          <HoverSelect value={fTopic} options={L.topics||[]} allLabel="All topics" allValue="" onChange={setFTopic} style={sel} />
          {anyFilter && <button onClick={clearFilters} style={{ border:"none", background:"transparent", color:BLUE.accent, fontSize:12, fontWeight:700, cursor:"pointer", textDecoration:"underline" }}>clear</button>}
        </>); })()}
        <div style={{ flex:1 }} />
        {lastImport && <span style={{ fontSize:11, color:C.sub }}>Last imported <b style={{ color:C.ink }}>{fmtDateTime(lastImport)}</b></span>}
        <span style={{ fontSize:11.5, color:C.sub, fontWeight:600 }}>{list.length} post{list.length===1?"":"s"}</span>
      </div>
      {importing && <ImportModal pieces={rows||[]} lists={L} onImport={onImport} onClose={()=>setImporting(false)} />}
      {connectRow && (()=>{ const usedByOthers = new Set(pub.filter((r)=>r.connectedTo && r._id!==connectRow._id).map((r)=>r.connectedTo)); const cand = connectable.filter((c)=>!usedByOthers.has(c._id)); return <ConnectModal source={connectRow} candidates={cand} connectedId={connectRow.connectedTo||""} onConnect={(tid)=>{ onConnect(connectRow._id, tid); setConnectRow(null); }} onClose={()=>setConnectRow(null)} />; })()}
      {pub.length===0 ? <Empty>No performance data yet. Use “Import from Meta” to pull in your published posts — Insight only shows imported data.</Empty> : (
        <div style={{ ...card(0), overflow:"visible" }}>
          <div style={{ overflow:"visible" }}>
            <table className="xl" style={{ width:"100%" }}>
              <colgroup>
                <col style={{ width:86 }} /><col /><col style={{ width:86 }} />
                <col style={{ width:74 }} /><col style={{ width:80 }} /><col style={{ width:76 }} /><col style={{ width:78 }} />
                <col style={{ width:96 }} /><col style={{ width:96 }} /><col style={{ width:74 }} />
              </colgroup>
              <thead><tr style={{ background:BLUE.head }}>
                <th style={th} onClick={()=>toggleSort("importedAt")}>Imported{arrow("importedAt")}</th>
                <th style={th} onClick={()=>toggleSort("title")}>Title / Caption{arrow("title")}</th>
                <th style={th} onClick={()=>toggleSort("publishedAt")}>Published{arrow("publishedAt")}</th>
                <th style={{ ...th, textAlign:"right" }} onClick={()=>toggleSort("duration")}>Dur. (s){arrow("duration")}</th>
                <th style={{ ...th, textAlign:"right" }} onClick={()=>toggleSort("views")}>Views{arrow("views")}</th>
                <th style={{ ...th, textAlign:"right" }} onClick={()=>toggleSort("follows")}>Follows{arrow("follows")}</th>
                <th style={{ ...th, textAlign:"center" }}>Permalink</th>
                <th style={th} onClick={()=>toggleSort("writer")}>Writer{arrow("writer")}</th>
                <th style={th} onClick={()=>toggleSort("topic")}>Topic{arrow("topic")}</th>
                <th style={{ ...th, cursor:"default", borderRight:"none", textAlign:"center" }}>Connect</th>
              </tr></thead>
              <tbody>
                {list.map((r)=>{ const c=connectedPiece(r); return (
                  <tr key={r._id}>
                    <td style={{ fontSize:11.5, color:C.sub, padding:"7px 7px", whiteSpace:"nowrap" }}>{r.importedAt?isoToDisp(r.importedAt):"—"}</td>
                    <td style={{ fontSize:12, padding:"7px 7px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:0 }} title={r.title}>{r.title||"(untitled)"}</td>
                    <td style={{ fontSize:11.5, color:C.sub, padding:"7px 7px", whiteSpace:"nowrap" }}>{pubDate(r)?isoToDisp(pubDate(r)):"—"}</td>
                    <td style={numCell}>{r.duration?fmt(r.duration):"—"}</td>
                    <td style={numCell}>{fmt(r.views)}</td>
                    <td style={{ ...numCell, fontWeight:700, color:"#15724A" }}>{fmt(r.follows)}</td>
                    <td style={{ padding:"5px 7px", textAlign:"center" }}>{r.contentLink ? <a href={r.contentLink} target="_blank" rel="noopener noreferrer" title={r.contentLink} style={{ color:BLUE.accent, fontWeight:700, fontSize:11.5, textDecoration:"none" }}>Open ↗</a> : <span style={{ color:"#C4CBD8" }}>—</span>}</td>
                    <td style={{ fontSize:12, padding:"7px 7px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c ? (writerOf(r)||"—") : <span style={{ color:"#C4CBD8" }}>—</span>}</td>
                    <td style={{ fontSize:12, padding:"7px 7px" }}>{c ? (topicOf(r) ? <Pill bg="#EEF1F6" fg={C.sub}>{topicOf(r)}</Pill> : "—") : <span style={{ color:"#C4CBD8" }}>—</span>}</td>
                    <td style={{ padding:"5px 7px", borderRight:"none", textAlign:"center" }}>
                      {c ? (
                        <button onClick={()=>setConnectRow(r)} title={"Connected to: "+(c.title||"")+"  ·  click to change or disconnect"} style={{ display:"inline-grid", placeItems:"center", width:26, height:26, border:`1px solid #8FD3AC`, background:"#DCF0E4", color:"#15724A", borderRadius:7, cursor:"pointer" }}>
                          <Share2 size={13} />
                        </button>
                      ) : (
                        <button onClick={()=>setConnectRow(r)} title="Connect to a published content piece" style={{ display:"inline-grid", placeItems:"center", width:26, height:26, border:`1px solid ${BLUE.accent}`, background:"#fff", color:BLUE.accent, borderRadius:7, cursor:"pointer" }}>
                          <Plus size={14} />
                        </button>
                      )}
                    </td>
                  </tr>
                ); })}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {pub.length>0 && <div style={{ fontSize:11, color:C.sub, marginTop:9 }}>Each row is an imported Meta post. Hit <Plus size={11} style={{ verticalAlign:"middle" }} /> to <b>connect</b> it to a piece you've marked <b>Published</b> on Content — that pulls in the piece's <b>Writer</b> and <b>Topic</b>, and the row shows a <Share2 size={11} style={{ verticalAlign:"middle" }} /> badge.</div>}
    </div>
  );
}

/* ── connect an imported post to a Published content piece (reference only — nothing is merged or deleted) ── */
function ConnectModal({ source, candidates, connectedId, onConnect, onClose }) {
  const [q, setQ] = useState("");
  const nrm = (s)=>String(s||"").toLowerCase();
  const dayGap = (a,b)=>{ if(!a||!b) return 9999; return Math.abs((new Date(a)-new Date(b))/86400000); };
  const srcPub = source.publishedAt || source.target;
  const scored = candidates.map((c)=>{
    let s = 0;
    if (c.brand && source.brand && c.brand===source.brand) s += 50;
    const gap = dayGap(c.target||c.dateAdded, srcPub); if (gap < 400) s += Math.max(0, 30 - gap);
    const t = nrm(c.title).slice(0,14); if (t && nrm(source.title).indexOf(t)>=0) s += 40;
    return { c, s };
  }).sort((a,b)=>b.s-a.s).map((x)=>x.c);
  const shown = q ? scored.filter((c)=>nrm(c.title).indexOf(nrm(q))>=0 || nrm(c.brand).indexOf(nrm(q))>=0) : scored.slice(0,25);
  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(17,25,43,.45)", display:"grid", placeItems:"center", zIndex:60, padding:16, backdropFilter:"blur(2px)" }}>
      <div onClick={(e)=>e.stopPropagation()} style={{ background:"#fff", borderRadius:16, width:"min(600px,100%)", maxHeight:"84vh", display:"flex", flexDirection:"column", boxShadow:"0 24px 60px rgba(20,35,62,.28)" }}>
        <div style={{ background:C.navy, padding:"14px 18px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ color:"#fff", fontWeight:700, fontSize:14.5 }}>Connect to a published content piece</div>
          <span style={{ cursor:"pointer" }} onClick={onClose}><X size={17} color="#9FB0CC" /></span>
        </div>
        <div style={{ padding:"14px 18px", borderBottom:`1px solid ${C.line}` }}>
          <div style={{ fontSize:11, color:C.sub, marginBottom:6 }}>Imported post</div>
          <div style={{ fontSize:12.5, fontWeight:700, lineHeight:1.4, maxHeight:52, overflow:"hidden" }}>{source.title}</div>
          <div style={{ fontSize:11, color:C.sub, marginTop:5 }}>{[source.brand, srcPub && isoToDisp(srcPub), fmtNum(source.follows)+" follows"].filter(Boolean).join(" · ")}</div>
          <div style={{ fontSize:11.5, color:C.sub, marginTop:11 }}>Only pieces you've marked <b>Published</b> on Content appear here. Connecting pulls that piece's Writer and Type onto this row — the post itself is not changed.</div>
          <input value={q} onChange={(e)=>setQ(e.target.value)} placeholder="Search your published pieces…" style={{ ...inp(), marginTop:10 }} />
        </div>
        <div style={{ padding:12, overflowY:"auto", display:"grid", gap:7 }}>
          {connectedId && <button onClick={()=>onConnect("")} style={{ display:"flex", alignItems:"center", justifyContent:"center", gap:6, border:`1px solid ${C.red}`, background:"#fff", color:C.red, borderRadius:10, padding:"9px 11px", cursor:"pointer", fontSize:12.5, fontWeight:700 }}>Disconnect this post</button>}
          {shown.length===0 && <Empty>{candidates.length===0 ? "Nothing to connect to yet. Mark a piece Published on Content, then it shows up here." : "No published pieces match that search."}</Empty>}
          {shown.map((c)=>{ const on=c._id===connectedId; return (
            <button key={c._id} onClick={()=>onConnect(c._id)} style={{ display:"flex", alignItems:"center", gap:10, border:`1.5px solid ${on?"#8FD3AC":C.line}`, background:on?"#F1FBF5":"#fff", borderRadius:10, padding:"9px 11px", cursor:"pointer", textAlign:"left" }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:12.5, fontWeight:700, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{c.title||"(untitled)"}</div>
                <div style={{ fontSize:10.5, color:C.sub, marginTop:2 }}>{[c.brand, c.type, (c.scriptWriter||c.owner||c.by) && ("writer "+(c.scriptWriter||c.owner||c.by)), c.target && isoToDisp(c.target)].filter(Boolean).join(" · ")}</div>
              </div>
              <span style={{ fontSize:11.5, fontWeight:700, color:on?"#15724A":BLUE.accent, whiteSpace:"nowrap" }}>{on?"✓ connected":"Connect →"}</span>
            </button>
          ); })}
        </div>
      </div>
    </div>
  );
}

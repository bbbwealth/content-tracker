// Payout — editors record their rate, edited-content count, payee details, and submit invoices. Admins see everyone.
function Payout({ rows, payouts, isAdmin, isEditor, myName, team, onSave, onSubmitInvoice }) {
  const P = (rows||[]).filter((r)=>!r.imported);
  const editedBy = (name)=> P.filter((r)=>r.editor===name && (r.stamps && r.stamps[ST.EDITED]));
  const POUT = payouts || {};
  const editorsFromData = [...new Set(P.filter((r)=>r.editor && (r.stamps&&r.stamps[ST.EDITED])).map((r)=>r.editor))];
  const names = isAdmin ? [...new Set([...editorsFromData, ...Object.keys(POUT)])].filter(Boolean).sort() : [myName];
  const fmt = (n)=>Number(n||0).toLocaleString();
  const fld = (label, val, onCommit, ph, readOnly) => (
    <div style={{ marginBottom:9 }}>
      <div style={{ fontSize:10, fontWeight:700, color:C.sub, textTransform:"uppercase", letterSpacing:".3px", marginBottom:3 }}>{label}</div>
      {readOnly ? <div style={{ fontSize:13, fontWeight:600, minHeight:18 }}>{val||"—"}</div>
        : <input defaultValue={val||""} placeholder={ph||""} onBlur={(e)=>{ if((e.target.value||"")!==(val||"")) onCommit(e.target.value); }} onKeyDown={(e)=>{ if(e.key==="Enter") e.target.blur(); }} style={{ width:"100%", border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 9px", fontSize:13, fontFamily:"inherit", outline:"none", boxSizing:"border-box" }} />}
    </div>
  );
  const panel = (name)=>{
    const rec = POUT[name] || {}; const payee = rec.payee || {};
    const edited = editedBy(name); const rate = Number(rec.rate)||0; const total = edited.length*rate;
    const invoices = rec.invoices || [];
    const canEdit = isAdmin || (isEditor && name===myName);
    const savePayee = (patch)=> onSave(name, { payee:{ ...payee, ...patch } });
    const submit = ()=>{
      if (edited.length===0) { alert("No edited content to invoice yet."); return; }
      if (!rate) { alert("Set your rate per content first."); return; }
      if (!payee.company || !payee.bank) { alert("Please fill in at least your company name and bank details before submitting."); return; }
      onSubmitInvoice(name, { id:uid(), date:nowISO(), count:edited.length, rate, amount:total, titles:edited.map((r)=>r.title).slice(0,50) });
    };
    return (
      <div key={name} style={{ ...card(18), marginBottom:16 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginBottom:12 }}>
          <span style={{ width:34, height:34, borderRadius:10, background:C.navy, color:"#fff", display:"grid", placeItems:"center", fontWeight:800, fontSize:14 }}>{(name||"?").slice(0,1)}</span>
          <div style={{ fontSize:16, fontWeight:700 }}>{name}</div>
          <div style={{ flex:1 }} />
          <div style={{ textAlign:"right" }}><div style={{ fontSize:22, fontWeight:800, color:C.navy }}>RM {fmt(total)}</div><div style={{ fontSize:11, color:C.sub }}>{edited.length} edited × RM {fmt(rate)}</div></div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1.1fr 1fr", gap:18 }}>
          <div>
            <div style={{ fontSize:11.5, fontWeight:700, color:C.sub, textTransform:"uppercase", letterSpacing:".3px", marginBottom:8 }}>Work &amp; rate</div>
            <div style={{ display:"flex", gap:12, marginBottom:12, flexWrap:"wrap" }}>
              <div style={{ flex:1, minWidth:110, background:"#F8F9FC", border:`1px solid ${C.line}`, borderRadius:10, padding:"10px 12px" }}><div style={{ fontSize:20, fontWeight:800 }}>{edited.length}</div><div style={{ fontSize:11, color:C.sub, fontWeight:600 }}>Content edited</div></div>
              <div style={{ flex:1, minWidth:110 }}>{fld("Rate per content (RM)", rate||"", (v)=>onSave(name,{ rate:Number(v)||0 }), "0", !canEdit)}</div>
            </div>
            <div style={{ maxHeight:150, overflowY:"auto", border:`1px solid ${C.line}`, borderRadius:9 }}>
              {edited.length===0 ? <div style={{ padding:12, fontSize:12, color:C.sub }}>No content marked Edited yet.</div>
                : edited.map((r)=>(<div key={r._id} style={{ display:"flex", gap:8, alignItems:"center", padding:"7px 10px", borderBottom:`1px solid ${C.line}`, fontSize:12 }}><span style={{ color:"#15724A", fontWeight:800 }}>✓</span><span style={{ flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }} title={r.title}>{r.title||"(untitled)"}</span><span style={{ color:C.sub, fontSize:11 }}>{r.stamps&&r.stamps[ST.EDITED]?isoToDisp(String(r.stamps[ST.EDITED]).slice(0,10)):""}</span></div>))}
            </div>
          </div>
          <div>
            <div style={{ fontSize:11.5, fontWeight:700, color:C.sub, textTransform:"uppercase", letterSpacing:".3px", marginBottom:8 }}>Payee details</div>
            {fld("Company name", payee.company, (v)=>savePayee({ company:v }), "Your company / name", !canEdit)}
            {fld("Registration no.", payee.regNo, (v)=>savePayee({ regNo:v }), "SSM / business reg", !canEdit)}
            <div style={{ display:"flex", gap:10 }}>
              <div style={{ flex:1 }}>{fld("Email", payee.email, (v)=>savePayee({ email:v }), "you@email.com", !canEdit)}</div>
              <div style={{ flex:1 }}>{fld("Contact number", payee.phone, (v)=>savePayee({ phone:v }), "+60…", !canEdit)}</div>
            </div>
            {fld("Bank details", payee.bank, (v)=>savePayee({ bank:v }), "Bank · account name · account no.", !canEdit)}
          </div>
        </div>
        {canEdit && <div style={{ display:"flex", alignItems:"center", gap:12, marginTop:14, paddingTop:14, borderTop:`1px solid ${C.line}` }}>
          <button onClick={submit} style={{ border:"none", background:C.navy, color:"#fff", borderRadius:9, padding:"10px 18px", fontSize:13, fontWeight:700, cursor:"pointer" }}>Submit invoice · RM {fmt(total)}</button>
          <span style={{ fontSize:11.5, color:C.sub }}>Submits the {edited.length} edited piece{edited.length===1?"":"s"} at RM {fmt(rate)} each.</span>
        </div>}
        {invoices.length>0 && <div style={{ marginTop:14 }}>
          <div style={{ fontSize:11.5, fontWeight:700, color:C.sub, textTransform:"uppercase", letterSpacing:".3px", marginBottom:6 }}>Submitted invoices</div>
          <table style={{ width:"100%", borderCollapse:"collapse" }}>
            <thead><tr>{["Date","Content","Rate","Amount"].map((h,i)=><th key={h} style={{ textAlign:i>=2?"right":"left", fontSize:10, fontWeight:700, color:C.sub, textTransform:"uppercase", padding:"0 8px 6px" }}>{h}</th>)}</tr></thead>
            <tbody>{[...invoices].reverse().map((iv)=>(<tr key={iv.id} style={{ borderTop:`1px solid ${C.line}` }}><td style={{ padding:"7px 8px", fontSize:12 }}>{isoToDisp(String(iv.date).slice(0,10))}</td><td style={{ padding:"7px 8px", fontSize:12 }}>{iv.count} piece{iv.count===1?"":"s"}</td><td style={{ padding:"7px 8px", fontSize:12, textAlign:"right" }}>RM {fmt(iv.rate)}</td><td style={{ padding:"7px 8px", fontSize:12.5, fontWeight:700, textAlign:"right" }}>RM {fmt(iv.amount)}</td></tr>))}</tbody>
          </table>
        </div>}
      </div>
    );
  };
  return (
    <div>
      <div style={{ marginBottom:16 }}>
        <div style={{ fontSize:18, fontWeight:800, color:C.ink }}>Payout</div>
        <div style={{ fontSize:12.5, color:C.sub, marginTop:2 }}>{isAdmin ? "Editor payouts — content edited, rate, and submitted invoices." : "Log your edited content, rate and payee details, then submit an invoice."}</div>
      </div>
      {names.length===0 || (!isAdmin && !isEditor)
        ? <div style={{ ...card(16), fontSize:13, color:C.sub }}>{(!isAdmin && !isEditor) ? "This tab is for editors. If you edit content, ask an admin to set your role to Editor." : "No editor payouts yet."}</div>
        : names.map((n)=>panel(n))}
    </div>
  );
}

/* ── follower growth: import Meta's daily "Follows" export (UTF-16 CSV), chart it, keep the export link ── */
function FollowerGrowth({ brands, growth, onSave }) {
  const list = brands || [];
  const [brand, setBrand] = useState(list.includes("Madeleine Learns") ? "Madeleine Learns" : (list[0]||""));
  const [mode, setMode] = useState("cumulative"); // cumulative | daily
  const [hover, setHover] = useState(-1);
  const G = growth || {};
  const rec = G[brand] || {};
  const [linkDraft, setLinkDraft] = useState(rec.link||"");
  useEffect(()=>{ setLinkDraft((G[brand]||{}).link||""); }, [brand]);
  const num = (v)=>Number(v)||0;
  const fmt = (v)=>Number(v||0).toLocaleString();
  const disp = (d)=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d)); return m?`${m[3]}/${m[2]}`:String(d); };
  const importCsv = async (file) => {
    if (!brand) { alert("Pick a brand first."); return; }
    try {
      const buf = new Uint8Array(await file.arrayBuffer());
      let enc = "utf-8";
      if (buf[0]===0xFF && buf[1]===0xFE) enc="utf-16le";
      else if (buf[0]===0xFE && buf[1]===0xFF) enc="utf-16be";
      const text = new TextDecoder(enc).decode(buf);
      const out = [];
      text.split(/\r?\n/).forEach((line)=>{ const m=/(\d{4}-\d{2}-\d{2})(?:[T ][^",]*)?"?\s*,\s*"?(-?[\d,]+)/.exec(line); if (m) out.push({ d:m[1], n:num(m[2].replace(/,/g,"")) }); });
      if (!out.length) { alert("Couldn't find any date, follows rows. Export the Instagram 'Follows' chart from Meta and upload that CSV."); return; }
      out.sort((a,b)=>a.d.localeCompare(b.d));
      onSave(brand, { series:out, updatedAt:localDateTime() });
    } catch (e) { alert("Sorry, couldn't read that file."); }
  };
  const daily = (rec.series||[]).slice().sort((a,b)=>String(a.d).localeCompare(String(b.d))).map((s)=>({ d:s.d, n:num(s.n) }));
  let run=0; const cumulative = daily.map((s)=>({ d:s.d, n:(run+=s.n) }));
  const chartData = mode==="cumulative" ? cumulative : daily;
  const total = daily.reduce((s,x)=>s+x.n,0);
  const best = daily.reduce((m,x)=>x.n>m.n?x:m, {n:-1,d:""});
  const kpi = (v,l,c)=>(<div style={{ ...card(12), flex:1, minWidth:120 }}><div style={{ fontSize:22, fontWeight:600, lineHeight:1, color:c||C.ink }}>{v}</div><div style={{ fontSize:11, color:C.sub, fontWeight:600, marginTop:6 }}>{l}</div></div>);
  const W=760, H=260, padL=44, padR=14, padT=16, padB=40, iW=W-padL-padR, iH=H-padT-padB;
  const max=Math.max(1, ...chartData.map((x)=>x.n));
  const x=(i)=> padL + (chartData.length<=1 ? iW/2 : (i/(chartData.length-1))*iW);
  const bx=(i)=> padL + (i*iW/Math.max(1,chartData.length));
  const y=(v)=> padT + iH - (v/max)*iH;
  const labelIdx = chartData.length>10 ? Math.ceil(chartData.length/6) : 1;
  const linePath = chartData.map((p,i)=>`${i===0?"M":"L"}${x(i).toFixed(1)},${y(p.n).toFixed(1)}`).join(" ");
  const areaPath = chartData.length ? `${linePath} L${x(chartData.length-1).toFixed(1)},${(padT+iH).toFixed(1)} L${x(0).toFixed(1)},${(padT+iH).toFixed(1)} Z` : "";
  return (
    <div style={card(16)}>
      <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
        <SectionTitle icon={TrendingUp}>Follower growth</SectionTitle>
        <div style={{ flex:1 }} />
        {list.map((b)=>(<button key={b} type="button" onClick={()=>setBrand(b)} style={{ display:"flex", alignItems:"center", gap:6, border:`1.5px solid ${brand===b?C.navy:C.line}`, background:brand===b?"#F3F6FC":"#fff", color:brand===b?C.navy:C.sub, borderRadius:8, padding:"5px 10px", fontSize:12, fontWeight:700, cursor:"pointer" }}><span style={{ width:8, height:8, borderRadius:3, background:BRAND_DOT[b]||C.sub }} />{b}</button>))}
      </div>
      <div style={{ fontSize:11, color:C.sub, margin:"5px 0 12px" }}>Import the Instagram <b>Follows</b> chart export from Meta (daily follows gained). Paste your export link so you can jump straight there next time.</div>
      <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap", marginBottom:14 }}>
        <label style={{ fontSize:12, fontWeight:700, color:"#fff", background:C.navy, borderRadius:8, padding:"8px 12px", cursor:"pointer", display:"inline-flex", alignItems:"center", gap:6, whiteSpace:"nowrap" }}>⬆ Import follows CSV<input type="file" accept=".csv,text/csv" onChange={(e)=>{ const f=e.target.files&&e.target.files[0]; if(f) importCsv(f); if(e.target) e.target.value=""; }} style={{ display:"none" }} /></label>
        <input value={linkDraft} onChange={(e)=>setLinkDraft(e.target.value)} onBlur={()=>onSave(brand,{link:linkDraft.trim()})} onKeyDown={(e)=>{ if(e.key==="Enter"){ onSave(brand,{link:linkDraft.trim()}); e.target.blur(); } }} placeholder="Paste Meta export URL for this brand…" style={{ flex:1, minWidth:180, border:`1px solid ${C.line}`, borderRadius:8, padding:"8px 10px", fontSize:12, fontFamily:"inherit", boxSizing:"border-box" }} />
        {rec.link ? <a href={rec.link} target="_blank" rel="noopener noreferrer" style={{ fontSize:12, fontWeight:700, color:"#fff", background:BLUE.accent, borderRadius:8, padding:"8px 12px", textDecoration:"none", whiteSpace:"nowrap" }}>Open Meta ↗</a> : <span style={{ fontSize:11, color:C.sub }}>add a link to enable ↗</span>}
      </div>
      {daily.length===0 ? <Empty>No follower data for {brand||"this brand"} yet — import the Follows CSV above.</Empty> : (
        <div>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", marginBottom:12 }}>
            {kpi("+"+fmt(total), "Total gained ("+disp(daily[0].d)+"–"+disp(daily[daily.length-1].d)+")", "#15724A")}
            {kpi("+"+fmt(best.n), "Best day ("+disp(best.d)+")", BLUE.accent)}
            {kpi(fmt(daily.length), "Days tracked")}
          </div>
          <div style={{ display:"flex", justifyContent:"flex-end", gap:6, marginBottom:6 }}>
            {[["cumulative","Cumulative"],["daily","Daily"]].map((o)=>(<button key={o[0]} onClick={()=>setMode(o[0])} style={{ border:"none", cursor:"pointer", borderRadius:7, padding:"5px 12px", fontSize:11.5, fontWeight:700, background:mode===o[0]?C.navy:"#EEF1F6", color:mode===o[0]?"#fff":C.sub }}>{o[1]}</button>))}
          </div>
          <div style={{ border:`1px solid ${C.line}`, borderRadius:10, padding:"8px 4px", overflowX:"auto" }}>
            <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", minWidth:520, display:"block" }} preserveAspectRatio="xMidYMid meet" onMouseLeave={()=>setHover(-1)}>
              {[0,0.5,1].map((f)=>{ const gv=Math.round(max*f); const gy=y(gv); return (<g key={f}><line x1={padL} y1={gy} x2={W-padR} y2={gy} stroke={C.line} strokeWidth="1" /><text x={padL-6} y={gy+3} textAnchor="end" fontSize="9" fill={C.sub}>{fmt(gv)}</text></g>); })}
              {mode==="daily"
                ? chartData.map((p,i)=>{ const bw=Math.max(2,(iW/chartData.length)*0.66); const cx=bx(i)+(iW/chartData.length-bw)/2; return <rect key={i} x={cx} y={y(p.n)} width={bw} height={(padT+iH)-y(p.n)} fill={hover===i?C.navy:BLUE.accent} rx="1.5" />; })
                : (<g><path d={areaPath} fill={BLUE.accent} opacity="0.12" /><path d={linePath} fill="none" stroke={BLUE.accent} strokeWidth="2" />{chartData.map((p,i)=>(<circle key={i} cx={x(i)} cy={y(p.n)} r={hover===i?4:2.5} fill={BLUE.accent} />))}</g>)
              }
              {chartData.map((p,i)=> (i%labelIdx===0 || i===chartData.length-1) ? <text key={"x"+i} x={mode==="daily"?bx(i)+(iW/chartData.length)/2:x(i)} y={H-padB+16} textAnchor="middle" fontSize="9" fill={C.sub}>{disp(p.d)}</text> : null)}
              {/* invisible hover bands — one per date */}
              {chartData.map((p,i)=>{ const w=iW/Math.max(1,chartData.length); const hxo=mode==="daily"?bx(i):Math.max(padL, x(i)-w/2); return <rect key={"hb"+i} x={hxo} y={padT} width={w} height={iH} fill="transparent" onMouseEnter={()=>setHover(i)} onMouseMove={()=>setHover(i)} />; })}
              {/* tooltip — always shows the DAILY gain for the pointed date */}
              {hover>=0 && hover<chartData.length && (()=>{
                const cx = mode==="daily" ? bx(hover)+(iW/chartData.length)/2 : x(hover);
                const cy = y(chartData[hover].n);
                const dn = daily[hover].n, cn = cumulative[hover].n;
                const lines = [ disp(daily[hover].d), "+"+fmt(dn)+" that day", fmt(cn)+" total" ];
                const bw = 108, bh = 14+lines.length*13;
                let bxo = cx+10; if (bxo+bw > W-padR) bxo = cx-10-bw; if (bxo < padL) bxo = padL;
                let byo = cy-bh-8; if (byo < padT) byo = cy+10;
                return (<g pointerEvents="none">
                  <line x1={cx} y1={padT} x2={cx} y2={padT+iH} stroke={C.sub} strokeWidth="1" strokeDasharray="3 3" opacity="0.55" />
                  {mode==="cumulative" && <circle cx={cx} cy={cy} r="4" fill={BLUE.accent} stroke="#fff" strokeWidth="1.5" />}
                  <rect x={bxo} y={byo} width={bw} height={bh} rx="6" fill={C.navy} opacity="0.97" />
                  {lines.map((ln,li)=>(<text key={li} x={bxo+9} y={byo+15+li*13} fontSize={li===0?10:11} fontWeight={li===1?800:600} fill={li===0?"#9FB0CC":li===1?"#8FD3AC":"#CBD5E6"}>{ln}</text>))}
                </g>);
              })()}
            </svg>
          </div>
          {rec.updatedAt && <div style={{ fontSize:10.5, color:C.sub, marginTop:8 }}>Last imported {rec.updatedAt}.</div>}
        </div>
      )}
    </div>
  );
}

function Analytics({ rows, lists, followers, onSaveFollowers, growth, onSaveGrowth, brands }) {
  const L = lists || {};
  const P = rows || [];
  const FOL = followers || {};
  const byId = {}; P.forEach((p)=>{ byId[p._id]=p; });
  const n = (v)=>Number(v)||0;
  const fmt = (v)=>Number(v||0).toLocaleString();
  const stages = [ST.IDEA, ST.SCRIPTED, ST.READY, ST.FILMED, ST.EDITED, ST.PUBLISHED];
  const monthName = (ym)=>{ const m=/^(\d{4})-(\d{2})$/.exec(ym); if(!m) return ym; return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][Number(m[2])-1]+" "+m[1]; };

  // ── performance: imported posts, attributed via their connected content piece ──
  const posts = P.filter((r)=>r.imported);
  const connOf = (r)=> r.connectedTo ? byId[r.connectedTo] : null;
  const topicOf = (r)=>{ const c=connOf(r); return c ? (c.category||"") : ""; };
  const writerOf = (r)=>{ const c=connOf(r); return c ? (c.scriptWriter||c.owner||c.by||"") : ""; };
  const connectedPosts = posts.filter((r)=>connOf(r));
  const agg = (keyFn)=>{
    const m={};
    connectedPosts.forEach((r)=>{ const k=keyFn(r)||"(none)"; m[k]=m[k]||{ k, posts:0, follows:0, views:0 }; m[k].posts++; m[k].follows+=n(r.follows); m[k].views+=n(r.views); });
    return Object.values(m).map((x)=>({ ...x, avgF:x.posts?Math.round(x.follows/x.posts):0, avgV:x.posts?Math.round(x.views/x.posts):0 })).sort((a,b)=>b.follows-a.follows);
  };
  const byTopic = agg(topicOf);
  const byWriter = agg(writerOf);

  // ── throughput: planned content pieces, by stage stamps ──
  const content = P.filter((r)=>!r.imported);
  const monthsPresent = (()=>{ const set=new Set(); content.forEach((r)=>Object.values(r.stamps||{}).forEach((v)=>{ const mm=String(v).slice(0,7); if(/^\d{4}-\d{2}$/.test(mm)) set.add(mm); })); return set; })();
  const curMonth = (()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); })();
  const [ym, setYm] = useState(curMonth);
  // the current month is ALWAYS an option (so you can always come back to it), plus every month that appears in stamps
  const monthOpts = (()=>{ const s=new Set(monthsPresent); s.add(curMonth); s.add(ym); return [...s].sort().reverse(); })();
  const inMonth = (iso)=> String(iso||"").slice(0,7)===ym;
  const stageMatrix = (field)=>{
    const m={};
    content.forEach((r)=>{ const who=r[field]; if(!who) return; m[who]=m[who]||{ who, month:{}, total:{}, pieces:new Set() }; m[who].pieces.add(r._id);
      stages.forEach((s)=>{ const t=(r.stamps||{})[s]; if(t){ m[who].total[s]=(m[who].total[s]||0)+1; if(inMonth(t)) m[who].month[s]=(m[who].month[s]||0)+1; } }); });
    return Object.values(m).sort((a,b)=>b.pieces.size-a.pieces.size);
  };
  const writerRows = stageMatrix("scriptWriter");
  const editorRows = stageMatrix("editor");

  const [topicSort, setTopicSort] = useState({ k:"follows", d:-1 });
  const [writerSort, setWriterSort] = useState({ k:"follows", d:-1 });
  const [wStageSort, setWStageSort] = useState({ k:"pieces", d:-1 });
  const [eStageSort, setEStageSort] = useState({ k:"pieces", d:-1 });
  const sArrow = (active,d)=><span style={{ opacity:active?1:.4, marginLeft:3, fontSize:9 }}>{active?(d===1?"▲":"▼"):"↕"}</span>;
  const th = { textAlign:"left", fontSize:10.5, fontWeight:700, color:"#fff", padding:"9px 8px", whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:".2px" };
  const numTd = { textAlign:"right", fontSize:12, padding:"7px 8px", whiteSpace:"nowrap", borderBottom:`1px solid ${C.line}` };
  const perfTable = (label, data, sort, setSort) => {
    const cols = [[label,"k","left"],["Posts","posts","right"],["Total follows","follows","right"],["Avg follows","avgF","right"],["Total views","views","right"],["Avg views","avgV","right"]];
    const toggle = (k)=> setSort(sort.k===k ? { k, d:-sort.d } : { k, d:k==="k"?1:-1 });
    const rows = data.slice().sort((a,b)=>{ const x=a[sort.k], y=b[sort.k]; if(typeof x==="number"&&typeof y==="number") return (x-y)*sort.d; return String(x==null?"":x).localeCompare(String(y==null?"":y))*sort.d; });
    return (
    <div style={{ overflowX:"auto" }}>
      <table style={{ width:"100%", borderCollapse:"collapse", minWidth:520 }}>
        <thead><tr style={{ background:BLUE.head }}>
          {cols.map(([lab,k,al])=><th key={k} onClick={()=>toggle(k)} style={{ ...th, textAlign:al, cursor:"pointer", userSelect:"none" }}>{lab}{sArrow(sort.k===k, sort.d)}</th>)}
        </tr></thead>
        <tbody>
          {rows.length===0 && <tr><td colSpan={6} style={{ padding:0 }}><Empty>Connect imported posts to content pieces (Insight → ＋) so they pick up a {label.toLowerCase()}.</Empty></td></tr>}
          {rows.map((x,i)=>(
            <tr key={x.k} style={{ background:i%2?"#F5F7FB":"#fff" }}>
              <td style={{ fontSize:12, fontWeight:600, padding:"7px 8px", borderBottom:`1px solid ${C.line}` }}>{x.k}</td>
              <td style={numTd}>{x.posts}</td>
              <td style={{ ...numTd, fontWeight:700, color:"#15724A" }}>{fmt(x.follows)}</td>
              <td style={numTd}>{fmt(x.avgF)}</td>
              <td style={{ ...numTd, fontWeight:700 }}>{fmt(x.views)}</td>
              <td style={numTd}>{fmt(x.avgV)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
    );
  };
  const matrixTable = (label, dataRows, sort, setSort) => {
    const mval = (row,k)=>{ if(k==="who") return (row.who||"").toLowerCase(); if(k==="pieces") return row.pieces.size; if(k.indexOf("st:")===0){ const s=k.slice(3); return row.total[s]||0; } return 0; };
    const toggle = (k)=> setSort(sort.k===k ? { k, d:-sort.d } : { k, d:k==="who"?1:-1 });
    const rows = dataRows.slice().sort((a,b)=>{ const x=mval(a,sort.k), y=mval(b,sort.k); if(typeof x==="number"&&typeof y==="number") return (x-y)*sort.d; return String(x).localeCompare(String(y))*sort.d; });
    return (
    <div style={{ overflowX:"auto" }}>
      <table style={{ width:"100%", borderCollapse:"collapse", minWidth:640 }}>
        <thead><tr style={{ background:BLUE.head }}>
          <th onClick={()=>toggle("who")} style={{ ...th, cursor:"pointer", userSelect:"none" }}>{label}{sArrow(sort.k==="who", sort.d)}</th>
          {stages.map((s)=><th key={s} onClick={()=>toggle("st:"+s)} style={{ ...th, textAlign:"center", cursor:"pointer", userSelect:"none" }}>{s}{sArrow(sort.k==="st:"+s, sort.d)}</th>)}
          <th onClick={()=>toggle("pieces")} style={{ ...th, textAlign:"center", cursor:"pointer", userSelect:"none" }}>Pieces{sArrow(sort.k==="pieces", sort.d)}</th>
        </tr></thead>
        <tbody>
          {rows.length===0 && <tr><td colSpan={stages.length+2} style={{ padding:0 }}><Empty>No content assigned to a {label.toLowerCase()} yet.</Empty></td></tr>}
          {rows.map((row,i)=>(
            <tr key={row.who} style={{ background:i%2?"#F5F7FB":"#fff" }}>
              <td style={{ fontSize:12, fontWeight:600, padding:"7px 8px", borderBottom:`1px solid ${C.line}`, whiteSpace:"nowrap" }}>{row.who}</td>
              {stages.map((s)=>(
                <td key={s} style={{ textAlign:"center", padding:"6px 8px", borderBottom:`1px solid ${C.line}`, borderLeft:`1px solid ${C.line}` }}>
                  <span style={{ fontSize:13, fontWeight:800, color:(row.month[s]||0)>0?C.ink:"#C7CFDD" }}>{row.month[s]||0}</span>
                  <span style={{ fontSize:10.5, color:C.sub }}> / {row.total[s]||0}</span>
                </td>
              ))}
              <td style={{ textAlign:"center", padding:"6px 8px", borderBottom:`1px solid ${C.line}`, borderLeft:`1px solid ${C.line}`, fontSize:13, fontWeight:800, color:BLUE.ink }}>{row.pieces.size}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
    );
  };

  const totF = connectedPosts.reduce((s,r)=>s+n(r.follows),0);
  const totV = connectedPosts.reduce((s,r)=>s+n(r.views),0);
  const kpi = (v,l,c)=>(<div style={{ ...card(14), flex:1, minWidth:150 }}><div style={{ fontFamily:"inherit", fontSize:28, fontWeight:600, lineHeight:1, color:c||C.ink }}>{v}</div><div style={{ fontSize:11.5, color:C.sub, fontWeight:600, marginTop:7 }}>{l}</div></div>);

  return (
    <div style={{ display:"grid", gap:16 }}>
      <div style={{ display:"flex", gap:12, flexWrap:"wrap" }}>
        {kpi(fmt(connectedPosts.length)+" / "+fmt(posts.length), "Connected posts", BLUE.accent)}
        {kpi(fmt(totF), "Follows (connected)", "#15724A")}
        {kpi(fmt(totV), "Views (connected)", C.navy)}
      </div>
      {posts.length>0 && connectedPosts.length===0 && <div style={{ ...card(12), background:"#FFF3CC", border:`1px solid ${C.yellow}`, fontSize:12.5, fontWeight:600, color:"#7a5b00" }}>None of your imported posts are connected to a content piece yet, so topic/writer performance is empty. On <b>Insight</b>, hit ＋ on a post to connect it — that gives it a topic and writer.</div>}

      <div style={card(16)}>
        <div style={{ display:"flex", alignItems:"baseline", gap:10, flexWrap:"wrap" }}>
          <SectionTitle icon={AtSign}>Current followers by brand</SectionTitle>
          <span style={{ fontSize:11, color:C.sub }}>Read each account's follower count and key it in — the date stamps when you update it.</span>
        </div>
        <table style={{ width:"100%", borderCollapse:"collapse", marginTop:12 }}>
          <thead><tr>
            <th style={{ textAlign:"left", fontSize:10, fontWeight:700, color:C.sub, textTransform:"uppercase", letterSpacing:".3px", padding:"0 8px 7px" }}>Brand</th>
            <th style={{ textAlign:"right", fontSize:10, fontWeight:700, color:C.sub, textTransform:"uppercase", letterSpacing:".3px", padding:"0 8px 7px", width:180 }}>Current followers</th>
            <th style={{ textAlign:"left", fontSize:10, fontWeight:700, color:C.sub, textTransform:"uppercase", letterSpacing:".3px", padding:"0 8px 7px", width:150 }}>As of</th>
          </tr></thead>
          <tbody>
            {(L.brands||[]).map((b)=>{ const rec=FOL[b]||{}; return (
              <tr key={b} style={{ borderTop:`1px solid ${C.line}` }}>
                <td style={{ padding:"9px 8px" }}><BrandTag b={b} /></td>
                <td style={{ padding:"5px 8px", textAlign:"right" }}>
                  <InlineText type="number" value={rec.total==null?"":rec.total} onCommit={(v)=>onSaveFollowers && onSaveFollowers(b,{ total:Number(v)||0, asOf:nowISO() })} placeholder="—" style={{ textAlign:"right", fontWeight:700, fontSize:14, border:`1px solid ${C.line}`, borderRadius:7, background:"#fff", padding:"6px 8px" }} />
                </td>
                <td style={{ padding:"5px 8px" }}>
                  <DateCell value={rec.asOf||""} onCommit={(v)=>onSaveFollowers && onSaveFollowers(b,{ asOf:v })} style={{ fontSize:12, color:C.sub, border:`1px solid ${C.line}`, borderRadius:7, background:"#fff", padding:"6px 8px" }} />
                </td>
              </tr>
            ); })}
          </tbody>
        </table>
      </div>

      <FollowerGrowth brands={brands||L.brands} growth={growth} onSave={onSaveGrowth} />

      <div style={card(16)}>
        <SectionTitle icon={TrendingUp}>Performance by topic</SectionTitle>
        <div style={{ fontSize:11, color:C.sub, margin:"5px 0 12px" }}>Follows &amp; views of connected posts, grouped by the connected piece's topic.</div>
        {perfTable("Topic", byTopic, topicSort, setTopicSort)}
      </div>
      <div style={card(16)}>
        <SectionTitle icon={TrendingUp}>Performance by writer</SectionTitle>
        <div style={{ fontSize:11, color:C.sub, margin:"5px 0 12px" }}>Same, grouped by the connected piece's writer.</div>
        {perfTable("Writer", byWriter, writerSort, setWriterSort)}
      </div>

      <div style={{ ...card(16) }}>
        <div style={{ display:"flex", alignItems:"center", gap:12, flexWrap:"wrap", marginBottom:6 }}>
          <SectionTitle icon={CalendarDays}>Content produced — by stage</SectionTitle>
          <div style={{ flex:1 }} />
          <span style={{ fontSize:11.5, color:C.sub }}>Month</span>
          <select value={ym} onChange={(e)=>setYm(e.target.value)} style={{ border:`1px solid ${C.line}`, borderRadius:8, padding:"6px 10px", fontSize:12.5, background:"#fff", color:C.ink, minWidth:120, fontFamily:"inherit", cursor:"pointer" }}>
            {monthOpts.map((m)=><option key={m} value={m}>{monthName(m)}{m===curMonth?" (this month)":""}</option>)}
          </select>
        </div>
        <div style={{ fontSize:11, color:C.sub, marginBottom:12 }}>Each cell: <b>{monthName(ym)}</b> count <span style={{ color:C.sub }}>/ all-time total</span>. Counts how many pieces reached each stage.</div>
        <div style={{ fontSize:11.5, fontWeight:700, color:C.sub, margin:"4px 0 6px", textTransform:"uppercase", letterSpacing:".3px" }}>By writer</div>
        {matrixTable("Writer", writerRows, wStageSort, setWStageSort)}
        <div style={{ fontSize:11.5, fontWeight:700, color:C.sub, margin:"16px 0 6px", textTransform:"uppercase", letterSpacing:".3px" }}>By editor</div>
        {matrixTable("Editor", editorRows, eStageSort, setEStageSort)}
      </div>
    </div>
  );
}

function Dashboard({ data, setTab, myName }) {
  const p = data.pipeline;
  const inProd = p.filter((r)=>[ST.SCRIPTED,ST.FILMED,ST.EDITED].includes(r.status)).length;
  const scheduled = p.filter((r)=>r.status===ST.SCHEDULED).length;
  const posted = p.filter((r)=>r.status===ST.PUBLISHED).length;
  const ideas = p.filter((r)=>r.status===ST.IDEA).length;
  const kpis = [{ n:inProd, l:"In Production", c:C.yellow },{ n:scheduled, l:"Scheduled", c:BLUE.accent },{ n:posted, l:"Published", c:"#1FA463" },{ n:ideas, l:"Ideas", c:C.red }];
  const byBrand = data.lists.brands.map((b)=>({ b, n:p.filter((r)=>r.brand===b).length }));
  const maxB = Math.max(1, ...byBrand.map((x)=>x.n));
  const active = data.collabs.filter((c)=>["Negotiating","Confirmed","In Production","Delivered"].includes(c.status)).length;
  const awaiting = data.collabs.filter((c)=>c.payStatus==="Invoiced"||c.payStatus==="Partially Paid").length;
  const donePaid = data.collabs.filter((c)=>c.payStatus==="Paid").length;
  const fees = data.collabs.reduce((s,c)=>s+(Number(c.fee)||0),0);
  const upcoming = p.filter((c)=>c.target).sort((a,b)=>a.target.localeCompare(b.target)).slice(0,4);
  const wkPlans = (data.weeklyPlans||[]).filter((w)=>w.week===THIS_MON);
  const wkTeam = (data.lists.team||[]).filter((t)=>t!=="Unassigned");
  const ideasTarget = (data.settings && data.settings.ideasTarget) || 20;
  const wkHit = wkTeam.filter((t)=>wkPlans.filter((w)=>w.owner===t).length >= ideasTarget).length;
  const wkUnder = wkTeam.filter((t)=>wkPlans.filter((w)=>w.owner===t).length < ideasTarget);
  const wkPublished = wkPlans.filter((w)=>w.status==="Published").length;
  const mineThisWeek = wkPlans.filter((w)=>w.owner===myName).length;
  return (
    <div style={{ display:"grid", gap:16 }}>
      <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:12 }}>
        {kpis.map((k)=>(<div key={k.l} style={card()}><div style={{ fontFamily:"inherit", fontSize:42, fontWeight:600, lineHeight:1 }}>{k.n}</div><div style={{ display:"flex", alignItems:"center", gap:6, marginTop:8 }}><span style={{ width:10, height:10, borderRadius:3, background:k.c }} /><span style={{ fontSize:12.5, color:C.sub, fontWeight:600 }}>{k.l}</span></div></div>))}
      </div>
      <div style={{ display:"grid", gridTemplateColumns:"1.3fr 1fr", gap:16 }}>
        <div style={card()}>
          <SectionTitle icon={TrendingUp}>Pipeline by brand</SectionTitle>
          <div style={{ display:"grid", gap:14, marginTop:14 }}>
            {byBrand.map((x)=>(<div key={x.b}><div style={{ display:"flex", justifyContent:"space-between", fontSize:13, marginBottom:6 }}><BrandTag b={x.b} /><span style={{ fontWeight:700 }}>{x.n}</span></div><div style={{ height:9, background:"#EEF1F6", borderRadius:6, overflow:"hidden" }}><div style={{ width:`${(x.n/maxB)*100}%`, height:"100%", background:BRAND_DOT[x.b], borderRadius:6, transition:"width .5s" }} /></div></div>))}
          </div>
        </div>
        <div style={card()}>
          <SectionTitle icon={Briefcase}>Collabs</SectionTitle>
          <Row k="Active deals" v={active} /><Row k="Awaiting payment" v={awaiting} /><Row k="Completed / Paid" v={donePaid} />
          <div style={{ borderTop:`1px dashed ${C.line}`, margin:"10px 0 4px" }} />
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline" }}><span style={{ fontSize:12.5, color:C.sub, fontWeight:600 }}>Total fees logged</span><span style={{ fontFamily:"inherit", fontSize:24, fontWeight:600 }}>RM {fees.toLocaleString()}</span></div>
        </div>
      </div>
      <div style={card()}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}><SectionTitle icon={CalendarDays}>Next up</SectionTitle><button onClick={()=>setTab("calendar")} style={linkBtn()}>Open calendar <ArrowRight size={13} /></button></div>
        <div style={{ display:"grid", gap:8, marginTop:12 }}>
          {upcoming.length===0 && <Empty>Nothing scheduled yet.</Empty>}
          {upcoming.map((c)=>(<div key={c._id} style={{ display:"flex", alignItems:"center", gap:12, padding:"8px 10px", border:`1px solid ${C.line}`, borderRadius:10 }}><div style={{ textAlign:"center", minWidth:46 }}><div style={{ fontSize:11, color:C.sub, fontWeight:700 }}>{dow(c.target)}</div><div style={{ fontFamily:"inherit", fontSize:18, fontWeight:600 }}>{c.target && c.target.slice(8)}</div></div><div style={{ flex:1 }}><div style={{ fontSize:13.5, fontWeight:600 }}>{c.title}</div><div style={{ fontSize:11.5, color:C.sub, marginTop:2 }}>{[c.type, c.category].filter(Boolean).join(" · ")}</div></div><BrandTag b={c.brand} /><StatusPill s={c.status} /></div>))}
        </div>
      </div>
    </div>
  );
}

// idea approval is binary: Backlog = pending, anything else = approved
function ApprovalTag({ r }) { const ok = r.status && r.status !== "Backlog"; return <Pill bg={ok?"#DCF0E4":"#FFF3CC"} fg={ok?"#15724A":"#8a6d1a"}>{ok?"Approved":"Pending approval"}</Pill>; }

/* ── dates are shown/typed as DD/MM/YYYY but stored as ISO ── */
const isoToDisp = (iso) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||"")); return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso||""); };
const dispToIso = (s) => {
  const t = String(s||"").trim();
  if (!t) return "";
  const m = /^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2}|\d{4})$/.exec(t);
  if (!m) return null;
  const d = m[1].padStart(2,"0"), mo = m[2].padStart(2,"0");
  const y = m[3].length === 2 ? "20"+m[3] : m[3];
  if (+mo < 1 || +mo > 12 || +d < 1 || +d > 31) return null;
  return `${y}-${mo}-${d}`;
};
// Type a date OR pick from a small calendar that opens when you focus/click the cell.
// The calendar is our own popover (not the native picker), so it always closes cleanly when you pick a day.
function DateCell({ value, onCommit, style, ...rest }) {
  const [v, setV] = useState(isoToDisp(value));
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  useEffect(()=>{ setV(isoToDisp(value)); }, [value]);
  const commit = ()=>{ const iso = dispToIso(v); if (iso === null) { setV(isoToDisp(value)); return; } if (iso !== (value||"")) onCommit(iso); };
  const selISO = /^\d{4}-\d{2}-\d{2}$/.test(String(value||"")) ? value : "";
  const [vm, setVm] = useState(()=>{ const d=new Date(); return { y:d.getFullYear(), m:d.getMonth() }; });
  useEffect(()=>{ if(open){ const base = selISO ? new Date(selISO+"T00:00:00") : new Date(); setVm({ y:base.getFullYear(), m:base.getMonth() }); } }, [open]);
  useEffect(()=>{ if(!open) return; const h=(e)=>{ if(wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); }; document.addEventListener("mousedown", h); return ()=>document.removeEventListener("mousedown", h); }, [open]);
  const pad2 = (n)=>String(n).padStart(2,"0");
  const pick = (iso)=>{ onCommit(iso); setV(isoToDisp(iso)); setOpen(false); };
  const first = new Date(vm.y, vm.m, 1); const startPad = (first.getDay()+6)%7; const dim = new Date(vm.y, vm.m+1, 0).getDate();
  const gridCells = []; for(let i=0;i<startPad;i++) gridCells.push(null); for(let d=1;d<=dim;d++) gridCells.push(d);
  const todayISO = localISO(new Date());
  const monthLbl = first.toLocaleDateString("en-US",{ month:"short", year:"numeric" });
  const shift = (delta)=>setVm(({y,m})=>{ const dd=new Date(y,m+delta,1); return { y:dd.getFullYear(), m:dd.getMonth() }; });
  const navBtn = { border:"none", background:"transparent", cursor:"pointer", color:C.navy, fontSize:15, fontWeight:800, lineHeight:1, padding:"2px 6px" };
  return (
    <div ref={wrapRef} style={{ display:"flex", minWidth:0, flex:1, position:"relative" }}>
      <input {...rest} value={v} placeholder="dd/mm/yyyy" onClick={()=>setOpen(true)} onChange={(e)=>setV(e.target.value)}
        onBlur={(e)=>{ commit(); if(!wrapRef.current || !wrapRef.current.contains(e.relatedTarget)) setOpen(false); }}
        onKeyDown={(e)=>{ if(e.key==="Enter"){ setOpen(false); e.target.blur(); } else if(e.key==="Escape"){ setOpen(false); } }}
        style={{ ...style, flex:1, minWidth:0 }} />
      {open && (
        <div onMouseDown={(e)=>e.preventDefault()} style={{ position:"absolute", top:"100%", left:0, zIndex:50, background:"#fff", border:`1px solid ${C.line}`, borderRadius:9, boxShadow:"0 12px 28px rgba(20,35,62,.22)", padding:8, width:212 }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:6 }}>
            <button type="button" onClick={()=>shift(-1)} style={navBtn}>‹</button>
            <span style={{ fontSize:12, fontWeight:700 }}>{monthLbl}</span>
            <button type="button" onClick={()=>shift(1)} style={navBtn}>›</button>
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)", gap:2 }}>
            {["Mo","Tu","We","Th","Fr","Sa","Su"].map((d)=><div key={d} style={{ fontSize:9.5, fontWeight:700, color:C.sub, textAlign:"center", padding:"2px 0" }}>{d}</div>)}
            {gridCells.map((d,i)=> d==null ? <div key={"e"+i} /> : (()=>{ const iso=`${vm.y}-${pad2(vm.m+1)}-${pad2(d)}`; const isSel=iso===selISO; const isToday=iso===todayISO; return (
              <button key={i} type="button" onClick={()=>pick(iso)} style={{ border:"none", cursor:"pointer", borderRadius:5, padding:"4px 0", fontSize:11, fontWeight:isSel?800:500, background:isSel?BLUE.accent:isToday?BLUE.soft:"transparent", color:isSel?"#fff":C.ink }}>{d}</button>
            ); })())}
          </div>
          <div style={{ display:"flex", justifyContent:"space-between", marginTop:6, borderTop:`1px solid ${C.line}`, paddingTop:6 }}>
            <button type="button" onClick={()=>pick(todayISO)} style={{ ...navBtn, fontSize:11, fontWeight:700, color:BLUE.accent }}>Today</button>
            {selISO && <button type="button" onClick={()=>pick("")} style={{ ...navBtn, fontSize:11, fontWeight:700, color:C.sub }}>Clear</button>}
          </div>
        </div>
      )}
    </div>
  );
}

/* ── dropdown that opens on hover (no click needed), still keyboard-driveable ── */
// Excel data-validation cell: the option list opens on CLICK (or Alt+Down / Enter / typing while focused),
// never on hover — so dragging across cells to select a range doesn't pop dropdowns open.
function HoverSelect({ value, options, onChange, placeholder, allLabel, allValue, style, wrapStyle, ...rest }) {
  const [open, setOpen] = useState(false);
  const [pos, setPos] = useState(null);
  const trigRef = React.useRef(null);
  const openMenu = ()=>{ const el=trigRef.current; if(el){ const r=el.getBoundingClientRect(); setPos({ top:r.bottom+2, left:r.left, width:r.width }); } setOpen(true); };
  const opts = (options||[]).map((o)=>(o && typeof o==="object") ? { v:o.v, l:o.l } : { v:o, l:String(o) });
  const clearV = allValue !== undefined ? allValue : "";
  const cur = opts.find((o)=>o.v===value);
  const label = cur ? cur.l : (allLabel || placeholder || "—");
  const vals = opts.map((o)=>o.v);
  const step = (dir)=>{ const i = vals.indexOf(value); const ni = dir>0 ? Math.min(vals.length-1, i+1) : Math.max(0, i-1); if (vals[ni] !== undefined) onChange(vals[ni]); };
  const onKey = (e)=>{
    if (e.altKey && (e.key==="ArrowDown" || e.key==="ArrowUp")) { e.preventDefault(); e.stopPropagation(); open?setOpen(false):openMenu(); return; } // Alt+Down opens, like Excel validation
    if (e.key==="ArrowDown" || e.key==="ArrowUp") {
      if (open) { e.preventDefault(); e.stopPropagation(); step(e.key==="ArrowDown" ? 1 : -1); } // OPEN: step through options
      // CLOSED: do nothing here — let the arrow bubble so the grid moves between rows
      return;
    }
    if (e.key==="Enter") { if (open) { e.preventDefault(); e.stopPropagation(); setOpen(false); } /* closed: bubble to grid → move down */ }
    else if (e.key==="Escape") { if(open){ e.preventDefault(); e.stopPropagation(); } setOpen(false); }
    else if (e.key==="Backspace" || e.key==="Delete") { e.preventDefault(); onChange(clearV); }
    else if (e.key.length===1 && !e.ctrlKey && !e.metaKey) { const f = opts.find((o)=>o.l.toLowerCase().startsWith(e.key.toLowerCase())); if (f) onChange(f.v); }
  };
  useEffect(()=>{ if(!open) return; const close=()=>setOpen(false); window.addEventListener("scroll",close,true); window.addEventListener("resize",close); return ()=>{ window.removeEventListener("scroll",close,true); window.removeEventListener("resize",close); }; },[open]);
  return (
    <div style={{ position:"relative", ...wrapStyle }}>
      <div ref={trigRef} {...rest} data-select="1" tabIndex={0} onClick={(e)=>{ e.stopPropagation(); open?setOpen(false):openMenu(); }} onBlur={()=>setOpen(false)} onKeyDown={onKey} style={{ cursor:"pointer", padding:"6px 6px", fontSize:12, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", minHeight:26, display:"flex", alignItems:"center", gap:5, ...style }}>
        <span style={{ flex:1, overflow:"hidden", textOverflow:"ellipsis", color:cur?undefined:"#A9B2C4" }}>{label}</span>
        <span style={{ opacity:.45, fontSize:9 }}>▼</span>
      </div>
      {open && pos && (
        <div style={{ position:"fixed", top:pos.top, left:pos.left, minWidth:pos.width, background:"#fff", border:`1px solid ${C.line}`, borderRadius:8, boxShadow:"0 10px 26px rgba(20,35,62,.18)", zIndex:9999, maxHeight:216, overflowY:"auto", padding:4 }}>
          <div onMouseDown={(e)=>{ e.preventDefault(); e.stopPropagation(); onChange(clearV); setOpen(false); }} style={{ padding:"5px 8px", fontSize:11.5, color:C.sub, cursor:"pointer", borderRadius:5, whiteSpace:"nowrap" }}>{allLabel || "—"}</div>
          {opts.map((o)=>(
            <div key={String(o.v)} onMouseDown={(e)=>{ e.preventDefault(); e.stopPropagation(); onChange(o.v); setOpen(false); }} style={{ padding:"5px 8px", fontSize:12, cursor:"pointer", borderRadius:5, whiteSpace:"nowrap", background:o.v===value?"#EAF1FD":"transparent", fontWeight:o.v===value?700:400 }}>{o.l}</div>
          ))}
        </div>
      )}
    </div>
  );
}

// commits a text edit on blur / Enter (avoids a DB write per keystroke)
function InlineText({ value, onCommit, style, placeholder, type, ...rest }) {
  const [v,setV] = useState(value==null?"":value);
  useEffect(()=>{ setV(value==null?"":value); }, [value]);
  return <input {...rest} type={type||"text"} value={v} placeholder={placeholder||""} onChange={(e)=>setV(e.target.value)} onBlur={()=>{ if(v!==(value==null?"":value)) onCommit(v); }} onKeyDown={(e)=>{ if(e.key==="Enter") e.target.blur(); }} style={style} />;
}
// number input that shows 1,000,000 grouping when idle, raw digits while typing — no spinner arrows (text input)
function NumCell({ value, onCommit, style, placeholder, ...rest }) {
  const [foc,setFoc] = useState(false);
  const [draft,setDraft] = useState("");
  const shown = foc ? draft : (value===""||value==null ? "" : Number(value).toLocaleString());
  return <input {...rest} type="text" inputMode="decimal" value={shown} placeholder={placeholder||""}
    onFocus={()=>{ setFoc(true); setDraft(value==null||value===""?"":String(value)); }}
    onChange={(e)=>setDraft(e.target.value.replace(/[^0-9.]/g,""))}
    onBlur={()=>{ setFoc(false); const nv = draft===""?0:(Number(draft)||0); if(nv!==(Number(value)||0)) onCommit(nv); }}
    onKeyDown={(e)=>{ if(e.key==="Enter") e.target.blur(); }} style={style} />;
}

function ContentBoard({ rows, allRows, lists, isAdmin, myName, quota, onAdd, onEdit, onDel, onDuplicate, onPatch, onQuickAdd, topicLinks, memberPhones, brandFilter, setBrandFilter, setStatus, onPaste, onUndo, canUndo }) {
  const L = lists || {};
  const team = (L.team||[]).filter((t)=>t!=="Unassigned");
  const stages = (L.pipelineStatus && L.pipelineStatus.length) ? L.pipelineStatus : STAGES;
  const gridRef = useRef(null);
  const [sel, setSel] = useState(null);   // { r1,c1,r2,c2 } anchor -> focus
  const dragRef = useRef(false);
  const [toast, setToast] = useState("");
  const toastTimer = useRef(null);
  // clear the previous timer, otherwise an older toast's timeout wipes a newer message early
  const flash = (m)=>{ setToast(m); if(toastTimer.current) clearTimeout(toastTimer.current); toastTimer.current = setTimeout(()=>setToast(""), 2600); };
  const [sortKey, setSortKey] = useState("");
  const [sortDir, setSortDir] = useState(1);
  const [newTitle, setNewTitle] = useState("");
  const [shareRow, setShareRow] = useState(null);
  const addRef = useRef(null);
  const toggleSort = (k)=>{ if (sortKey===k) setSortDir(sortDir*-1); else { setSortKey(k); setSortDir(1); } };
  const commitNew = ()=>{ const t=(newTitle||"").trim(); if(!t) return; onQuickAdd(t); setNewTitle(""); setTimeout(()=>{ if(addRef.current) addRef.current.focus(); },0); };
  // picking a topic auto-fills its default script link (unless the piece already has its own)
  const setTopic = (r, t)=>{
    const patch = { category:t };
    const tl = topicLinks || {};
    const next = tl[t] || "", prev = tl[r.category] || "", cur = (r.scriptLink||"").trim();
    if (next && (!cur || cur===prev)) patch.scriptLink = next;
    onPatch(r._id, patch);
  };
  // ── excel-style range selection + clipboard ──
  // each grid column, and how to read/write it as plain text
  const GRID_COLS = [
    { field:"dateAdded",    kind:"date", label:"Date added" },
    { field:"brand",        kind:"list", label:"Brand",   opts:()=>L.brands||[] },
    { field:"type",         kind:"list", label:"Type",    opts:()=>L.types||[] },
    { field:"title",        kind:"text", label:"Idea" },
    { field:"category",     kind:"list", label:"Topic",   opts:()=>L.topics||[] },
    { field:"status",       kind:"list", label:"Stage",   opts:()=>stages },
    { field:"scriptWriter", kind:"list", label:"Writer",  opts:()=>team },
    { field:"editor",       kind:"list", label:"Editor",  opts:()=>team },
    { field:"target",       kind:"date", label:"Schedule" },
  ];
  const NCOL = GRID_COLS.length;
  const readCell = (r, ci) => { const c=GRID_COLS[ci]; if(!c||!r) return ""; const v=r[c.field]; return c.kind==="date" ? (v?isoToDisp(v):"") : String(v==null?"":v); };
  // parse a pasted string into a storable value — undefined means "don't trust it, skip this cell"
  const writeCell = (ci, raw) => {
    const c = GRID_COLS[ci]; if (!c) return undefined;
    const s = String(raw==null?"":raw).trim();
    if (c.kind==="date") { if(!s) return ""; const iso=dispToIso(s); if(iso) return iso; if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s; return undefined; }
    if (c.kind==="list") { if(!s) return ""; const hit=(c.opts()||[]).find((x)=>String(x).toLowerCase()===s.toLowerCase()); return hit===undefined?undefined:hit; }
    return s;
  };
  const normSel = (s)=> s ? { r1:Math.min(s.r1,s.r2), r2:Math.max(s.r1,s.r2), c1:Math.min(s.c1,s.c2), c2:Math.max(s.c1,s.c2) } : null;
  const selSize = ()=>{ const n=normSel(sel); return n ? (n.r2-n.r1+1)*(n.c2-n.c1+1) : 0; };
  const multiSel = selSize() > 1;
  // only tint when a real range is up, so ordinary single-cell editing looks unchanged
  const cellSelected = (ri,ci)=>{ if(!multiSel) return false; const n=normSel(sel); return ri>=n.r1 && ri<=n.r2 && ci>=n.c1 && ci<=n.c2; };
  const SEL_CELL = { background:"#DBE7FB", boxShadow:"inset 0 0 0 1px #B9D0F5" };
  const cellAt = (e)=>{ const td=e.target && e.target.closest && e.target.closest("td[data-r]"); return td ? { r:Number(td.getAttribute("data-r")), c:Number(td.getAttribute("data-c")) } : null; };
  // functional updater — shift+click must extend from the CURRENT anchor, not a stale closure copy
  const onCellDown = (e)=>{
    const p=cellAt(e); if(!p) return;
    if (e.shiftKey) { e.preventDefault(); setSel((s)=> s ? { ...s, r2:p.r, c2:p.c } : { r1:p.r, c1:p.c, r2:p.r, c2:p.c }); }
    else { setSel({ r1:p.r, c1:p.c, r2:p.r, c2:p.c }); dragRef.current=true; }
  };
  const onCellOver = (e)=>{ if(!dragRef.current) return; const p=cellAt(e); if(!p) return; setSel((s)=> s ? { ...s, r2:p.r, c2:p.c } : s); };
  useEffect(()=>{ const up=()=>{ dragRef.current=false; }; document.addEventListener("mouseup", up); return ()=>document.removeEventListener("mouseup", up); },[]);
  const buildTSV = ()=>{
    const n=normSel(sel); if(!n) return "";
    const out=[];
    for(let ri=n.r1; ri<=Math.min(n.r2, list.length-1); ri++){
      const cells=[];
      for(let ci=n.c1; ci<=n.c2; ci++) cells.push(readCell(list[ri], ci).replace(/\t/g," ").replace(/\r?\n/g," "));
      out.push(cells.join("\t"));
    }
    return out.join("\n");
  };
  // Ctrl+C — hand the range to the clipboard as TSV so it lands in Excel as real columns
  const onGridCopy = (e)=>{
    if (!multiSel) return; // single cell: let the browser copy the text in the field
    e.preventDefault();
    const tsv = buildTSV();
    if (e.clipboardData) e.clipboardData.setData("text/plain", tsv);
    flash(`Copied ${selSize()} cells`);
  };
  const pasteTSV = (text)=>{
    const n = normSel(sel); if(!n) return;
    const lines = String(text).replace(/\r\n/g,"\n").replace(/\r/g,"\n").split("\n");
    while (lines.length && lines[lines.length-1]==="") lines.pop();
    if (!lines.length) return;
    const updates=[], creates=[]; let skipped=0;
    lines.forEach((line, i)=>{
      const cells = line.split("\t");
      const patch = {};
      cells.forEach((raw, j)=>{
        const col = n.c1 + j; if (col >= NCOL) return;
        const v = writeCell(col, raw);
        if (v === undefined) { skipped++; return; }
        patch[GRID_COLS[col].field] = v;
      });
      if (!Object.keys(patch).length) return;
      const target = n.r1 + i;
      if (target < list.length) updates.push({ id:list[target]._id, patch });
      else creates.push(patch); // past the last row -> becomes a new piece
    });
    if (!updates.length && !creates.length) { flash("Nothing usable in that paste"); return; }
    onPaste && onPaste({ updates, creates });
    const bits=[];
    if (updates.length) bits.push(updates.length+" row"+(updates.length===1?"":"s")+" updated");
    if (creates.length) bits.push(creates.length+" new piece"+(creates.length===1?"":"s"));
    if (skipped) bits.push(skipped+" cell"+(skipped===1?"":"s")+" skipped");
    flash(bits.join(" · ")+" — Ctrl+Z to undo");
  };
  const onGridPaste = (e)=>{
    const text = e.clipboardData && e.clipboardData.getData("text/plain");
    if (!text) return;
    if (!/[\t\n\r]/.test(text) && !multiSel) return; // plain single value into one field: behave normally
    e.preventDefault();
    pasteTSV(text);
  };
  const clearSel = ()=>{
    const n = normSel(sel); if(!n) return;
    const updates=[];
    for (let ri=n.r1; ri<=Math.min(n.r2, list.length-1); ri++){
      const patch={};
      for (let ci=n.c1; ci<=n.c2; ci++){ const c=GRID_COLS[ci]; if(c.field==="status") continue; patch[c.field]=""; }
      if (Object.keys(patch).length) updates.push({ id:list[ri]._id, patch });
    }
    if (!updates.length) return;
    onPaste && onPaste({ updates, creates:[] });
    flash("Cleared "+updates.length+" row"+(updates.length===1?"":"s")+" — Ctrl+Z to undo");
  };
  // focus the editable control in cell (nr,nc). NOTE: the <td> also carries data-r/data-c for range
  // selection, so we must target the focusable inner element (input or dropdown), never the td.
  const focusCell = (nr, nc) => {
    const g = gridRef.current; if (!g) return false;
    const el = g.querySelector(`input[data-r="${nr}"][data-c="${nc}"], [data-select][data-r="${nr}"][data-c="${nc}"]`);
    if (el) { el.focus(); if (el.select) { try { el.select(); } catch (err) {} } return true; }
    return false;
  };
  // excel-style keyboard nav: Enter/↓ down, Shift+Enter/↑ up, Tab/→ right, Shift+Tab/← left, Esc exit
  const onGridKey = (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && (e.key==="a" || e.key==="A")) { e.preventDefault(); setSel({ r1:0, c1:0, r2:Math.max(0,list.length-1), c2:NCOL-1 }); flash("Selected all "+list.length+" rows"); return; }
    if (mod && (e.key==="z" || e.key==="Z")) { e.preventDefault(); setSel(null); flash(onUndo && onUndo() ? "Undone" : "Nothing left to undo"); return; }
    if ((e.key==="Delete" || e.key==="Backspace") && multiSel) { e.preventDefault(); clearSel(); return; }
    if (e.shiftKey && sel && /^Arrow(Up|Down|Left|Right)$/.test(e.key)) {
      e.preventDefault();
      const d = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] }[e.key];
      setSel((s)=>({ ...s, r2:Math.max(0,Math.min(list.length-1, s.r2+d[0])), c2:Math.max(0,Math.min(NCOL-1, s.c2+d[1])) }));
      return;
    }
    const el = e.target;
    if (!el || !el.getAttribute) return;
    const r = el.getAttribute("data-r"), c = el.getAttribute("data-c");
    if (r === null || c === null) return;
    const isSelect = el.tagName === "SELECT" || el.getAttribute("data-select") === "1";
    const isInput = el.tagName === "INPUT";
    const atEnd = !isInput || (el.selectionStart === el.value.length && el.selectionEnd === el.value.length);
    const atStart = !isInput || (el.selectionStart === 0 && el.selectionEnd === 0);
    let nr = Number(r), nc = Number(c);
    const move = (rr, cc) => { if (rr < 0 || cc < 0 || cc > NCOL-1) { el.blur(); return; } if (focusCell(rr, cc)) setSel({ r1:rr, c1:cc, r2:rr, c2:cc }); else el.blur(); };
    if (e.key === "Escape") { setSel(null); el.blur(); return; }
    if (e.key === "Tab") { e.preventDefault(); if (e.shiftKey) { nc-=1; if(nc<0){ nc=NCOL-1; nr-=1; } } else { nc+=1; if(nc>NCOL-1){ nc=0; nr+=1; } } move(nr, nc); return; }
    if (e.key === "Enter") { e.preventDefault(); move(nr + (e.shiftKey ? -1 : 1), nc); return; }
    // ↑/↓ move between rows on every cell type; an OPEN dropdown swallows them first (to step options), so these only fire when it's closed
    if (e.key === "ArrowDown") { e.preventDefault(); move(nr+1, nc); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); move(nr-1, nc); return; }
    // horizontal: only jump cells once the caret is at the input's edge (dropdowns jump immediately)
    if (e.key === "ArrowRight" && atEnd) { e.preventDefault(); move(nr, nc+1); return; }
    if (e.key === "ArrowLeft" && atStart) { e.preventDefault(); move(nr, nc-1); return; }
  };
  const [fType, setFType] = useState("");
  const [fStage, setFStage] = useState("");
  const [fScript, setFScript] = useState("");
  const [fWriter, setFWriter] = useState("");
  const [fEditor, setFEditor] = useState("");
  const hasScript = (r)=>!!(r.scriptLink && String(r.scriptLink).trim());

  let list = (rows||[]).slice();

  if (fScript==="needs") list = list.filter((r)=>!hasScript(r));
  else if (fScript==="has") list = list.filter((r)=>hasScript(r));
  if (fWriter) list = list.filter((r)=>r.scriptWriter===fWriter);
  if (fEditor) list = list.filter((r)=>r.editor===fEditor);
  if (sortKey) {
    const val = (r)=> sortKey==="status" ? String(STAGES.indexOf(r.status)).padStart(2,"0") : String(r[sortKey]==null?"":r[sortKey]).toLowerCase();
    list.sort((a,b)=>{ const x=val(a), y=val(b); if(x===y) return 0; if(x==="") return 1; if(y==="") return -1; return (x<y?-1:1)*sortDir; });
  }
  const anyFilter = !!(fType||fStage||fScript||fWriter||fEditor||(brandFilter&&brandFilter!=="All")||sortKey);
  const clearAll = ()=>{ setFType(""); setFStage(""); setFScript(""); setFWriter(""); setFEditor(""); setSortKey(""); if(setBrandFilter) setBrandFilter("All"); };

  const selSty = { border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 10px", fontSize:12.5, fontFamily:"inherit", background:"#fff", cursor:"pointer", color:C.ink, minWidth:118 };
  const th = { textAlign:"left", fontSize:11, fontWeight:700, color:"#fff", padding:"11px 12px", whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:".3px" };
  return (
    <div>
      <div style={{ display:"flex", gap:9, flexWrap:"wrap", alignItems:"center", marginBottom:14 }}>
        <HoverSelect value={brandFilter||"All"} options={L.brands||[]} allLabel="All brands" allValue="All" onChange={(v)=>setBrandFilter && setBrandFilter(v)} style={selSty} />
        <HoverSelect value={fType} options={L.types||[]} allLabel="All types" allValue="" onChange={setFType} style={selSty} />
        <HoverSelect value={fStage} options={stages} allLabel="All stages" allValue="" onChange={setFStage} style={selSty} />
        <HoverSelect value={fScript} options={[{v:"needs",l:"Needs script"},{v:"has",l:"Has script"}]} allLabel="Script: all" allValue="" onChange={setFScript} style={selSty} />
        <HoverSelect value={fWriter} options={team} allLabel="All writers" allValue="" onChange={setFWriter} style={selSty} />
        <HoverSelect value={fEditor} options={team} allLabel="All editors" allValue="" onChange={setFEditor} style={selSty} />
        {anyFilter && <button onClick={clearAll} style={{ border:"none", background:"transparent", color:BLUE.accent, fontSize:12, fontWeight:700, cursor:"pointer", textDecoration:"underline" }}>clear</button>}
        <span style={{ marginLeft:"auto", fontSize:11.5, color:C.sub, fontWeight:600 }}>{list.length} of {(rows||[]).length} pieces</span>
        <button onClick={onAdd} style={{ border:"none", background:C.navy, color:"#fff", padding:"8px 14px", borderRadius:9, fontWeight:700, fontSize:12.5, cursor:"pointer", display:"flex", alignItems:"center", gap:6 }}><Plus size={15} />New piece</button>
      </div>
      {(
        <div style={{ ...card(0), overflow:"visible" }}>
          <div style={{ overflow:"visible" }} ref={gridRef} onKeyDown={onGridKey} onCopy={onGridCopy} onPaste={onGridPaste} onMouseDown={onCellDown} onMouseOver={onCellOver}>
            <table className="xl" style={{ width:"100%" }}>
              <colgroup>
                <col style={{ width:170 }} /><col style={{ width:126 }} /><col style={{ width:88 }} /><col />
                <col style={{ width:104 }} /><col style={{ width:104 }} /><col style={{ width:94 }} /><col style={{ width:94 }} />
                <col style={{ width:132 }} /><col style={{ width:150 }} />
              </colgroup>
              <thead><tr style={{ background:BLUE.head }}>
                {[["dateAdded","Date added"],["brand","Brand"],["type","Type"],["title","Idea"],["category","Topic"],["status","Stage"],["scriptWriter","Writer"],["editor","Editor"],["target","Schedule"]].map((col)=>(
                  <th key={col[0]} style={{ ...th, cursor:"pointer", userSelect:"none", padding:"10px 6px" }} onClick={()=>toggleSort(col[0])} title={"Sort by "+col[1]}>
                    {col[1]}<span style={{ opacity:sortKey===col[0]?1:.35, marginLeft:3 }}>{sortKey===col[0] ? (sortDir===1?"▲":"▼") : "↕"}</span>
                  </th>
                ))}
                <th style={{ ...th, padding:"10px 6px", borderRight:"none" }} title="Link to the folder holding script, footage & final content">Project Assets</th>
              </tr></thead>
              <tbody>
                <tr className="addrow" style={{ background:"#FCFDFF" }}>
                  <td style={{ color:C.sub, fontSize:11.5, padding:"6px 7px", whiteSpace:"nowrap" }}>+ new</td>
                  <td /><td />
                  <td><input ref={addRef} value={newTitle} onChange={(e)=>setNewTitle(e.target.value)} onKeyDown={(e)=>{ if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); commitNew(); } }} onBlur={commitNew} placeholder="Type an idea and press Enter…" /></td>
                  <td /><td /><td /><td /><td /><td style={{ borderRight:"none" }} />
                </tr>
                {list.map((r,ri)=>{
                  const cells = [
                    <div style={{ display:"flex", alignItems:"center", gap:1 }}>
                      <DateCell data-r={ri} data-c={0} value={r.dateAdded} onCommit={(v)=>onPatch(r._id,{dateAdded:v})} />
                      <IconBtn title="Share via WhatsApp" onClick={()=>setShareRow(r)}><Share2 size={12} /></IconBtn>
                      <IconBtn title="Duplicate row below" onClick={()=>onDuplicate(r)}><Copy size={12} /></IconBtn>
                      <IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={12} /></IconBtn>
                    </div>,
                    <HoverSelect data-r={ri} data-c={1} value={r.brand||""} options={L.brands||[]} onChange={(v)=>onPatch(r._id,{brand:v})} />,
                    <HoverSelect data-r={ri} data-c={2} value={r.type||""} options={L.types||[]} onChange={(v)=>onPatch(r._id,{type:v})} />,
                    <div style={{ display:"flex", alignItems:"center" }}>{r.imported ? <span title="Imported from Meta — this is a post that already went out, not one of your planned ideas" style={{ flexShrink:0, color:BLUE.accent, fontWeight:900, fontSize:11, paddingLeft:5 }}>⬆</span> : null}<InlineText data-r={ri} data-c={3} value={r.title} onCommit={(v)=>onPatch(r._id,{title:v})} placeholder="Idea…" /></div>,
                    <HoverSelect data-r={ri} data-c={4} value={r.category||""} options={L.topics||[]} onChange={(v)=>setTopic(r, v)} placeholder="topic" />,
                    <HoverSelect data-r={ri} data-c={5} value={r.status||stages[0]} options={stages} onChange={(v)=>setStatus(r._id, v)} style={{ background:STAGE_TINT[r.status]||"transparent", color:STAGE_INK[r.status]||C.ink, fontWeight:700, borderRadius:6, margin:"3px", padding:"4px 6px" }} />,
                    <HoverSelect data-r={ri} data-c={6} value={r.scriptWriter||""} options={team} onChange={(v)=>onPatch(r._id,{scriptWriter:v})} placeholder="writer" />,
                    <HoverSelect data-r={ri} data-c={7} value={r.editor||""} options={team} onChange={(v)=>onPatch(r._id,{editor:v})} placeholder="editor" />,
                    <div style={{ display:"flex", alignItems:"center" }}><DateCell data-r={ri} data-c={8} value={r.target} onCommit={(v)=>onPatch(r._id,{target:v})} /><button onClick={()=>setStatus(r._id, r.status===ST.PUBLISHED ? ST.SCHEDULED : ST.PUBLISHED)} tabIndex={-1} title={r.imported ? "Published — came in from the Meta import, not ticked by the team" : (r.status===ST.PUBLISHED ? "Published — click to undo" : "Tick when published as scheduled")} style={{ border:"none", cursor:"pointer", background:r.status===ST.PUBLISHED?"#1FA463":"#E9EDF4", color:r.status===ST.PUBLISHED?"#fff":"#A9B2C4", width:18, height:18, borderRadius:5, fontSize:11, fontWeight:900, lineHeight:1, flexShrink:0, marginRight:4, display:"grid", placeItems:"center" }}>✓</button></div>,
                  ];
                  return (
                    <tr key={r._id}>
                      {cells.map((node,ci)=>(
                        <td key={ci} data-r={ri} data-c={ci} style={cellSelected(ri,ci)?SEL_CELL:null}>{node}</td>
                      ))}
                      <td style={{ borderRight:"none" }}><LinksCell r={r} onPatch={onPatch} /></td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {list.length===0 && <Empty>No pieces match your filter.</Empty>}
      <div style={{ fontSize:11, color:C.sub, marginTop:9, display:"flex", alignItems:"center", gap:14, flexWrap:"wrap" }}>
        <span><b>Tab</b>/<b>→</b> next cell · <b>Enter</b>/<b>↓</b> down · drag or Shift+click to select · <b>Ctrl+A</b> all · <b>Ctrl+C</b> copy · <b>Ctrl+V</b> paste · <b>Del</b> clear · <b>Ctrl+Z</b> undo</span>
        {multiSel && <span style={{ fontWeight:700, color:BLUE.accent }}>{selSize()} cells selected</span>}
      </div>
      {toast && <div style={{ position:"fixed", right:20, bottom:20, background:C.navy, color:"#fff", padding:"10px 15px", borderRadius:10, fontSize:12.5, fontWeight:600, boxShadow:"0 10px 26px rgba(20,35,62,.28)", zIndex:80 }}>{toast}</div>}
      {shareRow && <ShareModal r={shareRow} phones={memberPhones} team={team} onClose={()=>setShareRow(null)} />}
    </div>
  );
}

/* ── legacy (no longer rendered — kept only so old data shape stays readable) ── */
function Ideas({ rows, allIdeas, allTeam, lists, isAdmin, myName, quota, onAdd, onEdit, onDel, onPromote, onApprove, onDuplicate, onPatch }) {
  const team = (allTeam||[]).filter((t)=>t!=="Unassigned");
  const L = lists || {};
  const [fBy,setFBy]=useState(""); const [fApproval,setFApproval]=useState(""); const [sortBy,setSortBy]=useState("newest"); const [viewMode,setViewMode]=useState("cards");
  const wkIdeas = (allIdeas||[]).filter((i)=>i.dateAdded && mondayOf(i.dateAdded)===THIS_MON);
  const mine = wkIdeas.filter((i)=>i.by===myName).length;
  const countFor = (t)=>wkIdeas.filter((i)=>i.by===t).length;
  const pending = (allIdeas||[]).filter((i)=>i.status==="Backlog").length;
  const hit = team.filter((t)=>countFor(t)>=quota).length;
  const kpiBox=(n,l,c)=>(<div style={{ ...card(12), flex:1, minWidth:120 }}><div style={{ fontFamily:"inherit", fontSize:24, fontWeight:700, lineHeight:1, color:c||C.ink }}>{n}</div><div style={{ fontSize:11, color:C.sub, fontWeight:600, marginTop:5 }}>{l}</div></div>);
  const barRow=(t)=>{ const c=countFor(t); const ok=c>=quota; return (
    <div key={t} style={{ display:"flex", alignItems:"center", gap:10 }}>
      <span style={{ width:90, fontSize:12.5, fontWeight:600 }}>{t}</span>
      <div style={{ flex:1, height:6, background:"#EEF1F6", borderRadius:4, overflow:"hidden" }}><div style={{ width:`${Math.min(100,(c/quota)*100)}%`, height:"100%", background:ok?"#1FA463":C.yellow }} /></div>
      <span style={{ fontSize:12, fontWeight:700, color:ok?"#1FA463":C.red, width:52, textAlign:"right" }}>{c}/{quota}</span>
    </div>
  ); };
  let view = (rows||[]).slice();
  if (fBy) view = view.filter((r)=>r.by===fBy);
  if (fApproval==="approved") view = view.filter((r)=>r.status && r.status!=="Backlog");
  else if (fApproval==="pending") view = view.filter((r)=>r.status==="Backlog");
  if (sortBy==="newest") view.sort((a,b)=>String(b.dateAdded||"").localeCompare(String(a.dateAdded||"")));
  else if (sortBy==="oldest") view.sort((a,b)=>String(a.dateAdded||"").localeCompare(String(b.dateAdded||"")));
  else if (sortBy==="byPerson") view.sort((a,b)=>String(a.by||"").localeCompare(String(b.by||"")));
  const ctrlSel = { ...inp(), width:"auto", minWidth:150, padding:"8px 10px", fontSize:12.5 };
  return (
    <div>
      <Toolbar title="Idea Bank" sub={`Every member submits ≥ ${quota} ideas/week. Admin approves them, then they can be scheduled on the Calendar.`} onAdd={onAdd} addLabel="New idea" />
      {team.includes(myName) && mine<quota && (
        <div style={{ background:"#FFF3CC", border:`1px solid ${C.yellow}`, borderRadius:10, padding:"10px 12px", fontSize:12.5, fontWeight:600, color:"#7a5b00", marginBottom:14 }}>⏰ You've submitted {mine} of {quota} ideas this week — add {quota-mine} more.</div>
      )}
      {isAdmin && (
        <div style={{ ...card(14), marginBottom:16 }}>
          <SectionTitle icon={Shield}>Weekly submissions — {mondayOf(new Date())} → {addDaysISO(mondayOf(new Date()),6)}</SectionTitle>
          <div style={{ display:"flex", gap:10, flexWrap:"wrap", margin:"12px 0" }}>
            {kpiBox(`${hit}/${team.length}`, `Hit ${quota}-idea quota`, "#1FA463")}
            {kpiBox(wkIdeas.length, "Ideas this week", C.navy)}
            {kpiBox(pending, "Pending approval", pending?"#C98A00":C.ink)}
          </div>
          <div style={{ display:"grid", gap:8 }}>{team.map((t)=>barRow(t))}</div>
        </div>
      )}
      <div style={{ display:"flex", gap:10, flexWrap:"wrap", alignItems:"center", marginBottom:14 }}>
        <span style={{ fontSize:11.5, fontWeight:700, color:C.sub }}>Sort & filter:</span>
        <select value={fBy} onChange={(e)=>setFBy(e.target.value)} style={ctrlSel}><option value="">All submitters</option>{team.map((t)=><option key={t} value={t}>{t}</option>)}</select>
        <select value={fApproval} onChange={(e)=>setFApproval(e.target.value)} style={ctrlSel}><option value="">All statuses</option><option value="approved">Approved</option><option value="pending">Pending approval</option></select>
        <select value={sortBy} onChange={(e)=>setSortBy(e.target.value)} style={ctrlSel}><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="byPerson">By submitter (A–Z)</option></select>
        {(fBy||fApproval||sortBy!=="newest") && <button onClick={()=>{ setFBy(""); setFApproval(""); setSortBy("newest"); }} style={{ border:`1px solid ${C.line}`, background:"#fff", color:C.sub, borderRadius:8, padding:"7px 11px", fontSize:12, fontWeight:600, cursor:"pointer" }}>Reset</button>}
        <div style={{ marginLeft:"auto", display:"flex", gap:8, alignItems:"center" }}>
          <div style={{ display:"flex", background:"#F1F3F8", borderRadius:8, padding:3 }}>
            {[["cards","Cards"],["list","List"]].map((o)=>(<button key={o[0]} onClick={()=>setViewMode(o[0])} style={{ border:"none", cursor:"pointer", borderRadius:6, padding:"5px 13px", fontSize:12, fontWeight:700, background:viewMode===o[0]?"#fff":"transparent", color:viewMode===o[0]?C.navy:C.sub, boxShadow:viewMode===o[0]?"0 1px 2px rgba(20,35,62,.12)":"none" }}>{o[1]}</button>))}
          </div>
          <span style={{ fontSize:11.5, color:C.sub, fontWeight:600 }}>{view.length} of {(rows||[]).length} shown</span>
        </div>
      </div>
      {viewMode==="cards" && <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))", gap:12 }}>
        {view.map((r,i)=>(
          <div key={r._id} style={{ ...card(14), animation:`rise .35s ${i*0.03}s both` }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"start", gap:8 }}><BrandTag b={r.brand} /><div style={{ display:"flex", gap:2, alignItems:"center" }}>{isAdmin && r.status==="Backlog" && <button onClick={()=>onApprove(r._id)} style={{ border:"none", background:"#DCF0E4", color:"#15724A", fontWeight:700, fontSize:11, padding:"3px 8px", borderRadius:7, cursor:"pointer" }}>✓ Approve</button>}<IconBtn title="Duplicate & edit" onClick={()=>onDuplicate(r)}><Copy size={14} /></IconBtn><IconBtn title="Promote to pipeline" onClick={()=>onPromote(r)}><ArrowRight size={15} /></IconBtn><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={14} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={14} /></IconBtn></div></div>
            <div style={{ fontSize:15, fontWeight:700, margin:"8px 0 4px", lineHeight:1.3 }}>{r.title}</div>
            <div style={{ fontSize:12.5, color:C.sub, lineHeight:1.4, minHeight:20 }}>{r.category ? ("🏷 " + r.category) : ""}</div>
            <div style={{ display:"flex", gap:6, flexWrap:"wrap", margin:"10px 0", alignItems:"center" }}><Pill bg="#EEF1F6" fg={C.sub}>{r.type}</Pill>{r.kind && <Pill bg={r.kind==="Collab"?"#EAE2FB":"#DCF0E4"} fg={r.kind==="Collab"?"#4B2E9E":"#15724A"}>{r.kind}</Pill>}<ApprovalTag r={r} /></div>
            {Array.isArray(r.crossPost) && r.crossPost.length>0 && <div style={{ display:"flex", gap:5, flexWrap:"wrap", alignItems:"center", marginBottom:8 }}><span style={{ fontSize:11, fontWeight:700, color:C.sub }}>↗ Cross-post:</span>{r.crossPost.map((b)=><Pill key={b} bg="#FFF3CC" fg="#7a5b00">{b}</Pill>)}</div>}
            {r.notes && <div style={{ fontSize:12, color:C.sub, lineHeight:1.45, marginBottom:8, background:"#F8F9FC", border:`1px solid ${C.line}`, borderRadius:8, padding:"7px 9px", display:"flex", gap:6 }}><span>📝</span><span style={{ flex:1, whiteSpace:"pre-wrap" }}>{r.notes}</span></div>}
            <div style={{ display:"flex", justifyContent:"space-between", fontSize:11, color:C.sub, borderTop:`1px solid ${C.line}`, paddingTop:8 }}><span>{r.by}</span><span>{r.code} · {r.dateAdded}</span></div>
          </div>
        ))}
      </div>}
      {viewMode==="list" && view.length>0 && (()=>{
        const th = { textAlign:"left", fontSize:11, fontWeight:700, color:C.sub, padding:"9px 10px", borderBottom:`1px solid ${C.line}`, whiteSpace:"nowrap", textTransform:"uppercase", letterSpacing:".3px" };
        const td = { padding:"7px 10px", borderBottom:`1px solid ${C.line}`, verticalAlign:"middle", fontSize:12.5 };
        const cellSel = (r,k,opts)=>(<select value={r[k]||""} onChange={(e)=>onPatch(r._id,{[k]:e.target.value})} style={{ border:`1px solid ${C.line}`, borderRadius:7, padding:"5px 7px", fontSize:12, fontFamily:"inherit", background:"#fff", cursor:"pointer", maxWidth:150 }}><option value="">—</option>{(opts||[]).map((o)=><option key={o} value={o}>{o}</option>)}</select>);
        return (
        <div style={{ ...card(0), overflow:"hidden" }}><div style={{ overflowX:"auto" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", minWidth:1040 }}>
            <thead><tr><th style={th}>Brand</th><th style={th}>Type</th><th style={th}>Organic/Collab</th><th style={th}>Topic</th><th style={th}>Working Title</th><th style={th}>Cross-post</th><th style={th}>Submitter</th><th style={th}>Status</th><th style={{ ...th, textAlign:"right" }}></th></tr></thead>
            <tbody>
              {view.map((r)=>(
                <tr key={r._id}>
                  <td style={td}>{cellSel(r,"brand",L.brands)}</td>
                  <td style={td}>{cellSel(r,"type",L.types)}</td>
                  <td style={td}>{cellSel(r,"kind",L.ideaKind)}</td>
                  <td style={td}>{cellSel(r,"category",L.topics)}</td>
                  <td style={{ ...td, minWidth:220 }}><InlineText value={r.title} onCommit={(v)=>onPatch(r._id,{title:v})} placeholder="Working title…" style={{ width:"100%", border:`1px solid ${C.line}`, borderRadius:7, padding:"6px 8px", fontSize:12.5, fontFamily:"inherit" }} />{r.notes && <div title={r.notes} style={{ fontSize:11, color:C.sub, marginTop:4, maxWidth:240, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", cursor:"help" }}>📝 {r.notes}</div>}</td>
                  <td style={td}>{Array.isArray(r.crossPost)&&r.crossPost.length>0 ? <div style={{ display:"flex", gap:4, flexWrap:"wrap" }}>{r.crossPost.map((b)=><Pill key={b} bg="#FFF3CC" fg="#7a5b00">{b}</Pill>)}</div> : <span style={{ color:C.sub }}>—</span>}</td>
                  <td style={{ ...td, color:C.sub, whiteSpace:"nowrap" }}>{r.by||"—"}</td>
                  <td style={td}>{isAdmin ? (<select value={(r.status&&r.status!=="Backlog")?"Approved":"Pending"} onChange={(e)=>onPatch(r._id,{status:e.target.value==="Approved"?"Approved":"Backlog"})} style={{ border:`1px solid ${C.line}`, borderRadius:7, padding:"5px 7px", fontSize:12, fontFamily:"inherit", background:"#fff", cursor:"pointer" }}><option value="Pending">Pending approval</option><option value="Approved">Approved</option></select>) : <ApprovalTag r={r} />}</td>
                  <td style={{ ...td, textAlign:"right", whiteSpace:"nowrap" }}><IconBtn title="Duplicate & edit" onClick={()=>onDuplicate(r)}><Copy size={13} /></IconBtn><IconBtn title="Promote to pipeline" onClick={()=>onPromote(r)}><ArrowRight size={14} /></IconBtn><IconBtn title="Edit" onClick={()=>onEdit(r)}><Pencil size={13} /></IconBtn><IconBtn title="Delete" danger onClick={()=>onDel(r._id)}><Trash2 size={13} /></IconBtn></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div></div>
        ); })()}
      {view.length===0 && <Empty>No ideas match your filter.</Empty>}
    </div>
  );
}

function Pipeline({ rows, ideas, pipelineAll, onAddFromIdeas, onAdd, onEdit, onDel, drag, setDrag, setStatus, pipelineStatus }) {
  const [picker, setPicker] = useState(false);
  const base = (pipelineStatus && pipelineStatus.length) ? pipelineStatus : PIPE_COLS;
  const extra = [...new Set(rows.map((r)=>r.status))].filter((s)=>s && !base.includes(s));
  const cols = [...base, ...extra];
  return (
    <div>
      <Toolbar title="Pipeline" sub="Drag cards between stages to update status" onAdd={onAdd} addLabel="New piece" onSecondary={()=>setPicker(true)} secondaryLabel="Add from ideas" secondaryIcon={Lightbulb} />
      <div style={{ display:"flex", gap:12, overflowX:"auto", paddingBottom:8 }}>
        {cols.map((col)=>{ const items=rows.filter((r)=>r.status===col); const over=drag&&drag.over===col; return (
          <div key={col} onDragOver={(e)=>{ e.preventDefault(); if(drag) setDrag({ ...drag, over:col }); }} onDrop={()=>{ if(drag){ setStatus(drag.id,col); setDrag(null); } }} style={{ minWidth:210, width:210, background:over?"#EDF1F8":"#EFF1F6", borderRadius:12, padding:8, transition:"background .15s", border:over?`2px dashed ${C.navy2}`:"2px dashed transparent" }}>
            <div style={{ display:"flex", alignItems:"center", gap:7, padding:"4px 6px 10px" }}><span style={{ width:9, height:9, borderRadius:3, background:STATUS_TINT[col], border:`1px solid ${C.line}` }} /><span style={{ fontSize:12.5, fontWeight:700 }}>{col}</span><span style={{ fontSize:11, color:C.sub, marginLeft:"auto", background:"#fff", borderRadius:6, padding:"1px 7px" }}>{items.length}</span></div>
            <div style={{ display:"grid", gap:8, minHeight:30 }}>
              {items.map((r)=>(
                <div key={r._id} draggable onDragStart={()=>setDrag({ id:r._id, over:col })} onDragEnd={()=>setDrag(null)} style={{ background:"#fff", borderRadius:10, padding:10, border:`1px solid ${C.line}`, cursor:"grab", boxShadow:"0 1px 2px rgba(20,35,62,.05)" }}>
